<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Tratómetro | Training Visa T · TMLF Academy</title>
<style>
:root{
  --navy:#1a2744; --navy-2:#233258; --navy-light:#3a4a72;
  --gold:#c9a227; --gold-light:#e6c85a;
  --cream:#f7f5f0; --paper:#ffffff; --ink:#232323; --muted:#6b7280;
  --r1:#d9736c; --r1-bg:#fbe6e4; /* nivel 3 rojo */
  --r2:#e0954a; --r2-bg:#fbe9d6; /* nivel 2 frecuencia naranja */
  --r3:#d1b23a; --r3-bg:#faf3d6; /* nivel 2 sistematicidad amarillo */
  --r4:#c9b378; --r4-bg:#f7f0dd; /* nivel 1 camuflado beige */
  --r5:#6f9e73; --r5-bg:#e6f1e6; /* verde no trata */
  --radius:14px;
  --shadow:0 4px 18px rgba(26,39,68,0.08);
  --shadow-lg:0 12px 34px rgba(26,39,68,0.14);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Georgia',"DM Sans",-apple-system,sans-serif;
  background:var(--cream);
  color:var(--ink);
  display:flex;
  min-height:100vh;
}
h1,h2,h3,h4{font-family:Georgia,'Cormorant Garamond',serif; color:var(--navy); margin-top:0;}
h3{margin-bottom:8px; font-size:19px;}
p{line-height:1.5; margin:0 0 10px;}
button{font-family:inherit; cursor:pointer;}
::selection{background:var(--gold-light);}

/* ===== SIDEBAR ===== */
#sidebar{
  width:270px; flex:0 0 270px; background:var(--navy); color:#fff;
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
}
#brand{padding:26px 22px 14px; border-bottom:1px solid rgba(255,255,255,0.12);}
#brand .eyebrow{font-family:'DM Sans',sans-serif; letter-spacing:.14em; font-size:11px; color:var(--gold-light); text-transform:uppercase;}
#brand h1{color:#fff; font-size:26px; margin:6px 0 2px; letter-spacing:.02em;}
#brand .sub{font-family:'DM Sans',sans-serif; font-size:12px; color:#b9c2d6;}
#progressWrap{padding:16px 22px;}
#progressBar{height:6px; border-radius:6px; background:rgba(255,255,255,0.14); overflow:hidden;}
#progressFill{height:100%; width:0%; background:linear-gradient(90deg,var(--gold),var(--gold-light)); transition:width .4s ease;}
#progressLabel{font-family:'DM Sans',sans-serif; font-size:11px; color:#b9c2d6; margin-top:6px;}
#navList{list-style:none; margin:0; padding:8px 12px 24px; flex:1;}
#navList li{margin-bottom:2px;}
.navBtn{
  width:100%; text-align:left; background:none; border:none; color:#c7cee2;
  font-family:'DM Sans',sans-serif; font-size:13.5px; padding:9px 12px; border-radius:9px;
  display:flex; gap:8px; align-items:center; transition:background .15s, color .15s;
}
.navIcon{width:16px; height:16px; flex:0 0 16px; opacity:.75;}
.navIcon svg{width:16px; height:16px; stroke:currentColor; fill:none;}
.navBtn .num{font-size:10.5px; color:var(--gold-light); width:16px; flex:0 0 16px;}
.navBtn:hover{background:rgba(255,255,255,0.07); color:#fff;}
.navBtn.active{background:var(--navy-2); color:#fff; box-shadow:inset 3px 0 0 var(--gold);}
.navBtn.done .num::after{content:" ✓"; color:var(--gold-light);}

/* ===== MAIN ===== */
#main{flex:1; display:flex; justify-content:center; padding:30px 28px 70px;}
#content{width:100%; max-width:960px;}
.moduleTag{font-family:'DM Sans',sans-serif; letter-spacing:.12em; text-transform:uppercase; font-size:11.5px; color:var(--gold); font-weight:700;}
.moduleTitle{font-size:28px; margin:4px 0 14px;}
.card{background:var(--paper); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px 24px; margin-bottom:14px;}
.lead{font-size:16px; color:var(--navy-2);}
.hint{font-family:'DM Sans',sans-serif; font-size:13px; color:var(--muted);}

.tag{display:inline-block; font-family:'DM Sans',sans-serif; font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; letter-spacing:.03em;}
.tag.n1{background:var(--r4-bg); color:#8a742c;}
.tag.n2f{background:var(--r2-bg); color:#a05a1a;}
.tag.n2s{background:var(--r3-bg); color:#8a7315;}
.tag.n3{background:var(--r1-bg); color:#a13a33;}
.tag.n0{background:var(--r5-bg); color:#3f6b43;}

/* ===== HERO HEADER ===== */
.hero{
  border-radius:18px; padding:26px 30px; margin-bottom:16px; position:relative; overflow:hidden;
  color:#fff; box-shadow:var(--shadow-lg);
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 60%,var(--hero-accent,var(--gold)) 160%);
}
.hero::before{
  content:""; position:absolute; right:-40px; top:-50px; width:220px; height:220px; border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,0.10),transparent 70%);
}
.hero::after{
  content:""; position:absolute; left:30%; bottom:-70px; width:180px; height:180px; border-radius:50%;
  background:radial-gradient(circle,var(--hero-accent,var(--gold)),transparent 72%); opacity:.28;
}
.hero-row{display:flex; align-items:center; gap:18px; position:relative; z-index:1;}
.hero-icon{
  width:58px; height:58px; flex:0 0 58px; border-radius:16px; display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.25);
}
.hero-icon svg{width:30px; height:30px; stroke:#fff; fill:none;}
.hero .moduleTag{color:var(--gold-light); position:relative; z-index:1;}
.hero .moduleTitle{color:#fff; margin:2px 0 0; position:relative; z-index:1;}
.hero-sub{font-family:'DM Sans',sans-serif; font-size:13.5px; color:#d6dcec; margin-top:6px; max-width:560px; position:relative; z-index:1;}

/* ===== ICON CHIPS / STAT CARDS ===== */
.statGrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:14px 0;}
.statCard{border-radius:12px; padding:14px 16px; color:#fff; position:relative; overflow:hidden; box-shadow:var(--shadow);}
.statCard .sc-icon{width:22px; height:22px; stroke:#fff; fill:none; opacity:.9; margin-bottom:6px;}
.statCard b{display:block; font-size:14px; font-family:'DM Sans',sans-serif; line-height:1.25;}
.statCard span{display:block; font-family:'DM Sans',sans-serif; font-size:11px; opacity:.85; margin-top:2px;}

.iconChip{display:inline-flex; align-items:center; gap:6px; font-family:'DM Sans',sans-serif; font-size:12.5px; font-weight:700; padding:6px 12px 6px 8px; border-radius:20px; background:#eef1f8; color:var(--navy-2);}
.iconChip svg{width:14px; height:14px; stroke:currentColor; fill:none;}

.card-accent{border-left:5px solid var(--accent,var(--gold)); padding-left:23px;}

.detailBox{border-radius:12px; padding:16px 18px; background:linear-gradient(135deg,#f4f2ea,#fff); border:1px solid #ece7da;}
.detailGrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; margin-top:12px;}
.detailGrid .di{background:#fff; border-radius:10px; padding:10px 12px; border:1px solid #ece7da;}
.detailGrid .di label{margin:0 0 3px; font-size:10.5px; color:var(--muted);}
.detailGrid .di div{font-family:'DM Sans',sans-serif; font-size:13px; font-weight:700; color:var(--navy);}

/* thermometer bulb */
#thermo{position:relative; padding-bottom:34px;}
#thermo::after{
  content:""; position:absolute; bottom:0; left:50%; transform:translateX(-50%);
  width:64px; height:64px; border-radius:50%; background:var(--r1); box-shadow:var(--shadow);
  border:4px solid #fff;
}
#thermo .thermo-seg:last-child{border-radius:0 0 0 0;}

/* score ring */
.ringWrap{position:relative; width:150px; height:150px; margin:0 auto 16px;}
.ringWrap svg{transform:rotate(-90deg); width:150px; height:150px;}
.ringWrap circle{fill:none; stroke-width:12;}
.ringBg{stroke:#ece7da;}
.ringVal{stroke-linecap:round; transition:stroke-dashoffset .6s ease;}
.ringLabel{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:'DM Sans',sans-serif;}
.ringLabel b{font-size:32px; color:var(--navy);}
.ringLabel span{font-size:11px; color:var(--muted);}

.badge-critica{background:var(--r1); color:#fff; font-family:'DM Sans',sans-serif; font-weight:700; font-size:11px; padding:4px 10px; border-radius:20px;}

/* Termómetro */
#thermo-wrap{display:flex; gap:22px; align-items:flex-start; flex-wrap:wrap;}
#thermo{width:64px; flex:0 0 64px; display:flex; flex-direction:column-reverse; border-radius:40px; overflow:hidden; box-shadow:var(--shadow); border:1px solid #e6e0d2;}
.thermo-seg{padding:20px 0; text-align:center; font-family:'DM Sans',sans-serif; font-weight:700; font-size:12px; color:#fff; cursor:pointer; transition:filter .15s;}
.thermo-seg:hover{filter:brightness(1.06);}
.thermo-seg.sel{outline:3px solid var(--navy); outline-offset:-3px;}
.thermo-seg.s0{background:var(--r5);} .thermo-seg.s1{background:var(--r4); color:#5a4c1e;}
.thermo-seg.s2{background:var(--r3); color:#5a4c1e;} .thermo-seg.s3{background:var(--r2);}
.thermo-seg.s4{background:var(--r1);}
#thermo-detail{flex:1; min-width:280px;}

.categoryRow{display:flex; align-items:center; gap:14px; padding:11px 16px; border-radius:10px; margin-bottom:6px; cursor:pointer; transition:transform .12s;}
.categoryRow:hover{transform:translateX(3px);}
.categoryRow .dot{width:14px; height:14px; border-radius:50%; flex:0 0 14px;}
.categoryRow b{font-family:'DM Sans',sans-serif; font-size:14px;}
.categoryRow span{font-family:'DM Sans',sans-serif; font-size:12.5px; color:var(--muted); display:block;}

/* Nav buttons bottom */
.navFooter{display:flex; justify-content:space-between; margin-top:16px;}
.btn{font-family:'DM Sans',sans-serif; font-weight:700; font-size:13.5px; padding:11px 22px; border-radius:9px; border:none; transition:opacity .15s, transform .1s;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--navy); color:#fff;}
.btn-primary:hover{background:var(--navy-2);}
.btn-gold{background:var(--gold); color:var(--navy);}
.btn-gold:hover{background:var(--gold-light);}
.btn-ghost{background:transparent; color:var(--navy); border:1.5px solid #d8d2c2;}
.btn-ghost:hover{background:#f0ece0;}
.btn:disabled{opacity:.4; cursor:not-allowed;}

/* Activities */
.optList{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0;}
.optList.single{grid-template-columns:1fr;}
.optBtn{text-align:left; padding:11px 14px; border-radius:10px; border:1.5px solid #e2ddcf; background:#fdfcf9; font-family:'DM Sans',sans-serif; font-size:13.5px; line-height:1.35;}
.optBtn:hover{border-color:var(--gold);}
.optBtn.correct{border-color:var(--r5); background:var(--r5-bg);}
.optBtn.incorrect{border-color:var(--r1); background:var(--r1-bg);}
.feedback{margin-top:12px; padding:13px 16px; border-radius:10px; background:#f1f4fb; border-left:4px solid var(--navy); font-size:14px; line-height:1.5;}
@media(max-width:640px){.optList{grid-template-columns:1fr;}}
.feedback.good{border-left-color:var(--r5); background:var(--r5-bg);}
.feedback.bad{border-left-color:var(--r1); background:var(--r1-bg);}
.quote{font-style:italic; font-size:16px; color:var(--navy-2); border-left:3px solid var(--gold); padding-left:14px; margin:10px 0;}

table.dtbl{width:100%; border-collapse:collapse; font-family:'DM Sans',sans-serif; font-size:13px; margin-top:10px;}
table.dtbl th{background:var(--navy); color:#fff; text-align:left; padding:8px 10px;}
table.dtbl td{padding:8px 10px; border-bottom:1px solid #ece7da; vertical-align:top;}

.pillGrid{display:flex; flex-wrap:wrap; gap:7px; margin-top:8px;}
.pillGrid .pill{font-family:'DM Sans',sans-serif; font-size:12.5px; padding:6px 12px; border-radius:20px; background:#eef1f8; color:var(--navy-2);}

.qStepDot{display:inline-block; width:8px; height:8px; border-radius:50%; background:#d8d2c2; margin-right:4px;}
.qStepDot.active{background:var(--gold);}

select, input[type=text]{font-family:'DM Sans',sans-serif; font-size:13.5px; padding:8px 10px; border-radius:8px; border:1.5px solid #d8d2c2; background:#fff;}
label{font-family:'DM Sans',sans-serif; font-size:12.5px; font-weight:700; color:var(--navy-2); display:block; margin:12px 0 5px;}

.progressDots{display:flex; gap:6px; margin-bottom:14px;}
.progressDots .d{width:26px; height:5px; border-radius:4px; background:#e2ddcf;}
.progressDots .d.on{background:var(--gold);}

#scoreCircle{width:130px; height:130px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-direction:column; margin:0 auto 20px; border:8px solid var(--navy); font-family:'DM Sans',sans-serif;}
#scoreCircle b{font-size:30px; color:var(--navy);}
#scoreCircle span{font-size:11px; color:var(--muted);}

.methodFlow{display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-family:'DM Sans',sans-serif; font-weight:700; font-size:13px; color:var(--navy-2); margin:12px 0;}
.methodFlow .step{background:#eef1f8; padding:7px 13px; border-radius:20px;}
.methodFlow .arrow{color:var(--gold);}

.centerBig{text-align:center; padding:26px 10px;}
.centerBig h2{font-size:34px; margin-bottom:6px;}

@media(max-width:900px){
  body{flex-direction:column;}
  #sidebar{position:relative; height:auto; width:100%; flex:none;}
  #main{padding:26px 16px 80px;}
}
</style>
</head>
<body>

<nav id="sidebar">
  <div id="brand">
    <div class="eyebrow">TMLF Academy · Visa T</div>

    <div id="progressBar"><div id="progressFill"></div></div>
    <div id="progressLabel">0% completado</div>
  </div>
  <ul id="navList"></ul>
</nav>

<main id="main"><div id="content"></div></main>

let state = JSON.parse(localStorage.getItem('tratometro_progress') || '{}');
if(!state.completed) state.completed = {};
if(!state.current) state.current = 1;
if(!state.examAnswers) state.examAnswers = {};
if(!state.examAttempts) state.examAttempts = 0;

function saveState(){ localStorage.setItem('tratometro_progress', JSON.stringify(state)); }
function markDone(id){ state.completed[id]=true; saveState(); renderNav(); updateProgress(); }
function goTo(id){ state.current=id; saveState(); renderNav(); render(); window.scrollTo({top:0,behavior:'smooth'}); }

function renderNav(){
  const ul = document.getElementById('navList');
  ul.innerHTML = MODULES.map(m=>{
    const meta = MODULE_META[m.id]||{icon:'thermo'};
    return `<li><button class="navBtn ${state.current===m.id?'active':''} ${state.completed[m.id]?'done':''}" onclick="goTo(${m.id})">
      <span class="navIcon">${ICONS[meta.icon]}</span><span class="num">${m.id<13?m.id:'★'}</span><span>${m.title}</span>
    </button></li>`;
  }).join('');
}
function updateProgress(){
  const done = Object.keys(state.completed).length;
  const pct = Math.round(done/MODULES.length*100);
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressLabel').textContent = pct+'% completado';
}
function footer(prevId, nextId, nextLabel){
  return `<div class="navFooter">
    ${prevId? `<button class="btn btn-ghost" onclick="goTo(${prevId})">← Anterior</button>`:'<span></span>'}
    ${nextId? `<button class="btn btn-primary" onclick="finishAndGo(${state.current},${nextId})">${nextLabel||'Siguiente →'}</button>`:'<span></span>'}
  </div>`;
}
function finishAndGo(cur,next){ markDone(cur); goTo(next); }

function catTag(cat){
  const map={n3:['n3','Nivel 3'],n2f:['n2f','Nivel 2 · Frecuencia'],n2s:['n2s','Nivel 2 · Sistematicidad'],n1:['n1','Nivel 1'],n0:['n0','No configura trata']};
  const [cls,label]=map[cat]||['n1',cat];
  return `<span class="tag ${cls}">${label}</span>`;
}

function buildThermo(){
  const t = document.getElementById('thermo');
  if(!t) return;
  const order = [4,3,2,1,0]; // s0=verde bottom ... s4=rojo top when column-reverse
  t.innerHTML = `
   <div class="thermo-seg s4" onclick="showThermo(0)">3</div>
   <div class="thermo-seg s3" onclick="showThermo(1)">2</div>
   <div class="thermo-seg s2" onclick="showThermo(2)">2</div>

}
function showThermo(i){
  const cat = CATEGORIAS[i];

  detail.innerHTML = `

    <p class="hint">${cat.desc}</p>
    <table class="dtbl"><thead><tr><th>Conducta</th><th>Ejemplo</th><th>${cat.key==='n0'?'¿Por qué no es trata?':'Elemento TVPA'}</th></tr></thead><tbody>

}

function mountM3(){

    {t:"B) Posible manipulación / indicador Nivel 1", correct:true},

  ];

  if(!wrap) return;

function answerM3(i){
  const opts = window.__m3opts;
  document.querySelectorAll('#m3-opts .optBtn').forEach((b,idx)=>{

    b.disabled=true;

   <div class="feedback ${opts[i].correct?'good':'bad'}">
     <b>Respuesta esperada: B) Posible manipulación.</b><br>

     <b>Pregunta que debería hacer el entrevistador:</b> "¿Qué le pide exactamente que haga a cambio? ¿Qué pasaría si usted se negara?"

/* =========================================================
   SCORM 1.2 — comunicación con Moodle (LMS)
   ========================================================= */
var SCORM_API = null;
var SCORM_INITIALIZED = false;

function SCORM_findAPI(win){
  let attempts = 0;
  while(win && attempts < 500){
    try{
      if(win.API) return win.API;
    }catch(e){ /* cross-origin frame — no se puede acceder, se detiene esta cadena */ return null; }
    try{
      if(win.parent && win.parent !== win){ win = win.parent; attempts++; }
      else { break; }
    }catch(e){ return null; }
  }
  return null;
}
function SCORM_getAPI(){
  let api = null;
  // 1. Buscar subiendo por la cadena de ventanas padre (caso típico: contenido en un iframe de Moodle)
  try{ api = SCORM_findAPI(window); }catch(e){ api = null; }
  // 2. Si no se encontró, buscar en window.opener (caso: contenido abierto en ventana/pestaña nueva)
  if(!api){
    try{ if(window.opener) api = SCORM_findAPI(window.opener); }catch(e){ /* opener cruzado, ignorar */ }
  }
  // 3. Último intento: comprobar window.top directamente
  if(!api){
    try{ if(window.top && window.top.API) api = window.top.API; }catch(e){ /* ignorar */ }
  }
  return api;
}
function SCORM_init(){
  try{
    SCORM_API = SCORM_getAPI();
  }catch(e){ SCORM_API = null; }
  if(!SCORM_API){ return false; }
  try{
    const result = SCORM_API.LMSInitialize('');
    SCORM_INITIALIZED = (result === 'true' || result === true);
    if(SCORM_INITIALIZED){
      // Si el curso ya se había iniciado antes, respeta el estado previo salvo que ya esté completado/aprobado.
      const status = SCORM_API.LMSGetValue('cmi.core.lesson_status');
      if(status === '' || status === 'not attempted'){
        SCORM_API.LMSSetValue('cmi.core.lesson_status', 'incomplete');
        SCORM_API.LMSCommit('');
      }
      console.log('SCORM: conectado al LMS correctamente.');
    }
    return SCORM_INITIALIZED;
  }catch(e){ console.warn('SCORM_init error:', e); SCORM_INITIALIZED = false; return false; }
}
function SCORM_reportScore(score, passed){
  // Si no se conectó al cargar la página, intenta una última vez antes de dar por perdido el reporte.
  if(!SCORM_API || !SCORM_INITIALIZED){
    const ok = SCORM_init();
    if(!ok){
      console.warn('SCORM: no se encontró un LMS activo — la calificación no se envió a Moodle (modo local).');
      return;
    }
  }
  try{
    SCORM_API.LMSSetValue('cmi.core.score.raw', String(score));
    SCORM_API.LMSSetValue('cmi.core.score.min', '0');
    SCORM_API.LMSSetValue('cmi.core.score.max', '100');
    SCORM_API.LMSSetValue('cmi.core.lesson_status', passed ? 'passed' : 'failed');
    SCORM_API.LMSCommit('');
    console.log('SCORM: calificación enviada al LMS ->', score, passed?'passed':'failed');
  }catch(e){ console.warn('SCORM_reportScore error:', e); }
}
function SCORM_finish(){
  if(!SCORM_API || !SCORM_INITIALIZED) return;
  try{
    // Si el trainee completó todos los módulos pero aún no hay estado passed/failed registrado, marca completed.
    const status = SCORM_API.LMSGetValue('cmi.core.lesson_status');
    if(status !== 'passed' && status !== 'failed'){
      const doneCount = Object.keys(state.completed || {}).length;
      if(doneCount >= MODULES.length){
        SCORM_API.LMSSetValue('cmi.core.lesson_status', 'completed');
      }
    }
    SCORM_API.LMSCommit('');
    SCORM_API.LMSFinish('');
  }catch(e){ console.warn('SCORM_finish error:', e); }
  SCORM_INITIALIZED = false;
}
window.addEventListener('beforeunload', function(){ try{ SCORM_finish(); }catch(e){} });

function afterRenderHook(){
  const id = state.current;
  if(id===1) mountModule1Extras();
  if(id===3) mountM3();
  if(id===9) mountM9();
  if(id===10) mountM10();
}
const originalRender = render;
render = function(){
  originalRender();
  afterRenderHook();
};

// Intento inicial de conexión con el LMS. Si falla, reintenta una vez tras 800ms
// (por si el reproductor SCORM del LMS aún no ha inyectado la API en ese instante).
try{
  const connected = SCORM_init();
  if(!connected){
    setTimeout(function(){
      try{
        const retryOk = SCORM_init();
        if(!retryOk){
          console.warn('SCORM API no encontrada tras reintento — modo local (sin LMS). Esto es normal si el archivo se abre fuera de Moodle (vista previa, doble clic, etc.).');
        }
      }catch(e){ console.warn('SCORM_init retry error:', e); }
    }, 800);
  }
}catch(e){ console.warn('SCORM_init top-level error:', e); }
renderNav();
updateProgress();
render();
</script>
