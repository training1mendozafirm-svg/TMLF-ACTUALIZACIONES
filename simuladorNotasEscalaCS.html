<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CUSTOMER SERVICE — OPERATIONAL SIMULATOR</title>
<style>
:root{--p1:#171a21;--p2:#617073;--p3:#7a93ac;--p4:#92bcea;--p5:#afb3f7;--line:#e4e6ea;--ink:#1d1c1d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;color:var(--ink);background:#dfe5ec}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em;flex:none}
.screen{position:fixed;inset:0;display:flex;flex-direction:column}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#c9ced6;border-radius:9px;border:2px solid transparent;background-clip:content-box}

/* ===== HOME / TRAINING CHROME ===== */
#screenHome,#screenResult,#screenInstr{background:radial-gradient(1200px 600px at 20% -10%,#2b3345 0,#171a21 60%);color:#e8eef5;overflow:auto}
.hm{width:min(1120px,94vw);margin:0 auto;padding:30px 0 60px}
.hm h1{font-size:21px;letter-spacing:.14em;margin:0 0 4px;font-weight:700}
.hm .sub{color:var(--p3);font-size:12px}
.hcard{background:#1f242e;border:1px solid #2c3441;border-radius:10px;padding:18px;margin-top:16px}
.hcard h3{margin:0 0 12px;font-size:11px;letter-spacing:.12em;color:var(--p4);text-transform:uppercase}
.inp,.hm select,.hm textarea,.modal input,.modal select,.modal textarea{background:#12151b;border:1px solid #2f3846;border-radius:6px;color:#fff;padding:8px 10px;width:100%}
.inp:focus,.hm select:focus,.hm textarea:focus,.modal input:focus,.modal textarea:focus{outline:2px solid var(--p5);outline-offset:-1px}
.btn{border:1px solid #3a4557;background:#262d39;color:#e8eef5;padding:7px 13px;border-radius:6px;display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:#2f3846}
.btn.pri{background:var(--p4);border-color:var(--p4);color:#10151c;font-weight:600}.btn.pri:hover{background:#a6caf0}
.btn.vio{background:var(--p5);border-color:var(--p5);color:#10131a;font-weight:600}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.dng{border-color:#7a3340;color:#ffb9c3}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lvgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.lvc{border:1px solid #2f3846;border-radius:8px;padding:12px;background:#171b23;cursor:pointer}
.lvc.on{border-color:var(--p4);background:#1c2634}
.lvc b{display:block;margin-bottom:3px}.lvc span{color:var(--p3);font-size:11.5px}
.exl{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.exi{border:1px solid #2f3846;border-radius:8px;padding:11px 12px;background:#171b23;display:flex;flex-direction:column;gap:6px}
.exi h4{margin:0;font-size:13px}.exi .m{color:var(--p3);font-size:11.5px;display:flex;gap:8px;flex-wrap:wrap}
.pill{border-radius:99px;padding:1px 8px;font-size:10.5px;background:#2a3342;color:#cfe0f3}
.pill.ok{background:#173b2a;color:#9be2bb}.pill.no{background:#3d1f27;color:#ffb9c3}.pill.l1{background:#1d3a55}.pill.l2{background:#3a3560}.pill.l3{background:#4a2f55}
.note-warn{font-size:11.5px;color:var(--p3);line-height:1.5}
table.tb{width:100%;border-collapse:collapse;font-size:12px}
table.tb th{text-align:left;color:var(--p4);font-weight:600;padding:7px 8px;border-bottom:1px solid #2c3441;font-size:11px;letter-spacing:.04em}
table.tb td{padding:7px 8px;border-bottom:1px solid #262d39;vertical-align:top}
table.tb tr.clk{cursor:pointer}table.tb tr.clk:hover td{background:#1c2330}

/* ===== TOP BAR ===== */
#topbar{height:40px;background:var(--p1);color:#cfd9e4;display:flex;align-items:center;gap:12px;padding:0 12px;font-size:12px;flex:none;border-bottom:2px solid var(--p5)}
#topbar .brand{font-weight:700;letter-spacing:.1em;color:var(--p4);font-size:10.5px;white-space:nowrap}
#topbar .chip{background:#232a35;border:1px solid #2f3846;border-radius:5px;padding:3px 8px;white-space:nowrap}
#topbar .sp{flex:1}
#topbar button{background:#232a35;border:1px solid #38445a;color:#dbe6f2;border-radius:5px;padding:4px 10px;font-size:12px;white-space:nowrap}
#topbar button:hover{border-color:var(--p4)}
#topbar button.fin{background:var(--p5);color:#10131a;border-color:var(--p5);font-weight:600}
#topbar .seg{display:inline-flex}.seg button{border-radius:0!important}.seg button:first-child{border-radius:5px 0 0 5px!important}.seg button:last-child{border-radius:0 5px 5px 0!important}
.seg button.on{background:var(--p4)!important;color:#10151c!important;border-color:var(--p4)!important}
#timer{font-variant-numeric:tabular-nums;color:var(--p4)}
#workspace{flex:1;min-height:0;display:grid;grid-template-columns:56% 44%;background:#171a21}
#workspace.v-crm,#workspace.v-slack{grid-template-columns:1fr}
#workspace.v-crm #pSlack,#workspace.v-slack #pCRM{display:none}
.plat{min-width:0;min-height:0;position:relative;overflow:hidden;background:#fff;display:flex;flex-direction:column}
#pCRM{border-right:3px solid var(--p1)}
.ptab{height:22px;flex:none;background:#232a35;color:#9fb4c9;font-size:10.5px;letter-spacing:.06em;display:flex;align-items:center;justify-content:space-between;padding:0 8px}
.ptab button{background:none;border:0;color:var(--p4);font-size:10.5px;padding:0}
.plat>.body{flex:1;min-height:0;position:relative}
.noexp{position:absolute;inset:0;background:rgba(246,247,249,.96);z-index:20;display:flex;align-items:center;justify-content:center;text-align:center;color:#555;padding:30px;font-size:13px}

/* ===== CRM ===== */
.crm{display:flex;height:100%;font-size:12px;color:#1f2328;background:#fff;position:relative}
.crm-side{width:186px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:6px 0;overflow:auto}
.crm-brand{display:flex;gap:8px;align-items:center;padding:6px 10px;font-size:11px;line-height:1.25}
.crm-brand .lg{width:20px;height:20px;border-radius:5px;background:#0b6b3a;color:#fff;font-weight:700;font-size:10px;display:grid;place-items:center}
.crm-ssearch{margin:8px 8px 6px;border:1px solid #333;border-radius:8px;padding:5px 8px;font-size:11px;color:#555}
.ni{display:flex;align-items:center;gap:8px;padding:5px 10px;font-size:11px;color:#333;cursor:pointer;margin:0 6px;border-radius:7px;white-space:nowrap}
.ni:hover{background:#f3f4f6}.ni.sel{background:#111;color:#fff;font-weight:600}
.ni.na{color:#444}
.nsec{font-size:10px;color:#666;padding:12px 12px 4px;letter-spacing:.03em;display:flex;justify-content:space-between;cursor:pointer}
.crm-sfoot{margin-top:auto;border-top:1px solid var(--line);padding-top:6px}
.crm-user{display:flex;align-items:center;gap:7px;padding:8px 10px;font-size:10.5px}
.crm-user .av{width:18px;height:18px;border-radius:50%;background:#111;color:#fff;font-size:8px;display:grid;place-items:center}
.crm-main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.crm-top{display:flex;align-items:center;gap:10px;padding:10px 14px 2px;font-size:12px}
.crm-top h2{font-size:12px;font-weight:600;margin:0;flex:1}
.crm-search{display:flex;align-items:center;gap:6px;border:1px solid #d5d8de;border-radius:7px;padding:5px 9px;width:230px;font-size:11px;color:#666;background:#fff}
.crm-search input{border:0;outline:0;flex:1;min-width:0;font-size:11px;background:transparent}
.crm-chips{display:flex;gap:8px;align-items:center;padding:8px 14px 2px;flex-wrap:wrap;font-size:11px}
.st{border-radius:99px;padding:2px 9px;font-size:10.5px}
.st.open{background:#d8f5e3;color:#145c34}.st.due{background:#fde7e7;color:#a11}.st.ina{background:#fff1cc;color:#8a5a00}
.cid{font-weight:600;display:inline-flex;gap:5px;align-items:center}
.tagrow{padding:4px 14px 6px;display:flex;gap:8px;flex-wrap:wrap}
.tg{display:inline-flex;gap:5px;align-items:center;border-radius:99px;background:#eef0f3;padding:2px 10px;font-size:10px}
.tg:before{content:"";width:5px;height:5px;border-radius:50%;background:#e0457b}
.tg.y:before{background:#e8b100}.tg.b:before{background:#5c7cfa}
.crm-body{flex:1;min-height:0;display:flex;border-top:1px solid var(--line)}
.lp{width:218px;flex:none;overflow:auto;padding:8px 8px 20px 12px}
.lp .ctl{display:flex;justify-content:space-between;font-size:10.5px;color:#444;padding:2px 4px 8px;cursor:pointer}
.sect{border:1px solid var(--line);border-radius:8px;margin-bottom:12px;background:#fff}
.sect .sh{display:flex;justify-content:space-between;align-items:center;padding:9px 11px;font-size:10px;letter-spacing:.06em;color:#555;cursor:pointer;background:#f6f7f9;border-radius:8px 8px 0 0}
.sect.c .sh{border-radius:8px}.sect.c .sb{display:none}
.sect .sb{padding:4px 11px 8px}
.fld{padding:7px 0;border-bottom:1px solid #eee}.fld:last-child{border:0}.fld small{display:block;color:#777;font-size:10.5px}.fld b{font-weight:500;font-size:11.5px;word-break:break-word}
.cbadge{display:inline-block;background:#d8f5e3;color:#145c34;border-radius:4px;padding:1px 6px;font-size:10px;margin-top:4px}
.ph{display:flex;align-items:center;gap:6px;padding:5px 0;font-size:10.5px;color:#444}.ph small{color:#888;font-size:8.5px;display:block;letter-spacing:.05em}
.cp{flex:1;min-width:0;overflow:auto;padding:0 14px 30px;position:relative}
.tabs{display:flex;gap:2px;align-items:center;padding:10px 0 8px;font-size:12px;border-bottom:0;position:sticky;top:0;background:#fff;z-index:3}
.tabs .t{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:7px;color:#444;cursor:pointer;border:1px solid transparent}
.tabs .t.sel{border:1px solid #e0e3e8;font-weight:600;color:#111}
.tabs .cnt{background:#eceef1;border-radius:99px;font-size:10px;padding:0 6px}
.nhead{display:flex;align-items:center;gap:10px;padding:6px 0 10px;font-size:11.5px;color:#555}
.nhead .ib{border:0;background:none;color:#555;padding:2px}
.nhead .sp{flex:1}
.sel2{border:1px solid #cfd3da;background:#fff;border-radius:8px;padding:6px 10px;font-size:11.5px;display:inline-flex;justify-content:space-between;align-items:center;gap:20px;min-width:170px}
.addbtn{border:1px solid #cfd3da;background:#fff;border-radius:8px;padding:6px 12px;font-size:11.5px;display:inline-flex;align-items:center;gap:8px;position:relative}
.addbtn.open{background:#eceef1}
.menu{position:absolute;right:0;top:calc(100% + 4px);width:260px;background:#fff;border:1px solid #dcdfe4;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);z-index:30;padding:6px;text-align:left;font-size:12px}
.menu .ms{display:flex;gap:8px;align-items:center;border-bottom:1px solid #eee;padding:6px 8px;color:#777}
.menu .ms input{border:0;outline:0;flex:1;font-size:12px}
.menu .mg{font-size:10px;font-weight:600;color:#666;padding:8px 8px 3px;letter-spacing:.03em}
.menu .mi{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:6px;cursor:pointer}
.menu .mi:hover,.menu .mi.hl{background:#eceef1}.menu .mi .r{margin-left:auto;color:#888;font-size:10.5px}
.menu hr{border:0;border-top:1px solid #eee;margin:4px 0}
.note{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;position:relative;background:#fff}
.note.pinned{border-color:#c9d3ee;background:#fbfcff}
.note h4{margin:0 0 2px;font-size:12px;font-weight:600;padding-right:70px}
.nmeta{font-size:10px;color:#666;display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap;text-transform:none}
.nmeta .au{text-transform:uppercase}
.nmeta .team{background:#e6eefc;color:#1a3d8f;border-radius:99px;padding:1px 8px;font-weight:500}
.nmeta .ed{color:#a15c00}
.nact{position:absolute;right:12px;top:12px;display:flex;gap:10px;color:#666}
.nact button{background:none;border:0;color:#666;padding:0}.nact button:hover{color:#000}
.nbody{font-size:12px;line-height:1.6;word-break:break-word}
.nbody.clamp{max-height:150px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent)}
.nbody b.lb{font-weight:700}
.nbody table{border-collapse:collapse}.nbody td,.nbody th{border:1px solid #ccc;padding:3px 7px}
.more{font-size:10.5px;color:#556;background:none;border:0;padding:4px 0 0;display:flex;gap:4px;align-items:center}
.ed-box{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px;background:#fff}
.ed-box .sel3{border:1px solid #2b2b2b;border-radius:8px;padding:0;margin-bottom:8px;position:relative;background:#fff}
.ed-box .sel3 input,.ed-box .sel3 select{border:0;outline:0;width:100%;padding:7px 28px 7px 10px;font-size:11.5px;background:transparent;appearance:none;-webkit-appearance:none;border-radius:8px}
.ed-box .sel3 .i{position:absolute;right:9px;top:9px;pointer-events:none;color:#444}
.ed-box .sel3.lite{border-color:#d3d6dc}
.ed-row{display:flex;gap:10px}.ed-row .sel3:first-child{width:110px;flex:none}.ed-row .sel3:last-child{flex:1}
.tbar{display:flex;align-items:center;gap:2px;padding:6px 8px;border:1px solid #e6e8ec;border-bottom:0;border-radius:8px 8px 0 0;background:#fafafb;font-size:11px;color:#444;flex-wrap:wrap}
.tbar button{background:none;border:0;padding:4px 6px;border-radius:5px;color:#333;position:relative;display:inline-flex;align-items:center;gap:2px}
.tbar button:hover{background:#e9ebef}.tbar button.dis{opacity:.4}
.tbar .sepv{width:1px;height:16px;background:#d9dce1;margin:0 4px}
.tbar .wc{margin-left:auto;font-size:10px;color:#777}
.ced{min-height:130px;max-height:340px;overflow:auto;border:1px solid #e6e8ec;border-radius:0 0 8px 8px;padding:10px 12px;font-size:12px;line-height:1.6;outline:0}
.ced:empty:before{content:attr(data-ph);color:#999}
.ced table,.nbody table{border-collapse:collapse}.ced td,.ced th{border:1px solid #ccc;padding:3px 8px;min-width:40px}
.ed-act{display:flex;justify-content:flex-end;gap:10px;padding-top:10px;align-items:center}
.b2{border:1px solid #2b2b2b;background:#fff;border-radius:7px;padding:5px 12px;font-size:11.5px;display:inline-flex;gap:6px;align-items:center}
.b2.ghost{border:0;background:none;font-weight:500}.b2.dark{background:#6f7378;color:#fff;border-color:#6f7378}.b2.dark.ready{background:#111;border-color:#111}
.b2:disabled{cursor:not-allowed}
.hmenu{position:absolute;top:100%;left:0;background:#fff;border:1px solid #dcdfe4;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.14);z-index:40;padding:4px;min-width:130px}
.hmenu div{padding:5px 9px;border-radius:5px;cursor:pointer;white-space:nowrap;color:#222}.hmenu div:hover{background:#eceef1}
.comm{width:310px;flex:none;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#fff}
.comm .ch{display:flex;align-items:center;gap:8px;padding:12px 12px 8px;font-size:11px;border-bottom:1px solid var(--line)}
.comm .ch .cl{background:#d8f5e3;color:#145c34;font-size:9.5px;border-radius:5px;padding:1px 7px}
.comm .tgl{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;font-size:10px;color:#444;border-bottom:1px solid #f0f0f0}
.sw{width:34px;height:19px;border-radius:99px;background:#cfd3da;position:relative;border:0;padding:0}.sw.on{background:#111}.sw:after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.15s}.sw.on:after{left:17px}
.msgs{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.bub{max-width:88%;border-radius:12px;padding:9px 11px;font-size:11px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.bub.out{align-self:flex-end;background:#0e0e10;color:#fff;border-bottom-right-radius:3px}.bub.in{align-self:flex-start;background:#eef0f3;border-bottom-left-radius:3px}
.bmeta{font-size:9.5px;color:#777;display:flex;gap:6px;align-items:center}.bmeta.r{align-self:flex-end}
.rel{font-size:9.5px;color:#4b3fd0;background:#eceafd;border-radius:5px;padding:1px 6px;align-self:flex-start;margin-bottom:6px}
.comp{border-top:1px solid var(--line);padding:10px 12px}
.comp .box{border:1px solid #d5d8de;border-radius:10px;padding:8px 10px}
.comp textarea{width:100%;border:0;outline:0;resize:none;font-size:11.5px;min-height:46px;background:transparent}
.comp .bt{display:flex;align-items:center;gap:10px;color:#555;justify-content:space-between}
.sendb{background:#c8cbd0;color:#fff;border:0;border-radius:7px;padding:6px 12px;display:inline-flex;gap:6px;align-items:center;font-size:11px}.sendb.rdy{background:#111}
.crm.compact .comm{position:absolute;right:0;top:0;bottom:0;z-index:12;box-shadow:-8px 0 20px rgba(0,0,0,.12);display:none}
.crm.compact.copen .comm{display:flex}
.cbtn{display:none}.crm.compact .cbtn{display:inline-flex}
.crm.compact .lp{width:190px}
.crm .na{cursor:not-allowed}

/* ===== SLACK ===== */
.sl{display:flex;height:100%;font-family:Lato,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:13.5px;color:#1d1c1d;background:#fff;position:relative}
.sl-rail{width:64px;background:#1b1c1f;color:#c9cbce;display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:10px;font-size:10px;flex:none}
.sl-rail .ws{width:34px;height:34px;border-radius:9px;background:#5b5e63;color:#fff;font-weight:700;display:grid;place-items:center;margin-bottom:4px}
.sl-rail .ri{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;cursor:pointer;line-height:1.15;padding:4px 2px;width:60px}
.sl-rail .ri .ic{width:34px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:16px}
.sl-rail .ri.sel .ic{background:#fff;color:#111}
.sl-rail .ri:hover .ic{background:#2a2b2f}.sl-rail .ri.sel:hover .ic{background:#fff}
.sl-rail .me{margin-top:auto;width:34px;height:34px;border-radius:9px;background:#8a6b4d;position:relative}
.sl-side{width:248px;background:#232427;color:#d1d2d3;display:flex;flex-direction:column;flex:none;min-height:0}
.sl-side .sh span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sl-side .sh{display:flex;gap:6px;align-items:center;justify-content:space-between;padding:12px 14px 8px;font-weight:800;font-size:14px;color:#fff}
.sl-side .sq{margin:4px 10px 8px;background:#38393d;border:1px solid #4a4b50;border-radius:7px;padding:5px 9px;font-size:12px;color:#c0c1c4;display:flex;gap:7px;align-items:center}
.sl-list{overflow:auto;flex:1;padding-bottom:10px}
.sl-list .it{display:flex;align-items:center;gap:8px;padding:3px 14px;margin:0 8px;border-radius:7px;font-size:13px;cursor:pointer;color:#c9cacd;height:27px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl-list .it:hover{background:#2f3033}.sl-list .it.sel{background:#fff;color:#111;font-weight:600}
.sl-list .it.b{font-weight:800;color:#fff}.sl-list .it.sel.b{color:#111}
.sl-list .it .i{opacity:.75;font-size:12px}
.sl-list .gh{padding:10px 18px 4px;font-size:12.5px;color:#c9cacd;display:flex;gap:8px;align-items:center}
.sl-list .it.na{opacity:.8}
.dm{display:flex;align-items:center;gap:8px}.dm .sq2{width:18px;height:18px;border-radius:4px}
.sl-main{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff}
.sl-hd{display:flex;align-items:center;gap:10px;padding:10px 16px 6px;min-height:46px}
.sl-hd h3{margin:0;font-size:17px;font-weight:800;display:flex;gap:6px;align-items:center}
.sl-hd .tp{color:#616061;font-size:12px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl-hd .rt{display:flex;gap:14px;color:#444;font-size:12px;align-items:center}
.sl-tabs{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid #e3e3e3;font-size:12.5px}
.sl-tabs .t{padding:6px 10px;display:flex;gap:6px;align-items:center;color:#444;cursor:pointer;border-radius:6px 6px 0 0}

function load(){try{DB=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){DB=null}

 const d=defaults();for(const k in d.config)if(DB.config[k]===undefined)DB.config[k]=d.config[k];
 for(const k in ERRDEF)if(!DB.config.errors[k])DB.config.errors[k]=clone(ERRDEF[k]);
 DB.results=DB.results||[]}
let saveT=null;
function save(){try{localStorage.setItem(LS,JSON.stringify(DB))}catch(e){if(!save.w){save.w=1;toast('No se pudo guardar en el navegador (almacenamiento lleno o bloqueado).',4500)}}}
function persist(){clearTimeout(saveT);saveT=setTimeout(()=>{if(S)DB.session=S;save()},250)}

/* ============================ MODALES ============================ */
function modal(html,cls=''){const bk=document.createElement('div');bk.className='bk';bk.innerHTML=`<div class="modal ${cls}">${html}</div>`;$('#modalRoot').appendChild(bk);return bk}
function confirmBox(title,msg,okLabel,cb,danger){const m=modal(`<h3>${esc(title)}</h3><p>${msg}</p><div class="acts"><button class="btn" data-x>Cancelar</button><button class="btn ${danger?'dng':'pri'}" data-ok>${esc(okLabel||'Aceptar')}</button></div>`);
 $('[data-x]',m).onclick=()=>m.remove();$('[data-ok]',m).onclick=()=>{m.remove();cb()}}
function askText(title,label,def='',type='text'){return new Promise(res=>{const m=modal(`<h3>${esc(title)}</h3><label>${esc(label)}</label><input type="${type}" value="${esc(def)}"><div class="acts"><button class="btn" data-x>Cancelar</button><button class="btn pri" data-ok>Aceptar</button></div>`);
 const i=$('input',m);setTimeout(()=>i.focus(),30);const done=v=>{m.remove();res(v)};
 $('[data-x]',m).onclick=()=>done(null);$('[data-ok]',m).onclick=()=>done(i.value);i.onkeydown=e=>{if(e.key==='Enter')done(i.value);if(e.key==='Escape')done(null)}})}

function hasTerm(nt,dg,term){term=String(term).trim();if(!term)return false;
 if(/^[\d\s().+-]{7,}$/.test(term)){const d=digs(term);return d.length>=7&&dg.includes(d)}
 const t=norm(term);return term.length<=3?nt.includes(t):nt.includes(t.trim())}
const hasKey=(k,nt,dg)=>k.any.some(t=>hasTerm(nt,dg,t));
function keyCheck(keys,text){const nt=norm(text),dg=digs(text),hit=[],miss=[];(keys||[]).forEach(k=>(hasKey(k,nt,dg)?hit:miss).push(k));return{hit,miss,ratio:keys&&keys.length?hit.length/keys.length:1}}
const NEG=new Set(['no','not','never','nor','without','cannot','t','nothing','nunca','ni','sin','whether','if','asked','asking','ask','wants','wanted','know','question','questions','duda','pregunta','si']);
function negHits(keys,text){const nt=norm(text);return(keys||[]).filter(k=>k.any.some(term=>{const t=norm(term).trim();if(!t)return false;let i=-1;while((i=nt.indexOf(t,i+1))>=0){const pre=nt.slice(0,i).trim().split(' ').slice(-6);if(!pre.some(w=>NEG.has(w)))return true}return false}))}
function legalHits(list,text){return negHits((list||[]).map(p=>({label:p,any:[p]})),text).map(k=>k.label)}
function parseNote(text){const F=DB.config.noteTemplate.fields;const re=new RegExp('^\\s*('+F.map(l=>l.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')\\s*:\\s*(.*)$','i');const sec={};let cur=null;
 String(text).split('\n').forEach(l=>{const m=l.match(re);if(m){cur=F.find(x=>x.toLowerCase()===m[1].toLowerCase());sec[cur]=(sec[cur]||'')+m[2]}else if(cur)sec[cur]+='\n'+l});return sec}

 const all=note+'\n'+msgs;let m=all.match(MISSP);if(m)issues.push('Posibles errores ortográficos: '+[...new Set(m.map(x=>x.toLowerCase()))].join(', '));

  const bad=Object.values(parseNote(note)).filter(v=>/^[a-záéíóúñ]/.test(v.trim()));if(bad.length>1)issues.push('Varias secciones de la nota inician con minúscula');

const k2t=ks=>(ks||[]).map(k=>(k.crit?'!':'')+k.label+' = '+k.any.join(' | ')).join('\n');
const t2k=t=>String(t||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{let crit=false;if(l[0]==='!'){crit=true;l=l.slice(1).trim()}const i=l.indexOf('=');const label=(i>=0?l.slice(0,i):l).trim();const any=(i>=0?l.slice(i+1):l).split('|').map(s=>s.trim()).filter(Boolean);return crit?{label,any,crit:true}:{label,any}});
const sec2t=(o,fn)=>Object.entries(o||{}).map(([c,v])=>'## '+c+'\n'+fn(v)).join('\n');
const t2sec=(t,fn)=>{const o={};let cur=null,buf=[];const fl=()=>{if(cur)o[cur]=fn(buf.join('\n').trim())};String(t||'').split('\n').forEach(l=>{const m=l.match(/^##\s*(\S+)/);if(m){fl();cur=m[1];buf=[]}else buf.push(l)});fl();return o};
const notes2t=ns=>(ns||[]).map(n=>[n.a,n.team,n.d,n.title,String(n.b).replace(/\n/g,'\\n')].join(' | ')).join('\n');
const t2notes=t=>String(t||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split(' | ');return{a:p[0]||'',team:p[1]||'',d:p[2]||'2026-11-01 09:00',title:p[3]||'',b:(p.slice(4).join(' | ')||'').replace(/\\n/g,'\n')}});
const sms2t=ms=>(ms||[]).map(m=>[m.dir,String(m.x).replace(/\n/g,'\\n'),m.t].join(' | ')).join('\n');
const t2sms=t=>String(t||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split(' | ');return{dir:p[0]==='in'?'in':'out',x:(p[1]||'').replace(/\\n/g,'\n'),t:p[2]||'',rel:false}});

 $('[data-rst]',m).onclick=()=>{DB.results=DB.results.filter(x=>!(x.user===r.user&&x.exId===r.exId));save();m.remove();iRes();toast('Ejercicio reiniciado para '+r.user)}}
function iProg(){const b=$('#iBody');const users=[...new Set(DB.results.map(r=>r.user))].sort();const rs=DB.results.filter(r=>!iUser||r.user===iUser);
 const sk=CRITERIA.map(c=>{const a=rs.map(r=>r.criteria.find(x=>x.id===c.id)).filter(x=>x&&x.applies&&x.max);const q=a.length?a.reduce((s,x)=>s+x.earned/x.max,0)/a.length:null;return{...c,q,n:a.length}});const low=sk.filter(s=>s.q!=null).sort((a,b)=>a.q-b.q).slice(0,3).map(s=>s.id);
 const er={};rs.forEach(r=>r.errors.forEach(e=>er[e.label]=(er[e.label]||0)+1));
 b.innerHTML=`<div class="hcard"><div class="row"><select id="pUser" style="max-width:260px"><option value="">Todos los colaboradores</option>${users.map(u=>`<option ${u===iUser?'selected':''}>${esc(u)}</option>`).join('')}</select><span class="note-warn">${rs.length} intento(s) analizado(s)</span></div></div>
 <div class="hcard"><h3>Dominio por habilidad</h3>${rs.length?sk.map(s=>`<div class="skill"><span>${esc(s.label)}${low.includes(s.id)&&s.q<.85?' <span class="pill no">Requiere refuerzo</span>':''}</span><div class="bar" style="margin:0"><i class="${s.q==null?'':s.q>=.85?'hi':s.q<.6?'lo':''}" style="width:${s.q==null?0:Math.round(s.q*100)}%"></i></div><b>${s.q==null?'—':Math.round(s.q*100)+'%'}</b></div>`).join(''):'<div class="note-warn">Aún no hay resultados.</div>'}</div>
 <div class="two"><div class="hcard"><h3>Errores críticos más frecuentes</h3>${Object.keys(er).length?Object.entries(er).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="margin:5px 0">${esc(k)}: <b>${v}</b></div>`).join(''):'<div class="note-warn">Sin errores críticos registrados.</div>'}</div>
 <div class="hcard"><h3>Resumen por colaborador</h3><table class="tb"><tr><th>Colaborador</th><th>Intentos</th><th>Promedio</th><th>Aprobados</th></tr>${users.map(u=>{const a=DB.results.filter(r=>r.user===u);const sc=a.map(r=>r.adjusted!=null?r.adjusted:r.score);return `<tr><td>${esc(u)}</td><td>${a.length}</td><td>${Math.round(sc.reduce((x,y)=>x+y,0)/sc.length)}</td><td>${a.filter(r=>r.pass).length}</td></tr>`}).join('')}</table></div></div>`;
 $('#pUser').onchange=e=>{iUser=e.target.value;iProg()}}

window.addEventListener('DOMContentLoaded',init);

/* ---------------- MODO PRÁCTICA LIBRE: solo CRM + Slack ---------------- */
const CASES=()=>DB.exercises.filter(e=>e.client&&e.client.name);
function startFree(id,nm){const name=(nm||DB.lastUser||'').trim();if(!name)return;
 const ex=CASES().find(e=>e.id===id)||CASES()[0];DB.lastUser=name;EX=ex;
 const notes=(ex.notes||[]).map(n=>({id:uid(),author:n.a,team:n.team,dt:toD(n.d).getTime(),title:n.title,text:n.b,html:null,own:false,pinned:false}));
 S={free:true,user:name,exId:ex.id,attempt:1,started:Date.now(),elapsed:0,view:'split',channel:'tier-1',
  call:{phase:'done',sec:0,mode:'read',shown:0,open:false},notes,slack:buildSeed(),sms:clone(ex.sms||[]).map(m=>({...m,id:uid()})),
  draft:null,drafts:{},consulted:{notes:{},search:0,info:0},deleted:[],edits:[],finished:false,showRel:false};
 DB.session=S;save();renderWork()}
function renderWork(){screen('screenWork');const el=$('#screenWork');
 el.innerHTML=`<header id="topbar"><span class="brand">CRM + SLACK — PRÁCTICA DE NOTAS Y ESCALACIONES</span><span class="chip">Usuario: <b>${esc(S.user)}</b></span>
 <select id="tbCase" title="Caso de práctica (datos ficticios)">${CASES().map(e=>`<option value="${esc(e.id)}" ${e.id===EX.id?'selected':''}>${esc(e.client.name)}</option>`).join('')}</select><span class="sp"></span>
 <span class="seg"><button data-v="split">Dividida</button><button data-v="crm">CRM</button><button data-v="slack">Slack</button></span>
 <button id="tbUser" title="Cambiar de usuario">${ic('home')} Usuario</button><button id="tbReset" title="Borra las notas y mensajes escritos en este caso">Reiniciar caso</button></header>
 <main id="workspace"><div class="plat" id="pCRM"><div class="ptab"><span>ESPACIO 1 · MENDOZA LAW FIRM CRM</span><button data-max="crm">${ic('max')} Maximizar</button></div><div class="body" id="crmHost"></div></div>
 <div class="plat" id="pSlack"><div class="ptab"><span>ESPACIO 2 · SLACK</span><button data-max="slack">${ic('max')} Maximizar</button></div><div class="body" id="slackHost"></div></div></main>`;
 buildCRM();buildSlack();
 $$('#topbar [data-v]').forEach(b=>b.onclick=()=>setView(b.dataset.v));
 $$('[data-max]').forEach(b=>b.onclick=()=>setView(S.view===b.dataset.max?'split':b.dataset.max));
 $('#tbCase').onchange=e=>{const id=e.target.value;const hasWork=S.notes.some(n=>n.own)||Object.values(S.slack).flat().some(m=>m.own);
  if(!hasWork)return startFree(id,S.user);confirmBox('Cambiar de caso','Se perderán las notas y mensajes escritos en el caso actual.','Cambiar',()=>startFree(id,S.user),true);$('#tbCase').value=EX.id};
 $('#tbReset').onclick=()=>confirmBox('Reiniciar caso','Se borrarán las notas y mensajes que escribiste en este caso.','Reiniciar',()=>startFree(EX.id,S.user),true);
 $('#tbUser').onclick=()=>askText('Usuario','Tu nombre',S.user).then(v=>{if(v&&v.trim()){S.user=v.trim();DB.lastUser=S.user;persist();startFree(EX.id,S.user)}});
 setView(S.view,true)}
function init(){load();ensureScreens();
 const go=()=>{if(DB.session&&DB.session.free){S=DB.session;EX=CASES().find(e=>e.id===S.exId)||CASES()[0];renderWork()}else startFree(CASES()[0].id,DB.lastUser)};
 if(DB.session&&DB.session.free||DB.lastUser)return go();
 askText('Bienvenido','Escribe tu nombre para firmar tus notas y mensajes','').then(v=>{DB.lastUser=(v&&v.trim())||'Colaborador';go()})}

</script>
</body>
