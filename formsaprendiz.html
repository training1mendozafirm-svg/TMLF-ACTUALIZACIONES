<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formularios Migratorios TMLF</title>
<style>
:root{color-scheme:dark;--bg:#171A21;--panel:#1E222B;--panel2:#262B36;--line:#303644;--text:#E9EDF3;--muted:#A3AEBA;--dim:#617073;--a:#92BCEA;--b:#AFB3F7;--c:#7A93AC;--ok:#8FD3B0;--bad:#F2A0A0;--warn:#EBCB8B;--r:14px;--side:262px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--a);text-decoration:none}a:hover{text-decoration:underline}
h1,h2,h3{line-height:1.25;margin:0}
h1{font-size:clamp(1.5rem,2.6vw,2rem)}
.h2{font-size:1.2rem;margin:28px 0 12px}.h3{font-size:1.05rem;margin:0 0 12px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--b);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)}.sm{font-size:.85rem}.sp{flex:1}
.on{color:var(--ok)}.bad{color:var(--bad)}.okc{color:var(--ok)}.badc{color:var(--bad)}

/* layout */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:#13161C;border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 12px;border-bottom:1px solid var(--line)}
.logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--a),var(--b));color:#171A21;display:grid;place-items:center;font-weight:800;font-size:.9rem}
.brand b{display:block;font-size:.95rem}.brand span{font-size:.78rem;color:var(--muted)}
.nav-i{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:var(--text);font-size:.93rem;min-height:42px}
.nav-i:hover{background:var(--panel);text-decoration:none}
.nav-i.on{background:var(--panel2);box-shadow:inset 3px 0 0 var(--a);font-weight:600}
.side-f{margin-top:auto;font-size:.78rem;color:var(--muted);padding:8px 6px;border-top:1px solid var(--line)}
.main-wrap{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;gap:12px;align-items:center;padding:12px clamp(14px,3vw,32px);background:rgba(23,26,33,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
body.is-home .top .search{visibility:hidden}
.burger{display:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;width:42px;height:42px;font-size:1.2rem}
main{padding:clamp(16px,3vw,32px);max-width:none;width:100%;margin:0;flex:1;outline:none}
.foot{padding:16px clamp(16px,3vw,32px);color:var(--muted);font-size:.8rem;border-top:1px solid var(--line);text-align:center}

/* búsqueda */
.search{position:relative;flex:1;max-width:640px}
.search input{width:100%;padding:12px 16px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;font:inherit;min-height:44px}
.search input:focus{border-color:var(--a);outline:none;box-shadow:0 0 0 3px rgba(146,188,234,.2)}
.search.big{max-width:none;margin:18px 0}.search.big input{padding:16px 20px;font-size:1.05rem;border-radius:14px}
.sug{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.45);z-index:30}
.sug a{display:flex;gap:10px;padding:10px 14px;color:var(--text);align-items:baseline}
.sug a:hover{background:#2F3542;text-decoration:none}.sug .k{min-width:68px;color:var(--a);font-weight:700;font-size:.82rem}
.sug .all{color:var(--b);border-top:1px solid var(--line);font-size:.9rem}.sug .none{padding:12px 14px;color:var(--muted)}

/* piezas */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:18px 20px;margin-bottom:16px}
.ph{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
.lead{color:var(--muted);margin:6px 0 0;max-width:70ch}
.eyebrow{color:var(--b);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem;margin:0 0 6px}
.note{font-size:.82rem;color:var(--muted);border-left:3px solid var(--c);padding:6px 12px;margin:18px 0 0;background:rgba(122,147,172,.08);border-radius:0 8px 8px 0}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:11px;border:1px solid transparent;background:linear-gradient(135deg,var(--a),var(--b));color:#171A21;font-weight:700;min-height:42px;text-decoration:none}
.btn:hover{filter:brightness(1.08);text-decoration:none}
.btn.ghost{background:transparent;border-color:var(--c);color:var(--text)}.btn.ghost:hover{background:var(--panel2)}
.btn.done{background:rgba(143,211,176,.15);border-color:var(--ok);color:var(--ok)}
.btn.danger{background:transparent;border-color:#a96a6a;color:var(--bad)}
.btn.small{padding:6px 14px;min-height:36px;font-size:.9rem}
.btns,.actions,.hero-act{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;padding:4px 12px;border-radius:99px;background:rgba(146,188,234,.13);border:1px solid rgba(146,188,234,.35);color:var(--a);font-size:.86rem;font-weight:600;font-family:inherit;min-height:30px;align-items:center}
.chip:hover{background:rgba(146,188,234,.24);text-decoration:none}
.chip.alt{background:rgba(175,179,247,.12);border-color:rgba(175,179,247,.4);color:var(--b)}
.chip.dim{background:transparent;border-color:var(--dim);color:var(--muted);font-weight:500}
.chip.main{background:linear-gradient(135deg,var(--a),var(--b));color:#171A21;border:0}
.chip.pair{background:transparent;border-color:var(--c);color:var(--text);cursor:pointer}
.badge{display:inline-block;padding:2px 10px;border-radius:7px;font-size:.74rem;font-weight:700;letter-spacing:.02em;background:var(--panel2);color:var(--muted)}
.badge.principal{background:rgba(146,188,234,.18);color:var(--a)}.badge.complementario{background:rgba(175,179,247,.18);color:var(--b)}.badge.depende{background:rgba(122,147,172,.22);color:#C5D3E0}
.badge.lv-basico{background:rgba(143,211,176,.16);color:var(--ok)}.badge.lv-intermedio{background:rgba(235,203,139,.16);color:var(--warn)}.badge.lv-avanzado{background:rgba(242,160,160,.16);color:var(--bad)}
.badge.esc{background:rgba(235,203,139,.14);color:var(--warn)}.badge.cat{background:var(--panel2);color:var(--text)}
.bar{height:8px;background:#2A303C;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));border-radius:99px;transition:width .4s}
.bar.alt i{background:linear-gradient(90deg,var(--b),#C7B8F5)}.bar.bad i{background:var(--bad)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.tab{padding:8px 16px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--panel);font-size:.9rem;min-height:38px;display:inline-flex;align-items:center}
.tab:hover{text-decoration:none;border-color:var(--c)}.tab.on{background:var(--a);color:#171A21;border-color:var(--a);font-weight:700}
.crumbs{font-size:.85rem;color:var(--muted);margin-bottom:12px}
.empty{color:var(--muted);text-align:center;padding:30px}
.filter input{padding:10px 14px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;font:inherit;min-width:220px}
.tscroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}.tbl th,.tbl td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}.tbl th{color:var(--muted);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}

/* inicio */
.hero{padding:clamp(18px,4vw,40px);border-radius:20px;background:radial-gradient(900px 300px at 85% -20%,rgba(175,179,247,.22),transparent),radial-gradient(700px 300px at 0% 120%,rgba(146,188,234,.16),transparent),var(--panel);border:1px solid var(--line)}
.steps{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.step{display:flex;flex-direction:column;gap:4px;padding:14px;height:100%;position:relative;color:var(--text);font-size:.85rem}
.step:hover{border-color:var(--a);text-decoration:none;transform:translateY(-2px)}.step b{letter-spacing:.06em;color:var(--a)}.step .ico{font-size:1.5rem}.step .n{position:absolute;right:12px;top:10px;color:var(--dim);font-weight:800}
.step span:last-child{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.big-n{font-size:2.6rem;font-weight:800;color:var(--a);line-height:1.1}
.kv{list-style:none;padding:0;margin:14px 0 0}.kv li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:.92rem}.kv span{color:var(--muted)}
.news{list-style:none;padding:0;margin:0;display:grid;gap:12px}.news li{display:grid;gap:2px;font-size:.92rem}.news b{color:var(--text)}.news span{color:var(--muted)}
.more{display:inline-block;margin-top:10px;font-size:.9rem}.meta{font-size:.9rem;color:var(--muted)}

/* tarjetas */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.fcard,.pcard{display:flex;flex-direction:column;gap:6px;padding:16px;color:var(--text);border-top:3px solid var(--c,var(--a));transition:transform .15s,border-color .15s}
.pcard{border-top-color:var(--b)}
.fcard:hover,.pcard:hover{transform:translateY(-2px);border-color:var(--a);text-decoration:none}
.fc-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.fid{font-size:1.35rem;font-weight:800;color:var(--c,var(--a));letter-spacing:.01em}
.fname{font-weight:700}.fen{color:var(--muted);font-size:.82rem}.fshort{color:var(--muted);font-size:.9rem}
.fmn{font-size:.86rem;color:var(--b);margin-top:auto;padding-top:6px}
.fstat{display:flex;justify-content:space-between;font-size:.8rem;color:var(--dim);border-top:1px solid var(--line);padding-top:8px;margin-top:6px}
.pname{font-size:1.05rem}
.cat-h{display:grid;grid-template-columns:auto 1fr 140px;gap:14px;align-items:center;margin:28px 0 12px}
.cat-ico{font-size:1.8rem;width:50px;height:50px;border-radius:13px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--c)}
.cat-h .h2{margin:0}

/* ficha */
.ficha{--c:var(--a)}
.fh{display:flex;gap:20px;align-items:center;border-left:5px solid var(--c)}
.fh-id{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:900;color:var(--c);min-width:110px}
.fh-t p{margin:2px 0 8px}.row{display:flex;gap:8px;flex-wrap:wrap}
.mnemo{display:flex;flex-direction:column;gap:2px;padding:14px 18px;border-radius:var(--r);background:linear-gradient(135deg,rgba(146,188,234,.14),rgba(175,179,247,.14));border:1px solid rgba(175,179,247,.35);margin-bottom:12px}
.mnemo span{font-size:.8rem;color:var(--muted)}.mnemo b{font-size:1.1rem;color:var(--text)}
details.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px}
details.sec>summary{cursor:pointer;padding:14px 18px;font-weight:700;list-style:none;display:flex;justify-content:space-between;min-height:48px;align-items:center}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"＋";color:var(--a);font-weight:400}details[open].sec>summary::after{content:"－"}
.sec-b{padding:0 18px 16px}.sec-b p{margin:0 0 10px}
.list{margin:0;padding-left:20px;display:grid;gap:8px}.list.num{padding-left:22px}
.warn-l li::marker{color:var(--warn)}
.pend{border:1px dashed var(--warn);background:rgba(235,203,139,.07);border-radius:12px;padding:12px 16px;margin:12px 0}.pend b{color:var(--warn)}.pend ul{margin:6px 0 0;padding-left:20px}
.callout{padding:14px 18px;border-radius:var(--r);background:var(--panel2);border-left:4px solid var(--a);margin:14px 0}.callout p{margin:4px 0 0}
.callout.warn{border-left-color:var(--warn);background:rgba(235,203,139,.08)}.callout.okk{border-left-color:var(--ok);background:rgba(143,211,176,.08)}
.pn{display:flex;justify-content:space-between;gap:10px;margin:20px 0;flex-wrap:wrap}.pn a{padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.ext{word-break:break-all}

/* proceso */
.goal p{margin:6px 0}.mainf{margin-top:10px!important}
.dg{width:100%;height:auto;display:block}
.dg line{opacity:.9}
.dn rect{fill:#262B36;stroke:var(--s,#92BCEA);stroke-width:1.6}
.dn.link:hover rect{fill:#303747}.dn.doc rect{stroke-dasharray:4 3;fill:#1E222B}
.dn text{text-anchor:middle;fill:var(--text);font-family:inherit}.dn .t1{font-weight:800;font-size:14px;fill:var(--a)}.dn .t2{font-size:10.5px;fill:var(--muted)}.dn .dt{fill:var(--text);font-size:11px}
.dn.main rect{fill:#92BCEA;stroke:#AFB3F7;stroke-width:2}.dn.main .m1{font-weight:900;font-size:21px;fill:#171A21}.dn.main .m2{font-size:11.5px;fill:#202632}
.dn a,a.dn{cursor:pointer}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;color:var(--text);margin-top:6px;align-items:center}
.legend i{display:inline-block;width:26px;height:0;border-top:3px solid var(--c);vertical-align:middle;margin-right:6px}
.legend i.d1{border-top-style:dashed}.legend i.d2{border-top-style:dotted}
.route{margin:0;padding-left:22px;display:grid;gap:6px}
.when{font-size:.78rem;padding:2px 9px;border-radius:7px;white-space:nowrap;font-weight:600}
.w-habitual{background:rgba(146,188,234,.18);color:var(--a)}.w-segun{background:rgba(175,179,247,.18);color:var(--b)}.w-cuando{background:rgba(122,147,172,.25);color:#C5D3E0}

/* comparador */
.cmp-sel{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end}
.cmp-sel label{display:grid;gap:6px;font-size:.85rem;color:var(--muted)}
select{width:100%;padding:11px 12px;border-radius:10px;background:var(--panel2);color:var(--text);border:1px solid var(--line);font:inherit;min-height:44px}
.vs{font-size:1.4rem;color:var(--b);padding-bottom:8px}.pairs{margin-top:14px}
.cmp{overflow:hidden;margin-top:16px}
.cmp-row{display:grid;grid-template-columns:150px 1fr 1fr;border-bottom:1px solid var(--line)}
.cmp-row:last-child{border:0}
.cmp-l{padding:14px;font-weight:700;color:var(--b);font-size:.88rem;background:rgba(175,179,247,.06)}
.cmp-c{padding:14px;font-size:.92rem;border-left:1px solid var(--line)}.cmp-c.span{grid-column:2/4}
.cmp-h .cmp-t{display:flex;flex-direction:column;gap:2px;padding:14px;border-left:1px solid var(--line);color:var(--text);background:var(--panel2)}
.cmp-t b{font-size:1.4rem;color:var(--a)}.cmp-t i{font-style:normal;color:var(--b);font-size:.82rem}

/* simulador, quiz */
.cases{display:grid;gap:12px;margin-top:14px}.case .cs{margin:8px 0 12px}
.q-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.q .bar{margin-bottom:16px}
.scn{background:var(--panel2);border-left:4px solid var(--c);padding:12px 16px;border-radius:0 10px 10px 0;margin:0 0 14px}
.qp{font-size:1.15rem;margin-bottom:14px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;border-radius:12px;background:var(--panel2);border:1.5px solid var(--line);min-height:50px}
.opt:hover:not(:disabled){border-color:var(--a)}.opt .l{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--bg);font-weight:800;color:var(--a);font-size:.85rem}
.opt.right{border-color:var(--ok);background:rgba(143,211,176,.12)}.opt.wrong{border-color:var(--bad);background:rgba(242,160,160,.1)}.opt.sel{border-color:var(--b);background:rgba(175,179,247,.14)}
.opt:disabled{cursor:default;color:var(--text)}
.fb{margin-top:16px;padding:14px 16px;border-radius:12px;border:1px solid}.fb p{margin:6px 0}
.fb.ok{border-color:var(--ok);background:rgba(143,211,176,.08)}.fb.bad{border-color:var(--bad);background:rgba(242,160,160,.07)}
.fb.ok>b{color:var(--ok)}.fb.bad>b{color:var(--bad)}.escn{color:var(--warn);font-size:.9rem}
.fb details{margin:8px 0;font-size:.9rem}.fb summary{cursor:pointer;color:var(--a)}
.q-nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px}
.rev{padding:12px 0;border-bottom:1px solid var(--line)}.rev p{margin:4px 0}.reinf{padding:8px 0}
.prow{display:grid;grid-template-columns:minmax(150px,260px) 1fr;gap:14px;align-items:center;padding:8px 0}.prow small{color:var(--muted);display:block;margin:3px 0 6px;font-size:.78rem}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.stat{text-align:center;margin:0}.stat b{display:block;font-size:1.9rem;color:var(--a)}.stat span{color:var(--muted);font-size:.85rem}
.need h3{margin:0 0 10px;color:var(--b)}.nl{list-style:none;margin:0;padding:0;display:grid;gap:8px}.nl li{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.nl span{color:var(--muted);font-size:.92rem;flex:1;min-width:200px}
.filebtn{cursor:pointer}

/* modal / toast */
.modal{position:fixed;inset:0;background:rgba(10,12,16,.7);display:grid;place-items:center;z-index:100;padding:20px}.modal[hidden]{display:none}
.modal>div{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:420px}.modal .btns{justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:var(--panel2);border:1px solid var(--a);padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:120;max-width:90vw}.toast.show{opacity:1;transform:translate(-50%,0)}
.scrim{display:none}

/* tablet y móvil */
@media(max-width:1000px){.steps{grid-template-columns:repeat(3,1fr)}.stat-grid{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);z-index:60;transform:translateX(-100%);transition:transform .25s}
  body.menu-open .side{transform:none}
  body.menu-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50}
  .burger{display:grid;place-items:center}
  body.is-home .top .search{visibility:visible}
}
@media(max-width:640px){
  .steps{grid-template-columns:1fr 1fr}.cat-h{grid-template-columns:auto 1fr}.cat-h .bar{grid-column:1/3}
  .cmp-sel{grid-template-columns:1fr}.vs{display:none}
  .cmp-row{grid-template-columns:1fr}.cmp-l{border-bottom:1px solid var(--line)}.cmp-c{border-left:0}.cmp-c.span{grid-column:1}
  .cmp-c[data-l]::before{content:attr(data-l) " — ";font-weight:800;color:var(--a)}
  .cmp-h .cmp-l{display:none}.cmp-h .cmp-t{border-left:0;border-bottom:1px solid var(--line)}
  .prow{grid-template-columns:1fr}.fh{flex-direction:column;align-items:flex-start}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.modal .wide{width:min(560px,92vw);max-width:none}textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:12px/1.4 ui-monospace,Consolas,monospace;resize:vertical}

.dsvg{width:100%;max-width:420px;height:auto;display:block}
.dsvg .pg{fill:#232833;stroke:#3B4352;stroke-width:1.5}.dsvg .ph0{fill:#3A4150}.dsvg .ln{fill:#2E3441}
.dsvg .zn{fill:rgba(146,188,234,.22);stroke:#92BCEA;stroke-width:1.5}.dsvg .pin{fill:#AFB3F7;stroke:#171A21;stroke-width:1.5}
.dsvg .pn2{fill:#171A21;font-weight:800;font-size:11px;text-anchor:middle}
.anat{display:grid;grid-template-columns:minmax(240px,420px) 1fr;gap:22px;align-items:start}
.flds{list-style:none;margin:0;padding:0;display:grid;gap:12px}.flds li{display:flex;gap:12px}.flds p{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.pinb{flex:none;width:26px;height:26px;border-radius:99px;background:var(--b);color:#171A21;font-weight:800;display:grid;place-items:center;font-size:.85rem}
.where{display:block;color:var(--a);font-size:.82rem}
.dcalc label{display:grid;gap:6px;color:var(--muted);font-size:.9rem;max-width:340px}
.dcalc input{padding:10px 12px;border-radius:10px;background:var(--panel2);color:var(--text);border:1px solid var(--line);font:inherit;min-height:44px;color-scheme:dark}
.dres{margin-top:12px;padding:12px 14px;border-radius:10px;border-left:4px solid var(--dim)}
.dres.ok{border-color:var(--ok);background:rgba(143,211,176,.09);color:var(--text)}.dres.warn{border-color:var(--warn);background:rgba(235,203,139,.09);color:var(--text)}.dres.bad{border-color:var(--bad);background:rgba(242,160,160,.09);color:var(--text)}
.esc-c{border-left:4px solid var(--warn)}
.shot img{max-width:100%;border-radius:10px;border:1px solid var(--line);display:block;margin-bottom:6px}.shot{margin:0 0 10px}
.slot p{margin:8px 0 0}
.shortcuts{margin-top:18px}
@media(max-width:700px){.anat{grid-template-columns:1fr}}

.mxb{padding:2px 10px;border-radius:7px;font-weight:700;font-size:.8rem;white-space:nowrap}.mx-si{background:rgba(143,211,176,.16);color:var(--ok)}.mx-dep{background:rgba(235,203,139,.16);color:var(--warn)}.mx-no{background:rgba(242,160,160,.16);color:var(--bad)}
.tblw{overflow-x:auto}
.lead{max-width:90ch}

    if (hit < need) s = 0;
    s += bonus[x.f.id] || 0;
    return { f: x.f, score: s };

    return { p: x.p, score: s };
  }).filter(x => x.score > 0).sort((a, b) => b.score - a.score).slice(0, 8);

VIEWS.compare = r => {
  let a = r.a && FID(r.a) ? r.a : null, b = r.b && FID(r.b) ? r.b : null;
  const opts = sel => `<option value="">— Elegir —</option>` + DATA.categories.map(c => `<optgroup label="${esc(c.id + ' · ' + c.name)}">${DATA.forms.filter(f => f.cat === c.id).map(f => `<option value="${f.id}" ${f.id === sel ? 'selected' : ''}>${esc(f.id)} · ${esc(f.es)}</option>`).join('')}</optgroup>`).join('');
  const pairs = DATA.compare.map(c => `<a class="chip pair" href="#/compare/${c.a}/${c.b}">${c.a} ⇄ ${c.b}</a>`).join('');
  let out = '';
  if (a && b && a !== b) {
    const d = cmpData(a, b), fa = FID(a), fb = FID(b);
    const row = (label, v, span) => `<div class="cmp-row"><div class="cmp-l">${label}</div>${Array.isArray(v) ? v.map((x, i) => `<div class="cmp-c" data-l="${[a, b][i]}">${esc(x)}</div>`).join('') : `<div class="cmp-c span" >${esc(v)}</div>`}</div>`;
    out = `<div class="cmp card">
      <div class="cmp-row cmp-h"><div class="cmp-l"></div>${[fa, fb].map(f => `<a class="cmp-t" href="#/form/${f.id}"><b>${esc(f.id)}</b><span>${esc(f.es)}</span><i>💡 ${esc(f.mnemo)}</i></a>`).join('')}</div>
      ${row('¿Para qué sirve?', d.purpose)}${row('Diferencia clave', d.diff)}${row('¿Quién lo presenta?', d.who)}${row('¿Cuándo se usa?', d.when)}${row('¿Se relacionan?', d.related)}${row('Error común a evitar', d.avoid)}
    </div>${d.cur ? '' : '<p class="note">Comparación generada automáticamente a partir de las fichas; para pares frecuentes se muestran comparaciones curadas.</p>'}${disclaimer}`;
  } else if (a && b) out = '<p class="empty">Elige dos formularios distintos.</p>';
  else out = '<p class="empty">Elige dos formularios o un par sugerido para ver la comparación.</p>';
  return head('Comparador de formularios', 'Compara formularios que suelen confundirse: propósito, quién los presenta, cuándo se usan y cómo se relacionan.') +
    `<div class="card pad"><div class="cmp-sel"><label>Formulario A<select data-change="cmp" data-side="a">${opts(a)}</select></label><span class="vs">⇄</span><label>Formulario B<select data-change="cmp" data-side="b">${opts(b)}</select></label></div>
    <div class="chips pairs"><span class="muted sm">Pares sugeridos:</span>${pairs}</div></div>${out}`;
};

/* ---------- 4 · SIMULADOR ---------- */
VIEWS.sim = r => {
  const lv = ['basico', 'intermedio', 'avanzado'].includes(r.a) ? r.a : 'all';
  const list = DATA.cases.filter(c => lv === 'all' || c.level === lv);
  const cnt = l => DATA.cases.filter(c => l === 'all' || c.level === l).length;
  const tabs = [['all', 'Todos'], ['basico', 'Básico'], ['intermedio', 'Intermedio'], ['avanzado', 'Avanzado']].map(([k, t]) => `<a class="tab ${lv === k ? 'on' : ''}" href="#/sim${k === 'all' ? '' : '/' + k}">${t} (${cnt(k)})</a>`).join('');
  const cards = list.map(c => { const rec = S().cq[c.id], st = rec ? (rec.last ? '<span class="on">✓ Acertado</span>' : '<span class="bad">✗ Por repasar</span>') : '<span class="muted">Sin resolver</span>';
    return `<div class="card pad case"><div class="fc-top"><b>Caso ${c.id}</b>${levelBadge(c.level)}${c.esc ? '<span class="badge esc">Requiere revisión legal</span>' : ''}<span class="sp"></span>${st}</div><p class="cs">${esc(c.s)}</p><button class="btn small" data-act="start" data-mode="case1" data-id="${c.id}">Resolver</button></div>`; }).join('');
  return head('Simulador de casos', 'Practica con situaciones de clientes. Son ejercicios educativos: no determinan elegibilidad y, cuando la información no alcanza, lo correcto es pedir revisión legal.') +
    `<nav class="tabs">${tabs}</nav><div class="hero-act"><button class="btn" data-act="start" data-mode="cases" data-level="${lv}">▶ Practicar ${Math.min(10, list.length)} casos al azar</button></div>
    ${sec('Información que conviene confirmar antes de decidir', `<ul class="list">${DATA.checklist.map(c => `<li><b>${esc(c.t)}</b> ${esc(c.d)}</li>`).join('')}</ul>`, false)}
    <div class="cases">${cards}</div>${disclaimer}`;
};

/* ---------- 5 · BÚSQUEDA ---------- */
VIEWS.search = r => {
  const q = r.rest || '', res = App.search(q);
  let out = '';
  if (!q) out = `<div class="card pad"><h2 class="h3">Prueba buscando…</h2><div class="chips">${['I-485', 'permiso de trabajo', 'perdón', 'visa U', 'VAWA', 'quitar condiciones', 'novio', 'ciudadanía'].map(x => `<a class="chip pair" href="#/search/${encodeURIComponent(x)}">${esc(x)}</a>`).join('')}</div><p class="muted">Puedes buscar por número (I-130, DS-260), nombre, proceso, palabra clave o por lo que necesita el cliente.</p></div>`;
  else if (!res.needs.length && !res.forms.length && !res.procs.length && !res.docs.length) out = `<p class="empty">Sin resultados para «${esc(q)}». Prueba con el número del formulario o con otra palabra.</p>`;
  else {
    if (res.needs.length) out += `<h2 class="h2">Necesidad del cliente</h2>` + res.needs.map(({ n }) => `<div class="card pad need"><h3>${esc(n.title)}</h3><ul class="nl">${(n.docs || []).map(id => { const d = DATA.docs.find(x => x.id === id); return `<li>${docChip(id)} <span>${esc(d.what)}</span></li>`; }).join('')}${(n.forms || []).map(id => `<li>${chipF(id)} <span>${esc((n.explain || {})[id] || (FID(id) || {}).short || '')}</span></li>`).join('')}</ul>${n.note ? `<p class="note">⚠️ ${esc(n.note)}</p>` : ''}</div>`).join('');
    if (res.docs.length) out += `<h2 class="h2">Documentos del cliente</h2><div class="cards">${res.docs.map(x => `<a class="card pcard" href="#/doc/${x.d.id}"><b class="pname">${x.d.ico} ${esc(x.d.name)}</b><p class="fshort">${esc(x.d.what)}</p></a>`).join('')}</div>`;
    if (res.forms.length) out += `<h2 class="h2">Formularios</h2><div class="cards">${res.forms.map(x => formCard(x.f)).join('')}</div>`;
    if (res.procs.length) out += `<h2 class="h2">Procesos</h2><div class="cards">${res.procs.map(x => `<a class="card pcard" href="#/process/${x.p.id}"><b class="pname">${esc(x.p.name)}</b><div class="muted">${esc(x.p.sub || '')}</div><p class="fshort">${esc(x.p.goal)}</p></a>`).join('')}</div>`;
  }
  return head('Búsqueda inteligente', 'Por número, nombre, proceso, palabra clave o necesidad del cliente.') +
    `<div class="search big"><input data-search type="search" value="${esc(q)}" placeholder="Ej. I-130, permiso de trabajo, perdón, visa U…" autocomplete="off" aria-label="Buscar"><div class="sug" hidden></div></div>${out}${disclaimer}`;
};

/* ---------- 6 · PROGRESO Y EXAMEN ---------- */
VIEWS.progress = () => {
  const st = App.stats(), ex = S().exams.slice().reverse();
  const cats = DATA.categories.map(c => { const fs = DATA.forms.filter(f => f.cat === c.id), s = fs.filter(f => S().studied[f.id]).length, u = fs.filter(f => S().understood[f.id]).length;

  const last = ex[0], weak = last ? Object.entries(last.topics).map(([k, v]) => [k, Math.round(v.ok / v.n * 100)]).filter(x => x[1] < 85).sort((a, b) => a[1] - b[1]) : [];

    `<section class="stat-grid">

      <p class="muted sm">El repaso espaciado reprograma cada pregunta: si fallas, vuelve de inmediato; si aciertas, reaparece en 1, 3, 7 y 14 días.</p></div>

      <button class="btn" data-act="start" data-mode="exam">📝 ${ex.length ? 'Presentar de nuevo' : 'Presentar examen final'}</button>

      ${weak.length ? `<p class="muted sm">Temas a reforzar (último examen): ${weak.map(([k, p]) => `<a href="#/progress" class="chip dim">${esc(DATA.topics[k].name)} · ${p}%</a>`).join(' ')}</p>` : ''}</div>
    <div class="card pad"><h2 class="h3">Datos de progreso</h2><div class="btns"><button class="btn ghost" data-act="export">⬇ Exportar progreso</button><button class="btn ghost" data-act="import">⬆ Importar progreso</button><button class="btn danger" data-act="reset">Reiniciar progreso</button></div></div>`;

/* ---------- Imágenes (esquemas y capturas) ---------- */
const CARD_DOCS = ['ead', 'greencard', 'parole'];
function docSvg(d) {
  const card = CARD_DOCS.includes(d.id);
  let s = `<svg viewBox="0 0 320 230" class="dsvg" role="img" aria-label="Esquema ilustrativo de ${esc(d.name)} con los campos numerados">`;
  if (card) s += `<rect x="14" y="26" width="292" height="150" rx="14" class="pg"/><rect x="28" y="52" width="58" height="80" rx="6" class="ph0"/><rect x="100" y="36" width="120" height="9" rx="3" class="ph0"/>`;
  else { s += `<rect x="14" y="8" width="292" height="214" rx="8" class="pg"/><rect x="30" y="18" width="150" height="9" rx="3" class="ph0"/>`; for (let y = 36, i = 0; y < 212; y += 14, i++) s += `<rect x="30" y="${y}" width="${[250, 210, 240, 180, 230][i % 5]}" height="5" rx="2" class="ln"/>`; }
  d.zones.forEach(z => { s += `<rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="4" class="zn"/><circle cx="${z.x}" cy="${z.y + z.h / 2}" r="9" class="pin"/><text x="${z.x}" y="${z.y + z.h / 2 + 4}" class="pn2">${z.n}</text>`; });
  return s + '</svg>';
}
function imgSlot(key, label) {
  const emb = (DATA.images || {})[key], loc = (S().imgs || {})[key], im = emb || loc;
  if (im) return `<figure class="shot"><img src="${im}" alt="${esc(label)}"><figcaption class="muted sm">${emb ? 'Imagen incluida en la herramienta.' : 'Imagen guardada solo en este navegador.'}</figcaption></figure>${emb ? '' : `<button class="btn ghost small" data-act="imgdel" data-k="${esc(key)}">Quitar imagen</button>`}`;
  return `<div class="slot"><label class="btn ghost small">📷 Agregar imagen<input type="file" accept="image/*" data-change="img" data-k="${esc(key)}" hidden></label><p class="muted sm">Sube una captura de un formato o aviso <b>en blanco o de ejemplo</b>. No subas documentos con datos reales de clientes. Se guarda solo en este navegador.</p></div>`;
}
const docChip = id => { const d = DATA.docs.find(x => x.id === id); return d ? `<a class="chip alt" href="#/doc/${d.id}">${d.ico} ${esc(d.name)}</a>` : ''; };

/* ---------- 7 · DOCUMENTOS DEL CLIENTE ---------- */
VIEWS.docs = () => {
  const quick = [['Cita de biométricos: fecha, hora y lugar', 'bio'], ['Fecha de vencimiento del permiso de trabajo', 'ead'], ['Fecha de vencimiento de la Green Card', 'greencard'], ['Plazo para responder un RFE o NOID', 'rfe'], ['Número de recibo del caso', 'receipt'], ['Fecha y lugar de la entrevista', 'interview'], ['Cita en el consulado', 'nvc'], ['Hasta cuándo puede permanecer (I-94)', 'i94']];
  return head('Documentos que recibe el cliente', 'Cuando un cliente llama con una carta o tarjeta en la mano, aquí ves qué dato buscar, en qué parte del documento está y cuándo escalar.') +
    `<div class="card pad"><h2 class="h3">¿Qué dato necesitas encontrar?</h2><ul class="nl">${quick.map(([t, id]) => `<li><a class="chip alt" href="#/doc/${id}">${esc(t)}</a></li>`).join('')}</ul></div>
    <div class="card pad"><h2 class="h3">📬 Primeros avisos después de enviar el caso a USCIS</h2><ol class="list">${DATA.firstNotices.map(x => `<li><a href="#/doc/${x.doc}"><b>${esc(x.t)}</b></a>: ${esc(x.d)}</li>`).join('')}</ol>${pending(DATA.firstNoticesPending)}</div>
    <div class="card pad"><h2 class="h3">Los 7 tipos de I-797</h2><div class="tblw"><table class="tbl"><thead><tr><th>Formulario</th><th>Nombre</th><th>¿Para qué sirve?</th></tr></thead><tbody>${DATA.i797.map(x => `<tr><td><b>${esc(x.f)}</b></td><td>${esc(x.n)}</td><td>${esc(x.u)}</td></tr>`).join('')}</tbody></table></div>
    <h3 class="h3">¿Cuáles son los más importantes para identificar en un expediente?</h3><p>En procesos como Visa T, Visa U, VAWA y Ajuste de Estatus, es especialmente útil reconocer:</p><ul class="list">${DATA.i797Key.map(([k, v]) => `<li><b>${esc(k)}:</b> ${esc(v)}</li>`).join('')}</ul><div class="callout"><b>Regla fundamental</b><p>${esc(DATA.i797Rule)}</p></div></div>
    <div class="cards">${DATA.docs.map(d => `<a class="card pcard" href="#/doc/${d.id}"><div class="fc-top"><b class="pname">${d.ico} ${esc(d.name)}</b>${d.kind ? '<span class="badge esc">Fecha crítica</span>' : ''}</div><div class="muted sm">${esc(d.en)} · ${esc(d.issuer)}</div><p class="fshort">${esc(d.what)}</p></a>`).join('')}</div>
    <p class="note">Los esquemas son ilustrativos: la posición exacta de los datos puede variar según la edición del documento. Ante cualquier duda, escala al equipo legal.</p>`;
};
VIEWS.doc = r => {
  const d = DATA.docs.find(x => x.id === r.a);
  if (!d) return head('Documento no encontrado', '<a href="#/docs">Volver</a>');
  const rel = Object.keys(DATA.formDocs).filter(id => DATA.formDocs[id].docs.includes(d.id)).map(chipF).join('');
  const calc = d.kind ? `<div class="card pad dcalc"><h2 class="h3">📅 Calculadora de fechas</h2><label>${esc(d.dateLabel)}<input type="date" data-dcalc="${d.kind}"></label><div class="dres muted" aria-live="polite">Escribe o elige la fecha que aparece en el documento.</div><p class="muted sm">Orientación operativa para priorizar; no determina plazos legales.</p></div>` : '';
  return `<nav class="crumbs"><a href="#/docs">Documentos del cliente</a> › ${esc(d.name)}</nav>
  ${head(d.ico + ' ' + esc(d.name), esc(d.en) + ' · ' + esc(d.issuer))}
  <div class="callout"><b>¿Qué es?</b><p>${esc(d.what)}</p></div>
  <div class="card pad"><h2 class="h3">Dónde mirar</h2><div class="anat"><div class="anat-i">${docSvg(d)}<p class="muted sm">Esquema ilustrativo; no es el documento oficial.</p></div>
    <ol class="flds">${d.fields.map(f => `<li><span class="pinb">${f.n}</span><div><b>${esc(f.label)}</b><span class="where">${esc(f.where)}</span><p>${esc(f.why)}</p></div></li>`).join('')}</ol></div></div>
  ${calc}
  <div class="grid2"><div class="card pad"><h2 class="h3">🎧 Qué hacer como agente</h2><ul class="list">${d.agent.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
  <div class="card pad esc-c"><h2 class="h3">⚖️ Cuándo escalar</h2><ul class="list warn-l">${d.escalate.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div></div>
  ${pending(d.pending)}
  <div class="card pad"><h2 class="h3">Imagen del documento</h2>${imgSlot('doc:' + d.id, 'Imagen de ' + d.name)}</div>
  ${rel ? `<div class="card pad"><h2 class="h3">Formularios con los que puede llegar</h2><div class="chips">${rel}</div></div>` : ''}
  <p class="muted sm">Fuente: ${link(d.src, d.src.replace(/^https?:\/\//, ''))} · Última verificación: ${esc(DATA.meta.verifiedLabel)}</p>${disclaimer}`;
};
function dateMsg(kind, v) {
  const t = new Date(); t.setHours(0, 0, 0, 0); const p = v.split('-').map(Number); if (p.length < 3 || !p[0]) return null;
  const n = Math.round((new Date(p[0], p[1] - 1, p[2]) - t) / 864e5), f = x => (x === 1 ? '1 día' : x + ' días');
  if (kind === 'appt') return n < 0 ? ['bad', `La fecha pasó hace ${f(-n)}. Escala de inmediato al equipo legal.`] : n <= 1 ? ['bad', n === 0 ? 'Es HOY. Confirma que el cliente asiste; si no puede, escala ya.' : 'Es MAÑANA. Confirma asistencia; si no puede, escala hoy.'] : n <= 7 ? ['warn', `Faltan ${f(n)}. Recuerda qué debe llevar y confirma asistencia.`] : ['ok', `Faltan ${f(n)}. Regístrala en el expediente y recuérdala unos días antes.`];
  if (kind === 'deadline') return n < 0 ? ['bad', `El plazo venció hace ${f(-n)}. Escala hoy mismo.`] : n <= 14 ? ['bad', `Quedan ${f(n)}. Urgente: envía el aviso completo al abogado hoy.`] : ['warn', `Quedan ${f(n)}. Aun así, envía el aviso completo al abogado el mismo día que llega.`];
  return n < 0 ? ['bad', `Venció hace ${f(-n)}. No confirmes autorización ni estatus al cliente: escala.`] : n <= 180 ? ['warn', `Vence en ${f(n)} (180 días o menos). Avisa al equipo legal para revisar renovación o reemplazo.`] : ['ok', `Faltan ${f(n)} para el vencimiento. Regístralo en el expediente.`];
}

/* ---------- SESIONES DE PRÁCTICA (quiz, casos, repaso, examen) ---------- */
let RUN = null;
function startSession(mode, el) {
  let qs = [], title = '', from = 'progress';
  const takeForms = () => { const rank = f => { const r = S().fq[f.id]; return !r ? 0 : r.last === false ? 1 : 2; }; return App.shuffle(DATA.forms.filter(f => f.q)).sort((a, b) => rank(a) - rank(b)).slice(0, 10).map(App.formQ); };
  if (mode === 'forms10') { qs = takeForms(); title = 'Quiz corto de formularios'; }
  else if (mode === 'cat') { const c = App.catById[el.dataset.cat]; qs = DATA.forms.filter(f => f.cat === c.id && f.q).map(App.formQ); title = 'Quiz · ' + c.name; }
  else if (mode === 'form1') { qs = [App.formQ(FID(el.dataset.id))]; title = 'Practicar ' + el.dataset.id; from = 'form/' + el.dataset.id; }
  else if (mode === 'case1') { qs = [App.caseQ(DATA.cases.find(c => c.id === el.dataset.id))]; title = 'Caso ' + el.dataset.id; from = 'sim'; }
  else if (mode === 'cases') { const lv = el.dataset.level; qs = App.shuffle(DATA.cases.filter(c => lv === 'all' || c.level === lv)).slice(0, 10).map(App.caseQ); title = 'Simulador de casos'; from = 'sim'; }
  else if (mode === 'wrong') { qs = App.wrongKeys().map(App.qFromKey).filter(Boolean); title = 'Repetir incorrectas'; }
  else if (mode === 'due') { qs = App.dueKeys().map(App.qFromKey).filter(Boolean); title = 'Repaso espaciado'; }
  else if (mode === 'exam') { RUN = { mode: 'exam', title: 'Examen final', from, qs: App.buildExam(), i: 0, ans: [], done: false }; navigate('#/run'); return; }
  if (!qs.length) { toast(mode === 'wrong' ? 'No tienes respuestas incorrectas pendientes. 🎉' : mode === 'due' ? 'No hay preguntas por repasar hoy.' : 'No hay preguntas disponibles.'); return; }
  RUN = { mode, title, from, qs: App.shuffle(qs).map(App.prepare), i: 0, ans: [], done: false };
  navigate('#/run');
}
function finishRun() {
  const s = RUN; s.done = true;
  s.score = s.qs.filter((q, i) => s.ans[i] === q.a).length;
  if (s.mode === 'exam') {
    s.qs.forEach((q, i) => App.record(q.kind, q.id, s.ans[i] === q.a));
    const pct = Math.round(s.score / s.qs.length * 100), topics = App.topicStats(s.qs, s.ans);
    s.result = { t: Date.now(), score: s.score, total: s.qs.length, pct, pass: pct >= App.EXAM.pass, topics };
    App.S.exams.push(s.result); App.S.exams = App.S.exams.slice(-20); App.save();
  }
  render(true);
}
const letters = 'ABCDEFG';
function qCard(q, i, n, picked, exam) {
  const answered = picked != null, show = answered && !exam;
  const opts = q.o.map((t, k) => { let c = 'opt'; if (show) c += k === q.a ? ' right' : k === picked ? ' wrong' : ''; else if (exam && k === picked) c += ' sel'; return `<button class="${c}" data-act="pick" data-i="${k}" ${show ? 'disabled' : ''}><span class="l">${letters[k]}</span><span>${esc(t)}</span></button>`; }).join('');
  let fb = '';
  if (show) {
    const ok = picked === q.a;
    fb = `<div class="fb ${ok ? 'ok' : 'bad'}" role="status"><b>${ok ? '✓ Correcto' : '✗ Incorrecto'}</b>${ok ? '' : `<p>Respuesta correcta: <b>${letters[q.a]}. ${esc(q.o[q.a])}</b></p>`}<p>${esc(q.e)}</p>
      ${q.esc ? '<p class="escn">⚖️ Aunque la respuesta sea esta, un caso así requiere revisión legal: es orientación educativa, no una determinación de elegibilidad.</p>' : ''}
      ${q.kind === 'c' ? `<details><summary>¿Qué información faltaría confirmar?</summary><ul class="list">${DATA.checklist.map(c => `<li><b>${esc(c.t)}</b> ${esc(c.d)}</li>`).join('')}</ul></details>` : ''}
      ${q.forms && q.forms.length ? `<div class="chips"><span class="muted sm">Repasa:</span>${q.forms.map(chipF).join('')}</div>` : ''}</div>`;
  }
  return `<div class="card pad q"><div class="q-top"><span class="muted">Pregunta ${i + 1} de ${n}</span>${levelBadge(q.level)}<span class="chip dim">${esc(q.tag)}</span></div>${bar(Math.round(i / n * 100))}
    ${q.s ? `<p class="scn">${esc(q.s)}</p>` : ''}<h2 class="qp">${esc(q.p)}</h2><div class="opts" role="group">${opts}</div>${fb}
    <div class="q-nav">${exam && i > 0 ? '<button class="btn ghost" data-act="prev">← Anterior</button>' : '<span></span>'}${(show || (exam && answered)) ? `<button class="btn" data-act="next">${i + 1 >= n ? 'Ver resultado' : 'Siguiente →'}</button>` : exam ? '<span class="muted sm">Elige una respuesta para continuar</span>' : ''}</div></div>`;
}
VIEWS.run = () => {
  if (!RUN) return head('Sin práctica en curso', '<a href="#/progress">Ir a Mi progreso</a>');
  const s = RUN;
  if (!s.done) return `<nav class="crumbs"><a href="#/${s.from}">← Salir</a> · ${esc(s.title)}</nav>` + qCard(s.qs[s.i], s.i, s.qs.length, s.ans[s.i], s.mode === 'exam');
  const n = s.qs.length, pct = Math.round(s.score / n * 100), wrongQ = s.qs.filter((q, i) => s.ans[i] !== q.a);
  let verdict = '';
  if (s.mode === 'exam') {
    const r = s.result, ts = Object.entries(r.topics).map(([k, v]) => ({ k, pct: Math.round(v.ok / v.n * 100), v })).sort((a, b) => a.pct - b.pct);
    verdict = `<div class="callout ${r.pass ? 'okk' : 'warn'}"><b>${r.pass ? '🎉 Aprobado' : 'Aún no aprobado'}</b><p>${r.score} de ${r.total} (${r.pct}%). Se requiere ${App.EXAM.pass}% (${Math.ceil(r.total * App.EXAM.pass / 100)} aciertos).</p></div>
    <div class="card pad"><h2 class="h3">Resultado por tema</h2>${ts.map(t => `<div class="prow"><span>${esc(DATA.topics[t.k].name)}</span><div>${bar(t.pct, t.pct >= App.EXAM.pass ? '' : 'bad')}<small>${t.v.ok}/${t.v.n} · ${t.pct}%</small></div></div>`).join('')}</div>
    ${ts.filter(t => t.pct < App.EXAM.pass).length ? `<div class="card pad"><h2 class="h3">Temas a reforzar</h2>${ts.filter(t => t.pct < App.EXAM.pass).map(t => { const T = DATA.topics[t.k]; return `<div class="reinf"><b>${esc(T.name)}</b> <span class="muted">(${t.pct}%)</span><div class="chips">${T.forms.map(chipF).join('')}${T.procs.map(chipP).join('')}${T.link ? `<a class="chip alt" href="${T.link}">Repasar documentos del cliente</a>` : !T.forms.length ? '<a class="chip alt" href="#/help">Información necesaria antes de decidir</a>' : ''}</div></div>`; }).join('')}</div>` : ''}`;
  } else verdict = `<div class="callout ${pct >= 85 ? 'okk' : ''}"><b>${s.score} de ${n} correctas (${pct}%)</b><p>${pct >= 85 ? 'Muy bien. Sigue con el repaso espaciado para fijar lo aprendido.' : 'Repite las incorrectas: el repaso activo es la forma más rápida de fijar los formularios.'}</p></div>`;
  return `<nav class="crumbs"><a href="#/${s.from}">← Salir</a> · ${esc(s.title)}</nav>${head('Resultado')}${verdict}
    ${wrongQ.length ? `<div class="card pad"><h2 class="h3">Para revisar (${wrongQ.length})</h2>${wrongQ.map(q => `<div class="rev"><p class="muted sm">${esc(q.tag)}</p>${q.s ? `<p>${esc(q.s)}</p>` : ''}<p><b>${esc(q.p)}</b></p><p class="badc">Tu respuesta: ${s.ans[s.qs.indexOf(q)] == null ? 'sin responder' : esc(q.o[s.ans[s.qs.indexOf(q)]])}</p><p class="okc">Correcta: ${esc(q.o[q.a])}</p><p class="muted">${esc(q.e)}</p></div>`).join('')}</div>` : ''}
    <div class="btns">${wrongQ.length ? '<button class="btn" data-act="retry">🔁 Repetir las incorrectas</button>' : ''}${s.mode === 'exam' ? '<button class="btn ghost" data-act="start" data-mode="exam">Presentar de nuevo</button>' : ''}<a class="btn ghost" href="#/${s.from}">Salir</a></div>`;
};

/* ---------- Modal / aviso ---------- */
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600); }
function dataDlg(mode) {
  const m = $('#modal2'), ta = $('#data-ta'), exp = mode === 'export';
  $('#data-t').textContent = exp ? 'Exportar progreso' : 'Importar progreso';
  $('#data-d').textContent = exp ? 'Copia este texto y guárdalo (por ejemplo, en un archivo .json). Para restaurarlo, usa «Importar progreso».' : 'Pega aquí el respaldo que copiaste antes, o elige el archivo .json.';
  ta.value = exp ? App.exportJSON() : ''; ta.readOnly = exp;
  $('#data-copy').hidden = !exp; $('#data-do').hidden = exp; $('#data-file').hidden = exp;
  m.hidden = false; ta.focus(); if (exp) ta.select();
}
function confirmDlg(msg, yes) { const m = $('#modal'); $('#modal-msg').textContent = msg; m.hidden = false; $('#modal-yes').onclick = () => { m.hidden = true; yes(); }; $('#modal-no').onclick = () => { m.hidden = true; }; $('#modal-yes').focus(); }

/* ---------- Acciones (data-act) ---------- */
const ACT = {
  toggle(el) { const m = S()[el.dataset.k], id = el.dataset.id; m[id] ? delete m[id] : (m[id] = 1); if (el.dataset.k === 'understood' && m[id]) S().studied[id] = 1; App.save(); render(true); },
  seen(el) { const m = S().procSeen, id = el.dataset.id; m[id] ? delete m[id] : (m[id] = 1); App.save(); render(true); },
  start(el) { startSession(el.dataset.mode, el); },
  pick(el) { const s = RUN; if (!s || s.done) return; const i = +el.dataset.i, q = s.qs[s.i]; if (s.mode !== 'exam' && s.ans[s.i] != null) return; s.ans[s.i] = i; if (s.mode !== 'exam') App.record(q.kind, q.id, i === q.a); render(true); },
  next() { const s = RUN; s.i++; s.i >= s.qs.length ? finishRun() : render(true); window.scrollTo(0, 0); },
  prev() { RUN.i = Math.max(0, RUN.i - 1); render(true); },
  retry() { const w = RUN.qs.filter((q, i) => RUN.ans[i] !== q.a); RUN = { mode: 'retry', title: 'Repetir incorrectas', from: RUN.from, qs: App.shuffle(w).map(q => App.prepare(Object.assign({}, q, { o: q.o, a: q.a }))), i: 0, ans: [], done: false }; render(true); window.scrollTo(0, 0); },
  imgdel(el) { if (S().imgs) delete S().imgs[el.dataset.k]; App.save(); render(true); },
  menu() { document.body.classList.toggle('menu-open'); },
  export() { dataDlg('export'); },
  import() { dataDlg('import'); },
  copy() { const ta = $('#data-ta'); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} if (!ok && navigator.clipboard) navigator.clipboard.writeText(ta.value).then(() => toast('Copiado'), () => {}); else toast(ok ? 'Copiado' : 'Selecciona el texto y cópialo'); },
  doimport() { try { App.importJSON($('#data-ta').value); $('#modal2').hidden = true; toast('Progreso importado'); render(true); } catch (e) { toast('El texto no es un respaldo válido'); } },
  closedata() { $('#modal2').hidden = true; },
  reset() { confirmDlg('¿Reiniciar todo tu progreso (estudiados, quizzes, repaso y exámenes)? Esta acción no se puede deshacer.', () => { App.reset(); toast('Progreso reiniciado'); render(true); }); }
};
const CHG = {
  cmp(el) { const sel = [...document.querySelectorAll('[data-change=cmp]')], a = sel.find(x => x.dataset.side === 'a').value, b = sel.find(x => x.dataset.side === 'b').value; navigate('#/compare' + (a || b ? '/' + (a || '_') + '/' + (b || '_') : '')); },
  img(el) { const f = el.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, 900 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); S().imgs = S().imgs || {}; S().imgs[el.dataset.k] = c.toDataURL('image/jpeg', 0.8); App.save(); if (!App.storageOK) toast('No se pudo guardar: el navegador no permite almacenamiento'); render(true); }; im.onerror = () => toast('No se pudo leer la imagen'); im.src = rd.result; }; rd.readAsDataURL(f); },
  importfile(el) { const f = el.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { $('#data-ta').value = rd.result; ACT.doimport(); }; rd.readAsText(f); }
};

/* ---------- Búsqueda en vivo ---------- */
function liveSearch(inp) {
  const box = inp.parentElement.querySelector('.sug'), v = inp.value.trim();
  if (!v) { box.hidden = true; return; }
  const r = App.search(v), items = [];
  r.needs.slice(0, 2).forEach(x => items.push(`<a href="#/search/${encodeURIComponent(x.n.title)}"><span class="k">Necesidad</span>${esc(x.n.title)}</a>`));
  r.forms.slice(0, 5).forEach(x => items.push(`<a href="#/form/${x.f.id}"><span class="k">${esc(x.f.id)}</span>${esc(x.f.es)}</a>`));
  r.docs.slice(0, 2).forEach(x => items.push(`<a href="#/doc/${x.d.id}"><span class="k">Documento</span>${esc(x.d.name)}</a>`));
  r.procs.slice(0, 3).forEach(x => items.push(`<a href="#/process/${x.p.id}"><span class="k">Proceso</span>${esc(x.p.name)}</a>`));
  box.innerHTML = items.length ? items.join('') + `<a class="all" href="#/search/${encodeURIComponent(v)}">Ver todos los resultados →</a>` : '<div class="none">Sin resultados</div>';
  box.hidden = false;
}

/* ---------- Router y render ---------- */
/* Las rutas internas se escriben '#/vista/a/b'; en la URL real se guardan como '#vista--a--b'
   (el visor de artefactos solo admite hashes simples). El texto de búsqueda vive en memoria. */
let Q = '';
function toHash(r) {
  const parts = r.slice(2).split('/').map(x => (x === '' || x === '_' ? 'none' : x));
  if (parts[0] === 'search') { try { Q = decodeURIComponent(parts.slice(1).join('/')); } catch (e) { Q = parts.slice(1).join('/'); } return '#search'; }
  return '#' + parts.join('--');
}
function navigate(r) { const nh = toHash(r); if (location.hash === nh) render(false); else location.hash = nh; }
function parse() {
  let h = (location.hash || '#home').slice(1);
  if (h.charAt(0) === '/') h = h.slice(1).split('/').join('--');
  const parts = h.split('--').map(x => (x === 'none' ? '' : x)), v = parts[0] || 'home';
  return { v, a: v === 'search' ? Q : parts[1], b: parts[2], rest: v === 'search' ? Q : parts.slice(1).join('/') };
}
function buildNav(active) {
  $('#nav').innerHTML = NAV.map(n => `<a class="nav-i ${n.k === active ? 'on' : ''}" href="${n.h}" ${n.k === active ? 'aria-current="page"' : ''}><span>${n.ico}</span>${esc(n.t)}</a>`).join('');
}
function render(keep) {
  const r = parse(), V = VIEWS[r.v] || VIEWS.home;
  let act = { form: 'catalog', process: 'processes', doc: 'docs', run: RUN && RUN.from ? RUN.from.split('/')[0] : 'progress' }[r.v] || r.v;
  if (act === 'form') act = 'catalog';
  $('#main').innerHTML = V(r);
  buildNav(act);
  document.body.classList.toggle('is-home', r.v === 'home');
  document.body.classList.remove('menu-open');
  if (['catalog', 'form', 'process', 'compare', 'sim', 'processes'].includes(r.v)) { S().last = '#/' + location.hash.slice(1).split('--').join('/'); App.save(); }
  if (!keep) { window.scrollTo(0, 0); }
  document.title = 'Formularios Migratorios TMLF';
}

document.addEventListener('click', e => {
  const an = e.target.closest('a[href^="#/"]');
  if (an) { e.preventDefault(); document.querySelectorAll('.sug').forEach(x => (x.hidden = true)); navigate(an.getAttribute('href')); return; }
  const t = e.target.closest('[data-act]');
  if (t && ACT[t.dataset.act]) { e.preventDefault(); ACT[t.dataset.act](t, e); return; }
  if (!e.target.closest('.search')) document.querySelectorAll('.sug').forEach(x => (x.hidden = true));
  else if (e.target.closest('.sug a')) document.querySelectorAll('.sug').forEach(x => (x.hidden = true));
});
document.addEventListener('change', e => { const t = e.target.closest('[data-change]'); if (t && CHG[t.dataset.change]) CHG[t.dataset.change](t); });
document.addEventListener('input', e => {
  if (e.target.matches('[data-search]')) liveSearch(e.target);
  else if (e.target.matches('[data-dcalc]')) { const m = dateMsg(e.target.dataset.dcalc, e.target.value), o = e.target.closest('.dcalc').querySelector('.dres'); o.className = 'dres ' + (m ? m[0] : 'muted'); o.textContent = m ? m[1] : 'Escribe o elige la fecha que aparece en el documento.'; }
  else if (e.target.matches('[data-filter]')) {
    const q = App.norm(e.target.value); let any = false;
    document.querySelectorAll('#catlist .fcard').forEach(c => { const m = !q || App.norm(c.textContent).includes(q); c.hidden = !m; if (m) any = true; });
    document.querySelectorAll('#catlist .catsec').forEach(s => (s.hidden = ![...s.querySelectorAll('.fcard')].some(c => !c.hidden)));
    $('#catempty').hidden = any;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('[data-search]')) { const v = e.target.value.trim(); if (v) { navigate('#/search/' + encodeURIComponent(v)); document.querySelectorAll('.sug').forEach(x => (x.hidden = true)); } }
  if (e.key === 'Escape') { document.querySelectorAll('.sug').forEach(x => (x.hidden = true)); document.body.classList.remove('menu-open'); $('#modal').hidden = true; $('#modal2').hidden = true; }
});
window.addEventListener('hashchange', () => render(false));
window.addEventListener('DOMContentLoaded', () => { render(false); });
if (document.readyState !== 'loading') render(false);
})();

})();

</script>
