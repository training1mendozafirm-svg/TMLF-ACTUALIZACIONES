<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tiempos de Procesamiento TMLF</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: navy masthead + persistent process rail on the left, working panel on the right (call-desk console). */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#F7F8FB; --ink:#101B2E; --muted:#5A6577; --line:#DCE1E9;
  --navy:#13284A; --navy-2:#1D3A66; --pri:#13284A; --pri-h:#1D3A66; --link:#1D3A66; --on-navy:#F2F4F8; --gold:#A6823F; --gold-soft:#F4ECDC;
  --int:#3B5B8C; --usc:#2F7A6B; --oth:#8A5A2B;
  --ok:#2E7D4F; --ok-bg:#E8F4EC; --warn:#A65A12; --warn-bg:#FCF1E4; --info:#2F5E9E; --info-bg:#E9F0FA; --crit:#A33A2E;
  --esc-bg:#FBF6EC; --esc-line:#D9C49A;
  --f-display:"Newsreader", Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1420; --surface:#141D2C; --surface-2:#18233414; --ink:#E6EAF1; --muted:#9AA6B8; --line:#26344A;
  --navy:#0A1424; --navy-2:#1A2C48; --pri:#2B4A7E; --pri-h:#355892; --link:#CDA862; --on-navy:#E9EDF4; --gold:#CDA862; --gold-soft:#2A2516;
  --int:#86A6D8; --usc:#6CC2AE; --oth:#D7A06B;
  --ok:#6BC58E; --ok-bg:#15291E; --warn:#E3A35C; --warn-bg:#2C2113; --info:#86AEE6; --info-bg:#162338; --crit:#E4847A;
  --esc-bg:#221E14; --esc-line:#5B4D2C; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D1420; --surface:#141D2C; --surface-2:#18233414; --ink:#E6EAF1; --muted:#9AA6B8; --line:#26344A;
  --navy:#0A1424; --navy-2:#1A2C48; --pri:#2B4A7E; --pri-h:#355892; --link:#CDA862; --on-navy:#E9EDF4; --gold:#CDA862; --gold-soft:#2A2516;
  --int:#86A6D8; --usc:#6CC2AE; --oth:#D7A06B;
  --ok:#6BC58E; --ok-bg:#15291E; --warn:#E3A35C; --warn-bg:#2C2113; --info:#86AEE6; --info-bg:#162338; --crit:#E4847A;
  --esc-bg:#221E14; --esc-line:#5B4D2C; color-scheme:dark; }

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12.5px} .grow{flex:1}
.lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
.pg{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* masthead */
.top{background:var(--navy);color:var(--on-navy);position:relative}
.top-in,.tabs-in,.disc-in,.body,.foot{max-width:1360px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.top-in{display:flex;gap:28px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;padding-block:22px 18px}
.wordmark{font-size:11.5px;letter-spacing:.32em;color:var(--gold);font-weight:600;padding-bottom:8px;margin-bottom:10px;border-bottom:1px solid color-mix(in srgb,var(--gold) 45%,transparent);display:inline-block}
.brand h1{font-family:var(--f-display);font-weight:600;font-size:clamp(24px,3vw,32px);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.005em}
.subtitle{color:color-mix(in srgb,var(--on-navy) 72%,transparent);font-size:14px;margin-top:4px}
.tabs-in{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;color:color-mix(in srgb,var(--on-navy) 70%,transparent);padding:11px 14px 12px;font-weight:500;font-size:14px;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--on-navy)}
.tab.on{color:var(--on-navy);border-bottom-color:var(--gold)}
.tab-home{margin-left:auto}

/* search */
.search{position:relative;flex:1 1 380px;max-width:560px;min-width:0}
.search input{width:100%;padding:12px 40px 12px 40px;border-radius:8px;border:1px solid color-mix(in srgb,var(--on-navy) 22%,transparent);background:color-mix(in srgb,var(--on-navy) 9%,transparent);color:var(--on-navy)}
.search input::placeholder{color:color-mix(in srgb,var(--on-navy) 55%,transparent)}
.search input:focus{background:var(--surface);color:var(--ink);outline:2px solid var(--gold);outline-offset:0}
.search-ic{position:absolute;left:13px;top:50%;width:17px;height:17px;transform:translateY(-50%);color:color-mix(in srgb,var(--on-navy) 60%,transparent);pointer-events:none}
.search input:focus ~ .kbd{display:none}
.search:focus-within .search-ic{color:var(--muted)}
.kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:11px;border:1px solid color-mix(in srgb,var(--on-navy) 30%,transparent);border-radius:4px;padding:0 6px;color:color-mix(in srgb,var(--on-navy) 60%,transparent)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:20;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 18px 40px -12px rgba(10,20,40,.35);max-height:62vh;overflow:auto}
.results-head{font-size:12px;color:var(--muted);padding:9px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.results-empty{padding:16px 14px;color:var(--muted)}
.result{display:grid;grid-template-columns:96px 1fr auto 10px;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 14px}
.result:hover,.result:focus-visible{background:var(--gold-soft)}
.result-proc{font-size:11.5px;font-weight:600;color:var(--navy-2);letter-spacing:.02em}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .result-proc{color:var(--gold)}}
:root[data-theme="dark"] .result-proc{color:var(--gold)}
.result-main{min-width:0;overflow-wrap:anywhere}
.result-time{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right}

.disclaimer{background:var(--gold-soft);border-bottom:1px solid var(--line)}
.disc-in{font-size:12.5px;color:var(--muted);padding-block:8px}

/* body */
.body{display:grid;grid-template-columns:232px minmax(0,1fr);gap:28px;padding-block:24px 40px;align-items:start}
.body.norail{grid-template-columns:minmax(0,1fr)}
.rail-wrap{position:sticky;top:14px}
.step-lbl{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.step-n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pri);color:var(--on-navy);font-size:11px;letter-spacing:0}
.rail{display:flex;flex-direction:column;gap:2px}
.rail-home{background:none;border:0;text-align:left;padding:8px 12px;font-size:13px;color:var(--muted);border-radius:6px}
.rail-home.on,.rail-home:hover{color:var(--ink);background:var(--surface)}
.rail-item{display:flex;flex-direction:column;align-items:flex-start;background:none;border:0;border-left:2px solid transparent;text-align:left;padding:7px 12px;border-radius:0 6px 6px 0}
.rail-item:hover{background:var(--surface)}
.rail-item.on{background:var(--surface);border-left-color:var(--gold);box-shadow:0 1px 0 var(--line)}
.rail-name{font-weight:600;font-size:14.5px}
.rail-meta{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.main{min-width:0}

/* home */
.home-intro h2,.sec-head h2,.kwres h2{font-family:var(--f-display);font-weight:600;font-size:26px;margin:0 0 6px;text-wrap:balance}
.home-intro p,.sec-head p{color:var(--muted);margin:0 0 14px;max-width:70ch}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
.kw-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.kw-btn:hover{border-color:var(--gold)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pcard{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;transition:border-color .15s,transform .15s}
.pcard:hover{border-color:var(--gold);transform:translateY(-1px)}
.pcard-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pcard-name{font-family:var(--f-display);font-size:21px;font-weight:600;color:var(--ink)}
.pcard-full{font-size:12px;color:var(--muted);margin-top:-6px}
.pcard-pg{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.pcard-desc{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:3.9em}
.pcard-forms{display:flex;flex-wrap:wrap;gap:4px;min-height:22px}
.pcard-stats{display:flex;gap:12px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:auto;font-variant-numeric:tabular-nums}
.form{font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;background:var(--surface-2);color:var(--ink)}

.kwres-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.kwres-list{display:grid;gap:14px}
.kwres-proc{font-weight:600;font-size:13px;color:var(--gold);letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.kwres-item{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin-bottom:4px}
.kwres-item:hover{border-color:var(--gold)}

/* process head */
.phead{margin-bottom:18px}
.phead-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600}
.phead-title{font-family:var(--f-display);font-weight:600;font-size:30px;line-height:1.1;margin:2px 0 0}
.phead-full{font-size:16px;color:var(--muted);font-family:var(--f-body);font-weight:400}
.phead-body{margin-top:12px;display:grid;gap:12px;max-width:90ch}
.phead-desc{margin:0;color:var(--ink)}
.variants,.notes{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:grid;gap:4px;font-size:14px}
.note{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:6px}
.note:first-of-type{border-top:0;padding-top:0}
.note>span:first-child{flex:1 1 300px;min-width:0}
.forms-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.forms-row .lbl{margin:0 6px 0 0}

/* picker */
.picker{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:22px}
.picker-group+.picker-group{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.picker-sub{font-size:12.5px;font-weight:600;color:var(--gold);margin-bottom:6px}
.picker-chips{display:flex;flex-wrap:wrap;gap:6px}
.schip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px 6px 9px;font-size:13px;text-align:left;border-left:3px solid var(--c)}
.schip:hover{background:var(--surface-2);border-color:var(--c)}
.schip.on{background:var(--pri);color:var(--on-navy);border-color:var(--pri);border-left-color:var(--gold)}
.k-int{--c:var(--int)} .k-usc{--c:var(--usc)} .k-oth{--c:var(--oth)}
.dot-esc{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{display:inline-block;width:3px;height:12px;background:var(--c)}

/* result */
.result-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 24px;display:grid;gap:16px;box-shadow:0 1px 2px rgba(16,27,46,.05)}
.rc-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.rc-tags{display:flex;gap:6px;flex-wrap:wrap}
.rc-name{font-family:var(--f-display);font-weight:600;font-size:28px;margin:-4px 0 0;line-height:1.15;text-wrap:balance;overflow-wrap:anywhere}
.rc-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:12px}
.rc-cell{min-width:0}
.rc-time{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.rc-grid>.rc-cell:not(.rc-time){padding:12px 14px;border:1px solid var(--line);border-radius:8px}
.rc-big{font-family:var(--f-mono);font-size:24px;font-weight:500;line-height:1.25;font-variant-numeric:tabular-nums;color:var(--ink)}
.rc-big.muted{font-family:var(--f-body);font-size:16px;color:var(--muted)}
.rc-orig{font-size:12.5px;color:var(--muted);margin-top:6px}
.rc-unit{font-size:12px;color:var(--muted);margin-top:2px}
.rc-start{font-size:17px;font-weight:500}
.rc-start.muted{font-size:14px;font-weight:400}
.conc{margin-top:8px;font-size:13px;color:var(--info);background:var(--info-bg);border-radius:6px;padding:6px 9px}
.obs{margin:0;padding-left:18px;display:grid;gap:3px}
.escbox{background:var(--esc-bg);border:1px solid var(--esc-line);border-radius:8px;padding:14px 16px;display:grid;gap:8px}
.escbox.none{background:var(--surface-2);border-color:var(--line);color:var(--muted)}
.escbox-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.escbox-head .lbl{margin:0;color:var(--gold)}
.escbox-text{font-family:var(--f-display);font-size:19px;line-height:1.35}
.escbox-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0}
.escbox-meta dt{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.escbox-meta dd{margin:0;font-size:13.5px}
.escbox-note{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--esc-line);padding-top:8px}
.warn{background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);color:var(--ink);border-radius:8px;padding:10px 14px;font-size:13.5px}
.warn b{color:var(--warn)}
.warn ul{margin:6px 0 0;padding-left:18px}
.warn.small{font-size:12.5px;padding:6px 10px;margin-top:6px}
.rc-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 13px;font-size:13.5px;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--navy-2)}
.btn:disabled{opacity:.45;cursor:default}
.btn-pri{background:var(--pri);color:var(--on-navy);border-color:var(--pri)}
.btn-pri:hover:not(:disabled){background:var(--pri-h)}
.btn-ghost{background:none;border:1px solid var(--line);border-radius:7px;padding:6px 11px;font-size:13px;color:var(--muted)}
.btn-ghost:hover{color:var(--ink);border-color:var(--gold)}
.toast{font-size:12.5px;color:var(--ok);font-weight:500}
.chip{display:inline-flex;align-items:center;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface);white-space:nowrap}
.chip-int{color:var(--int);border-color:color-mix(in srgb,var(--int) 40%,transparent)}
.chip-usc{color:var(--usc);border-color:color-mix(in srgb,var(--usc) 40%,transparent)}
.chip-oth{color:var(--oth);border-color:color-mix(in srgb,var(--oth) 40%,transparent)}
.chip-esc{color:var(--gold);border-color:var(--esc-line);background:var(--esc-bg)}
.chip-warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:var(--warn-bg)}
.chip-form{font-family:var(--f-mono);white-space:normal;color:var(--ink)}

/* tools */
.tools{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-top:16px}
.calc-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.calc-col{display:grid;gap:12px;align-content:start;min-width:0}
.us-col{border-left:1px solid var(--line);padding-left:18px}
.col-title{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.col-n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;background:var(--pri);color:var(--on-navy);font-size:12px}
.col-n.us{background:var(--usc)}
.us-steps{margin:0;padding-left:18px;font-size:13px;color:var(--muted);display:grid;gap:4px}
.us-steps a{color:var(--link);font-weight:600}
.inline{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,8.5em);gap:6px;min-width:0;width:100%}.field .inline input,.field .inline select{width:100%;min-width:0}
.span2{grid-column:1/-1}
.us-results{display:grid;gap:8px}
.verdict{border-radius:8px;padding:10px 14px;border:1px solid var(--line);display:grid;gap:3px}
.verdict-src{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.verdict-label{font-weight:600;font-size:15.5px}
.verdict-detail{font-size:13.5px}
.tone-ok .verdict-label{color:var(--ok)} .tone-warn .verdict-label{color:var(--warn)} .tone-info .verdict-label{color:var(--info)}
.tone-gold{background:var(--esc-bg);border-color:var(--esc-line)} .tone-gold .verdict-label{color:var(--gold)}
.summary{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:8px}
.sumtbl{border-collapse:collapse;width:100%;font-size:13.5px}
.sumtbl th{text-align:left;font-weight:500;color:var(--muted);padding:6px 12px 6px 0;width:38%;vertical-align:top}
.sumtbl td{padding:6px 0;vertical-align:top}
.sumtbl tr+tr th,.sumtbl tr+tr td{border-top:1px solid var(--line)}
.check.disabled{color:var(--muted)}
@media (max-width:980px){ .calc-cols{grid-template-columns:1fr} .us-col{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:16px} }
@media (max-width:520px){ .sumtbl th{width:auto;display:block;padding-bottom:0} .sumtbl td{display:block} }
.tool{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:12px;align-content:start;min-width:0}
.tool-head h4{margin:0;font-family:var(--f-display);font-size:19px;font-weight:600}
.tool-sub{font-size:12.5px;color:var(--muted)}
.ct{width:100%;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface-2);resize:vertical;line-height:1.55;font-size:14.5px}
.tool-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fine{font-size:12px;color:var(--muted);margin:0;max-width:85ch}
.calc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field input,.field select,.sel select,.ftxt{border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--surface);min-width:0;width:100%}
.field input[readonly]{background:var(--surface-2);color:var(--muted)}
.calc-ref{font-size:13px;line-height:1.55;border-left:2px solid var(--gold);padding-left:10px}
.calc-out{border-radius:8px;padding:12px 14px;display:grid;gap:6px;border:1px solid var(--line)}
.calc-status{font-weight:600;font-size:16px}
.tone-ok{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 35%,transparent)} .tone-ok .calc-status{color:var(--ok)}
.tone-warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 35%,transparent)} .tone-warn .calc-status{color:var(--warn)}
.tone-info{background:var(--info-bg);border-color:color-mix(in srgb,var(--info) 30%,transparent)} .tone-info .calc-status{color:var(--info)}
.tone-muted{background:var(--surface-2)} .tone-muted .calc-status{color:var(--muted)}
.calc-why,.calc-el{font-size:13.5px}
.calc-el{font-variant-numeric:tabular-nums}
.calc-esc{font-size:13.5px;background:var(--esc-bg);border:1px solid var(--esc-line);border-radius:6px;padding:8px 10px}
.calc-esc b{color:var(--gold)}
.calc-escno{font-size:12.5px;color:var(--muted)}
.placeholder{border:1px dashed var(--line);border-radius:var(--r);padding:28px;color:var(--muted);text-align:center;background:var(--surface)}
.placeholder.big{padding:56px 28px}

/* ficha */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:4px 0 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--pri);color:var(--on-navy)}
.sel{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.sel select{width:auto}
.check{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.ftxt{width:200px;max-width:100%;font-size:13px}
.count{font-size:13px;color:var(--muted);margin-left:auto}
.tl{list-style:none;margin:14px 0 0;padding:0 0 0 4px;position:relative}
.tl::before{content:"";position:absolute;left:10px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tl-sub{font-weight:600;color:var(--gold);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;padding:14px 0 6px 28px}
.tl-item{position:relative;padding:0 0 12px 28px}
.tl-dot{position:absolute;left:2px;top:12px;width:17px;height:17px;border-radius:50%;background:var(--surface);border:3px solid var(--c)}
.tl-body{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:grid;gap:6px;min-width:0}
.tl-row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.tl-name{background:none;border:0;padding:0;font-weight:600;font-size:15px;text-align:left}
.tl-name::after{content:" ▾";color:var(--muted);font-size:11px}
.tl-name[aria-expanded="true"]::after{content:" ▴"}
.tl-time{font-size:13.5px}
.tl-time.muted{font-family:var(--f-body);font-size:13px}
.tl-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.anchor{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.conc-a{color:var(--info);background:var(--info-bg);border-color:transparent}
.esc-a{color:var(--gold);background:var(--esc-bg);border-color:var(--esc-line)}
.warn-a{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.tl-detail{font-size:13.5px;display:grid;gap:3px}
.tl-esc{font-family:var(--f-display);font-size:15px;color:var(--ink);border-left:2px solid var(--gold);padding-left:8px;margin-top:4px}
.link{background:none;border:0;padding:0;color:var(--navy-2);font-size:12.5px;font-weight:600;justify-self:start}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .link{color:var(--gold)}}
:root[data-theme="dark"] .link{color:var(--gold)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-top:8px}
.tbl{border-collapse:collapse;width:100%;font-size:13.5px;min-width:820px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);position:sticky;top:0}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.clickrow{cursor:pointer}
.clickrow:hover td{background:var(--gold-soft)}
.badge-warn{display:inline-block;margin-top:4px;font-size:11px;color:var(--warn);background:var(--warn-bg);padding:0 6px;border-radius:4px}

/* audit */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:8px 0 18px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid}
.stats b{font-family:var(--f-display);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.stats span{font-size:12.5px;color:var(--muted)}
.h3{font-family:var(--f-display);font-size:20px;font-weight:600;margin:20px 0 8px}
.audit-list{display:grid;gap:6px}
.audit-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13.5px;text-align:left;width:100%}
.audit-item ul{margin:4px 0 0;padding-left:18px}
.btnlike:hover{border-color:var(--gold)}
.rules{font-size:13.5px;color:var(--muted);padding-left:18px;display:grid;gap:4px}
.foot{font-size:12px;color:var(--muted);padding-block:0 28px}

/* responsive */
@media (max-width:860px){
  .body{grid-template-columns:minmax(0,1fr);gap:14px}
  .rail-wrap{position:static}
  .rail{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px;scrollbar-width:thin}
  .rail-item,.rail-home{flex:none;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
  .rail-item.on{border-color:var(--gold);box-shadow:inset 0 -2px 0 var(--gold)}
  .rail-meta{display:none}
  .rc-grid{grid-template-columns:1fr}
  .escbox-meta{grid-template-columns:1fr}
}
@media (max-width:520px){
  .top-in,.tabs-in,.disc-in,.body,.foot{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .result-card{padding:16px}
  .rc-name{font-size:23px}
  .calc-grid{grid-template-columns:1fr}
  .result{grid-template-columns:1fr auto;}
  .result-proc{grid-column:1/-1}
  .result .dot-esc{display:none}
  .audit-item{grid-template-columns:1fr}
  .kbd{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* Normalización ---------------------------------------------------------- */
const DATA = [];
PROCESSES.forEach(p => {
  p.stages = p.stages.map((s, i) => {
    const st = { obs: [], flags: [], ...s };
    st.obs = st.obs || []; st.flags = (st.flags || []).filter(Boolean);
    st.id = `${p.key}-${String(i + 1).padStart(2, "0")}`;
    st.order = i + 1; st.proc = p.key; st.procName = p.name;
    if (!st.t) { st.t = null; st.unit = st.unit || null; }
    if (!st.start) st.start = st.t ? (st.unit === "indef" ? "No aplica" : "No especificado en el documento") : "No aplica";
    st.escFrom = st.escFrom || null;
    DATA.push(st);
    return st;
  });
});

const { useState, useMemo, useEffect, useRef } = React;
const html = htm.bind(React.createElement);

/* ---------- utilidades ---------- */
const norm = s => (s || "").toString().normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const PBY = Object.fromEntries(PROCESSES.map(p => [p.key, p]));
const UNIT_LABEL = { meses: "meses", semanas: "semanas", dias_habiles: "días hábiles", dias_naturales: "días naturales", dias_sin_tipo: "días (tipo no especificado)", indef: "indefinido" };
const NO_TIME = "Tiempo no especificado en el documento fuente";
const NO_ESC = "Sin criterio de escalamiento especificado";

function escInfo(s) {
  const e = s.esc || "";
  let type = "Referencia de escalamiento";
  if (/Missing Receipts/i.test(e)) type = "Missing Receipts (Tier 2)";
  else if (/E-Request/i.test(e)) type = "E-Request (Tier 2)";
  else if (/\bBO\b/.test(e)) type = "Solicitud a BO";
  else if (/oficinas del social/i.test(e)) type = "Orientación al cliente";
  else if (/pasarlo a/i.test(e)) type = "Turnar a responsable";
  else if (/turnar/i.test(e)) type = "Turnar";
  else if (/se escala (con|al)/i.test(e)) type = "Escalamiento a responsable";
  else if (/se escala/i.test(e)) type = "Escalamiento interno";
  let modal = "Sin acción explícita en el texto";
  if (/se puede|puede/i.test(e)) modal = "Opcional · el documento dice «se puede»";
  else if (/se escala|pasarlo/i.test(e)) modal = "Indicado · el documento dice «se escala»";
  let cond = "Ver texto original";
  if (s.escN != null) cond = `Al superar ${s.escN} ${UNIT_LABEL[s.escU] || ""}` + (s.escFrom ? ` desde ${s.escFrom}` : "");
  if (/Missing Info/.test(e)) cond = "Si hay nota de Missing Info 1st draft (forms)";
  return { type, modal, cond };
}

const ACR = new Set(["vawa", "uscis", "ead", "ssn", "nvc", "lea", "rfa", "rfe", "foia", "dpt", "dvs", "aos", "reg", "usa", "lpr", "bo", "k1", "ds-160", "ds-260"]);
function clientName(name) {
  let s = name.toLowerCase().replace(/\s+/g, " ").trim();
  s = s.split(" ").map((w, i, arr) => {
    const bare = w.replace(/[().,]/g, "");
    if (ACR.has(bare) || /^[in]-\d/.test(bare)) return w.toUpperCase();
    if (i > 0 && /^visa$/.test(arr[i - 1].replace(/[()]/g, "")) && bare.length === 1) return w.toUpperCase();
    return w;
  }).join(" ");
  return s.charAt(0).toUpperCase() + s.slice(1);
}
const START_CLIENT = {
  "Recibos iniciales": "la emisión de los recibos iniciales",
  "Recibos iniciales (de la I-601A)": "la emisión de los recibos iniciales de la I-601A",
  "EAD (permiso de trabajo)": "la llegada del permiso de trabajo (EAD)",
  "Recepción del Bona Fide": "la recepción del Bona Fide",
  "Expediente Fully (documentos completos)": "que su expediente quedó completo",
  "Visa U interview": "la entrevista de Visa U",
  "Respuesta del Sup B": "la respuesta del Sup B",
  "Envío a la NVC": "el envío a la NVC",
  "Aprobación de su entrada y regreso a USA": "la aprobación de su entrada y su regreso a USA",
};
const startKnown = s => s.start && !/^No /.test(s.start);
function explanation(s) {
  const n = clientName(s.name);
  const tail = " Este tiempo es estimado y puede variar. Para conocer el estado específico de su expediente es necesario revisar la información registrada en su caso.";
  if (!s.t) return `De acuerdo con nuestros tiempos de referencia internos, no contamos con un tiempo documentado para la etapa de ${n}. Para conocer el estado específico de su expediente es necesario revisar la información registrada en su caso.`;
  if (s.unit === "indef") return `De acuerdo con nuestros tiempos de referencia internos, la etapa de ${n} no tiene un tiempo fijo: ${s.t.charAt(0).toLowerCase() + s.t.slice(1).replace(/\.$/, "")}. Para conocer el estado específico de su expediente es necesario revisar la información registrada en su caso.`;
  const st = startKnown(s) ? `, contada a partir de ${START_CLIENT[s.start] || s.start.toLowerCase()}` : "";
  return `De acuerdo con nuestros tiempos de referencia internos, la etapa de ${n} tiene una duración aproximada de ${(s.ts || s.t).replace(/\.$/, "").replace(/\s+aproximadamente$/i, "")}${st}.${tail}`;
}

function stageSummary(s) {
  const e = s.esc ? escInfo(s) : null;
  return [
    `${PBY[s.proc].name}${s.sub ? " · " + s.sub : ""} — ${s.name}`,
    `Tiempo aproximado: ${s.t || NO_TIME}`,
    `Se cuenta desde: ${s.start}`,
    s.desc ? `Descripción: ${s.desc}` : null,
    ...s.obs.map(o => `Observación: ${o}`),
    `Escalamiento: ${s.esc ? s.esc + (s.resp ? ` (Responsable: ${s.resp})` : "") + ` [${e.modal}]` : NO_ESC}`,
    `Fuente: CS Tiempos de Procesamiento, p. ${s.page}`,
  ].filter(Boolean).join("\n");
}

async function copyText(text, fallbackEl) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    if (fallbackEl) { fallbackEl.focus(); fallbackEl.select(); }
    return false;
  }
}

/* ---------- fechas ---------- */
const parseD = v => { if (!v) return null; const [y, m, d] = v.split("-").map(Number); return Date.UTC(y, m - 1, d); };
const DAY = 86400000;
function addMonthsUTC(t, k) {
  const d = new Date(t); const y = d.getUTCFullYear(), m = d.getUTCMonth() + k, day = d.getUTCDate();
  const last = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  return Date.UTC(y, m, Math.min(day, last));
}
function monthsBetween(a, b) {
  const da = new Date(a), db = new Date(b);
  let m = (db.getUTCFullYear() - da.getUTCFullYear()) * 12 + (db.getUTCMonth() - da.getUTCMonth());
  let anchor = addMonthsUTC(a, m);
  if (anchor > b) { m--; anchor = addMonthsUTC(a, m); }
  const next = addMonthsUTC(a, m + 1);
  return { months: m + (b - anchor) / (next - anchor), whole: m, rem: Math.round((b - anchor) / DAY) };
}
function businessDays(a, b) {
  let n = 0; for (let t = a + DAY; t <= b; t += DAY) { const w = new Date(t).getUTCDay(); if (w !== 0 && w !== 6) n++; } return n;
}
function elapsedIn(unit, a, b) {
  if (unit === "meses") return monthsBetween(a, b).months;
  if (unit === "semanas") return (b - a) / DAY / 7;
  if (unit === "dias_naturales") return (b - a) / DAY;
  if (unit === "dias_habiles") return businessDays(a, b);
  return null;
}
const fmt = n => (Math.round(n * 10) / 10).toLocaleString("es-MX", { maximumFractionDigits: 1 });
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };

function calc(s, startV, endV) {
  const a = parseD(startV), b = parseD(endV);
  if (!a || !b) return { state: "insuf", label: "Información insuficiente para determinar", why: "Ingresa la fecha de inicio de la etapa y la fecha de consulta." };
  if (b < a) return { state: "insuf", label: "Información insuficiente para determinar", why: "La fecha de consulta es anterior a la fecha de inicio." };
  const dNat = Math.round((b - a) / DAY), mb = monthsBetween(a, b);
  const base = { dNat, mb };
  if (!s.t) return { ...base, state: "insuf", label: "Información insuficiente para determinar", why: NO_TIME + "." };
  if (s.unit === "indef") return { ...base, state: "insuf", label: "Información insuficiente para determinar", why: "El documento no establece un tiempo definido para esta etapa." };
  if (!s.unit || s.unit === "dias_sin_tipo" || s.min == null)
    return { ...base, state: "insuf", label: "Información insuficiente para determinar", why: s.unit === "dias_sin_tipo" ? "El documento no indica si los días son hábiles o naturales." : "El documento no indica la unidad de tiempo." };
  const el = elapsedIn(s.unit, a, b);
  let state, label;
  if (el < s.min) { state = "before"; label = s.min === s.max ? "Aún no alcanza la referencia interna" : "Aún no alcanza el rango de referencia interno"; }
  else if (s.max == null || el <= s.max) { state = "in"; label = "En el rango de referencia interno"; }
  else { state = "over"; label = "Supera el rango de referencia interno"; }
  let esc = null;
  if (s.esc) {
    if (s.escN != null && s.escU && s.escU !== "dias_sin_tipo") {
      const ee = elapsedIn(s.escU, a, b);
      esc = { evaluable: true, reached: ee > s.escN, val: ee };
    } else esc = { evaluable: false };
  }
  return { ...base, state, label, el, esc };
}

/* ---------- búsqueda ---------- */
const INDEX = DATA.map(s => ({ s, hay: norm([s.procName, PBY[s.proc].fullName, s.sub, s.name, s.forms, s.desc, ...(s.obs || []), s.esc, s.resp, s.t, s.tags, s.esc ? "escalamiento escala escalar" : "", KIND_LABEL[s.kind]].join(" ")) }));
function search(q) {
  const terms = norm(q).split(/\s+/).filter(Boolean);
  if (!terms.length) return [];
  return INDEX.filter(x => terms.every(t => x.hay.includes(t))).map(x => x.s);
}

  const [q, setQ] = useState(""); const [open, setOpen] = useState(false); const ref = useRef(null);
  const res = useMemo(() => search(q), [q]);

    const h = e => { if (e.key === "/" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") { e.preventDefault(); ref.current?.focus(); } };
    window.addEventListener("keydown", h); return () => window.removeEventListener("keydown", h);
  }, []);
  const pick = s => { onPick(s); setOpen(false); setQ(""); };
  const shown = res.slice(0, 40);
  return html`<div className="search">
    <label htmlFor="q" className="sr">Buscar</label>
    <svg viewBox="0 0 20 20" className="search-ic" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M13 13l4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <input id="q" ref=${ref} value=${q} autoComplete="off" placeholder="Buscar proceso, formulario o etapa (I-130, Bona Fide…)"
      onChange=${e => { setQ(e.target.value); setOpen(true); }} onFocus=${() => setOpen(true)}

    ${open && q.trim() && html`<div className="results" role="listbox">

/* ---------- USCIS: datos que el colaborador copia de la página oficial ---------- */
const USCIS_TIMES_URL = "https://egov.uscis.gov/processing-times/";
const USCIS_STATUS_URL = "https://egov.uscis.gov/es";
const US_FORMS = ["I-90", "I-129F", "I-130", "I-131", "I-131F", "I-360", "I-485", "I-601A", "I-751", "I-765", "I-821D", "I-914", "I-918", "N-400", "N-600"];
const US_UNIT = { meses: "meses", semanas: "semanas", dias: "días naturales" };

/* Formulario sugerido por etapa, según lo que el PDF menciona para esa etapa */
function suggestedForm(s) {
  const n = norm(s.name), p = s.proc;
  if (/permiso de trabajo/.test(n)) return p === "visat" ? "I-914" : "I-765";
  if (/permiso de viaje/.test(n)) return "I-131";
  if (/bona fide/.test(n) && p === "visat") return "I-765";
  if (p === "vawa" && (/visa vawa/.test(n) || /prima facie/.test(n))) return "I-360";
  if (p === "vawa" && /residencia/.test(n)) return "I-485";
  if (p === "regaos" && /peticion aprobada/.test(n)) return "I-130";
  if (p === "regaos" && /^residencia/.test(n)) return "I-485";
  if (p === "visau" && /aprobacion de visa u/.test(n)) return "I-918";
  if (p === "consular" && /aprobacion i-130/.test(n)) return "I-130";
  if (p === "consular" && /perdon/.test(n)) return "I-601A";
  if (p === "piparmy" && /i-94/.test(n)) return "I-131";
  if (p === "pipbiden" && /i-94/.test(n)) return "I-131F";
  if (p === "k1" && /aprobacion i-129f/.test(n)) return "I-129F";
  if (p === "daca" && /^aprobacion/.test(n)) return "I-821D";
  if (p === "i751" && /i-751/.test(n)) return "I-751";
  if (p === "i90" && /renovacion/.test(n)) return "I-90";
  if (p === "n400" && /informacion/.test(n)) return "N-400";
  if (p === "n600" && /informacion/.test(n)) return "N-600";
  return "";
}
const receiptBased = s => /^Recibos iniciales/.test(s.start || "");
const fmtDate = v => { const t = parseD(v); if (!t) return ""; return new Date(t).toLocaleDateString("es-MX", { timeZone: "UTC", day: "numeric", month: "long", year: "numeric" }); };

/* Valores publicados por USCIS que el colaborador ya consultó: se recuerdan en este navegador por formulario.
   No se guarda ningún dato del cliente (ni fechas de recibo ni números de recibo). */
const LS_KEY = "tmlf-uscis-times-v1";
function loadUs() { try { return JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch (e) { return {}; } }
function saveUs(o) { try { localStorage.setItem(LS_KEY, JSON.stringify(o)); } catch (e) {} }

/* ¿Los datos de USCIS se consultaron después de la última actualización mensual (~día 15)? */
function staleCheck(checkedV, todayV) {
  const c = parseD(checkedV), t = parseD(todayV); if (!c || !t) return null;
  const d = new Date(t); let y = d.getUTCFullYear(), m = d.getUTCMonth();
  if (d.getUTCDate() < 15) { m -= 1; if (m < 0) { m = 11; y -= 1; } }
  const lastUpdate = Date.UTC(y, m, 15);
  return c < lastUpdate;
}

function usCalc(us, todayV) {
  const out = { time: null, inquiry: null };
  const r = parseD(us.receipt), q = parseD(todayV);
  if (!r || !q) return { ...out, missing: "Ingresa la fecha de recibo (Received Date del aviso I-797C)." };
  if (q < r) return { ...out, missing: "La fecha de consulta es anterior a la fecha de recibo." };
  const el = { meses: monthsBetween(r, q).months, semanas: (q - r) / DAY / 7, dias: (q - r) / DAY };
  const n = parseFloat(String(us.time).replace(",", "."));
  if (!isNaN(n) && n > 0) {
    const e = el[us.unit];
    out.time = e <= n
      ? { state: "in", label: "Dentro del tiempo publicado por USCIS", detail: `${fmt(e)} de ${fmt(n)} ${US_UNIT[us.unit]} publicados.` }
      : { state: "over", label: "Supera el tiempo publicado por USCIS", detail: `${fmt(e)} ${US_UNIT[us.unit]} transcurridos frente a ${fmt(n)} publicados (${fmt(e - n)} más).` };
  }
  const iq = parseD(us.inquiry);
  if (iq) {
    const diff = Math.round((iq - q) / DAY);
    out.inquiry = diff <= 0
      ? { state: "ready", label: "USCIS ya permite enviar una consulta de caso", detail: `La fecha de consulta de caso (${fmtDate(us.inquiry)}) ya pasó. Verifica en la página de USCIS que aparezca el enlace para la solicitud de servicio (e-Request).` }
      : { state: "wait", label: "Aún no se puede enviar consulta de caso a USCIS", detail: `Faltan ${diff} días naturales: USCIS permite consultar a partir del ${fmtDate(us.inquiry)}.` };
  }
  return out;
}

function ClientText({ s, usNote }) {
  const [inc, setInc] = useState(false);
  const build = () => {
    let t = explanation(s);
    if (inc && usNote) t += ` Como referencia adicional, la página oficial de tiempos de procesamiento de USCIS, consultada el ${fmtDate(usNote.checked)}, indica ${fmt(parseFloat(usNote.time))} ${US_UNIT[usNote.unit]} para el formulario ${usNote.form}${usNote.cat ? ` (${usNote.cat})` : ""}. USCIS señala que este tiempo corresponde a la mayoría de los casos y no es una fecha garantizada.`;
    return t;
  };
  const [txt, setTxt] = useState(build()); const [msg, setMsg] = useState(""); const ref = useRef(null);
  useEffect(() => setTxt(build()), [s.id, inc, usNote && usNote.form, usNote && usNote.time, usNote && usNote.unit, usNote && usNote.checked]);
  useEffect(() => { if (!usNote) setInc(false); }, [!!usNote]);
  const copy = async () => { const ok = await copyText(txt, ref.current); setMsg(ok ? "Explicación copiada" : "Texto seleccionado: copia con Ctrl+C"); setTimeout(() => setMsg(""), 2400); };
  return html`<section className="tool">
    <div className="tool-head"><h4>Explicación para el cliente</h4><span className="tool-sub">Editable antes de copiar. Se genera solo con datos del documento interno y, si lo eliges, con el tiempo que capturaste de USCIS.</span></div>
    <label className=${"check" + (usNote ? "" : " disabled")}><input id="ct-us" type="checkbox" checked=${inc} disabled=${!usNote} onChange=${e => setInc(e.target.checked)} /> Incluir el tiempo publicado por USCIS${usNote ? ` (${usNote.form})` : " — captúralo primero en la calculadora"}</label>
    <label htmlFor="ct" className="sr">Explicación para el cliente</label>
    <textarea id="ct" ref=${ref} className="ct" value=${txt} onChange=${e => setTxt(e.target.value)} rows="6"></textarea>
    <div className="tool-actions">
      <button className="btn btn-pri" onClick=${copy}>Copiar explicación</button>
      <button className="btn" onClick=${() => setTxt(build())}>Restablecer</button>
      ${msg && html`<span className="toast">${msg}</span>`}
    </div>
    <p className="fine">No promete fechas ni resultados, y no menciona escalamientos internos.</p>
  </section>`;
}

function Verdict({ tone, label, detail, src }) {
  return html`<div className=${"verdict tone-" + tone}>

}

function Calculator({ p, s, setStage, setUsNote }) {
  const [a, setA] = useState(""); const [b, setB] = useState(todayStr());
  const [store, setStore] = useState(loadUs);
  const [us, setUs] = useState({ form: "", cat: "", office: "", time: "", unit: "meses", checked: todayStr(), receipt: "", inquiry: "" });
  const sf = suggestedForm(s);

  /* Al cambiar de etapa: formulario sugerido y valores ya capturados para ese formulario */
  useEffect(() => {
    const f = sf || "";
    const saved = f ? store[f] : null;
    setUs(u => ({ ...u, form: f, cat: saved ? saved.cat : "", office: saved ? saved.office : "", time: saved ? saved.time : "", unit: saved ? saved.unit : "meses",
      checked: saved ? saved.checked : todayStr(), receipt: receiptBased(s) && a ? a : u.receipt, inquiry: "" }));
  }, [s.id]);
  useEffect(() => { if (receiptBased(s) && a) setUs(u => ({ ...u, receipt: a })); }, [a]);

  const setU = (k, v) => setUs(u => {
    const n = { ...u, [k]: v };
    if (k === "form") { const sv = store[v]; Object.assign(n, sv ? { cat: sv.cat, office: sv.office, time: sv.time, unit: sv.unit, checked: sv.checked } : { cat: "", office: "", time: "", unit: "meses", checked: todayStr() }); n.inquiry = ""; }
    return n;
  });
  /* Recordar en este navegador los valores publicados (no datos del cliente) */
  useEffect(() => {
    if (!us.form || !us.time) return;
    const next = { ...store, [us.form]: { cat: us.cat, office: us.office, time: us.time, unit: us.unit, checked: us.checked } };
    setStore(next); saveUs(next);
  }, [us.form, us.cat, us.office, us.time, us.unit, us.checked]);
  useEffect(() => {
    const n = parseFloat(String(us.time).replace(",", "."));
    setUsNote(us.form && n > 0 ? { form: us.form, cat: us.cat, time: String(n), unit: us.unit, checked: us.checked } : null);
  }, [us.form, us.cat, us.time, us.unit, us.checked]);

  const r = useMemo(() => calc(s, a, b), [s.id, a, b]);
  const u = useMemo(() => usCalc(us, b), [us, b]);
  const stale = staleCheck(us.checked, b);
  const tone = { in: "ok", before: "info", over: "warn", insuf: "muted" }[r.state];
  const hasUs = !!(us.form && (us.time || us.inquiry));

  return html`<section className="tool calc">
    <div className="tool-head"><h4>Calculadora de tiempo transcurrido</h4><span className="tool-sub">Compara la referencia interna del documento con los datos publicados por USCIS. No calcula fechas de aprobación.</span></div>

    <div className="calc-cols">
      <div className="calc-col">
        <div className="col-title"><span className="col-n">A</span> Referencia interna (documento CS)</div>
        <div className="calc-grid">
          <div className="field"><label htmlFor="c-proc">Proceso</label><input id="c-proc" value=${p.name} readOnly /></div>
          <div className="field"><label htmlFor="c-stage">Etapa</label>
            <select id="c-stage" value=${s.id} onChange=${e => setStage(e.target.value)}>
              ${p.stages.map(x => html`<option key=${x.id} value=${x.id}>${x.sub ? x.sub + " · " : ""}${x.name}</option>`)}
            </select></div>
          <div className="field"><label htmlFor="c-a">Fecha de inicio de la etapa</label><input id="c-a" type="date" value=${a} onChange=${e => setA(e.target.value)} /></div>
          <div className="field"><label htmlFor="c-b">Fecha de consulta</label><input id="c-b" type="date" value=${b} onChange=${e => setB(e.target.value)} /></div>
        </div>
        <div className="calc-ref">Referencia documentada: <b>${s.t || NO_TIME}</b>${s.unit && s.unit !== "indef" ? html` · unidad: ${UNIT_LABEL[s.unit]}` : null}<br/>
          Fecha a ingresar como inicio: <b>${s.start}</b>${!startKnown(s) && s.t && s.unit !== "indef" ? html`<span className="muted"> — el documento no fija el evento de inicio; el resultado depende de la fecha que elijas.</span>` : null}</div>
        <div className=${"calc-out tone-" + tone}>
          <div className="calc-status">${r.label}</div>
          ${r.why && html`<div className="calc-why">${r.why}</div>`}
          ${r.dNat != null && html`<div className="calc-el">Transcurrido: ${r.el != null && s.unit !== "meses" ? html`<b>${fmt(r.el)} ${UNIT_LABEL[s.unit]}</b> · ` : null}<b>${r.mb.whole} ${r.mb.whole === 1 ? "mes" : "meses"} y ${r.mb.rem} días</b> (${r.dNat} días naturales)</div>`}
          ${r.esc && r.esc.evaluable && r.esc.reached && html`<div className="calc-esc"><b>Revisar criterio de escalamiento documentado.</b> “${s.esc}”${s.resp ? ` · Responsable: ${s.resp}` : ""}</div>`}
          ${r.esc && r.esc.evaluable && !r.esc.reached && r.state !== "insuf" && html`<div className="calc-escno">Aún no se cumple la condición del criterio documentado (${escInfo(s).cond}).</div>`}
          ${r.esc && !r.esc.evaluable && html`<div className="calc-escno">El criterio documentado no se puede evaluar automáticamente: “${s.esc}”.</div>`}
        </div>
      </div>

      <div className="calc-col us-col">
        <div className="col-title"><span className="col-n us">B</span> Tiempos publicados por USCIS</div>
        <ol className="us-steps">
          <li>Abre <a href=${USCIS_TIMES_URL} target="_blank" rel="noopener">Tiempos de procesamiento de USCIS ↗</a>, elige el formulario, la categoría y la oficina que aparecen en el aviso de recibo.</li>

          <li>Para el estatus del expediente usa <a href=${USCIS_STATUS_URL} target="_blank" rel="noopener">Verifique el Estatus de su Caso ↗</a> con el número de recibo. Esta herramienta no guarda números de recibo.</li>
        </ol>
        <div className="calc-grid">
          <div className="field"><label htmlFor="u-form">Formulario</label>
            <select id="u-form" value=${us.form} onChange=${e => setU("form", e.target.value)}>
              <option value="">Selecciona…</option>${US_FORMS.map(f => html`<option key=${f} value=${f}>${f}${f === sf ? " · sugerido" : ""}</option>`)}
            </select></div>

          <div className="field"><label htmlFor="u-checked">Fecha en que consultaste USCIS</label><input id="u-checked" type="date" value=${us.checked} onChange=${e => setU("checked", e.target.value)} /></div>
          <div className="field"><label htmlFor="u-time">Tiempo publicado por USCIS</label>
            <div className="inline"><input id="u-time" inputMode="decimal" value=${us.time} placeholder="Ej. 14.5" onChange=${e => setU("time", e.target.value)} />
              <select id="u-unit" aria-label="Unidad del tiempo publicado" value=${us.unit} onChange=${e => setU("unit", e.target.value)}>${Object.entries(US_UNIT).map(([k, l]) => html`<option key=${k} value=${k}>${l}</option>`)}</select></div></div>
          <div className="field"><label htmlFor="u-receipt">Fecha de recibo (Received Date, I-797C)</label><input id="u-receipt" type="date" value=${us.receipt} onChange=${e => setU("receipt", e.target.value)} /></div>
          <div className="field span2"><label htmlFor="u-inq">Fecha de consulta de caso que devuelve USCIS</label><input id="u-inq" type="date" value=${us.inquiry} onChange=${e => setU("inquiry", e.target.value)} /></div>
        </div>
        ${!sf && html`<div className="calc-escno">El documento no asocia esta etapa con un formulario que tenga tiempo publicado en USCIS (por ejemplo, etapas internas, biométricos, SSN o NVC). Puedes elegir un formulario si aplica al caso.</div>`}
        ${receiptBased(s) && html`<div className="calc-escno">Esta etapa se cuenta desde recibos iniciales: la fecha de inicio de la columna A se copia como fecha de recibo.</div>`}
        ${hasUs && stale && html`<div className="warn small">USCIS actualiza los tiempos alrededor del día 15 de cada mes. Los datos capturados el ${fmtDate(us.checked)} son anteriores a la última actualización: vuelve a consultarlos.</div>`}
        ${!hasUs && html`<div className="calc-out tone-muted"><div className="calc-status">Sin datos de USCIS</div><div className="calc-why">Captura el tiempo publicado o la fecha de consulta de caso para comparar.</div></div>`}
        ${hasUs && u.missing && html`<div className="calc-out tone-muted"><div className="calc-status">Información insuficiente para determinar</div><div className="calc-why">${u.missing}</div></div>`}
        ${hasUs && !u.missing && html`<div className="us-results">

  </section>`;
}

        <td>${s.start}</td>
        ${detail && html`<td>${s.desc || "—"}${s.obs.map((o, i) => html`<div key=${i} className="muted small">· ${o}</div>`)}</td>`}
        <td>${s.esc ? html`<span>${s.esc}</span>${s.resp ? html`<div className="muted small">Resp.: ${s.resp}</div>` : null}` : html`<span className="muted">${NO_ESC}</span>`}</td>
        <td className="mono">${s.page}</td>
      </tr>`)}</tbody>
    </table></div>`}
  </div>`;
}

function Alerts({ openStage }) {
  const [pf, setPf] = useState("all"); const [tf, setTf] = useState("all");
  const rows = DATA.filter(s => s.esc).map(s => ({ s, e: escInfo(s) }));
  const types = [...new Set(rows.map(r => r.e.type))];
  const list = rows.filter(r => (pf === "all" || r.s.proc === pf) && (tf === "all" || r.e.type === tf));
  return html`<section className="alerts">
    <div className="sec-head"><h2>Alertas y criterios de escalamiento</h2>
      <p>Momento en el que el documento permite o indica solicitar una revisión. No equivale al tiempo aproximado de procesamiento. «Se puede solicitar» se muestra como opcional.</p></div>
    <div className="toolbar">
      <label className="sel"><span>Proceso</span><select id="a-proc" value=${pf} onChange=${e => setPf(e.target.value)}><option value="all">Todos</option>${PROCESSES.map(p => html`<option key=${p.key} value=${p.key}>${p.name}</option>`)}</select></label>
      <label className="sel"><span>Tipo</span><select id="a-type" value=${tf} onChange=${e => setTf(e.target.value)}><option value="all">Todos</option>${types.map(t => html`<option key=${t}>${t}</option>`)}</select></label>
      <span className="count">${list.length} criterios</span>
    </div>
    <div className="tablewrap"><table className="tbl">
      <thead><tr><th>Proceso</th><th>Etapa</th><th>Tiempo de la etapa</th><th>Condición</th><th>Acción indicada en el documento</th><th>Carácter</th><th>Responsable</th><th>Pág.</th></tr></thead>
      <tbody>${list.map(({ s, e }) => html`<tr key=${s.id} className="clickrow" onClick=${() => openStage(s)}>
        <td><b>${s.procName}</b>${s.sub ? html`<div className="muted small">${s.sub}</div>` : null}</td>
        <td>${s.name}</td><td className="mono">${s.t || html`<span className="muted">${NO_TIME}</span>`}</td>
        <td>${e.cond}</td><td>“${s.esc}”<div><${Chip} tone="esc">${e.type}<//></div></td><td className="small">${e.modal}</td><td>${s.resp || html`<span className="muted">No especificado</span>`}</td><td className="mono">${s.page}</td>
      </tr>`)}</tbody>
    </table></div>
  </section>`;
}

function Audit({ openStage }) {
  const flagged = DATA.filter(s => s.flags.length);
  const pnotes = PROCESSES.flatMap(p => [...(p.descFlag ? [{ p, text: p.descFlag, page: p.pages }] : []), ...p.notes.filter(n => n.flag).map(n => ({ p, text: n.flag, page: n.page }))]);
  const noTime = DATA.filter(s => !s.t).length;
  return html`<section className="audit">
    <div className="sec-head"><h2>Auditoría de datos</h2>
      <p>Información ambigua, incompleta o contradictoria detectada al estructurar el documento. Ningún dato fue corregido: el texto original se conserva y se marca para validación interna.</p></div>
    <div className="stats">
      <div><b>${PROCESSES.length}</b><span>procesos</span></div>
      <div><b>${DATA.length}</b><span>etapas</span></div>
      <div><b>${DATA.filter(s => s.esc).length}</b><span>criterios de escalamiento</span></div>
      <div><b>${noTime}</b><span>etapas sin tiempo</span></div>
      <div><b>${flagged.length + pnotes.length + AUDIT_GENERAL.length}</b><span>puntos a validar</span></div>
    </div>
    <h3 className="h3">Observaciones generales</h3>
    <div className="audit-list">${AUDIT_GENERAL.map((a, i) => html`<div key=${i} className="audit-item"><${Chip} tone="warn">${a.type}<//><div>${a.text}</div><span className="pg">p. ${a.page}</span></div>`)}
      ${pnotes.map((a, i) => html`<div key=${"n" + i} className="audit-item"><${Chip} tone="warn">${a.p.name}<//><div>${a.text}</div><span className="pg">p. ${a.page}</span></div>`)}</div>
    <h3 className="h3">Por etapa</h3>
    <div className="audit-list">${flagged.map(s => html`<button key=${s.id} className="audit-item btnlike" onClick=${() => openStage(s)}>
      <${Chip}>${s.procName}<//><div><b>${s.name}</b>${s.sub ? ` · ${s.sub}` : ""}<ul>${s.flags.map((f, i) => html`<li key=${i}>${f}</li>`)}</ul></div><span className="pg">p. ${s.page}</span></button>`)}</div>
    <h3 className="h3">Reglas aplicadas</h3>
    <ul className="rules">
      <li>Cuando el documento no indica tiempo se muestra «${NO_TIME}».</li>
      <li>Los tiempos de cada etapa no se suman; el documento no da un total del caso.</li>
      <li>Días hábiles, días naturales y días sin tipo se mantienen separados; no se convierten entre sí.</li>
      <li>«Se puede solicitar» se presenta como opcional, nunca como obligatorio.</li>
      <li>La herramienta no guarda nombres, números de recibo ni datos personales.</li>
      <li>Los tiempos de USCIS no forman parte del documento interno: el colaborador los copia de la página oficial de USCIS y se muestran siempre por separado de la referencia interna.</li>
    </ul>
  </section>`;
}

function App() {
  const [view, setView] = useState("consulta");
  const [proc, setProcRaw] = useState(null);
  const [stageId, setStageId] = useState(null);
  const [kw, setKw] = useState("");
  const setProc = k => { setProcRaw(k); setStageId(null); setKw(""); if (view !== "ficha") setView("consulta"); };
  const openStage = s => { setProcRaw(s.proc); setStageId(s.id); setKw(""); setView("consulta"); window.scrollTo({ top: 0, behavior: "smooth" }); };
  const goHome = () => { setProcRaw(null); setStageId(null); setKw(""); setView("consulta"); };
  const p = proc ? PBY[proc] : null;
  const tabs = [["consulta", "Consultar etapa del cliente"], ["ficha", "Ficha del proceso"], ["alertas", "Alertas y escalamiento"], ["auditoria", "Auditoría de datos"]];
  let main;
  if (view === "alertas") main = html`<${Alerts} openStage=${openStage} />`;
  else if (view === "auditoria") main = html`<${Audit} openStage=${openStage} />`;
  else if (kw) main = html`<${KwResults} q=${kw} onPick=${openStage} clear=${() => setKw("")} />`;
  else if (!p) main = html`<${Home} setProc=${setProc} onKeyword=${setKw} />`;
  else if (view === "ficha") main = html`<${Ficha} key=${p.key} p=${p} openStage=${openStage} />`;
  else main = html`<${Consult} key=${p.key} p=${p} stageId=${stageId} setStage=${setStageId} />`;
  const showRail = view === "consulta" || view === "ficha";
  return html`<div className="app">
    <header className="top"><div className="top-in">
      <div className="brand">
        <div className="wordmark">THE MENDOZA LAW FIRM</div>
        <h1>Centro de Consulta de Tiempos de Procesamiento</h1>
        <div className="subtitle">Herramienta de consulta operativa para atención al cliente</div>
      </div>
      <${SearchBox} onPick=${openStage} />
    </div>
    <nav className="tabs-in" aria-label="Secciones">${tabs.map(([k, l]) => html`<button key=${k} className=${"tab" + (view === k ? " on" : "")} onClick=${() => { setView(k); setKw(""); }}>${l}</button>`)}
      <button className="tab tab-home" onClick=${goHome}>Inicio</button></nav>
    </header>
    <div className="disclaimer"><div className="disc-in">Los tiempos mostrados son referencias internas extraídas del documento CS Tiempos de Procesamiento. No representan garantías de aprobación ni sustituyen la revisión del expediente, la información oficial vigente o el criterio del equipo legal autorizado.</div></div>
    <div className=${"body" + (showRail ? "" : " norail")}>
      ${showRail && html`<aside className="rail-wrap"><div className="step-lbl"><span className="step-n">1</span> Proceso</div><${Rail} proc=${proc} setProc=${setProc} goHome=${goHome} /></aside>`}
      <main className="main">${view === "ficha" && !p && !kw ? html`<div className="placeholder big">Selecciona un proceso a la izquierda para ver su ficha completa: línea de tiempo, tabla de etapas, notas y formularios.</div>` : main}</main>
    </div>
    <footer className="foot">Fuente única: CS Tiempos de Procesamiento (PDF, 24 páginas). Las referencias «p.» indican la página del PDF.</footer>
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);

</script>

</body></html>
