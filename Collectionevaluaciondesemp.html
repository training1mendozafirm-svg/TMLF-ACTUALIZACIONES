<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evaluación de Cobranza</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--desk:#E6DFD3;--page:#FFFDF8;--page2:#F7F2E9;--card:#FFFFFF;--ink:#1B1A18;--mut:#6A655C;--line:#E3DCD0;--gold:#B8894F;--golds:#F3EADC;--goldd:#8C6534;--ok:#2F6B4F;--oks:#E4F0E8;--warn:#A8462A;--hdr:#1B1A18;--hdrink:#F6F3EE;--sh:rgba(60,40,15,.16);--spine:rgba(60,40,15,.13);--ch:#B8894F}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--desk:#0D0C0B;--page:#1E1C19;--page2:#181614;--card:#26231F;--ink:#EEE9E1;--mut:#A8A196;--line:#3A352F;--gold:#D2A86E;--golds:#2E2519;--goldd:#E3BE8A;--ok:#7CC29C;--oks:#18291F;--warn:#E8916F;--hdr:#080706;--hdrink:#EEE9E1;--sh:rgba(0,0,0,.5);--spine:rgba(0,0,0,.45);--ch:#D2A86E}}
:root[data-theme="dark"]{--desk:#0D0C0B;--page:#1E1C19;--page2:#181614;--card:#26231F;--ink:#EEE9E1;--mut:#A8A196;--line:#3A352F;--gold:#D2A86E;--golds:#2E2519;--goldd:#E3BE8A;--ok:#7CC29C;--oks:#18291F;--warn:#E8916F;--hdr:#080706;--hdrink:#EEE9E1;--sh:rgba(0,0,0,.5);--spine:rgba(0,0,0,.45);--ch:#D2A86E}
/* Color por capítulo */
.ch-obj{--ch:#A87B3F}.ch-com{--ch:#2F6E6B}.ch-mol{--ch:#A24E33}.ch-per{--ch:#5F6E2E}.ch-con{--ch:#6A4877}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .ch-obj{--ch:#D2A86E}:root:not([data-theme="light"]) .ch-com{--ch:#6FB5B0}:root:not([data-theme="light"]) .ch-mol{--ch:#E38E6E}:root:not([data-theme="light"]) .ch-per{--ch:#AABB72}:root:not([data-theme="light"]) .ch-con{--ch:#B993C6}}
:root[data-theme="dark"] .ch-obj{--ch:#D2A86E}:root[data-theme="dark"] .ch-com{--ch:#6FB5B0}:root[data-theme="dark"] .ch-mol{--ch:#E38E6E}:root[data-theme="dark"] .ch-per{--ch:#AABB72}:root[data-theme="dark"] .ch-con{--ch:#B993C6}
*{box-sizing:border-box}
html{scroll-padding-top:72px}
body{margin:0;background:var(--desk);color:var(--ink);font:16px/1.6 'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
/* Header */
.hdr{position:sticky;top:0;z-index:10;background:var(--hdr);color:var(--hdrink);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;border-bottom:3px solid var(--gold)}
.hdr-in{max-width:1160px;margin:0 auto;display:flex;align-items:center;gap:12px}
.hdr-mark{width:38px;height:38px;border-radius:8px;background:#F6F3EE;display:grid;place-items:center;flex:none}
.hdr-mark img{width:30px;height:auto;display:block}
.hdr-t{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.hdr-t b{white-space:nowrap;font:600 1rem/1.1 'Barlow Condensed',sans-serif;letter-spacing:.14em;text-transform:uppercase}
.hdr-t span{font-size:.8rem;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-st{margin-left:auto;font:600 .8rem 'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
main{max-width:1160px;margin:0 auto;padding:28px 16px calc(64px + env(safe-area-inset-bottom,0px))}
/* Libro */
.book{display:grid;grid-template-columns:1fr;max-width:760px;margin:0 auto}
.pg{position:relative;background-color:var(--page);padding:30px 24px 64px;border-radius:6px 14px 14px 6px;border-left:6px solid var(--ch);background-image:linear-gradient(90deg,var(--spine),transparent 26px);box-shadow:0 14px 30px -12px var(--sh)}
.pg.r{box-shadow:0 14px 30px -12px var(--sh),4px 4px 0 -1px var(--page2),4px 4px 0 0 var(--line),8px 8px 0 -1px var(--page2),8px 8px 0 0 var(--line);animation:turn .5s cubic-bezier(.2,.7,.2,1);transform-origin:left center}
.pg.l{margin-bottom:22px}.pg.l.aux{display:none}
@keyframes turn{from{opacity:0;transform:perspective(1600px) rotateY(-14deg)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.pg.r{animation:none}}
@media(min-width:980px){
 .book.sp{grid-template-columns:1fr 1fr;max-width:1120px}
 .book.sp .pg{padding:40px 44px 72px}
 .book.sp .pg.l,.book.sp .pg.l.aux{display:block;margin:0;border-left:0;border-radius:14px 3px 3px 14px;background-image:linear-gradient(270deg,var(--spine),transparent 46px);box-shadow:0 14px 30px -12px var(--sh),-4px 4px 0 -1px var(--page2),-4px 4px 0 0 var(--line),-8px 8px 0 -1px var(--page2),-8px 8px 0 0 var(--line)}
 .book.sp .pg.r{border-left:0;border-radius:3px 14px 14px 3px;background-image:linear-gradient(90deg,var(--spine),transparent 46px)}
 .book.sp .pg.l .inner{position:sticky;top:96px}
 .book.sp:before{content:"";grid-column:1/3;grid-row:1;justify-self:center;width:2px;background:var(--line);z-index:1;pointer-events:none}
 .mob{display:none!important}
}
.rh{display:flex;justify-content:space-between;gap:10px;font:600 .74rem 'Barlow Condensed',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:26px}
.rh b{color:var(--ch);font-weight:700}
.fo{pointer-events:none;position:absolute;bottom:20px;left:0;right:0;text-align:center;font:500 1rem 'Cormorant Garamond',Georgia,serif;color:var(--mut);letter-spacing:.1em}
/* Type */
h1{font:600 2.1rem/1.15 'Cormorant Garamond',Georgia,serif;margin:0 0 10px}
h2{font:600 1.5rem/1.2 'Cormorant Garamond',Georgia,serif;margin:0 0 12px}
h3{font-size:1rem;margin:0 0 6px}
p{margin:0 0 12px}.mut{color:var(--mut)}
.eyebrow{font:600 .82rem 'Barlow Condensed',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--goldd);margin:0 0 6px;display:block}
.eyebrow.c{color:var(--ch)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.card.gold{border-top:3px solid var(--ch)}
/* Portada */
.cover{text-align:center;padding:12px 0 6px}
.cover img{width:190px;max-width:62%;height:auto;margin:0 auto 22px;display:block;background:#FFFDF8;border-radius:12px;padding:10px}
.cover h1{font-size:2.5rem;margin-bottom:10px}
.cover .lead{color:var(--mut);max-width:440px;margin:0 auto 20px;font-size:1.04rem}
.orn{display:flex;align-items:center;gap:10px;justify-content:center;margin:16px auto 18px;max-width:260px;color:var(--ch)}
.orn:before,.orn:after{content:"";flex:1;height:1px;background:currentColor;opacity:.5}
.orn i{width:9px;height:9px;transform:rotate(45deg);border:1.5px solid currentColor}
.facts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0}
.facts span{background:var(--golds);color:var(--goldd);border-radius:99px;padding:4px 12px;font-size:.88rem;font-weight:500}
.sig{margin-top:26px;font:600 .78rem 'Barlow Condensed',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.obj{border-left:4px solid var(--gold);padding:2px 0 2px 16px;margin:0 0 14px;font-size:1.05rem}
.list{margin:0;padding:0;list-style:none;counter-reset:s}
.list li{position:relative;padding:0 0 12px 40px;counter-increment:s}
.list li:before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--golds);color:var(--goldd);font:700 .95rem/28px 'Barlow Condensed',sans-serif;text-align:center}
.list li:last-child{padding-bottom:0}
.bul{margin:0;padding-left:20px}.bul li{margin-bottom:6px}
.lvls{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.lvls div{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.lvls b{display:block}.lvls span{font-size:.86rem;color:var(--mut)}
.note{background:color-mix(in srgb,var(--ch) 12%,transparent);border-left:3px solid var(--ch);border-radius:6px;padding:12px 14px;font-size:.94rem}
/* Índice */
.toc{list-style:none;margin:0;padding:0}
.toc li{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:baseline;padding:12px 0;border-bottom:1px dotted var(--line)}
.toc li:last-child{border:0}
.toc .rn{font:600 1.5rem/1 'Cormorant Garamond',Georgia,serif;color:var(--c)}
.toc .nm{font-weight:500;line-height:1.35}.toc .nm small{display:block;color:var(--mut);font-weight:400;font-size:.84rem}
.toc .ss{font:600 .76rem 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);white-space:nowrap}
.toc li.cur{background:color-mix(in srgb,var(--c) 10%,transparent);border-radius:8px;padding-left:8px;padding-right:8px;border-bottom-color:transparent}
.toc li.cur .ss{color:var(--c)}.toc li.dn .ss{color:var(--ok)}
/* Capítulo */
.chap{text-align:center;padding:10px 0 0}
.num{font:600 6.5rem/1 'Cormorant Garamond',Georgia,serif;color:var(--ch);margin:6px 0 4px}
.chap h1{font-size:2.3rem}
.chap .lead{color:var(--mut);max-width:460px;margin:0 auto 18px;font-size:1.04rem}
.meta{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;font:600 .8rem 'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--ch);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 14px;margin-bottom:22px}
.chap .obs{text-align:left;max-width:480px;margin:0 auto 18px}
.chap .obs li{margin-bottom:8px}.chap .obs li::marker{color:var(--ch)}
.chap .note{text-align:left;max-width:480px;margin:0 auto 22px}
.strip{display:flex;justify-content:center;gap:8px;margin-top:24px}
.strip i{width:30px;height:4px;border-radius:2px;background:var(--line)}.strip i.dn{background:var(--ok)}.strip i.cur{background:var(--ch)}
.side .num{font-size:4.5rem;text-align:left;margin:0 0 6px}
.dots{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 22px}
.dots i{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:600 .85rem 'Barlow Condensed',sans-serif;font-style:normal;color:var(--mut)}
.dots i.dn{background:var(--ch);border-color:var(--ch);color:var(--page)}.dots i.cur{border-color:var(--ch);color:var(--ch);border-width:2px}
/* Forms */
label{display:block;font-weight:500;margin-bottom:4px}
input[type=text]{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:8px;background:var(--page);color:var(--ink);font:inherit;margin-bottom:14px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin:4px 0 16px;cursor:pointer}
.chk input{width:18px;height:18px;margin:3px 0 0;accent-color:var(--gold);flex:none}
button{font:inherit;cursor:pointer;border-radius:8px;border:1.5px solid var(--ink);padding:12px 20px;font-weight:700}
.pri{background:var(--ink);color:var(--page)}
.pri:hover:not(:disabled){background:var(--ch);border-color:var(--ch);color:#fff}
.pri:disabled{opacity:.35;cursor:not-allowed}
.sec{background:transparent;color:var(--ink)}.sec:hover{border-color:var(--ch);color:var(--ch)}
button:focus-visible,input:focus-visible,.opt:focus-within{outline:3px solid var(--ch);outline-offset:2px}
/* Quiz */
.bar{height:6px;background:var(--line);border-radius:3px;margin-bottom:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ch);transition:width .3s}
.prog{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;margin-bottom:18px}
.tag{display:inline-block;background:color-mix(in srgb,var(--ch) 14%,transparent);color:var(--ch);font:600 .85rem 'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:3px 12px;border-radius:99px;margin-bottom:14px}
.sit{font:600 1.4rem/1.35 'Cormorant Garamond',Georgia,serif;border-left:4px solid var(--ch);padding:2px 0 2px 16px;margin:0 0 20px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:10px;cursor:pointer;background:var(--card);font-weight:400;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--ch)}.opt.on{border-color:var(--ch);background:color-mix(in srgb,var(--ch) 11%,var(--card))}
.opt input{width:18px;height:18px;margin:3px 0 0;accent-color:var(--ch);flex:none}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
/* Resultados */
.row{margin-bottom:18px}.row .top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;font-weight:500;margin-bottom:6px}.row .top span:last-child{white-space:nowrap;font-size:.9rem;color:var(--mut)}.row .bar{height:12px}
.lv{font-weight:700;color:var(--ch)}
.big{font:700 3.6rem/1 'Cormorant Garamond',Georgia,serif;color:var(--ink)}
.score{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.rev{border-top:1px solid var(--line);padding:14px 0}.rev:first-of-type{border:0}
.ok{color:var(--ok);font-weight:700}.no{color:var(--warn);font-weight:700}
.ideal{background:var(--oks);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:.95rem}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.sc{display:flex;gap:6px}.sc label{flex:1;position:relative;margin:0}.sc input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}.sc span{display:block;text-align:center;border:1px solid var(--line);border-radius:8px;padding:10px 0;font-weight:700;background:var(--card)}.sc input:checked+span{background:var(--ch);color:#fff;border-color:var(--ch)}.sc input:focus-visible+span{outline:3px solid var(--ch);outline-offset:2px}
.scl{display:flex;justify-content:space-between;font-size:.78rem;color:var(--mut);margin-top:6px}
@media(max-width:520px){.lvls{grid-template-columns:1fr}.cover h1,.chap h1{font-size:2rem}.num{font-size:5rem}.pg{padding:26px 18px 60px}}
/* Hojas de la portada (sin scroll) */
main:has(.book.fit){padding-top:24px;padding-bottom:16px}
.book.fit .pg{display:flex;flex-direction:column;height:calc(100dvh - 116px);min-height:520px;max-height:880px;overflow:auto;padding:30px 40px 54px}
.book.fit .pg.l{margin:0}
.book.fit .rh{margin-bottom:16px}
.book.fit h2{font-size:1.4rem;margin-bottom:10px}.book.fit .card{padding:16px}
.book.fit .toc li{padding:9px 0}.book.fit .list li{padding-bottom:10px}
.book.fit .cover img{width:160px;margin-bottom:16px}.book.fit .cover h1{font-size:2.2rem}.book.fit .orn{margin:10px auto 14px}.book.fit .sig{margin-top:18px}
.pc{flex:1 0 auto}.pc.mid{display:flex;align-items:center;justify-content:center}
.inav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.idots{display:flex;gap:6px;align-items:center}.idots i{width:8px;height:8px;border-radius:4px;background:var(--line);transition:width .25s}.idots i.cur{background:var(--gold);width:22px}
@media(max-width:979px){.book.fit .pg{height:calc(100dvh - 104px);min-height:460px;padding:24px 20px 50px}.book.fit .cover img{width:140px;margin-bottom:14px}.book.fit .cover h1{font-size:1.9rem}.book.fit .inav button{padding:10px 14px}.idots{display:none}.book.fit .icount{display:block}}
.icount{display:none;font:600 .85rem 'Barlow Condensed',sans-serif;letter-spacing:.1em;color:var(--mut)}
/* ---------- Admin ---------- */
:root{--l0:#2F6B4F;--l1:#7A8F3A;--l2:#C08A2E;--l3:#A8462A}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--l0:#7CC29C;--l1:#B6C870;--l2:#E6B464;--l3:#E8916F}}
:root[data-theme="dark"]{--l0:#7CC29C;--l1:#B6C870;--l2:#E6B464;--l3:#E8916F}
.hdr-adm{display:inline-flex;align-items:center;gap:6px;margin-left:10px;padding:6px 10px;border:1px solid rgba(246,243,238,.28);border-radius:8px;background:transparent;color:var(--hdrink);font:600 .8rem 'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase}
.hdr-adm:hover{border-color:var(--gold);color:var(--gold)}
@media(max-width:520px){.hdr-adm span{display:none}.hdr-adm{padding:7px}}
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,8,6,.55);display:grid;place-items:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.md{background:var(--page);color:var(--ink);border-radius:14px;width:100%;max-width:720px;max-height:88vh;overflow:auto;padding:24px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.pinbox{max-width:380px;text-align:center;border-top:4px solid var(--gold)}
.pinlogo{width:44px;background:#F6F3EE;border-radius:10px;padding:6px;margin:0 auto 10px;display:block}
.pin{width:190px;margin:4px auto 0;display:block;text-align:center;font:700 2rem 'Barlow Condensed',sans-serif;letter-spacing:.6em;padding:10px 0 10px .6em;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.pin:focus{border-color:var(--gold);outline:none}
.adm{max-width:1160px;margin:0 auto}
.adm-top{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px}
.filters input,.filters select,#so{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--page);color:var(--ink);font:inherit}
.filters input{flex:1 1 220px;margin:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:2px}
.kpi small{font:600 .76rem 'Barlow Condensed',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.kpi b{font:700 2.4rem/1.05 'Cormorant Garamond',Georgia,serif}
.kpi span{font-size:.86rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.grid2>.card{margin-bottom:16px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}
.sm{font-size:.86rem}
.hb{display:grid;grid-template-columns:minmax(120px,40%) 1fr 52px;gap:12px;align-items:center;margin-bottom:10px;font-size:.9rem;line-height:1.35}
.hb.wide{grid-template-columns:minmax(160px,55%) 1fr 52px}
.hb .tr{position:relative;height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--ch);border-radius:6px;transition:width .5s}
.hb.ref .tr:after{content:"";position:absolute;left:70%;top:0;bottom:0;width:2px;background:var(--ink);opacity:.45}
.hb .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
@media(max-width:600px){.hb,.hb.wide{grid-template-columns:1fr 48px}.hb .lb{grid-column:1/3}.hb .tr{grid-column:1}}
.crit{font-style:normal;font:600 .7rem 'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--warn);padding:1px 6px;border-radius:4px;margin-left:4px;white-space:nowrap}
.grp{display:flex;gap:8px;align-items:baseline;margin:18px 0 10px;color:var(--ch);font:600 1.15rem 'Cormorant Garamond',Georgia,serif}
.ch-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.stack{display:flex;height:30px;border-radius:8px;overflow:hidden;margin:6px 0 14px;background:var(--line)}
.stack i{display:grid;place-items:center;font:700 .8rem 'DM Sans',sans-serif;font-style:normal;color:#fff;min-width:2px}
.stack i.l0,.leg i.l0{background:var(--l0)}.stack i.l1,.leg i.l1{background:var(--l1)}.stack i.l2,.leg i.l2{background:var(--l2)}.stack i.l3,.leg i.l3{background:var(--l3)}
.leg{display:grid;gap:6px}.leg div{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;font-size:.92rem}.leg i{width:14px;height:14px;border-radius:4px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:.92rem}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-weight:700;font-size:.8rem;white-space:nowrap}
.chip.l0{color:var(--l0);background:color-mix(in srgb,var(--l0) 15%,transparent)}.chip.l1{color:var(--l1);background:color-mix(in srgb,var(--l1) 15%,transparent)}.chip.l2{color:var(--l2);background:color-mix(in srgb,var(--l2) 15%,transparent)}.chip.l3{color:var(--l3);background:color-mix(in srgb,var(--l3) 15%,transparent)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{text-align:left;font:600 .76rem 'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl.click tbody tr{cursor:pointer}.tbl.click tbody tr:hover,.tbl.click tbody tr:focus{background:var(--golds);outline:none}
@media print{.hdr,.btns,.nav{display:none}body{background:#fff;color:#000}.pg{box-shadow:none!important;animation:none}.card{break-inside:avoid}.book.sp{grid-template-columns:1fr}.pg.l.aux{display:none!important}}

var C=[{k:"obj",n:"Manejo de objeciones",d:"Responder a dudas y negativas de pago con argumentos, sin presionar ni ceder de más."},{k:"com",n:"Comunicación segura y clara",d:"Proteger la información del cliente y explicar montos y condiciones sin ambigüedad."},{k:"mol",n:"Gestión de clientes molestos",d:"Mantener la calma, validar la emoción y conservar el control de la llamada."},{k:"per",n:"Persuasión y uso de recursos",d:"Usar descuentos y planes de pago de forma estratégica, sin regalar margen."},{k:"con",n:"Confianza y seguridad personal",d:"Autopercepción sobre tu seguridad al hablar de dinero y sostener una postura."}];
// cada opción: [texto, puntos 0-3]
var Q=[
{c:"obj",s:"El cliente dice: «Ya pagué el anticipo de mi trámite de visa, ¿por qué me siguen cobrando?».",o:[["Pedirle fecha y comprobante del anticipo, y explicarle a qué etapa corresponde el saldo pendiente según su contrato.",3],["Revisar el sistema y decirle que el anticipo solo cubre la primera etapa, por lo que el saldo sigue vigente.",2],["Pedirle que revise su contrato con calma y regularice el saldo antes de que se retrase más el trámite.",1],["Explicarle que, si el saldo no se paga esta semana, el trámite se cancela y pierde lo ya pagado.",0]],w:"Validar el pago y explicar la etapa evita que el cliente sienta un cobro doble."},
{c:"obj",s:"El cliente dice: «Me negaron la visa, ¿por qué tendría que seguir pagando?».",o:[["Mostrar empatía, recordarle que el contrato cubre la gestión y no el resultado, y explorar opciones como un nuevo intento.",3],["Explicarle que el servicio es de gestión y no garantiza el resultado, por lo que el pago sigue siendo exigible.",2],["Ofrecerle el descuento autorizado para que liquide hoy y así cerrar el tema sin más discusión.",1],["Decirle que probablemente faltó información o documentos de su parte y por eso se negó la visa.",0]],w:"El contrato respalda el cobro, pero la empatía y las opciones evitan perder al cliente."},
{c:"obj",s:"El cliente dice: «Me aseguraron que si pagaba me garantizaban la visa».",o:[["No confirmar ni negar todavía; revisar contrato y notas de venta, y escalar a supervisión si hubo una promesa indebida.",3],["Aclararle que ninguna firma puede garantizar una visa y continuar con la gestión del saldo pendiente.",2],["Darle la razón para bajar la tensión y ofrecerle el descuento autorizado a cambio de que pague.",1],["Decirle que el contrato dice otra cosa y que no hay nada que revisar, aunque no lo haya leído.",0]],w:"Verificar protege al cliente y a la firma; ninguna visa puede garantizarse."},
{c:"obj",s:"El historial muestra dos promesas incumplidas. El cliente dice: «Ahora sí, te pago todo el viernes, lo prometo».",o:[["Aceptar la fecha, confirmar monto, hora y medio de pago, y proponer un abono pequeño hoy como muestra de compromiso.",3],["Aceptar la fecha, anotar el compromiso y programar una llamada de recordatorio un día antes.",2],["Recordarle que ya incumplió dos veces y pedirle una razón concreta de por qué esta vez sería distinto.",1],["No aceptar la promesa y avisarle que su expediente quedará detenido si no paga de inmediato.",0]],w:"Una señal inmediata convierte la intención en una conducta verificable."},
{c:"obj",s:"El cliente dice: «Dame 25% de descuento hoy o cancelo el trámite». El máximo que autoriza la firma es 10%.",o:[["Reconocer su propuesta, explicar que mi límite es 10% y ofrecerlo ligado a una fecha y un monto concretos.",3],["Explicarle que mi límite es 10% y preguntarle si prefiere pagar ahora o programar el pago para otra fecha.",2],["Ofrecerle el 10% de inmediato, sin condiciones, para evitar que cancele el trámite.",1],["Decirle que puede cancelar si quiere, porque el descuento no es negociable bajo ninguna circunstancia.",0]],w:"Condicionar el descuento a fecha y monto preserva el margen y mantiene viva la negociación."},
{c:"com",s:"Llamas a un cliente y contesta un familiar; el cliente teme que se sepa de su trámite migratorio.",o:[["Presentarme con mi nombre y la firma, confirmar que hablo con el titular y recién entonces mencionar el trámite.",3],["Presentarme y mencionar que llamo por su trámite de visa, y confirmar después con quién estoy hablando.",2],["Preguntar si hablo con el titular y mencionar el trámite, dejando mi presentación para más adelante.",1],["Ir directo al saldo pendiente y leer el guion completo con rapidez para no quitarle tiempo.",0]],w:"El trámite migratorio es información sensible: se revela solo al titular."},
{c:"com",s:"El cliente confunde los honorarios de la firma con las tasas consulares que se pagan al gobierno.",o:[["Explicarle con un ejemplo qué monto es de la firma y cuál se paga al gobierno, y pedirle que lo repita.",3],["Aclarar la diferencia en la llamada y enviarle después un desglose escrito por mensaje.",2],["Indicarle que ambos conceptos están detallados en su contrato y que ahí puede consultarlos.",1],["Decirle que todo forma parte del mismo trámite y que no hace falta separarlo.",0]],w:"Confirmar comprensión evita disputas por montos mal entendidos."},
{c:"com",s:"Presentas tu propuesta de pago y el cliente guarda silencio varios segundos.",o:[["Esperar unos segundos y preguntarle con calma qué parte de la propuesta le genera dudas.",3],["Repetir la propuesta con otras palabras para asegurarme de que la escuchó completa.",2],["Mejorar un poco la oferta enseguida para evitar que el silencio se convierta en rechazo.",1],["Preguntarle si sigue en la línea y si va a pagar o no, para no perder tiempo.",0]],w:"El silencio suele ser análisis; mejorar la oferta regala margen sin necesidad."},
{c:"com",s:"Debes informar que la promoción de pago que ofreciste hace unos días ya terminó.",o:[["Decírselo al inicio, explicar el motivo en una frase y pasar de inmediato a las opciones disponibles hoy.",3],["Comenzar con comentarios positivos sobre su avance y luego decirle que la promoción ya terminó.",2],["Presentar primero las demás opciones y mencionar que la promoción terminó solo si él pregunta.",1],["Hablar de la promoción como si siguiera vigente y consultarlo con mi supervisor después.",0]],w:"La claridad temprana protege la confianza; omitir información la destruye."},
{c:"com",s:"El cliente pregunta: «Si no pago, ¿me van a reportar con migración?».",o:[["Decirle con honestidad que la firma no hace reportes migratorios, explicar que según el contrato solo se pausa el trámite y ofrecer una salida.",3],["Decirle que ese tema no aplica y regresar a revisar las soluciones de pago disponibles.",2],["Sugerirle que lo más prudente es no arriesgarse y ponerse al corriente con sus pagos.",1],["No responder directamente la pregunta y dejar que la duda siga presente durante la llamada.",0]],w:"Insinuar consecuencias migratorias es una amenaza indebida y daña a la firma."},
{c:"mol",s:"El cliente amenaza con presentar una queja ante la FTC o el CFPB y publicar reseñas negativas en redes.",o:[["Mantener la calma, reconocer su derecho a quejarse, preguntar qué lo llevó a esto y ofrecer revisar su caso.",3],["Sugerirle que lo piense con calma y ofrecerle escalar su caso con un supervisor cuanto antes.",2],["Decirle que está en su derecho, aunque eso no cambia el saldo que tiene pendiente con la firma.",1],["Advertirle que una queja o reseña negativa podría complicar el avance de su trámite.",0]],w:"Entender el origen del enojo suele resolver más que defender la postura."},
{c:"mol",s:"A los dos minutos de llamada, el cliente exige hablar con tu supervisor.",o:[["Ofrecerle ayuda y, si insiste, escalarlo con el supervisor explicándole antes el contexto del caso.",3],["Transferirlo al supervisor de inmediato, sin preguntar el motivo ni resumir lo conversado.",2],["Pedirle una oportunidad de resolverlo, explicando que el supervisor le dará la misma respuesta.",1],["Decirle que el supervisor no está disponible hoy, aunque sí pueda atenderlo.",0]],w:"Respetar la solicitud con un buen traspaso reduce el conflicto."},
{c:"mol",s:"El cliente dice, angustiado: «Mi cita consular es en dos semanas y no tengo cómo pagar lo que falta».",o:[["Validar su urgencia, revisar qué falta realmente y presentar opciones, como un pago mínimo o un plan por etapas.",3],["Decirle que lo más importante ahora es priorizar el pago para no perder su cita consular.",2],["Informarle con claridad que sin el pago pendiente la firma no puede continuar con el trámite.",1],["Ofrecerle el descuento máximo de inmediato para que pague hoy, sin revisar su situación.",0]],w:"La urgencia es real: opciones claras y tiempos concretos ayudan más que presión."},

{c:"mol",s:"Acabas de tener una llamada hostil, sigues alterado y entra otra llamada.",o:[["Tomarme unos segundos para recuperar la calma, enfocarme en la nueva llamada y avisar al líder si lo necesito.",3],["Contestar de inmediato y concentrarme en mantener un tono neutral durante toda la conversación.",2],["Tomar la llamada, pero hacerla más breve de lo normal para terminar cuanto antes.",1],["Contestar con la misma energía con que terminó la llamada anterior, sin pausa.",0]],w:"Autorregularse sostiene el control y la empatía en la siguiente llamada."},
{c:"per",s:"El máximo de descuento que autoriza la firma es 10%. El cliente puede pagar el total pendiente, pero se resiste.",o:[["No ofrecer descuento todavía; reforzar el valor de completar su trámite y reservarlo solo si hay riesgo real de perder el pago.",3],["Ofrecer 5% condicionado a pagar hoy, dejando margen para llegar al 10% si fuera necesario.",2],["Ofrecer el 10% desde el inicio con una fecha límite para generar urgencia y cerrar rápido.",1],["Presentar únicamente el pago total y no mencionar ninguna otra opción ni beneficio.",0]],w:"Los descuentos son un recurso escaso; no se dan a quien puede pagar completo."},

{c:"per",s:"Un cliente que completó con descuento el trámite de un familiar pide el mismo descuento para otro integrante de su familia.",o:[["Reconocer su puntualidad, aclarar que el descuento no es automático y evaluar su situación actual antes de ofrecer algo.",3],["Ofrecer un descuento menor al anterior para reconocer su historial sin comprometer el margen.",2],["Dar el mismo descuento de la vez anterior para mantener la buena relación con la familia.",1],["Negar cualquier descuento porque ya recibió uno antes con el trámite de su familiar.",0]],w:"Premiar el buen historial sin crear expectativa de descuento permanente."}

function filt(){var f=AD.f;return AD.rows.filter(function(r){return(!f.p||r.puesto==f.p)&&(!f.n||r.nivel==f.n)&&(!f.q||(r.nombre+' '+r.id).toLowerCase().indexOf(f.q.toLowerCase())>=0)})}
function fdate(s){if(!s)return '—';var d=new Date(s);return isNaN(d)?'—':d.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'})}
function admin(){hs.textContent='Vista admin';var ab=document.getElementById('admBtn');if(ab)ab.style.display='none';
var R=filt(),n=R.length,puestos=Array.from(new Set(AD.rows.map(function(r){return r.puesto}))).sort();
var h='<div class="adm"><div class="adm-top"><div><span class="eyebrow">Training TMLF · Vista de administrador</span><h1 style="margin:0">Resultados de la evaluación de cobranza</h1><p class="mut" style="margin:4px 0 0">'+AD.rows.length+' evaluaciones registradas'+(n!=AD.rows.length?' · '+n+' con los filtros actuales':'')+'</p></div><div class="btns"><button class="sec" id="ar">Actualizar</button><button class="sec" id="ax">Exportar CSV</button><button class="pri" id="ao">Salir</button></div></div>';
h+='<div class="filters card"><input class="search" id="fq" type="search" placeholder="Buscar nombre o folio" value="'+esc(AD.f.q)+'" aria-label="Buscar"><select id="fp" aria-label="Puesto o equipo"><option value="">Todos los puestos / equipos</option>'+puestos.map(function(p){return '<option'+(p==AD.f.p?' selected':'')+'>'+esc(p)+'</option>'}).join('')+'</select><select id="fn" aria-label="Nivel"><option value="">Todos los niveles</option>'+LVN.map(function(l){return '<option'+(l==AD.f.n?' selected':'')+'>'+l+'</option>'}).join('')+'</select>'+(AD.f.q||AD.f.p||AD.f.n?'<button class="sec" id="fc">Limpiar filtros</button>':'')+'</div>';
if(!n){h+='<div class="card" style="text-align:center;padding:40px"><h2>Sin resultados</h2><p class="mut" style="margin:0">'+(AD.rows.length?'Ningún registro coincide con los filtros.':'Todavía no hay evaluaciones registradas.')+'</p></div></div>';app.innerHTML=h;top_();wireAdm();return}
var g=avg(R.map(function(r){return r.global})),dur=avg(R.map(function(r){return r.dur})),best=avg(R.map(function(r){return avg(r.s.map(function(x){return x===null?null:(x==3?100:0)}))}));
h+='<div class="kpis"><div class="kpi"><small>Evaluados</small><b>'+n+'</b><span class="mut">colaboradores</span></div><div class="kpi"><small>Promedio global</small><b>'+r0(g)+'%</b><span>'+chip(Math.round(g))+' '+LV(Math.round(g))[0]+'</span></div><div class="kpi"><small>Mejor práctica elegida</small><b>'+r0(best)+'%</b><span class="mut">de las situaciones</span></div><div class="kpi"><small>Duración promedio</small><b>'+(dur===null?'—':Math.round(dur))+'</b><span class="mut">minutos</span></div></div>';
// Capítulos + niveles
var capAvg=C.map(function(c,i){return avg(R.map(function(r){return r.caps[i]}))});
h+='<div class="grid2"><div class="card"><h2>Promedio por capítulo</h2>'+C.map(function(c,i){return hb(CH[c.k].r+'. '+c.n,capAvg[i],100,'ch-'+c.k+' ref')}).join('')+'<p class="mut sm">Línea de referencia: 70% = nivel Sólido.</p></div>';
var cnt=[0,0,0,0];R.forEach(function(r){cnt[lvi(r.global)]++});
h+='<div class="card"><h2>Distribución por nivel</h2><div class="stack" role="img" aria-label="Distribución por nivel">'+cnt.map(function(c,i){return c?'<i class="l'+i+'" style="flex:'+c+'" title="'+LVN[i]+': '+c+'">'+(c/n>=.08?Math.round(c/n*100)+'%':'')+'</i>':''}).join('')+'</div><div class="leg">'+cnt.map(function(c,i){return '<div><i class="l'+i+'"></i><span>'+LVN[i]+'</span><b>'+c+'</b></div>'}).join('')+'</div>';
var fo={},op={};R.forEach(function(r){fo[r.fortaleza]=(fo[r.fortaleza]||0)+1;op[r.oportunidad]=(op[r.oportunidad]||0)+1});
function topk(o){var k=Object.keys(o).sort(function(a,b){return o[b]-o[a]})[0];return k?esc(k)+' <span class="mut">('+o[k]+')</span>':'—'}
h+='<div class="duo"><div><small class="eyebrow">Fortaleza más común</small><p style="margin:0">'+topk(fo)+'</p></div><div><small class="eyebrow">Oportunidad más común</small><p style="margin:0">'+topk(op)+'</p></div></div></div></div>';
// Situaciones
var sit=Q.map(function(q,i){var v=R.map(function(r){return r.s[i]}).filter(function(x){return x!==null});return{i:i,q:q,best:v.length?v.filter(function(x){return x==3}).length/v.length*100:null,pts:avg(v)}});
var low=sit.slice().filter(function(x){return x.best!==null}).sort(function(a,b){return a.best-b.best}).slice(0,3).map(function(x){return x.i});
h+='<div class="card"><div class="ch-head"><h2 style="margin:0">Situaciones: % que eligió la mejor práctica</h2><span class="mut sm">Las 3 más bajas están marcadas como críticas</span></div>'+C.filter(function(c){return c.k!='con'}).map(function(c){return '<h3 class="grp ch-'+c.k+'"><span>'+CH[c.k].r+'</span> '+c.n+'</h3>'+sit.filter(function(x){return x.q.c==c.k}).map(function(x){return hb('<b>S'+('0'+(x.i+1)).slice(-2)+'</b> '+esc(x.q.s)+(low.indexOf(x.i)>=0?' <em class="crit">Crítica</em>':''),x.best,100,'ch-'+c.k+' wide')}).join('')}).join('')+'</div>';
// Autoevaluación
var af=T.map(function(t,i){return{t:t,v:avg(R.map(function(r){return r.a[i]}))}});
h+='<div class="grid2"><div class="card ch-con"><h2>Autoevaluación (capítulo V)</h2><p class="mut sm">Puntaje promedio 0–5, ya ajustado en reactivos inversos (más alto = más confianza).</p>'+af.map(function(x,i){return hb((i+1)+'. '+esc(x.t),x.v,5,'ch-con wide')}).join('')+'</div>';
// Por puesto
var gp={};R.forEach(function(r){(gp[r.puesto]=gp[r.puesto]||[]).push(r)});
h+='<div class="card"><h2>Por puesto / equipo</h2><div class="tw"><table class="tbl"><thead><tr><th>Puesto / equipo</th><th>N</th><th>Global</th>'+C.map(function(c){return '<th title="'+c.n+'">'+CH[c.k].r+'</th>'}).join('')+'</tr></thead><tbody>'+Object.keys(gp).sort().map(function(p){var a=gp[p];return '<tr><td>'+esc(p)+'</td><td>'+a.length+'</td><td>'+chip(Math.round(avg(a.map(function(r){return r.global}))))+'</td>'+C.map(function(c,i){var v=avg(a.map(function(r){return r.caps[i]}));return '<td>'+chip(v===null?null:Math.round(v))+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div></div></div>';
// Colaboradores
var srt=R.slice().sort(AD.sort=='global'?function(a,b){return a.global-b.global}:AD.sort=='nombre'?function(a,b){return a.nombre.localeCompare(b.nombre)}:function(a,b){return(b.fecha||'').localeCompare(a.fecha||'')});
h+='<div class="card"><div class="ch-head"><h2 style="margin:0">Colaboradores</h2><label class="sm" style="display:flex;gap:8px;align-items:center;margin:0">Ordenar por <select id="so"><option value="fecha"'+(AD.sort=='fecha'?' selected':'')+'>Más recientes</option><option value="global"'+(AD.sort=='global'?' selected':'')+'>Menor resultado</option><option value="nombre"'+(AD.sort=='nombre'?' selected':'')+'>Nombre</option></select></label></div><p class="mut sm">Haz clic en una fila para ver el detalle del colaborador.</p><div class="tw"><table class="tbl click"><thead><tr><th>Fecha</th><th>Nombre</th><th>Puesto / equipo</th><th>Global</th>'+C.map(function(c){return '<th title="'+c.n+'">'+CH[c.k].r+'</th>'}).join('')+'<th>Min</th></tr></thead><tbody>'+srt.map(function(r){return '<tr data-id="'+esc(r.id)+'" tabindex="0"><td>'+fdate(r.fecha)+'</td><td><b>'+esc(r.nombre)+'</b><br><span class="mut sm">'+esc(r.id)+'</span></td><td>'+esc(r.puesto)+'</td><td>'+chip(r.global)+'</td>'+r.caps.map(function(p){return '<td>'+chip(p)+'</td>'}).join('')+'<td>'+(r.dur===null?'—':Math.round(r.dur))+'</td></tr>'}).join('')+'</tbody></table></div></div></div>';
app.innerHTML=h;top_();wireAdm()}
function wireAdm(){var $=function(i){return document.getElementById(i)};
$('ao').onclick=function(){AD.pin='';AD.rows=[];intro(0)};$('ar').onclick=function(){refresh(this)};$('ax').onclick=csv;
var deb;$('fq').oninput=function(){var v=this.value;clearTimeout(deb);deb=setTimeout(function(){AD.f.q=v;admin();var q=$('fq');q.focus();q.setSelectionRange(v.length,v.length)},250)};
$('fp').onchange=function(){AD.f.p=this.value;admin()};$('fn').onchange=function(){AD.f.n=this.value;admin()};
if($('fc'))$('fc').onclick=function(){AD.f={q:'',p:'',n:''};admin()};
if($('so'))$('so').onchange=function(){AD.sort=this.value;admin()};
app.querySelectorAll('tr[data-id]').forEach(function(tr){tr.onclick=function(){det(tr.getAttribute('data-id'))};tr.onkeydown=function(e){if(e.key=='Enter')det(tr.getAttribute('data-id'))}})}
function det(id){var r=AD.rows.filter(function(x){return x.id==id})[0];if(!r)return;var o=document.createElement('div');o.className='ov';
o.innerHTML='<div class="md" role="dialog" aria-modal="true"><div class="ch-head"><div><span class="eyebrow">'+esc(r.id)+' · '+fdate(r.fecha)+'</span><h2 style="margin:0">'+esc(r.nombre)+'</h2><p class="mut" style="margin:2px 0 0">'+esc(r.puesto)+(r.dur!==null?' · '+Math.round(r.dur)+' min':'')+'</p></div><button class="sec" id="dx" aria-label="Cerrar">Cerrar</button></div><div class="score" style="margin:14px 0 18px"><div class="big">'+r.global+'%</div><div><p class="lv" style="margin:0;color:var(--goldd)">'+esc(r.nivel)+'</p><p class="mut sm" style="margin:0">Fortaleza: '+esc(r.fortaleza)+'<br>Oportunidad: '+esc(r.oportunidad)+'</p></div></div>'+C.map(function(c,i){return hb(CH[c.k].r+'. '+c.n,r.caps[i],100,'ch-'+c.k)}).join('')+'<h3 style="margin-top:20px">Situaciones donde no eligió la mejor práctica</h3><div id="dd"><p class="mut">Cargando respuestas…</p></div></div>';
document.body.appendChild(o);function close(){o.remove()}o.querySelector('#dx').onclick=close;o.onclick=function(e){if(e.target===o)close()};o.addEventListener('keydown',function(e){if(e.key=='Escape')close()});o.querySelector('#dx').focus();
jsonp({action:'detalle',id:id,pin:AD.pin},function(d){var dd=o.querySelector('#dd');if(!dd)return;if(!d||!d.ok){dd.innerHTML='<p class="no">No se pudo cargar el detalle.</p>';return}
var bad=(d.situaciones||[]).filter(function(s){return Number(s.puntos)<Number(s.max)});
dd.innerHTML=bad.length?bad.map(function(s){return '<div class="rev"><span class="eyebrow">S'+('0'+s.n).slice(-2)+' · Capítulo '+esc(s.cap)+' · '+esc(s.puntos)+'/'+esc(s.max)+' pts</span><p style="margin:0 0 4px"><b>'+esc(s.situacion)+'</b></p><p class="mut" style="margin:0">Eligió: '+esc(s.respuesta)+'</p><div class="ideal"><b>Recomendada:</b> '+esc(s.recomendada)+'</div></div>'}).join(''):'<p class="ok">Eligió la mejor práctica en todas las situaciones.</p>'},
function(){var dd=o.querySelector('#dd');if(dd)dd.innerHTML='<p class="no">No se pudo conectar para cargar el detalle.</p>'})}
function csv(){var R=filt(),q=function(v){v=v===null||v===undefined?'':String(v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
var hd=['Folio','Fecha','Nombre','Puesto / equipo','Global %','Nivel'].concat(C.map(function(c){return 'Cap. '+CH[c.k].r+' %'}),['Fortaleza','Oportunidad','Duración (min)'],Q.map(function(_,i){return 'S'+('0'+(i+1)).slice(-2)}),T.map(function(_,i){return 'A'+('0'+(i+1)).slice(-2)}));
var rows=R.map(function(r){return[r.id,fdate(r.fecha),r.nombre,r.puesto,r.global,r.nivel].concat(r.caps,[r.fortaleza,r.oportunidad,r.dur===null?'':Math.round(r.dur*10)/10],r.s,r.a)});
var txt='﻿'+[hd].concat(rows).map(function(x){return x.map(q).join(',')}).join('\r\n');
try{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));a.download='Resultados_Evaluacion_Cobranza_'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}catch(e){alert('No se pudo descargar el CSV.')}}

document.getElementById('admBtn').onclick=pinModal;
intro(0);
</script></body></html>
