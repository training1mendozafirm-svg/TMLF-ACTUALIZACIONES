<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TMLF · I-131 Military Parole in Place · Evaluación</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1f2a3a;--sheet:#fff;--ink:#1a2233;--muted:#5b6475;--line:#d7dce5;
--blue:#1d4ed8;--blue-s:#e6eeff;--green:#15803d;--green-s:#e3f5e9;--red:#b91c1c;--red-s:#fde8e8;--gray-s:#f1f3f7;--gold:#f59e0b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--ink);font-size:17px;line-height:1.55;padding:28px 16px}
.sheet{max-width:980px;margin:0 auto;background:var(--sheet);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
header{background:linear-gradient(120deg,#0f2a5c,#1d4ed8);color:#fff;padding:26px 32px}
header .kicker{font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.8;font-weight:600}
header h1{margin:6px 0 4px;font-size:28px;font-weight:800}
header p{margin:0;opacity:.9}
.bar{display:flex;gap:12px;align-items:center;padding:14px 32px;background:var(--gray-s);border-bottom:1px solid var(--line);font-size:14px;color:var(--muted);flex-wrap:wrap}
.progress{flex:1;min-width:140px;height:8px;background:#dfe3ea;border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--green);width:0;transition:width .4s}
main{padding:28px 32px 36px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tag{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;border-radius:99px}
.t-type{background:var(--blue-s);color:var(--blue)}.t-form{background:var(--gray-s);color:var(--muted)}
.case{border-left:5px solid var(--blue);background:var(--blue-s);padding:16px 20px;border-radius:0 10px 10px 0;margin-bottom:20px}
.case b.lbl{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--blue);margin-bottom:4px}
.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:26px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}main{padding:22px 16px}header,.bar{padding-left:16px;padding-right:16px}}
.formwrap{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fafbfc}
.form{position:relative;container-type:inline-size;width:100%}
.form img{display:block;width:100%;height:auto}
.fill{position:absolute;display:flex;align-items:center;padding-left:1.2cqw;font-family:'Courier Prime',monospace;font-weight:700;font-size:2.4cqw;color:#0b1f6b;white-space:nowrap}
.fill.cells{padding:0}.fill.cells span{flex:1;text-align:center}
.dt{width:100%;border-collapse:collapse;margin-top:12px;background:#fff;border-radius:8px;overflow:hidden;font-size:15px}.dt th,.dt td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left}.dt th{background:#dbe5fb;font-size:14px}.dt td:first-child{font-weight:600;color:var(--muted);width:30%}
.ptitle{font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);margin:14px 0 6px}.ptitle:first-child{margin-top:0}
.sech{font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--blue);padding:6px 12px;border-radius:8px;margin:18px 0 10px}.sech:first-child{margin-top:0}
.sticky{max-height:calc(100vh - 24px);overflow:auto}
.xmark{position:absolute;display:flex;align-items:center;justify-content:center;font-family:"Courier Prime",monospace;font-weight:700;font-size:2.2cqw;color:#0b1f6b;pointer-events:none}.xmark.ok{color:var(--green)}.xmark.bad{color:var(--red)}
.slot.chk .chkph{position:absolute;right:1cqw;top:50%;transform:translateY(-50%);font-size:3cqw}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.dot{border:1px solid var(--line);background:#fff;border-radius:6px;font:inherit;font-size:12px;font-weight:700;padding:4px 8px;cursor:pointer;color:var(--muted)}.dot.ans{background:var(--blue-s);color:var(--blue);border-color:#b9cbf5}.dot.cur{background:var(--gold);color:#1a1a1a;border-color:var(--gold)}
.stepc{font-size:13px;color:var(--muted);margin-bottom:12px}
.navs{display:flex;justify-content:space-between;margin-top:14px;gap:10px}.nav{border:2px solid var(--blue);background:#fff;color:var(--blue);font:inherit;font-weight:700;padding:9px 16px;border-radius:10px;cursor:pointer}.nav.nx{background:var(--blue);color:#fff}.nav:disabled{border-color:#cfd5df;background:#f1f3f7;color:#9aa3b2;cursor:not-allowed}
.slot{position:absolute;cursor:pointer;border:2px solid transparent;border-radius:3px}
.slot .fill{position:absolute;inset:0}
.slot:hover{border-color:rgba(29,78,216,.5)}
.slot.act{border:3px solid var(--gold);background:rgba(245,158,11,.18);animation:pulse 1.6s infinite}
.slot.ok{border:3px solid var(--green);background:rgba(21,128,61,.12)}
.slot.bad{border:3px solid var(--red);background:rgba(185,28,28,.12)}
.slot .tagf{position:absolute;right:-3px;top:-3.4cqw;white-space:nowrap;background:var(--gold);color:#1a1a1a;font-size:2cqw;font-weight:800;padding:.2cqw 1cqw;border-radius:4px 4px 0 0;display:none}
.slot.act .tagf{display:block}
.ph{font-style:normal;color:#9aa6c0}.slot.act .ph{color:#b45309}
.inst{margin:0 0 16px;color:var(--muted)}
.sticky{position:sticky;top:12px}
@media(max-width:820px){.sticky{position:static}}
.fq{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;cursor:pointer;transition:.15s}
.fq.on{border:2px solid var(--gold);box-shadow:0 0 0 4px rgba(245,158,11,.15)}
.fqh{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:10px}
.fqh .num{background:var(--blue);color:#fff;border-radius:6px;padding:2px 8px;font-size:13px}
.fqh .chk{margin-left:auto;color:var(--green)}
.fq .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fq .opt{padding:9px 11px}.fq .opt .l{width:24px;height:24px;font-size:12px}.fq .mono{font-size:15px}
.fq .fb{margin-top:10px;font-size:15px}
.grid{grid-template-columns:1.1fr 1fr}
.hl{position:absolute;border:3px solid var(--gold);border-radius:4px;background:rgba(245,158,11,.18);animation:pulse 1.6s infinite}
.hl span{position:absolute;right:-3px;top:-3.6cqw;background:var(--gold);color:#1a1a1a;font-size:2.2cqw;font-weight:800;padding:.3cqw 1.2cqw;border-radius:4px 4px 0 0;font-family:Inter}
.hl .q{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:4cqw;font-weight:800;color:#b45309}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(245,158,11,.25)}}
.cap{font-size:13px;color:var(--muted);margin-top:8px;text-align:center}
h2{font-size:21px;margin:0 0 14px;line-height:1.35}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:#fff;border-radius:10px;padding:13px 15px;font:inherit;cursor:pointer;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--blue);background:var(--blue-s)}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;background:var(--gray-s);display:grid;place-items:center;font-weight:800;font-size:14px}
.opt.sel{border-color:var(--blue);background:var(--blue-s)}.opt.sel .l{background:var(--blue);color:#fff}
.opt.ok{border-color:var(--green);background:var(--green-s)}.opt.ok .l{background:var(--green);color:#fff}
.opt.bad{border-color:var(--red);background:var(--red-s)}.opt.bad .l{background:var(--red);color:#fff}
.opt:disabled{cursor:default;color:var(--ink)}
.mono{font-family:'Courier Prime',monospace;font-weight:700;font-size:18px}
.btn{margin-top:16px;border:0;background:var(--blue);color:#fff;font:inherit;font-weight:700;padding:12px 22px;border-radius:10px;cursor:pointer}
.btn:disabled{background:#aab3c2;cursor:not-allowed}
.fb{margin-top:16px;border-radius:10px;padding:14px 18px;display:none}
.fb.ok{display:block;background:var(--green-s);border-left:5px solid var(--green)}
.fb.bad{display:block;background:var(--red-s);border-left:5px solid var(--red)}
.fb b.h{display:block;margin-bottom:4px}
.result{text-align:center;padding:30px 10px;display:none}
.result .big{font-size:54px;font-weight:800}

.stepper{display:flex;gap:0;border-bottom:1px solid var(--line);background:#fff}
.stepper div{flex:1;padding:14px 10px;text-align:center;font-weight:700;font-size:14px;color:#9aa3b2;border-bottom:4px solid transparent}
.stepper div.cur{color:var(--blue);border-bottom-color:var(--blue)}.stepper div.fin{color:var(--green);border-bottom-color:var(--green)}
.stepper div span{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#e5e8ee;margin-right:6px;font-size:12px}
.stepper div.cur span{background:var(--blue);color:#fff}.stepper div.fin span{background:var(--green);color:#fff}
.intro{background:var(--gray-s);border-radius:12px;padding:18px 20px;margin-bottom:20px}
.intro h3{margin:0 0 6px;font-size:19px}.intro p{margin:0;color:var(--muted)}
.single{max-width:760px;margin:0 auto}
.qcard{border:2px solid var(--gold);border-radius:12px;padding:18px;margin-top:16px;box-shadow:0 0 0 4px rgba(245,158,11,.12)}
.qcard.rev{border:1px solid var(--line);box-shadow:none}
.qcard h2{font-size:19px}
.qcard .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .qcard .opts{grid-template-columns:1fr}
@media(max-width:620px){.qcard .opts,.fq .opts{grid-template-columns:1fr}}
.qnum{font-size:13px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.revblock{margin-top:26px}
.center{text-align:center}
.rcard{border:1px solid var(--line);border-left:6px solid var(--line);border-radius:12px;padding:16px 20px;margin-top:14px}.rcard.rok{border-left-color:var(--green)}.rcard.rbad{border-left-color:var(--red)}
.rhead{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:19px}.rok .rhead b{color:var(--green)}.rbad .rhead b{color:var(--red)}.rhead b{font-size:26px}
.rsub{color:var(--muted);font-size:14px;margin-top:2px}.rfb{margin-top:10px}.rfb p{margin:0 0 4px;font-weight:600}.rfb ul{margin:0;padding-left:20px}
.scorebox{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}
@media(max-width:620px){.scorebox{grid-template-columns:1fr}}
.scorebox div{background:var(--gray-s);border-radius:12px;padding:16px;text-align:center}
.scorebox b{display:block;font-size:30px}
.scorebox span{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.intake{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px;margin-top:12px;font-size:15px}
.intake p{margin:0;padding:4px 0;border-bottom:1px dashed #c5d3f3;display:grid;grid-template-columns:145px 1fr;gap:10px}.intake p span{font-weight:600;color:var(--muted)}
.intake .ih{font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin:10px 0 2px}.intake .ih:first-child{margin-top:0}
@media(max-width:700px){.intake{grid-template-columns:1fr}.intake p{grid-template-columns:120px 1fr}}
/* ===== Registro + Administrador ===== */
body.pre #stepper,body.pre .bar,body.adm #stepper,body.adm .bar{display:none}
body.adm .sheet{max-width:1180px}
body.adm .slot{cursor:default}body.adm .slot:hover{border-color:transparent}
.reg{max-width:540px;margin:6px auto}
.reg label{display:block;font-weight:700;font-size:14px;margin:16px 0 6px}
.reg input{width:100%;font:inherit;padding:12px 14px;border:2px solid var(--line);border-radius:10px}
.reg input:focus{outline:none;border-color:var(--blue)}
.reg .err{color:var(--red);font-size:14px;margin-top:8px;min-height:20px}
.reg .note{font-size:14px;color:var(--muted);margin-top:14px}
.admlink{display:block;margin:26px auto 0;background:none;border:0;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer}
.who{display:inline-block;margin-top:12px;background:rgba(255,255,255,.16);padding:4px 12px;border-radius:99px;font-size:14px;font-weight:600}
.sync{margin-top:16px;font-size:14px;text-align:center;color:var(--muted)}.sync.ok{color:var(--green);font-weight:600}.sync.bad{color:var(--red);font-weight:600}
.atop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.atop h2{margin:0}
.abtn{border:2px solid var(--blue);background:#fff;color:var(--blue);font:inherit;font-size:14px;font-weight:700;padding:7px 14px;border-radius:9px;cursor:pointer}.abtn.pri{background:var(--blue);color:#fff}
.atabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.atabs button{border:0;background:none;font:inherit;font-weight:700;padding:10px 14px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer}
.atabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;background:var(--gray-s);padding:12px 14px;border-radius:12px;margin-bottom:16px}
.filters label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.filters input,.filters select{font:inherit;font-size:15px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.chips,.att{display:flex;gap:6px;flex-wrap:wrap}.att{margin-bottom:14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--gray-s);border-radius:12px;padding:14px}
.kpi span{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.kpi b{font-size:28px;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin-bottom:18px}
.atbl{width:100%;border-collapse:collapse;font-size:14px}
.atbl th,.atbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.atbl tr:last-child td{border-bottom:0}
.atbl th{background:#dbe5fb;font-size:12px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.atbl .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.atbl tr.click{cursor:pointer}.atbl tr.click:hover td{background:var(--blue-s)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--green-s);color:var(--green)}.pill.bad{background:var(--red-s);color:var(--red)}
.hb{display:flex;align-items:center;gap:8px;min-width:170px}.hb i{display:block;height:9px;border-radius:99px;background:#e5e8ee;flex:1;overflow:hidden}.hb i em{display:block;height:100%;border-radius:99px}.hb b{width:44px;text-align:right;font-variant-numeric:tabular-nums}
.ah{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--blue);margin:24px 0 10px}
.ok-t{color:var(--green);font-weight:700}.bad-t{color:var(--red);font-weight:700}
.banner{background:#fff7e6;border-left:5px solid var(--gold);padding:10px 14px;border-radius:0 10px 10px 0;font-size:14px;margin-bottom:16px}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:820px){.fgrid{grid-template-columns:1fr}}
/* ===== Tablero del grupo (vista general) ===== */
.g-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:4px 0 16px}
.g-head h3{margin:0;font-size:22px;line-height:1.25}.g-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.g-tiles{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:12px;margin-bottom:14px}
@media(max-width:820px){.g-tiles{grid-template-columns:1fr 1fr}}
.g-tile{background:var(--gray-s);border-radius:14px;padding:16px 18px;min-width:0}
.g-tile span.k{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.g-tile b.v{display:block;font-size:34px;font-weight:800;line-height:1.15;margin-top:4px}
.g-tile.hero b.v{font-size:52px}
.g-tile small{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.g-st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;margin-top:6px}
.g-st i{width:10px;height:10px;border-radius:3px;display:inline-block}
.g-split{display:flex;gap:2px;height:10px;border-radius:99px;overflow:hidden;margin-top:10px;background:#e5e8ee}
.g-split div{height:100%}
.g-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.g-grid2{grid-template-columns:1fr}}
.g-card{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px;background:#fff;min-width:0}
.g-card h4{margin:0;font-size:16px}.g-card .g-sub{margin:2px 0 12px;font-size:13px;color:var(--muted)}
.g-lg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:0 0 12px}
.g-lg span{display:inline-flex;align-items:center;gap:6px}.g-lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.g-lg em{font-style:normal;color:#8a93a3}
/* horizontal bars */
.g-row{display:grid;grid-template-columns:minmax(140px,36%) 1fr 46px;gap:12px;align-items:center;padding:6px 4px;border-radius:8px;outline:none}
.g-row:hover,.g-row:focus-visible{background:var(--gray-s)}
.g-lab{min-width:0;font-size:14px;line-height:1.3}.g-lab b{display:block;font-weight:600}.g-lab span{display:block;font-size:12px;color:var(--muted)}
.g-track{position:relative;height:14px;background:#eef0f4;border-radius:4px}
.g-fill{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0}
.g-ref{position:absolute;top:-4px;bottom:-4px;width:2px;background:#1a2233;opacity:.55}
.g-val{text-align:right;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.g-axis{display:grid;grid-template-columns:minmax(140px,36%) 1fr 46px;gap:12px;padding:2px 4px 0}
.g-axis div{position:relative;height:18px;font-size:11px;color:var(--muted)}
.g-axis em{position:absolute;transform:translateX(-50%);font-style:normal;font-variant-numeric:tabular-nums}
.g-axis em.r{color:var(--ink);font-weight:700}
@media(max-width:620px){.g-row,.g-axis{grid-template-columns:1fr 42px}.g-lab{grid-column:1/-1}.g-axis>span:first-child{display:none}}
/* histogram */
.g-hist{display:flex;align-items:flex-end;gap:2px;height:210px;padding-top:22px;border-bottom:1px solid #c9ced8;position:relative}
.g-col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;outline:none;min-width:0}
.g-col .g-bar{width:72%;max-width:64px;border-radius:4px 4px 0 0;min-height:0}
.g-col .cnt{font-size:13px;font-weight:700;margin-bottom:4px}
.g-col:hover .g-bar,.g-col:focus-visible .g-bar{filter:brightness(1.12)}
.g-thr{position:absolute;top:0;bottom:0;width:2px;background:#1a2233;opacity:.55}
.g-thr span{position:absolute;top:0;left:6px;white-space:nowrap;font-size:11px;font-weight:700;color:var(--ink);opacity:1}
.g-xl{display:flex;gap:2px;font-size:12px;color:var(--muted);margin-top:6px}.g-xl span{flex:1;text-align:center;font-variant-numeric:tabular-nums}
/* line */
.g-line svg{display:block;width:100%;overflow:visible}
.g-line text{font-family:Inter,system-ui,sans-serif;font-size:11px;fill:#5b6475}
/* focus cards */
.g-focus{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:14px}
.g-fc{border:1px solid var(--line);border-top:5px solid var(--red);border-radius:12px;padding:14px 16px;background:#fff}
.g-fc .t{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

function dots(n,cur,sel,labels){return `<div class="steps">${Array.from({length:n},(_,k)=>`<button class="dot ${k===cur?'cur':''} ${sel[k]!=null?'ans':''}" data-k="${k}">${labels?labels[k]:k+1}</button>`).join("")}</div><div class="stepc">Pregunta ${cur+1} de ${n}</div>`}
function optsHTML(opts,k,sel,done,ans,mono){return `<div class="opts">${opts.map((o,j)=>{let c="";if(done){if(j===ans)c="ok";else if(j===sel)c="bad"}else if(sel===j)c="sel";
 return `<button class="opt ${c}" data-k="${k}" data-j="${j}" ${done?'disabled':''}><span class="l">${L[j]}</span><span class="${mono?'mono':''}">${o}</span></button>`}).join("")}</div>`}
function navHTML(k,n,answered){return `<div class="navs"><button class="nav" data-d="-1" ${k===0?'disabled':''}>← Anterior</button><button class="nav nx" data-d="1" ${!answered||k===n-1?'disabled':''}>Siguiente →</button></div>`}

 if(!S.done){const q=TQ[S.cur];h+=dots(n,S.cur,S.sel)+`<div class="qcard"><div class="qnum">Pregunta ${S.cur+1}</div><h2>${q.q}</h2>${optsHTML(q.o,S.cur,S.sel[S.cur],false,q.a)}${navHTML(S.cur,n,S.sel[S.cur]!=null)}</div>

 else{h+=`<div class="fb ${S.got/n>=.85?'ok':'bad'}" style="display:block"><b class="h">${S.got} de ${n} correctas</b>Revisa la retroalimentación de cada pregunta y continúa a la parte práctica.</div>`+

function renderPerson(){const p=people().find(p=>p.k===ADM.sel);if(!p){ADM.sel=null;return renderAdmin()}
 if(ADM.att<0||ADM.att>=p.att.length)ADM.att=p.att.length-1;
 let h=`<button class="abtn" id="aback" style="margin-bottom:16px">← Todos los colaboradores</button>
 <h2 style="margin-bottom:2px">${esc(p.nombre)}</h2><p style="margin:0 0 14px;color:var(--muted)">${p.att.length} intento(s) · mejor resultado: ${p.best.pct}%</p>`;
 if(p.att.length>1)h+=`<div class="att">`+p.att.map((a,i)=>`<button class="chip ${i===ADM.att?'on':''}" data-i="${i}">Intento ${i+1} · ${fmtD(a.fecha)} · ${a.pct}%</button>`).join("")+`</div>`;
 $('abody').innerHTML=h+attemptDetail(p.att[ADM.att]);
 $('aback').onclick=()=>{ADM.sel=null;renderAdmin()};
 document.querySelectorAll('.att .chip').forEach(b=>b.onclick=()=>{ADM.att=+b.dataset.i;renderPerson()})}

/* --- Vista 2: tablero general del grupo (por fecha) --- */
const GC={ok:"#15803d",mid:"#d97706",bad:"#b91c1c",teo:"#1d4ed8",pra:"#0f9fa8"};
function LV(v){return v>=85?{c:GC.ok,t:"Dominado",i:"✔",r:"≥ 85%"}:v>=60?{c:GC.mid,t:"En desarrollo",i:"▲",r:"60–84%"}:{c:GC.bad,t:"A reforzar",i:"✘",r:"< 60%"}}
function lvLegend(){return `<div class="g-lg">${[90,70,30].map(v=>{const l=LV(v);return `<span><i style="background:${l.c}"></i>${l.i} ${l.t} <em>${l.r}</em></span>`}).join("")}<span><i style="background:#1a2233;opacity:.55;width:2px"></i>Mínimo aprobatorio 85%</span></div>`}
function setPreset(p){const t=new Date();ADM.preset=p;
 if(p==="all"){ADM.from="";ADM.to=""}
 else if(p==="today"){ADM.from=ADM.to=ymd(t)}
 else if(p==="7"){const d=new Date(t);d.setDate(d.getDate()-6);ADM.from=ymd(d);ADM.to=ymd(t)}
 else if(p==="month"){ADM.from=ymd(new Date(t.getFullYear(),t.getMonth(),1));ADM.to=ymd(t)}}
function filtered(){let rs=ADM.data.filter(r=>(!ADM.from||r.fecha>=ADM.from)&&(!ADM.to||r.fecha<=ADM.to)).sort((a,b)=>a.ts<b.ts?-1:1);
 if(ADM.mode!=="all"){const m={};rs.forEach(r=>{const k=r.clave||normName(r.nombre);
  if(ADM.mode==="first"){if(!m[k])m[k]=r}else if(ADM.mode==="last")m[k]=r;else if(!m[k]||r.pct>m[k].pct)m[k]=r});
  rs=Object.values(m).sort((a,b)=>a.ts<b.ts?-1:1)}
 return rs}
function itemStats(rs){const x=EX[0];
 const st=(sel,ans,opts)=>{const v=rs.map(sel).filter(s=>s!=null),ok=v.filter(s=>s===ans).length,w={};v.forEach(s=>{if(s!==ans)w[s]=(w[s]||0)+1});
  const top=Object.entries(w).sort((a,b)=>b[1]-a[1])[0];return {pct:v.length?Math.round(ok/v.length*100):0,ok,n:v.length,wrong:top?{txt:opts[+top[0]],n:top[1]}:null}};
 const T=TQ.map((q,k)=>({kind:"Teoría",label:q.t,sub:`Pregunta ${k+1}`,correct:q.o[q.a],why:q.w,...st(r=>r.tSel?.[k],q.a,q.o)}));
 const P=x.fields.map((f,k)=>({kind:"Práctica",label:f.id,sub:f.name,correct:f.opts[f.ans],why:f.why,...st(r=>r.pSel?.[k],f.ans,f.opts)}));
 return {T,P}}
function hbars(items,colorFn){return items.map(it=>{const c=colorFn?colorFn(it):LV(it.pct).c,l=LV(it.pct);
  const tip=`<b>${it.label}</b><br>${it.pct}% de aciertos · ${it.ok} de ${it.n}<br>${l.i} ${l.t}`+(it.wrong?`<br>Error más común: ${esc(it.wrong.txt)} (${it.wrong.n})`:"");
  return `<div class="g-row" tabindex="0" data-tip="${esc(tip)}"><div class="g-lab"><b>${it.label}</b>${it.sub?`<span>${it.sub}</span>`:""}</div><div class="g-track"><div class="g-fill" style="width:${it.pct}%;background:${c}"></div><div class="g-ref" style="left:calc(85% - 1px)"></div></div><div class="g-val">${it.pct}%</div></div>`}).join("")+
 `<div class="g-axis"><span></span><div>${[0,25,50,75,100].map(t=>`<em style="left:${t}%">${t}</em>`).join("")}<em class="r" style="left:85%;top:-1px"></em></div><span></span></div>`}
function histogram(rs){const bins=[[0,59,"0–59"],[60,69,"60–69"],[70,79,"70–79"],[80,84,"80–84"],[85,89,"85–89"],[90,94,"90–94"],[95,100,"95–100"]];
 const cnt=bins.map(b=>rs.filter(r=>r.pct>=b[0]&&r.pct<=b[1]).length),mx=Math.max(1,...cnt),n=rs.length;
 return `<div class="g-hist">${bins.map((b,i)=>{const pass=b[0]>=85,c=pass?GC.ok:GC.bad;
  const tip=`<b>${b[2]}%</b><br>${cnt[i]} ${cnt[i]===1?"intento":"intentos"} · ${n?Math.round(cnt[i]/n*100):0}% del grupo<br>${pass?"✔ Aprobado":"✘ No aprobado"}`;
  return `<div class="g-col" tabindex="0" data-tip="${esc(tip)}">${cnt[i]?`<div class="cnt">${cnt[i]}</div>`:""}<div class="g-bar" style="height:${cnt[i]/mx*100}%;background:${c}"></div></div>`}).join("")}
  <div class="g-thr" style="left:calc(${4/7*100}% - 1px)"><span>Mínimo 85%</span></div></div>
  <div class="g-xl">${bins.map(b=>`<span>${b[2]}</span>`).join("")}</div>`}
function lineChart(days){const ks=Object.keys(days).sort(),W=Math.max(280,($('g-line')?.clientWidth)||700),H=220,m={l:34,r:14,t:14,b:28},iw=W-m.l-m.r,ih=H-m.t-m.b;
 const X=i=>m.l+(ks.length===1?iw/2:i/(ks.length-1)*iw),Y=v=>m.t+ih-(v/100)*ih,pts=ks.map((d,i)=>({d,x:X(i),y:Y(avg(days[d].map(r=>r.pct))),v:avg(days[d].map(r=>r.pct)),a:days[d]}));
 const step=Math.ceil(ks.length/Math.max(2,Math.floor(iw/70)));
 let s=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Promedio del grupo por fecha">`;
 [0,25,50,75,100].forEach(t=>{s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="#e5e8ee" stroke-width="1"/><text x="${m.l-8}" y="${Y(t)+4}" text-anchor="end">${t}</text>`});
 s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(85)}" y2="${Y(85)}" stroke="#1a2233" stroke-opacity=".55" stroke-width="2"/><text x="${m.l+6}" y="${Y(85)-6}" text-anchor="start" style="font-weight:700;fill:#1a2233">Mínimo 85%</text>`;
 if(pts.length>1)s+=`<polyline fill="none" stroke="${GC.teo}" stroke-width="2" stroke-linejoin="round" points="${pts.map(p=>p.x+","+p.y).join(" ")}"/>`;
 pts.forEach((p,i)=>{const ap=p.a.filter(r=>r.aprobado).length,tip=`<b>${fmtD(p.d)}</b><br>Promedio: ${p.v}%<br>${new Set(p.a.map(r=>r.clave)).size} colaborador(es) · ${p.a.length} intento(s)<br>Aprobados: ${ap} (${Math.round(ap/p.a.length*100)}%)`;
  s+=`<g tabindex="0" data-tip="${esc(tip)}" style="outline:none"><circle cx="${p.x}" cy="${p.y}" r="14" fill="transparent"/><circle cx="${p.x}" cy="${p.y}" r="5" fill="${GC.teo}" stroke="#fff" stroke-width="2"/></g>`;
  if(i%step===0||i===pts.length-1)s+=`<text x="${p.x}" y="${H-8}" text-anchor="middle">${fmtD(p.d).slice(0,5)}</text>`});
 const lp=pts[pts.length-1];s+=`<text x="${lp.x}" y="${lp.v>=73&&lp.v<=97?lp.y+20:lp.y-12}" text-anchor="end" style="font-weight:700;fill:#1a2233;font-size:12px">${lp.v}%</text>`;
 return s+`</svg>`}
function tipBind(){let t=$('gtip');if(!t){t=document.createElement("div");t.id="gtip";t.className="g-tip";document.body.appendChild(t)}t.style.display="none";
 const show=(el,x,y)=>{t.innerHTML=el.dataset.tip;t.style.display="block";const r=t.getBoundingClientRect();let L=x+14,T=y+14;
  if(L+r.width>innerWidth-8)L=x-r.width-14;if(T+r.height>innerHeight-8)T=y-r.height-14;t.style.left=Math.max(8,L)+"px";t.style.top=Math.max(8,T)+"px"};
 document.querySelectorAll('#abody [data-tip]').forEach(el=>{el.onmousemove=e=>show(el,e.clientX,e.clientY);
  el.onmouseleave=el.onblur=()=>t.style.display="none";el.onfocus=()=>{const r=el.getBoundingClientRect();show(el,r.left+Math.min(r.width/2,200),r.top)}})}
function renderGeneral(){const rs=filtered(),n=rs.length,uniq=new Set(rs.map(r=>r.clave||normName(r.nombre))).size,apr=rs.filter(r=>r.aprobado).length;
 const pre=[["all","Todo"],["today","Hoy"],["7","Últimos 7 días"],["month","Este mes"]];
 const per=ADM.from||ADM.to?(ADM.from===ADM.to?fmtD(ADM.from):`${ADM.from?fmtD(ADM.from):"inicio"} – ${ADM.to?fmtD(ADM.to):"hoy"}`):"Todas las fechas";
 const modeT={all:"todos los intentos",first:"primer intento de cada colaborador",last:"último intento de cada colaborador",best:"mejor intento de cada colaborador"}[ADM.mode];
 let h=`<div class="filters"><label>Desde<input type="date" id="fd" value="${ADM.from}"></label><label>Hasta<input type="date" id="fh" value="${ADM.to}"></label>
 <div class="chips" style="padding-bottom:4px">${pre.map(([k,t])=>`<button class="chip ${ADM.preset===k?'on':''}" data-p="${k}">${t}</button>`).join("")}</div>
 <label>Intentos considerados<select id="fm">${[["all","Todos los intentos"],["first","Primer intento de cada colaborador"],["last","Último intento de cada colaborador"],["best","Mejor intento de cada colaborador"]].map(([k,t])=>`<option value="${k}" ${ADM.mode===k?'selected':''}>${t}</option>`).join("")}</select></label>
 <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap"><button class="abtn pri" id="fpres" ${n?'':'disabled'}>▶ Modo presentación</button><button class="abtn" id="fcsv" ${n?'':'disabled'}>⬇ CSV</button></div></div>`;
 h+=`<div class="g-head"><div><h3>Resultados del grupo · I-131 Military Parole in Place</h3><p>${per} · ${modeT}</p></div></div>`;
 if(!n){$('abody').innerHTML=h+`<div class="empty">No hay resultados en el periodo seleccionado.</div>`;bindGen();return}
 const pm=avg(rs.map(r=>r.pct)),pt=avg(rs.map(r=>r.tPct)),pp=avg(rs.map(r=>r.pPct)),L0=LV(pm),ap=Math.round(apr/n*100);
 h+=`<div class="g-tiles">
  <div class="g-tile hero"><span class="k">Promedio del grupo</span><b class="v">${pm}%</b><span class="g-st"><i style="background:${L0.c}"></i>${L0.i} ${L0.t}</span></div>
  <div class="g-tile"><span class="k">Aprobados</span><b class="v">${ap}%</b><small>${apr} de ${n} ${n===1?"intento":"intentos"} con 85% o más</small>
   <div class="g-split" title="${apr} aprobados · ${n-apr} no aprobados">${apr?`<div style="width:${ap}%;background:${GC.ok}"></div>`:""}${n-apr?`<div style="flex:1;background:${GC.bad}"></div>`:""}</div></div>
  <div class="g-tile"><span class="k">Participantes</span><b class="v">${uniq}</b><small>${n} ${n===1?"intento":"intentos"} considerados</small></div>
  <div class="g-tile"><span class="k">Teoría vs práctica</span>
   <div style="margin-top:10px">${[["Teoría",pt,GC.teo],["Práctica",pp,GC.pra]].map(([t,v,c])=>`<div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-top:6px"><span>${t}</span><span>${v}%</span></div><div class="g-track" style="height:10px;margin-top:3px"><div class="g-fill" style="width:${v}%;background:${c}"></div><div class="g-ref" style="left:calc(85% - 1px)"></div></div>`).join("")}</div></div></div>`;
 const {T,P}=itemStats(rs),days={};rs.forEach(r=>(days[r.fecha]=days[r.fecha]||[]).push(r));
 h+=`<div class="g-grid2"><div class="g-card"><h4>Distribución de calificaciones</h4><p class="g-sub">Cuántos intentos cayeron en cada rango de calificación total</p>
  <div class="g-lg"><span><i style="background:${GC.ok}"></i>✔ Aprobado</span><span><i style="background:${GC.bad}"></i>✘ No aprobado</span></div>${histogram(rs)}</div>
  <div class="g-card"><h4>Evolución del promedio por fecha</h4><p class="g-sub">Promedio total del grupo en cada fecha de aplicación</p><div class="g-line" id="g-line"></div></div></div>`;
 const weak=[...T,...P].filter(i=>i.n&&i.pct<85).sort((a,b)=>a.pct-b.pct).slice(0,3);
 h+=`<div class="ah">Temas a reforzar con el grupo</div>`;
 h+=weak.length?`<div class="g-focus">${weak.map(i=>`<div class="g-fc" style="border-top-color:${LV(i.pct).c}"><div class="t">${i.kind} · ${i.sub}</div><h5><span>${i.label}</span><b style="color:${LV(i.pct).c}">${i.pct}%</b></h5>
  ${i.wrong?`<p><span class="x">✘ Respuesta más elegida por error:</span> ${esc(i.wrong.txt)} <span class="rsub" style="display:inline">(${i.wrong.n} de ${i.n})</span></p>`:""}<p><span class="y">✔ Respuesta correcta:</span> ${esc(i.correct)}</p><div class="w">${i.why}</div></div>`).join("")}</div>`
  :`<div class="g-ok"><b>✔ El grupo domina todos los temas y campos evaluados</b> (85% de aciertos o más en cada uno).</div>`;
 h+=`<div class="g-card"><h4>Dominio por tema · parte teórica</h4><p class="g-sub">% del grupo que contestó correctamente cada pregunta, de menor a mayor</p>${lvLegend()}${hbars(T.slice().sort((a,b)=>a.pct-b.pct))}</div>`;
 h+=`<div class="g-card"><h4>Dominio por campo · parte práctica (Forma I-131)</h4><p class="g-sub">% del grupo que llenó correctamente cada campo, de menor a mayor</p>${lvLegend()}${hbars(P.slice().sort((a,b)=>a.pct-b.pct))}</div>`;
 h+=`<div class="ah">Resultados por fecha</div><div class="tw"><table class="atbl"><thead><tr><th>Fecha</th><th class="n">Colaboradores</th><th class="n">Intentos</th><th class="n">Teoría</th><th class="n">Práctica</th><th class="n">Promedio total</th><th class="n">Aprobados</th></tr></thead><tbody>`+
  Object.keys(days).sort().reverse().map(d=>{const a=days[d],k=a.filter(r=>r.aprobado).length;return `<tr class="click" data-d="${d}" title="Ver solo esta fecha"><td><b>${fmtD(d)}</b></td><td class="n">${new Set(a.map(r=>r.clave)).size}</td><td class="n">${a.length}</td><td class="n">${avg(a.map(r=>r.tPct))}%</td><td class="n">${avg(a.map(r=>r.pPct))}%</td><td class="n"><b>${avg(a.map(r=>r.pct))}%</b></td><td class="n">${k} (${Math.round(k/a.length*100)}%)</td></tr>`}).join("")+`</tbody></table></div>`;
 h+=`<div class="g-admonly"><div class="ah">Intentos del periodo <span class="rsub" style="display:inline;text-transform:none;letter-spacing:0;font-weight:500">· solo visible para el administrador</span></div><div class="tw"><table class="atbl"><thead><tr><th>Fecha</th><th>Colaborador</th><th class="n">Teoría</th><th class="n">Práctica</th><th class="n">Total</th><th>Resultado</th></tr></thead><tbody>`;
 const nm={};people().forEach(p=>nm[p.k]=p.nombre);
 h+=rs.slice().reverse().map(r=>`<tr class="click" data-id="${esc(r.id)}"><td>${fmtD(r.fecha)} · ${esc(r.hora)}</td><td><b>${esc(nm[r.clave||normName(r.nombre)]||r.nombre)}</b></td><td class="n">${r.tPct}%</td><td class="n">${r.pPct}%</td><td class="n"><b>${r.pct}%</b></td><td>${pill(r.aprobado)}</td></tr>`).join("")+`</tbody></table></div></div>`;
 h+=`<button class="abtn pri g-presx" id="fpx">✕ Salir de presentación</button>`;
 $('abody').innerHTML=h;$('g-line').innerHTML=lineChart(days);bindGen(rs);tipBind()}
function setPres(on){ADM.present=on;document.body.classList.toggle("pres",on);
 if(on){try{document.documentElement.requestFullscreen?.().catch(()=>{})}catch(e){}}else{try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}}
 scrollTo(0,0);setTimeout(()=>{if(ADM.tab==="gen"&&$('g-line'))renderGeneral()},150)}
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement&&ADM.present)setPres(false)});
let _gRz;addEventListener("resize",()=>{clearTimeout(_gRz);_gRz=setTimeout(()=>{if(document.body.classList.contains("adm")&&ADM.tab==="gen"&&$('g-line'))renderGeneral()},200)});
function bindGen(rs){
 $('fd').onchange=e=>{ADM.from=e.target.value;ADM.preset="";renderGeneral()};
 $('fh').onchange=e=>{ADM.to=e.target.value;ADM.preset="";renderGeneral()};
 $('fm').onchange=e=>{ADM.mode=e.target.value;renderGeneral()};
 document.querySelectorAll('.chips .chip').forEach(b=>b.onclick=()=>{setPreset(b.dataset.p);renderGeneral()});
 document.querySelectorAll('tr[data-d]').forEach(t=>t.onclick=()=>{if(ADM.present)return;ADM.from=ADM.to=t.dataset.d;ADM.preset="";renderGeneral();scrollTo(0,0)});
 document.querySelectorAll('tr[data-id]').forEach(t=>t.onclick=()=>{const r=ADM.data.find(r=>r.id===t.dataset.id);if(!r)return;
  ADM.tab="col";ADM.sel=r.clave||normName(r.nombre);const p=people().find(p=>p.k===ADM.sel);ADM.att=p?p.att.indexOf(p.att.find(a=>a.id===r.id)):-1;renderAdmin();scrollTo(0,0)});
 if($('fpres'))$('fpres').onclick=()=>setPres(true);
 if($('fpx'))$('fpx').onclick=()=>setPres(false);
 if(rs)$('fcsv').onclick=()=>exportCSV(rs)}
function exportCSV(rs){const x=EX[0],q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
 const head=["Fecha","Hora","Colaborador","Teoría aciertos","Teoría %","Práctica aciertos","Práctica %","Total aciertos","Total %","Resultado","Duración (min)",...TQ.map((t,k)=>`T${k+1} ${t.t}`),...x.fields.map(f=>`P ${f.id}`)];
 const rows=rs.map(r=>[fmtD(r.fecha),r.hora,r.nombre,r.tGot,r.tPct,r.pGot,r.pPct,r.tot,r.pct,r.aprobado?"Aprobado":"No aprobado",r.min??"",
  ...TQ.map((t,k)=>{const s=r.tSel?.[k];return s==null?"":`${L[s]} ${s===t.a?"✔":"✘"}`}),
  ...x.fields.map((f,k)=>{const s=r.pSel?.[k];return s==null?"":`${f.opts[s]} ${s===f.ans?"✔":"✘"}`})]);
 const csv="﻿"+[head,...rows].map(r=>r.map(q).join(",")).join("\r\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
 a.download=`Resultados_I131_PIP_${ADM.from||"inicio"}_${ADM.to||"hoy"}.csv`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

/* ---------- Inicio ---------- */
if(location.hash.toLowerCase()==="#admin")renderPin();else renderReg();
</script></body></html>
