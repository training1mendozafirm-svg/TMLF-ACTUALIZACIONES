content:{title:"Script — llamada saliente estándar",icon:"↗",color:"teal",
secs:[
{type:"steps",areas:["cc"],label:"Preparación previa a la llamada (asesores Chat/Textos — ClickUp)",items:[
{n:"1",c:"blue",t:"Revisar contexto de la tarea",d:"Antes de marcar, leer completa la descripción de la tarea en ClickUp para entender qué solicita el cliente y qué área la originó."},
{n:"2",c:"blue",t:"Verificar en CRM si el cliente ya se contactó",d:"Revisar las últimas notas en CRM.<br>• Si el cliente ya llamó por su cuenta a CS → <strong>marcar la tarea como COMPLETADO</strong> sin hacer la llamada. No tiene caso interrumpirlo de nuevo.<br>• Si no hay nota reciente → proceder con la llamada."},
{n:"3",c:"blue",t:"Asignarse la tarea y cambiar estado",d:"Asignarse el propio nombre en la tarea de ClickUp y cambiar el estado:<br>• <strong>Pendiente → En curso</strong> al iniciar.<br>• <strong>En curso → Completado</strong> al resolver."},
{n:"4",c:"amber",t:"Duda antes de llamar → escalar al TL primero",d:"Si después de revisar CRM y la tarea no queda claro qué decirle al cliente o cómo manejar la situación, <strong>consultar al TL antes de marcar</strong>. No llamar al cliente con información incompleta."},
{n:"5",c:"teal",t:"Nota en CRM al concluir",d:"La nota de este tipo de llamada lleva un título diferente al outbound estándar:<br><strong>«Outgoing Call / Chat Request»</strong><br>No usar «Outgoing Call» genérico — este formato identifica que la llamada provino de una tarea de ClickUp."}
]},
{type:"speech",label:"Apertura",text:"«Buen día/tarde/noche, ¿es usted el Sr./Sra. <strong>[Nombre del cliente]</strong>?»"},
{type:"steps",label:"Flujo completo",items:[
{n:"1",c:"teal",t:"Identificar al cliente",d:"«Buen día, ¿es usted el Sr./Sra. [Nombre]?»"},
{n:"2",c:"teal",t:"Presentarse",d:"«Le habla <strong>[tu nombre]</strong> de The Mendoza Law Firm. Por motivos de seguridad, le voy a confirmar sus filtros.»"},
{n:"3",c:"teal",t:"Candados de seguridad",d:"Mismo proceso: nombre completo + número de cliente o fecha de nacimiento + teléfono/email/dirección."},
{n:"4",c:"teal",t:"Motivo y resolución",d:"«El motivo de mi llamada es…» → flujo estándar con parafraseo y espera de 3 minutos."},
{n:"5",c:"teal",t:"Cierre",d:"2 min para documentar, despedida corporativa con apellido del cliente."}
]}
]}},
{id:"fl_rem",amb:true,label:"Remarcación automática",icon:"↺",color:"amber",
content:{title:"Protocolo — llamadas de remarcación automática",icon:"↺",color:"amber",
intro:"Ocurre cuando el sistema remarca una llamada entrante no contestada. Para el sistema es outbound pero el cliente la percibe como llamada de la firma.",
secs:[
{type:"speech",label:"Script de presentación obligatorio",text:"«Buen día/tarde/noche, me comunico de The Mendoza Law Firm, mi nombre es <strong>[tu nombre]</strong> y el motivo de esta llamada es por una solicitud que nos hizo para que lo contactáramos de vuelta.»"},
{type:"steps",label:"3 escenarios posibles",items:[
{n:"A",c:"teal",t:"Cliente no necesitaba ayuda",d:"1. Solicitar nombre. 2. Agradecer. 3. Nota informativa en CRM + ClickUp. 4. Cambiar a <strong>COMPLETADO</strong> en ClickUp. 5. Despedida."},
{n:"B",c:"teal",t:"Cliente sí llamó y tiene duda",d:"1. Filtros de seguridad. 2. Escuchar y parafrasear. 3. 3 minutos para revisar. 4. Resolver. 5. Asistencia adicional. 6. 2 minutos para registrar. 7. Cambiar a <strong>COMPLETADO</strong>. 8. Despedida."},
{n:"C",c:"amber",t:"Cliente no contesta",d:"1. Tomar número del sistema 8x8. 2. Localizar tarea en ClickUp y caso en CRM. 3. Nota de 'no contacto' en ClickUp. 4. Cambiar a <strong>EN CURSO</strong> (detiene remarcación, pasa a TEXTOS). 5. Nota CRM con plantilla."}
]},
{type:"rules",label:"Reglas importantes",color:"amber",items:[
"COMPLETADO = el sistema deja de remarcar permanentemente ese número",
"EN CURSO = el sistema deja de remarcar y pasa al equipo de TEXTOS para seguimiento",
"SIEMPRE asignarse el nombre propio en la tarea de ClickUp",
"Plantilla CRM (ES): 'Se intentó contactar al cliente para dar seguimiento a una llamada pendiente de CS. No se obtuvo respuesta. Si el cliente se comunica, favor de brindarle apoyo completo.'",
"Plantilla CRM (EN): 'An attempt was made to contact the client to follow up on a pending CS call. No response was received. If the client contacts the firm, please provide full assistance.'"
]}
]}}
]}
]},
{s:"Motivos de llamada",id:"motivos",icon:"❓",sc:"blu",ch:[
{id:"m_st_ok",blu:true,label:"Estatus — caso en tiempos normales",icon:"◉",color:"teal",
content:{"title":"Speech — caso enviado USCIS","icon":"◉","color":"teal","secs":[{"type":"speech","label":"Speech — caso pendiente en USCIS","text":"«En este momento, su caso está pendiente. USCIS publica que está completando el 80 % de las peticiones en aproximadamente <strong>[X] meses</strong>. Sin embargo, actualmente estamos observando retrasos en los casos de USCIS, tanto en nuestra oficina como a nivel nacional. Esta situación no afecta únicamente a su caso.<br><br>Hasta este momento, no tenemos ninguna notificación de USCIS solicitando evidencia adicional o alguna acción de su parte. La falta de respuesta se debe principalmente a la acumulación de casos que existe actualmente en las oficinas de USCIS.<br><br>Sabemos que la espera puede ser difícil. Los casos están siendo revisados de manera más estricta que hace algunos años, y estamos viendo más solicitudes de evidencia y posibles intentos de denegación en algunos casos. Mientras su caso continúe pendiente, existe la posibilidad de que haya cambios en las políticas migratorias que puedan beneficiar el procesamiento de los casos.<br><br>Por ahora, su caso simplemente continúa pendiente y no tenemos ninguna solicitud pendiente de USCIS ni ninguna acción pendiente de su parte.»"},{"type":"rules","label":"Qué verificar y qué hacer — A tener en cuenta","color":"teal","items":["Revisar fecha de envío a USCIS, fecha de recibos iniciales y estatus en la página oficial de USCIS","Enviar al cliente documentos como recibos iniciales, aprobaciones o documento de prima facie vigente si no se le ha enviado anteriormente.","No mencionar tiempos exactos o prometer fechas o resultados."]}]}},
{id:"m_st_at",blu:true,label:"Estatus — cliente molesto por tiempos",icon:"⚠",color:"amber",
content:{"title":"Cliente molesto por tiempos de procesamiento de USCIS","icon":"⚠","color":"amber","secs":[{"type":"rules","label":"Cliente molesto por tiempos de procesamiento de USCIS","color":"amber","items":["Dar contención al cliente","Enviar al cliente documentos como recibos iniciales, aprobaciones o documento de prima facie vigente si no se le ha enviado anteriormente.","No ofrecer E-Request.","Si el cliente insiste, está molesto o se identifica una situación de emergencia, alarmante o inusual en el caso, se puede ofrecer una <strong>llamada con USCIS</strong>. Esta llamada se realiza entre un asesor de la firma, el cliente y USCIS para solicitar información sobre el caso.","Escalar en <strong>TIER 1 a Back Office</strong>","Back Office puede demorar hasta un mes en llamarle."]}]}},
{id:"m_file",blu:true,label:"Solicitud de expediente (File Request)",icon:"⊞",color:"gold",
content:{"title":"Script completo — solicitud de expediente","icon":"⊞","color":"gold","secs":[{"type":"steps","label":"Escenario base — solicitud simple","items":[{"n":"1","c":"gold","t":"Speech","d":"<strong>«Claro, este es su expediente y usted tiene derecho a recibir una copia. Voy a registrar su solicitud en este momento; sin embargo, debo hacerle algunas preguntas como parte del protocolo de escalación».</strong><br>Confirmar el motivo por el que está solicitando su expediente."},{"n":"2","c":"gold","t":"Forma de envío","d":"<strong>«¿Cómo le gustaría recibir su expediente?»</strong><br>• Correo electrónico: archivo o enlace seguro.<br>• Correo físico: USB o documentos físicos.<br>• Recogerlo en una de nuestras oficinas.<br><br>Confirmar:<br>• Correo electrónico.<br>• Dirección física (si aplica)<br>• Número de teléfono.<br><br>Si desea enviar una copia a otro abogado → confirmar el correo electrónico del abogado."},{"n":"3","c":"gold","t":"Verificar fechas importantes","d":"<strong>«Antes de continuar, quiero verificar si tiene alguna fecha importante relacionada con su caso.»</strong><br>Preguntar si tiene:<br>• Fecha de audiencia.<br>• Fecha límite para presentar documentación.<br>• Fecha de corte migratoria.<br>• Notice to Appear (NTA) u otra notificación de la corte.<br><br>Si tiene una fecha próxima o un plazo menor a <strong>3 a 5 días hábiles</strong> → registrarlo y escalarlo con un TL como urgente."},{"n":"4","c":"gold","t":"Ofrecer llamada con abogado","d":"<strong>«Como parte del protocolo, vamos a agendar una llamada de seguimiento con la abogada María Álvarez. En esta llamada podrá hacer sus preguntas, resolver sus dudas y revisar con ella la estrategia de su caso».</strong><br>→ Agendar llamada con la abogada María Álvarez."},{"n":"5","c":"gold","t":"Check-in del servicio","d":"<strong>«Antes de terminar, ¿hay alguna molestia o preocupación con su caso o con el servicio que le hemos brindado?»</strong><br><strong>«¿Hay alguna preocupación específica o alguna pregunta que no haya sido respondida y en la que podamos ayudarle?»</strong><br><br>Si necesita orientación legal:<br><strong>«En la llamada que vamos a agendar, podrá revisar sus preguntas e inquietudes directamente con la abogada.»</strong><br>Si el cliente no desea responder, no insistir."},{"n":"6","c":"gold","t":"Actualización del caso","d":"Cuando aplique:<br><strong>«Entendemos que los tiempos de procesamiento de USCIS están siendo considerablemente largos. Estos retrasos están afectando a muchos casos actualmente. Su caso continúa siendo trabajado por nuestra firma y le mantendremos informado ante cualquier actualización.»</strong>"},{"n":"7","c":"gold","t":"Tiempo de entrega","d":"<strong>«La firma solicita de 3 a 5 días hábiles para reunir y preparar el expediente completo. Este es el plazo máximo; si está listo antes, se lo enviaremos».</strong><br><strong>«Si tiene una fecha límite o necesita el expediente antes de ese plazo, puede informárnoslo para registrarlo como urgente».</strong>"}]},{"type":"rules","label":"¿Cuándo un File Request es urgente?","color":"red","items":["Tiene una <strong>fecha próxima</strong> (audiencia, corte migratoria, Notice to Appear u otra notificación de la corte) o un <strong>plazo menor a 3 a 5 días hábiles</strong> → registrarlo y escalarlo con un TL como urgente.","Tiene una <strong>fecha límite para presentar documentación</strong> antes del plazo de entrega de 3 a 5 días hábiles → registrarlo como urgente.","Si existe urgencia, el TL debe reportarla a <strong>Management</strong> para solicitar atención expedita."]},{"type":"rules","label":"Recordatorio para el agente","color":"red","items":["LA SOLICITUD SE REGISTRA INMEDIATAMENTE.","No condicionar el expediente a: responder preguntas.","No condicionar el expediente a: hablar con un abogado.","No condicionar el expediente a: pago o firma de documentos.","No condicionar el expediente a: explicaciones del cliente.","Notificar siempre al TL."]},{"type":"acc","label":"Reporte File Request","tag":"gold","tl":"Plantilla","body":[{"type":"speech","text":"REPORTE FILE REQUEST<br>Nombre del cliente:<br>Motivo de la solicitud:<br>Método de entrega:<br>Correo electrónico:<br>Número de teléfono:<br>Fecha de la audiencia y/o comparecencia ante el tribunal:<br>Abogado Externo (Nombre/Email):<br>Fecha límite para presentar la documentación:<br>Preocupaciones o problemas del cliente:<br>Llamada con la abogada Mariana:"}]},{"type":"acc","label":"Escenario — cliente tiene corte próxima","tag":"amber","tl":"Escenario","body":[{"type":"rules","items":["Preguntar datos de la corte:","Fecha de la corte","Tipo de corte: penal o migratoria","Datos del abogado (si aplica): Nombre completo · Número de teléfono + extensión (si aplica) · Correo electrónico"]}]},{"type":"acc","label":"Escenario — El expediente lo solicita un abogado externo / CL menciona que quiere cambiar de abogado.","tag":"red","tl":"Escenario","body":[{"type":"rules","items":["Preguntar si ya cuenta con representación del otro abogado","Datos del abogado (si aplica): Nombre completo · Número de teléfono + extensión (si aplica) · Correo electrónico"]}]}]}},
{id:"m_pago",blu:true,label:"Pago de mensualidad",icon:"$",color:"teal",
content:{"title":"Protocolo — pago de mensualidad en LawPay","icon":"$","color":"teal","secs":[{"type":"steps","label":"Proceso de cobro paso a paso","items":[{"n":"1","c":"blue","t":"Si el CL quiere hacer el pago con CS:","d":"Verificar con el cliente la cantidad"},{"n":"2","c":"blue","t":"Llenar la plataforma LawPay","d":"Ingresar datos del Cliente: <strong>nombre completo</strong> como aparece registrado en el CRM, <strong>monto</strong> (siempre confirmarlo antes con el cliente), <strong>concepto del pago</strong> (Monthly payment).<br>Recuerda que por seguridad del cliente no le podemos repetir los datos bancarios al cliente.<br><a href='https://secure.lawpay.com/pages/mendozafirm/trust%2Fattyfees' target='_blank' style='color:var(--gold)'>https://secure.lawpay.com/pages/mendozafirm/trust%2Fattyfees</a>"},{"n":"3","c":"blue","t":"Fraseología de autorización (obligatoria antes de procesar el pago)","d":"<strong>«Voy a realizar un cobro por el monto de $[] USD por concepto de pago mensual para el caso a nombre de [nombre completo del titular del caso]. ¿Es correcto?»</strong><br>Esperar confirmación verbal antes de procesar."},{"n":"4","c":"teal","t":"Post-cobro — 3 acciones obligatorias","d":"• Copiar el comprobante de pago.<br>• Adjuntar el comprobante en las notas del CRM, como una nota adicional a la correspondiente a la interacción.<br>• Enviar el comprobante por mensaje de texto al cliente desde el CRM (esperar confirmación de recibido)."}]}]}},
{id:"m_cancel",blu:true,label:"Cancelaciones y reembolsos",icon:"✕",color:"amber",
content:{"title":"Tipos de cancelación en TMLF (en el CRM)","icon":"✕","color":"amber","secs":[{"type":"steps","label":"Cuando el cliente quiere cancelar","items":[{"n":"1","c":"amber","t":"Contener primero","d":"Contener primero: agotar la etapa de contención antes de escalar e identificar el motivo real de la molestia.<br><br><strong>⏱ Tiempo máximo de contención: 2 minutos.</strong><br>Si, después de ese tiempo, el cliente no acepta la respuesta o continúa insistiendo, escalar directamente, sin realizar más intentos de contención.<br>El área de <strong>Retentions</strong> es quien se encarga de la contención profunda — no es función de CS prolongar esta etapa.<br><br>Escalar en el CRM en <strong>“Make a request”</strong><br><strong>Solicitud de Cancelación</strong>"},{"n":"2","c":"amber","t":"Informar sobre el proceso","d":"<strong>«Contamos con un área especializada en gestionar las solicitudes de cancelación. Su solicitud será canalizada con el equipo correspondiente y un asesor se pondrá en contacto con usted para dar seguimiento a su caso y brindarle información sobre los siguientes pasos del proceso».</strong>"},{"n":"3","c":"amber","t":"Si el cliente pregunta por reembolso o tiempos de cancelación:","d":"<strong>«Esa información será proporcionada por el área encargada después de hacer una evaluación de la situación».</strong><br><br><strong>Importante:</strong> Nunca proporcionar montos, plazos ni tiempos estimados de cancelación."}]},{"type":"steps","label":"Cuando el cliente ya canceló y pregunta por reembolso","items":[{"n":"1","c":"blue","t":"Verificación previa de información sobre reembolsos:","d":"Antes de proporcionar cualquier información al cliente, se debe revisar en el CRM si existe una nota del equipo de Retentions.<br>La nota debe especificar los tiempos y la forma en que se realizará el reembolso.<br>Si aún no se cuenta con esta información, se le puede indicar al cliente que su solicitud será escalada con el área correspondiente para verificar el estatus y los detalles del reembolso.<br><br><strong>Importante:</strong> No proporcionar tiempos ni condiciones de reembolso sin contar con información previamente confirmada por el equipo de Retentions en el CRM."},{"n":"2","c":"red","t":"Si el cliente está molesto por la demora o amenaza con redes sociales","d":"Escalar con prioridad directamente al TL"}]}]}},

{id:"m_viaje",blu:true,label:"Cliente quiere viajar (Travel Call)",icon:"✈",color:"amber",
content:{"title":"Protocolo completo — Travel Call","icon":"✈","color":"amber","secs":[{"type":"rules","label":"Contención – Consultas sobre viajes fuera de Estados Unidos","color":"amber","items":["Actualmente, la firma no recomienda que los clientes viajen fuera de Estados Unidos debido a los riesgos migratorios que pueden presentarse al intentar reingresar al país.","Es importante explicarle al cliente que, si sale de Estados Unidos, al intentar regresar podría ser sujeto a una inspección migratoria. Durante esta revisión, las autoridades podrían identificar antecedentes migratorios que afecten su posibilidad de reingreso. Dependiendo de las circunstancias de su caso, podrían aplicarse consecuencias migratorias, incluido un <strong>castigo permanente de 10 años</strong> que le impediría reingresar legalmente al país."]},{"type":"steps","label":"Si el cliente insiste en realizar el viaje:","items":[{"n":"1","c":"amber","t":"Cuestionario de viaje","d":"Se deberá agendar una consulta legal con un abogado para que revise su situación migratoria, evalúe los posibles riesgos y le brinde orientación antes de tomar cualquier decisión de viajar.<br>Antes de agendar la consulta, se deberá realizar el siguiente cuestionario:<br>• ¿El cliente ha tenido algún contacto previo con USCIS?<br>• ¿El cliente tiene alguna audiencia o proceso de corte pendiente?<br>• ¿El cliente cuenta con un EAD? Solicitar una fotografía del documento a través del CRM.<br>• ¿Cuál es la fecha de vencimiento de su EAD? (Se requiere una vigencia mínima de 11 meses).<br>• ¿Su EAD cuenta con la anotación “Serves as I-512”?<br>• ¿El cliente cuenta con la aprobación de su formulario I-131?<br>• ¿El cliente cuenta con la aprobación de su formulario I-360?<br>• ¿El cliente cuenta con un pasaporte vigente?<br>• Fecha del viaje: ¿Tiene una fecha programada para realizar el viaje?"},{"n":"2","c":"teal","t":"Agendar Callback – Travel Call","d":"Para programar la consulta legal, se deberá ingresar al siguiente enlace:<br><a href='https://ecosystem-customer-service.vercel.app/callbacks/agendado' target='_blank' style='color:var(--gold)'>https://ecosystem-customer-service.vercel.app/callbacks/agendado</a><br><br>Instrucciones:<br>• Seleccionar al abogado que tenga disponibilidad para atender al cliente.<br>• Completar los datos solicitados para agendar el callback.<br>• En el campo <strong>Type of call</strong>, seleccionar la opción <strong>Travel</strong>.<br>• En el campo <strong>Description</strong>, ingresar el cuestionario de viaje con las preguntas realizadas y las respuestas proporcionadas por el cliente.<br><br><strong>Importante:</strong> Verificar que toda la información del cuestionario esté registrada correctamente para que el abogado pueda revisar el caso antes de la consulta."},{"n":"3","c":"blue","t":"Registro obligatorio en el CRM","d":"Una vez realizado el cuestionario, el asesor deberá:<br>• Dejar una nota en el CRM identificada en el título como <strong>Travel Call</strong>, incluyendo todas las preguntas y las respuestas proporcionadas por el cliente y la fecha de la cita.<br>• Registrar la información relevante y cualquier documentación solicitada o recibida."}]},{"type":"rules","label":"Viajes de emergencia o falta de disponibilidad de citas","color":"red","items":["Si el cliente necesita viajar por una emergencia o no hay citas disponibles con un abogado antes de la fecha programada de su viaje, el asesor deberá reportar el caso inmediatamente con su TL para revisar si existe la posibilidad de gestionar una cita prioritaria con el área legal.","No se deberá asegurar al cliente que será posible adelantar la consulta hasta contar con la confirmación correspondiente."]}]}},
{id:"m_abuser",blu:true,label:"Llama abusador / tercera persona",icon:"⊘",color:"amber",
content:{"title":"Script completo — abuser o tercera persona no autorizada","icon":"⊘","color":"amber","secs":[{"type":"steps","label":"Protocolo de atención – Llamadas de terceras personas","items":[{"n":"1","c":"amber","t":"Identificar la relación con el titular del caso","d":"Cuando llame una persona que no sea el titular del caso, el asesor deberá preguntarle qué relación tiene con el titular y verificar esa información antes de proporcionar cualquier dato."},{"n":"2","c":"amber","t":"Si el caso corresponde a una visa humanitaria (VAWA, T o U)","d":"Se deberá verificar si la persona que llama es alguna de las siguientes:<br>• <strong>Abuser</strong> (VAWA)<br>• <strong>Tratante</strong> (Visa T)<br>• <strong>Persona por la que está aplicando el cliente</strong> (Visa U)<br>Para identificar esta relación, el asesor puede apoyarse en la IA del CRM utilizando la consulta: «¿Quién es el abuser / por quién está aplicando el cliente?».<br><br><strong>Si la persona que llama es el abuser, el tratante o la persona por la que está aplicando el Cliente:</strong><br>• NO confirmar ni negar la existencia de un caso.<br>• NO proporcionar información ni detalles relacionados con el expediente.<br>• Intentar finalizar la llamada de manera cordial y profesional.<br>Speech sugerido: <strong>«Le agradezco mucho su comprensión. Si el titular del caso desea comunicarse con nosotros directamente, con gusto podremos asistirle. En este momento no puedo continuar con esta llamada».</strong><br><br><strong>Escalación inmediata:</strong> Si la persona se torna agresiva, insiste en obtener información, amenaza o se niega a finalizar la llamada, se deberá escalar la situación inmediatamente con el TL.<br><br><strong>Si se trata de cualquier otra tercera persona:</strong><br>Explicar que, por motivos de confidencialidad, es necesario que el titular del caso se encuentre presente en la llamada para poder proporcionar información.<br>Speech sugerido: <strong>«Para poder brindarle información sobre el caso, es necesario que el titular se encuentre presente durante la llamada. Con gusto podremos atenderles cuando puedan comunicarse juntos».</strong>"},{"n":"3","c":"blue","t":"Si el caso NO corresponde a una visa humanitaria","d":"Verificar la relación de la persona que llama con el titular del caso.<br>• <strong>Si es peticionario o beneficiario:</strong> Se le puede proporcionar información relacionada con el caso.<br>• <strong>Si no forma parte del caso:</strong> Explicar que es necesario que el titular se encuentre presente en la llamada para poder compartir información.<br>Speech sugerido: <strong>«Por motivos de confidencialidad, únicamente podemos proporcionar información a las personas autorizadas que forman parte del caso. Para poder asistirle, necesitamos que el titular se encuentre presente durante la llamada».</strong>"}]},{"type":"speech","label":"Speech sugerido — abuser, tratante o persona por la que aplica el cliente","text":"«Le agradezco mucho su comprensión. Si el titular del caso desea comunicarse con nosotros directamente, con gusto podremos asistirle. En este momento no puedo continuar con esta llamada»."},{"type":"speech","label":"Speech sugerido — cualquier otra tercera persona (visa humanitaria)","text":"«Para poder brindarle información sobre el caso, es necesario que el titular se encuentre presente durante la llamada. Con gusto podremos atenderles cuando puedan comunicarse juntos»."},{"type":"speech","label":"Speech sugerido — caso NO humanitario","text":"«Por motivos de confidencialidad, únicamente podemos proporcionar información a las personas autorizadas que forman parte del caso. Para poder asistirle, necesitamos que el titular se encuentre presente durante la llamada»."},{"type":"rules","label":"Consideraciones importantes para el asesor","color":"amber","items":["Siempre verificar la relación de la persona que llama antes de proporcionar información.","En casos de visas humanitarias, prestar especial atención a la identidad de la persona que llama y su relación con el caso.","Nunca confirmar ni negar la existencia de un expediente cuando la persona que llama sea el abuser, tratante o persona por la que aplica el cliente.","Ante cualquier situación de riesgo, amenaza o comportamiento agresivo, escalar inmediatamente con el TL."]},{"type":"acc","label":"Plantilla de nota obligatoria en CRM","tag":"gold","tl":"Plantilla","body":[{"type":"speech","text":"Título: THIRD-PARTY CALL / CASE INFORMATION REQUEST<br><br>Reason: A third party contacted the office regarding the case and requested information. No case information was provided, and the caller was advised that the case holder must contact the office directly for assistance.<br><br>Solution: The third party was informed that, for privacy and security reasons, no information could be disclosed. They were advised that the primary case holder must contact the office directly if assistance or case information is needed.<br><br>Behavior: Calm<br><br>CN and DOB: Not Confirmed"}]}]}}
]},
{s:"Emergencias — acción inmediata",id:"emgs",icon:"!",emg:true,sc:"red",ch:[
{id:"e_det",label:"Cliente fue detenido (ICE / autoridad)",icon:"!",color:"red",emg:true,
content:{"title":"Emergencia — cliente detenido","icon":"!","color":"red","emg":true,"secs":[{"type":"steps","label":"⚠ Emergencia — Notificar al TL antes de terminar la interacción","items":[{"n":"1","c":"red","t":"Si es primera vez que se nos informa","d":"Verificar en el CRM que no tengamos ya el reporte de la detención o que ya tenga seguimiento de Removals."},{"n":"2","c":"red","t":"Si ya tenemos seguimiento de Removals:","d":"• Sondear qué es lo que necesitan: actualización del proceso, proporcionar nueva información, dudas específicas de la detención.<br>• Confirmar el contacto de emergencia (nombre, número y parentesco)"},{"n":"3","c":"red","t":"Confirmar quién llama","d":"Confirmar los datos de la persona que se está comunicando y relación con el cliente.<br>Recuerda que se puede comunicar otra persona externa al caso para notificar que el cliente ha sido detenido y <strong>se pueden omitir los filtros de seguridad</strong>.<br><strong>Solamente tomamos información y reportamos, no damos estatus del caso o de la detención.</strong>"},{"n":"4","c":"red","t":"Recabar información de la detención con las siguientes preguntas clave:","d":"• Fecha y hora de la detención:<br>• Entidad que lo detuvo (ICE, USCIS, Sheriff, etc):<br>• Cargos (migratorios o criminales):<br>• Lugar dónde lo llevan o dónde será trasladado:<br>• Información proporcionada por las autoridades:<br>• Si hablaron con oficial: nombre completo, insignia o ID, número de caso, teléfono<br>• Contacto de emergencia (nombre, número y parentesco):<br>• <strong>Importante siempre confirmar el número del contacto de emergencia</strong><br>• Si es el abuser / tratante, solicitar otro contacto de emergencia adicional<br>• Tipo de caso y etapa:"}]},{"type":"speech","label":"Speech","text":"«Lamento mucho saber esta situación. Entiendo lo difícil que debe ser. Voy a escalar el caso de inmediato a nuestro departamento de Removals para que puedan evaluarlo y determinar la mejor manera de ayudarlos. Se revisará la información y se pondrán en contacto con ustedes»."},{"type":"rules","label":"Nota importante sobre representación","color":"red","items":["NO asumir representación automáticamente.","La firma evalúa cada caso individualmente y hay casos en los que no podemos representarlos. Puede requerirse el pago de honorarios.","Si el cliente fue detenido por cuestiones criminales: recomendarle conseguir asesoría de un abogado especialista en la materia e irnos informando del proceso. Aún así, debemos reportar a Removals para el seguimiento."]}]}},
{id:"e_cita",label:"Cliente informa cita con ICE / autoridad",icon:"◉",color:"red",emg:true,
content:{"title":"Emergencia — cita con ICE u otra autoridad","icon":"◉","color":"red","emg":true,"intro":"Los clientes pueden recibir un documento por parte de ICE donde les informan que deben asistir a una revisión.<br><br>Asimismo, hay clientes que tienen revisiones periódicas con ICE como parte del seguimiento de sus procesos de deportación. Estas revisiones las hacen presenciales, en las oficinas de ICE o por medio de una aplicación.<br><br>Es importante recabar toda la información necesaria, debido a que esta cita puede derivar en un proceso de deportación o detención para el cliente.","secs":[{"type":"speech","label":"Speech principal","text":"«Gracias por informarnos. En este tipo de situaciones es fundamental que un abogado revise su caso antes de que usted asista a la cita. Le pedimos, por favor, <strong>no presentarse hasta que un abogado de nuestro equipo le indique lo contrario</strong>. Su caso será canalizado al área correspondiente para que puedan revisar los detalles y brindarle la orientación legal adecuada lo antes posible.»"},{"type":"steps","label":"Procedimiento obligatorio","items":[{"n":"1","c":"red","t":"Notificar al TL de inmediato","d":"Es una emergencia. El cliente no debe presentarse a la cita sin antes tener asesoría legal por parte de la firma."},{"n":"2","c":"red","t":"Recabar la siguiente información","d":"• Fecha de la cita o chequeo<br>• Si tiene documentación, que la envíe por mensaje de texto en ese momento<br>• Autoridad que lo cita (ICE, USCIS, policía local, otra)"},{"n":"3","c":"blue","t":"Canalizar al equipo de Removals","d":"Un abogado de la firma revisará la situación y dará orientación legal antes de la cita.<br>Recabar la información y reportarla al TL."}]},{"type":"rules","label":"Reglas críticas — A tener en cuenta","color":"red","items":["El cliente NO debe presentarse a ninguna cita con una autoridad sin consultar primero con la firma.","Mantener calma, transmitir seguridad y claridad al cliente","Evitar conjeturas — nunca especular sobre consecuencias o resultados"]}]}},
{id:"e_red",label:"Redadas / ICE en la puerta del cliente",icon:"◈",color:"red",emg:true,
content:{"title":"Protocolo — redadas de ICE","icon":"◈","color":"red","emg":true,"secs":[{"type":"acc","label":"Derechos si ICE está en su puerta ahora","tag":"red","tl":"URGENTE","body":[{"type":"rules","items":["Tiene derecho a NO abrir la puerta","Tiene derecho a no responder","Puede quedarse dentro de su casa sin contestar","Única excepción: si presentan una «judge's order» (orden de un juez) que incluya el nombre del cliente y la firma del juez. Solo entonces debe responder.","NO debe firmar ningún documento sin consultar con un abogado de migración","Si tiene documentos migratorios: tenerlos impresos y a la mano siempre"]}]},{"type":"acc","label":"Derechos si lo detienen en la calle / retén","tag":"amber","tl":"Derechos","body":[{"type":"rules","items":["Tiene derecho a permanecer en silencio","Tiene derecho a pedir un abogado","NO debe responder preguntas sin asesoría legal","NO debe firmar ningún documento sin revisión de abogado","En un retén: tiene derecho a no responder preguntas"]}]},{"type":"rules","label":"Recursos a compartir con el cliente","color":"amber","items":["Red Card: <a href='https://drive.google.com/file/d/1OqJiWlDnvCobBC8s0rotPk5uOXrTsrV4/view' target='_blank' style='color:var(--gold)'>drive.google.com/…/1OqJiWlDnvCobBC8s0rotPk5uOXrTsrV4</a>","Recibos iniciales, aprobatorios, prima facie, bona fide.","Si ICE está en la puerta del cliente EN ESTE MOMENTO, notificar al TL de inmediato y mantener al cliente en línea."]}]}},
{id:"e_bar",label:"Demanda, Bar Complaint o comentarios negativos en redes",icon:"⚖",color:"red",emg:true,
content:{"title":"Emergencias — amenaza legal o reputacional","icon":"⚖","color":"red","emg":true,"secs":[{"type":"rules","label":"Niveles de riesgo y escalación inmediata","color":"red","items":["Amenaza de Bar Complaint o acción legal","Solicitud de Bar Number de MGM u otro abogado","Cliente quiere consultar a otro abogado","Amenaza con comentarios negativos en redes","Cliente quiere hablar con MGM"]},{"type":"rules","label":"¿Qué hacer?","color":"gold","items":["Reportar inmediatamente con un TL antes de terminar la llamada.","Escuchar activamente y validar la emoción del cliente.","Mantener la calma y un tono profesional y empático.","Ubicar la causa raíz de la frustración.","Comprometerse a escalar la situación.","Documentar los hechos de forma objetiva en MyCase."]},{"type":"rules","label":"No hacer:","color":"red","items":["Admitir culpa, negligencia o error de la firma.","Dar asesoría legal (exclusiva del abogado).","Prometer resultados garantizados ante USCIS.","Discutir, minimizar la queja o colgar la llamada.","Autorizar reembolsos."]},{"type":"acc","label":"Amenaza de Bar Complaint o acción legal","tag":"red","tl":"Escenario","body":[{"type":"rules","items":["Escuchar al cliente e identificar por qué quiere presentar la queja o demanda, qué necesita y qué solución podría atender la preocupación.","Si el cliente menciona que ya está pensando en ir con otro abogado o que está pidiendo asesoría hay que preguntar el nombre o datos del abogado (se puede mencionar que es por protocolo)","Recabar toda la información y pedirle tiempo en espera al cliente para escalar la situación con un TL.","El TL tomará la llamada, solicitará que se transfiera o dará indicaciones.","Dejar la nota con toda la información e incluir en el título el tipo de emergencia: <strong>Threat of a Bar Complaint</strong> · <strong>Threat of Legal Action</strong>"]}]},{"type":"acc","label":"Solicitud de Bar Number de MGM u otro abogado","tag":"red","tl":"Escenario","body":[{"type":"rules","items":["Preguntar por qué requiere el número y por qué lo necesita. No negar la información; explicar que puede agendarse una llamada con un abogado para revisar la solicitud.","Recabar toda la información y pedirle tiempo en espera al cliente para escalar la situación con un TL.","El TL tomará la llamada, solicitará que se transfiera o dará indicaciones.","Dejar la nota con toda la información e incluir en el título el tipo de emergencia: <strong>CL requests MGM's bar number.</strong> · <strong>CL requests the attorney's bar number.</strong>"]}]},{"type":"acc","label":"Cliente quiere consultar a otro abogado","tag":"red","tl":"Escenario","body":[{"type":"rules","items":["Confirmar si ya cuenta con otro abogado o apenas desea consultar; si ya cuenta con representación, solicitar información del abogado: nombre completo y firma","Preguntar el motivo, qué necesita y qué solución se puede ofrecer.","Recabar toda la información y pedirle tiempo en espera al cliente para escalar la situación con un TL.","El TL tomará la llamada, solicitará que se transfiera o dará indicaciones.","Dejar la nota con toda la información e incluir en el título el tipo de emergencia: <strong>CL is consulting with another attorney.</strong>"]}]},{"type":"acc","label":"Amenaza con comentarios negativos en redes","tag":"red","tl":"Escenario","body":[{"type":"rules","items":["Identificar el motivo de la amenaza, qué necesita el cliente.","Mostrar empatía y establecer compromiso con el cliente.","Recabar toda la información y pedirle tiempo en espera al cliente para escalar la situación con un TL.","El TL dará indicaciones para escalar las problemáticas del caso."]}]},{"type":"acc","label":"Indicadores de alerta — señales de riesgo en la llamada","tag":"red","tl":"Alertas","body":[{"type":"rules","items":["El cliente menciona 'fraude' o 'negligencia'","El cliente habla de 'demandar' a la firma o al abogado","El cliente menciona «no querer tomar otras acciones»","El cliente solicita el Bar Number de la abogada","El cliente menciona 'Bar Complaint'","El cliente amenaza con comentarios en redes (Google, Facebook, TikTok, Instagram)","El cliente menciona haber contratado o consultado a otro abogado","El cliente solicita hablar con MGM"]}]}]}},
{id:"e_est",label:"Cliente reporta posible estafa",icon:"⊗",color:"red",emg:true,
content:{"title":"Protocolo — posible intento de estafa","icon":"⊗","color":"red","emg":true,"secs":[{"type":"speech","label":"Speech","text":"«Lamentamos mucho esta situación. Le recordamos que la firma no solicita dinero por redes sociales, WhatsApp, Zelle, transferencias ni depósitos bancarios. Todos los pagos se realizan a través de nuestro número oficial de Customer Service y de nuestra plataforma LawPay. No solicitamos dinero para acelerar el proceso.»"},{"type":"rules","label":"Preguntas","color":"red","items":["¿Comentó en alguna publicación o live reciente de la Abogada María Mendoza?","¿Por qué medio fue contactado?","¿Usted dio alguna información de su caso?","¿Proporcionó su número de cliente?","¿Le solicitaron un pago?","¿Usted realizó un pago?","Solicitar evidencia (Link de pagina, Número de teléfono, Capturas de pantalla)","Pedir que reporte la página o el número.","Reportar con el TL la situación.","Dejar información explícita en el CRM","Enviar redes oficiales de la firma."]},{"type":"acc","label":"Redes y contacto oficial de la firma","tag":"gold","tl":"Enviar al cliente","body":[{"type":"rules","items":["Facebook: facebook.com/abogadamariamendoza","Instagram: instagram.com/abogadamariamendoza/","TikTok: tiktok.com/@abogadamaria","Página web: mendozafirm.com","Teléfono CS: (202) 869-0694","Correo: abogada@mendozafirm.com"]}]},{"type":"rules","label":"¿Cómo detectar que es fraude?","color":"red","items":["Menciona haber hablado con María Mendoza por WhatsApp","Menciona que le pedimos pagos por WhatsApp para mandar el caso o acelerar el proceso.","Le mandaron información que no coincide con la etapa actual de su proceso o con los datos que tenemos"]}]}}
]},
{s:"Herramientas y referencia",id:"tools",icon:"⊡",sc:"grn",ch:[
{id:"t_vdpc",grn:true,label:"Metodología VDPC — clientes molestos",icon:"◇",color:"gold",
content:{"title":"Metodología VDPC — contención de clientes molestos","icon":"◇","color":"gold","intro":"VDPC es el método para contener a clientes molestos. No es un guion rígido, sino una secuencia lógica que guía la interacción desde la tensión hacia la resolución.","secs":[{"type":"steps","label":"Las 4 etapas de VDPC","items":[{"n":"V","c":"teal","t":"Validación — reconocer la emoción","d":"Reconocer verbalmente los sentimientos del cliente ANTES de proporcionar información.<br><br><strong>Frases:</strong><br>• «Entiendo lo que me comenta.»<br>• «Tiene toda la razón en sentirse así.»<br>• «Sé que esta situación puede ser algo delicada.»<br><br><strong>Tono:</strong> cálido y pausado, nunca mecánico."},{"n":"D","c":"teal","t":"Disculpa — reconocer el inconveniente","d":"<strong>Frases:</strong><br>• «Lamento mucho la situación.»<br>• «Ofrezco una disculpa por la demora.»<br>• «Siento que esto le haya causado inconvenientes.»<br><br>⚠ Después de disculparse, es el momento adecuado para <strong>indagar y descubrir la causa principal</strong> del problema.<br><strong>Tono:</strong> sincero y breve, sin justificaciones excesivas."},{"n":"P","c":"teal","t":"Puente — conectar con la solución","d":"<strong>Frases:</strong><br>• «Estoy aquí para ayudarle con este tema.»<br>• «Le comento el siguiente paso…»<br>• «Ahora bien, lo que podemos hacer es…»<br><br><strong>Tono:</strong> ritmo seguro, con pausas cortas."},{"n":"C","c":"teal","t":"Cierre — orientar al futuro positivo","d":"Aunque no haya buenas noticias, es importante mantener una comunicación clara y orientar al cliente sobre los siguientes pasos.<br><br><strong>Frases:</strong><br>• «Cuando USCIS reciba su caso, le enviaremos un mensaje de texto.»<br>• «Ahora debemos esperar la respuesta por parte de USCIS.»<br>• «Vamos a trabajar en su caso.»<br><span class=\"draft\">[Pendiente de completar: confirmar la frase de cierre].</span><br><br>⚠ Promete <strong>ACOMPAÑAMIENTO</strong>, nunca resultados.<br><strong>Tono:</strong> firme, cálido y seguro."}]},{"type":"rules","label":"Errores que rompen la contención — EVITAR","color":"red","items":["Interrumpir al cliente durante la fase de Validación","Dar demasiada explicación cuando el cliente está muy molesto","Justificar a la firma en lugar de validar al cliente","Sonar mecánico o como si estuviera leyendo un guion","Prometer resultados en lugar de prometer acompañamiento","Olvidar la Asistencia Adicional al finalizar: «¿Hay algo más en lo que pueda servirle?»"]},{"type":"acc","label":"¿Cuándo contener vs cuándo escalar?","tag":"gold","tl":"Decisión","body":[{"type":"rules","items":["SE CONTIENE: solicitudes de cancelación, solicitudes para hablar con abogados y quejas por retrasos ordinarios (negociar más tiempo).","SE ESCALA: si, después de la contención, el cliente insiste; utiliza lenguaje agresivo o amenazas; existe riesgo de pérdida de confianza, o el caso superó el tiempo límite de su etapa.","HERRAMIENTA: 'Si el cliente se calma → vas bien. Si se acelera → ajusta el enfoque.'"]}]}]}},
{id:"t_esc",grn:true,label:"Mapa de escalaciones",icon:"⊥",color:"gold",
content:{"title":"Los medios de escalación de CS","icon":"⊥","color":"gold","secs":[{"type":"acc","label":"Escalación al chat de Slack Tier 1","tag":"gold","tl":"Principal","body":[{"type":"rules","items":["Siempre confirmar los responsables del área con ayuda de TL o Bot de Slack"]},{"type":"speech","text":"ESCALACIÓN CS | [ÁREA]<br>Case ID:<br>Cliente:<br>Motivo:<br>Acción requerida:<br>Prioridad: [Regular / Urgente]<br>Responsable:"}]},{"type":"acc","label":"Lo que no está en Tier 1","tag":"amber","tl":"Con TL","body":[{"type":"rules","items":["Lo que se escala con TL para que pueda dirigirlo al área correspondiente:","Removals","Interview 485","Seguimientos de reembolsos o de cancelaciones ya con seguimiento de Retentions","Personal Injury"]}]},{"type":"acc","label":"Por el CRM:","tag":"teal","tl":"CRM","body":[{"type":"rules","items":["Cancelaciones"]}]}]}},
{id:"t_can",grn:true,label:"End to End — proceso interno general",icon:"⊶",color:"teal",
content:{"title":"End to End — proceso interno general","icon":"⊶","color":"teal","intro":"Consulta el End to End para saber en qué etapa del proceso interno está el caso y qué tiempos aplican antes de informar al cliente.","secs":[{"type":"rules","label":"Acceso","color":"teal","items":["End to End: <a href='https://training1mendozafirm-svg.github.io/TMLF-ACTUALIZACIONES/tiemposprocesam.html' target='_blank' style='color:var(--gold)'>https://training1mendozafirm-svg.github.io/TMLF-ACTUALIZACIONES/tiemposprocesam.html</a>","Compleméntalo siempre con las últimas notas del CRM antes de informar al cliente."]}]}},
{id:"t_noinfo",grn:true,label:"Información que NO se revela al cliente",icon:"⊘",color:"red",
content:{"title":"Información visible en el CRM que NO se comunica directamente al cliente","icon":"⊘","color":"red","intro":"El asesor puede tener acceso visual a cierta información en el perfil del cliente; sin embargo, esto no significa que pueda proporcionar información completa sobre ella. Todo lo que aparece en esta lista debe escalarse al área correspondiente para que esta pueda brindar la información completa al cliente.","secs":[{"type":"rules","label":"Qué se puede decir y a dónde se escala","color":"red","items":["<strong>Rejections y Decisions</strong> — se le puede comentar al cliente que recibimos una “notificación” en su proceso y es necesario que tenga llamada con un abogado para revisar las actualizaciones del caso. Se escala en el formulario de Callbacks para que un abogado le notifique al cliente y evalúe los pasos siguientes.","<strong>RFE (Request for Evidence) y NOID (Notice of Intent to Deny)</strong> — se le puede comentar al cliente que recibimos una solicitud de evidencia adicional en su proceso y se comunicará el área para darle toda la información. No se debe informar directamente al cliente. Se escala con el área de RFE en Tier 1","<strong>NTA (Notice to Appear)</strong> — El asesor no puede decirle al cliente que tiene una NTA. Se escala a Removals para el seguimiento."]},{"type":"steps","label":"¿Qué hacer cuando el cliente pregunta o ya lo sabe?","items":[{"n":"B","c":"amber","t":"Cuando el cliente ya tiene conocimiento de la notificación de USCIS","d":"Si el cliente confirma que ya vio la notificación en la página de USCIS y solicita información al respecto, el asesor deberá verificar si el documento (Decision, Rejection o RFE) se encuentra disponible en el CRM o en Dropbox.<br><br><strong>Si el documento está disponible:</strong><br>Se deberá utilizar el siguiente speech: <strong>«Vamos a agendarle una llamada con nuestro equipo legal para darle el detalle correspondiente».</strong><br>Posteriormente, el asesor deberá escalar el caso al área correspondiente:<br>• <strong>Callbacks:</strong> Decision y Rejection.<br>• <strong>RFE:</strong> RFE y NOID.<br><br><strong>Si el documento NO está disponible en el CRM ni en Dropbox:</strong><br>El asesor podrá:<br>• Confirmarle al cliente que la información que visualiza en la página de USCIS es correcta.<br>• Explicarle que debemos esperar a recibir el documento oficial y que, una vez recibido, nuestro equipo se comunicará con él para proporcionarle la información correspondiente."},{"n":"C","c":"red","t":"El cliente pide el documento (RFE, NTA, decisión, etc.)","d":"Tratar como <strong>File Request</strong> y agendar la callback correspondiente."}]}]}},
{id:"t_notas",grn:true,label:"Estructura de notas en CRM",icon:"≣",color:"gold",
content:{"title":"Guía completa — notas en CRM","icon":"≣","color":"gold","secs":[{"type":"acc","areas":["cs","t2"],"label":"Estructura de notas — Inbound","tag":"blue","tl":"Inbound","body":[{"type":"speech","text":"<strong>Título:</strong> Incoming Call / Case status<br>(o: Incoming Call / Payment | Emergency | Documents)<br><br><strong>Cuerpo:</strong><br>Reason: [motivo principal de la interacción]<br>Solution: [acciones realizadas o información proporcionada]<br>Behavior: [Calm / Frustrated / Upset / etc.]<br>CN: [Confirmed o Not Confirmed]<br>Internal note: [incluir solo cuando sea necesario]"}]},{"type":"acc","areas":["ch"],"label":"Estructura de notas — Chats","tag":"violet","tl":"Chats","body":[{"type":"speech","text":"<strong>Título:</strong> Outbound call / Case status<br>(o: Incoming Call / Payment | Emergency | Documents)<br><br><strong>Cuerpo:</strong><br>Reason: [motivo principal de la interacción]<br>Solution: [acciones realizadas o información proporcionada]<br>Behavior: [Calm / Frustrated / Upset / etc.]<br>CN: [Confirmed o Not Confirmed]<br>Internal note: [incluir solo cuando sea necesario]"}]},{"type":"acc","areas":["cc"],"label":"Estructura de notas — Customer Care","tag":"teal","tl":"Customer Care","body":[{"type":"speech","text":"<strong>Título:</strong> Outbound CSM Call - Customer Care<br><br>Reason for the call: Case status<br>Stage:<br>Outcome:<br>Client feeling:<br>Next appointment:<br>CN or DoB:"}]}]}}
,

{id:"t_callback_pasos",grn:true,label:"Agenda de Callback — paso a paso",icon:"☏",color:"gold",sub:"Portal de agendas",
content:{"title":"Agenda de Callback — paso a paso","icon":"☏","color":"gold","intro":"<strong>Portal de agendas</strong><br>El agente de Customer Service puede agendar directamente una callback con un abogado en el portal de agendas.","secs":[{"type":"steps","label":"Cómo agendar una callback en el portal de agendas","items":[{"n":"1","c":"blue","t":"Entra al portal de agendas","d":"Abre el portal de agendas de callbacks e inicia sesión con la cuenta support<br><a href='https://ecosystem-customer-service.vercel.app/callbacks/agendado' target='_blank' style='color:var(--gold)'>https://ecosystem-customer-service.vercel.app/callbacks/agendado</a><br>Se abre un calendario donde podemos buscarle una cita al cliente que le quede con sus horarios<br><br><strong>Importante:</strong><br>• Si el CL ya ha tenido callbacks con uno de los abogados, debemos agendarle llamada con el mismo abogado.<br>• Si es para notificar una decisión o rejection se deberá agendar con <strong>Atty. Susana o Jesús</strong>, para agendar con ellos debemos escalarlo en el formulario de Callbacks y comentarle al cliente que se pondrán en contacto con él para agendarle su llamada.<br><a href='https://ecosystem-customer-service.vercel.app/escalar' target='_blank' style='color:var(--gold)'>https://ecosystem-customer-service.vercel.app/escalar</a><br>• Si es una emergencia: Se le deberá buscar un espacio con <strong>Atty Mariana</strong>."},{"n":"2","c":"blue","t":"Buscar un espacio disponible","d":"Buscar un espacio disponible para el cliente. Pueden aparecer días bloqueados por feriados u otras actividades. Las agendas son de lunes a viernes."},{"n":"3","c":"amber","t":"Ten en cuenta la zona horaria del abogado","d":"Todos los abogados manejan horario de Puerto Rico, con una excepción: <strong>Mariana Álvarez</strong>, cuya zona horaria corresponde a Houston, TX.<br>Realizar siempre la conversión de horario con la zona horaria del cliente.<br><br>Se puede:<br>• Confirmar la hora actual del cliente en la llamada: <strong>«¿Qué hora tiene en este momento?»</strong> y revisar en qué zona horaria se encuentra<br><a href='https://cambiohorario.com/zonas/usa/' target='_blank' style='color:var(--gold)'>https://cambiohorario.com/zonas/usa/</a><br>• Podemos utilizar el convertidor de horarios:<br><a href='https://24timezones.com/es/difference/puerto_rico/us' target='_blank' style='color:var(--gold)'>https://24timezones.com/es/difference/puerto_rico/us</a><br>En la columna izquierda ya aparece Puerto Rico como referencia. Solo deben buscar la zona horaria o el estado donde se encuentra el cliente para consultar la diferencia de horario."},{"n":"4","c":"teal","t":"Llena la información","d":"Al encontrar un horario disponible con el cliente podemos seleccionar el horario y llenar la información que se solicita:<br>• <strong>ID MyCase:</strong> número de cliente<br>• <strong>Cliente:</strong> nombre como aparece en el CRM<br>• <strong>Teléfono:</strong> confirmado con el cliente al que quiere que le llamemos<br>• <strong>Type of case:</strong> registrado en CRM<br>• <strong>Open case since:</strong> fecha en el CRM<br>• <strong>Current stage:</strong> etapa actual<br>• <strong>Case is in USCIS?:</strong> seleccionar cuando el caso ya se haya enviado a USCIS, aunque tenga un rejection.<br>• <strong>Type of call:</strong> ver opciones del menú desplegable abajo<br>• <strong>Description.</strong> descripción del por qué el cliente solicitó la llamada<br>• <strong>Área:</strong> customer service<br>• <strong>Atty.:</strong> no modificar<br>• <strong>Fecha de callback:</strong> no modificar<br>• <strong>Hora:</strong> no modificar"},{"n":"5","c":"teal","t":"Guarda la callback","d":"Da clic en <strong>Agendar Callback</strong><br>Si te aparece algún error, solicita ayuda de un TL."},{"n":"6","c":"gold","t":"Envía el recordatorio al cliente","d":"Manda un mensaje de confirmación al cliente usando siempre su hora local (nunca la hora del abogado). Ver plantilla abajo."},{"n":"7","c":"gold","t":"Deja la nota en el CRM","d":"Deja la nota en el CRM de la información brindada al cliente y de la llamada que se agendó:<br><strong>«Se agendó una llamada de seguimiento con la abogada Mariana Álvarez para el día [fecha], a las [hora del cliente] ([hora de Puerto Rico])».</strong>"}]},{"type":"acc","label":"Type of call — Opciones del menú desplegable:","tag":"gold","tl":"Referencia","body":[{"type":"rules","items":["<strong>CLIENT UPSET:</strong> cliente expresa molestia con procesos, tiempos de procesamiento, la firma, falta de contacto, etc.","<strong>TRAVEL:</strong> consulta de viaje","<strong>CL WANT TO TALK W MGM:</strong> quiere hablar con MGM y es la única solicitud que tiene","<strong>FOIA interpretation:</strong> se agenda cuando hay resultados de FOIA y un abogado necesita interpretarlos con el cliente (no se agenda directamente en CS)","<strong>LEGAL ADVICE:</strong> cliente quiere un consejo legal","<strong>Rejections/decisión Notification:</strong> Notificación de primera vez de rejection o decisión","<strong>Change of Strategy:</strong> cuando el cliente quiere ver si puede aplicar por otro proceso (aparte del que actualmente lleva)","<strong>File Request:</strong> CL quiere su expediente, declaración o copia de rejection, decisión, RFE o NOID","<strong>SECOND CALLBACK:</strong> segunda llamada de seguimiento con el abogado."]}]},{"type":"acc","label":"Plantilla — recordatorio al cliente","tag":"gold","tl":"Plantilla","body":[{"type":"speech","text":"Buen día<br>Le envío la información de su cita con nuestros abogados:<br>(Día de la semana, fecha, hora) de su hora local<br>Excelente tarde."}]}]}},
{id:"t_uscis",grn:true,label:"Consulta de caso en USCIS",icon:"◎",color:"teal",
content:{"title":"Consulta de caso — Portal USCIS","icon":"◎","color":"teal","intro":"Utiliza este portal para verificar el estatus del caso del cliente directamente en la página oficial de USCIS.","secs":[{"type":"acc","label":"Acceso al portal de USCIS","tag":"teal","tl":"Enlace","body":[{"type":"rules","items":["<a href='https://egov.uscis.gov/es' target='_blank' style='color:var(--tel)'>https://egov.uscis.gov/es</a> — Portal oficial en español para consulta de casos.","Ingresar el número de recibo del caso (receipt number) para verificar estatus actual."]}]},{"type":"acc","label":"Calculadora de tiempos","tag":"teal","tl":"Herramienta","body":[{"type":"rules","items":["Calculadora de tiempos: <a href='https://training1mendozafirm-svg.github.io/TMLF-ACTUALIZACIONES/tiemposprocesam.html' target='_blank' style='color:var(--gold)'>training1mendozafirm-svg.github.io/TMLF-ACTUALIZACIONES/tiemposprocesam.html</a>","Úsala para comparar el tiempo que lleva el caso contra los tiempos publicados por USCIS."]}]}]}}
]}
];
