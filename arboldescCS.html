r_cc:{"id":"r_cc","label":"Rutina operativa — Customer Care","icon":"◷","color":"teal","content":{"title":"Rutina operativa — Customer Care","icon":"◷","color":"teal","nolib":true,"intro":"Lo que debes tener abierto y hacer en cada turno como agente de Customer Care: plataformas, Agenda Customer Care, Slack, revisión del caso en el CRM, flujo de llamada y emergencias.","secs":[{"type":"steps","label":"Plataformas operativas que deben tener abiertas","items":[{"n":"1","c":"blue","t":"Portal de asistencia","d":"En el portal de asistencia se debe registrar los <strong>ingresos, breaks, lunch y salidas</strong>.<br><a href='https://script.google.com/a/macros/supportmendoza.com/s/AKfycbyQQieC30-hQ-lVU5f0VoNzW8UHGb0vqbcSj_9LpOgy4pxkdm_iTqG2NFgve6WpkkLO/exec' target='_blank' style='color:var(--gold)'>Abrir el Portal de asistencia</a>"},{"n":"2","c":"blue","t":"8x8 Work","d":"Aplicación del sistema telefónico."},{"n":"3","c":"teal","t":"Agenda Customer Care","d":"<a href='https://script.google.com/a/macros/supportmendoza.com/s/AKfycbzWO0KwF6ivgvbur2k06-nd7U0AT6rCq_DceP5y8gv7_e7yWWlNHz2wTx89RdaZZ9XS/exec' target='_blank' style='color:var(--gold)'>Abrir la Agenda Customer Care</a><br>Gestión de cartera de clientes y seguimientos pendientes.<br>• <strong>Clientes:</strong> lista completa de todos los clientes asignados.<br>• <strong>Calendario:</strong> lista de clientes agendados. Se puede ver por día, semana y mes.<br>• <strong>Seguimientos:</strong> lista de clientes en formato de tareas pendientes. Para poder darle trackeo a los clientes con contactos pendientes, contactados o que no han respondido.<br>• <strong>Escalaciones:</strong> clientes con escalaciones pendientes.<br><br><strong>Gestión de clientes:</strong><br>• Al abrir una tarea, iniciamos la <strong>«Gestión»</strong> para visualizar la información completa de la tarea e iniciar con el trabajo del caso.<br>• <strong>Nota del cliente:</strong> para colocar información general del proceso. Esta se puede visualizar cada que se inicia la gestión.<br>• <strong>Resultado de la llamada:</strong> registrar la opción que corresponda.<br>• <strong>Qué pasó:</strong> breve registro de la información proporcionada al cliente, preguntas que realizó y su estado de ánimo.<br>• <strong>Seguimiento:</strong> para agendar un próximo contacto (está en hora CDMX).<br>• <strong>Escalación:</strong> si durante la interacción es necesario realizar una escalación hacia otra área (esto no omite la escalación a TL, TIER 1 u otros medios para informar al área correspondiente).<br>• <strong>Historial:</strong> compilado de notas guardadas en la tarea."},{"n":"4","c":"blue","t":"Slack","d":"En la aplicación de Slack se debe de tener los siguientes grupos:<br>• <strong>CDMX - OFICINA:</strong> Para aviso de lunch, WC, regresos de WC y salidas a tomar agua.<br>• <strong>Preguntas Customer Care:</strong> Para solicitar ayuda sobre escalaciones de casos, dudas sobre procesos, ayuda con la gestión de la agenda.<br>• <strong>Tier 1:</strong> Para realizar escalaciones (ver plantilla abajo)."},{"n":"5","c":"blue","t":"CRM","d":"En la plataforma CRM se deben de realizar las búsquedas de los casos y revisar las actualizaciones del proceso y compromisos pendientes <strong>antes de realizar la llamada</strong> con el cliente.<br><br><strong>Si es la primera vez que se contacta al cliente:</strong><br>• Hacer una revisión del caso para conocer el estado del caso actual, procesos por los que ha pasado el caso, quejas que ha presentado el cliente, preguntas frecuentes del cliente y compromisos pendientes.<br>• Colocar la información en <strong>«Nota del cliente»</strong> dentro de la gestión.<br><br><strong>Si es parte de los seguimientos periódicos:</strong><br>• Leer las últimas notas del proceso para revisar información proporcionada y actualizaciones.<br>• Si el caso ya está enviado a USCIS: revisar los recibos iniciales en la página de USCIS para detectar posibles actualizaciones.<br>• Revisar pendientes o acuerdos de las últimas interacciones.<br>• Revisar escalaciones pendientes.<br><br>• Si se requieren revisar recibos o formatos, se deben de buscar en la carpeta <strong>Recibos y notificaciones de USCIS</strong>.<br>• Se pueden enviar los documentos del cliente si es que los solicita:<br>&nbsp;&nbsp;– BIOMÉTRICOS<br>&nbsp;&nbsp;– RECIBOS<br>&nbsp;&nbsp;– IDEN TO GO<br>&nbsp;&nbsp;– PRIMA FACIE<br><br>En dado caso que no le permita enviar los documentos por medio del CRM, se puede enviar un mensaje en Slack en el grupo <strong>Preguntas Customer Care</strong> para pedir apoyo en enviar los documentos al cliente. (Se debe de adjuntar el <strong>nombre completo del cliente, documento del cliente y correo electrónico</strong>.)<br><br>• Colocación de notas del área: ver <strong>Estructura de notas en CRM</strong> (Customer Care)."}]},{"type":"steps","label":"Flujo de llamada","items":[{"n":"1","c":"gold","t":"Saludo corporativo","d":"<strong>«Buenos días/tardes/noches. ¿Es usted [nombre completo del cliente]? Le habla [tu nombre completo] de The Mendoza Law Firm, su agente personal.»</strong><br><br><strong>Candados de seguridad (filtros de identidad)</strong><br><strong>«Le confirmaré los primeros 4 dígitos de su número de cliente [número de cliente], ¿puede usted confirmarme los últimos 4?»</strong><br>Esperar y confirmar los dígitos.<br>Si el cliente no los puede proporcionar, podemos:<br>• Pedirle su fecha de nacimiento<br>• Teléfono registrado, correo electrónico o dirección física"},{"n":"2","c":"gold","t":"Motivo de la llamada","d":"<strong>«El motivo de mi llamada el día de hoy es darle actualizaciones de su proceso…»</strong>"},{"n":"3","c":"gold","t":"Asistencia adicional","d":"<strong>«¿Tiene alguna duda o hay algo más en lo que lo podemos apoyar el día de hoy?»</strong>"},{"n":"4","c":"gold","t":"Agendar próximo contacto","d":"• Agendar llamada de seguimiento en un mes o dos meses, dependiendo de las necesidades del cliente.<br>• Acordar fecha y horario con el cliente (siempre en su zona horaria)."},{"n":"5","c":"gold","t":"Despedida corporativa","d":"<strong>«Entonces, nuestro próximo contacto será [fecha y hora del contacto]. Gracias por haber contestado mi llamada, le atendió [tu nombre] de The Mendoza Law Firm. Que tenga un excelente día, Sr./Sra. [Apellido del cliente].»</strong>"},{"n":"6","c":"gold","t":"Documentación en CRM","d":"Reason for the call: Case status<br>Stage:<br>Outcome:<br>Client feeling:<br>Next appointment:<br>CN or DoB:"},{"n":"7","c":"gold","t":"Documentación en plataforma","d":"• <strong>Registrar gestión:</strong> llenar la información que corresponda al proceso.<br>• <strong>Guardar gestión.</strong>"}]},{"type":"acc","label":"Plantilla de escalación Tier 1","tag":"gold","tl":"Plantilla","body":[{"type":"speech","text":"ESCALACIÓN CS | (AREA)<br>Case ID:<br>Cliente:<br>Motivo: [describir el motivo de la escalación]<br>Acción requerida:<br>Prioridad: [Regular / Urgente]<br>Responsable: @ [nombre o usuario]"}]},{"type":"rules","label":"Emergencias","color":"red","items":["<strong>File request</strong> — <button class=\"pc\" onclick=\"go('m_file')\">ver protocolo</button>","<strong>Talk to MGM</strong> (el cliente quiere hablar con MGM) — <button class=\"pc\" onclick=\"go('e_bar')\">ver protocolo</button>","<strong>Threatens to sue</strong> (amenaza con demandar) — <button class=\"pc\" onclick=\"go('e_bar')\">ver protocolo</button>","<strong>Bar complaint</strong> — <button class=\"pc\" onclick=\"go('e_bar')\">ver protocolo</button>","<strong>Bar number</strong> — <button class=\"pc\" onclick=\"go('e_bar')\">ver protocolo</button>","<strong>Bad review in social media</strong> (comentarios negativos en redes) — <button class=\"pc\" onclick=\"go('e_bar')\">ver protocolo</button>","<strong>Detenidos</strong> — <button class=\"pc\" onclick=\"go('e_det')\">ver protocolo</button> · <strong>corte</strong> — <button class=\"pc\" onclick=\"go('m_file')\">ver File Request</button> · <strong>clientes muy molestos</strong> — <button class=\"pc\" onclick=\"go('t_vdpc')\">ver VDPC</button>"]},{"type":"acc","label":"Reporte File Request","tag":"gold","tl":"Plantilla","body":[{"type":"speech","text":"REPORTE FILE REQUEST<br>Nombre del cliente:<br>Motivo de la solicitud:<br>Método de entrega:<br>Correo electrónico:<br>Número de teléfono:<br>Fecha de la audiencia y/o comparecencia ante el tribunal:<br>Abogado Externo (Nombre/Email):<br>Fecha límite para presentar la documentación:<br>Preocupaciones o problemas del cliente:<br>Llamada con la abogada Mariana:"}]}]}},
r_ch:{"id":"r_ch","label":"Rutina operativa — Chat Request","icon":"◷","color":"violet","content":{"title":"Rutina operativa — Chat Request","icon":"◷","color":"violet","nolib":true,"intro":"Lo que debes tener abierto y hacer en cada turno en Chat Request: plataformas, Espacio de tareas del CRM, Slack, gestión de tareas, flujo de llamada y emergencias.","secs":[{"type":"steps","label":"Plataformas operativas que deben tener abiertas","items":[{"n":"1","c":"blue","t":"Portal de asistencia","d":"En el portal de asistencia se debe registrar los <strong>ingresos, breaks, lunch y salidas</strong>.<br><a href='https://script.google.com/a/macros/supportmendoza.com/s/AKfycbyQQieC30-hQ-lVU5f0VoNzW8UHGb0vqbcSj_9LpOgy4pxkdm_iTqG2NFgve6WpkkLO/exec' target='_blank' style='color:var(--gold)'>Abrir el Portal de asistencia</a>"},{"n":"2","c":"blue","t":"8x8 Work","d":"Aplicación del sistema telefónico."},{"n":"3","c":"violet","t":"Espacio de tareas","d":"<a href='https://crm.kase.cloud/my-tasks' target='_blank' style='color:var(--gold)'>Abrir el Espacio de tareas (crm.kase.cloud/my-tasks)</a><br>Dentro del CRM están las escalaciones de otras áreas hacia Customer Service.<br>Al ingresar debes filtrarlas como <strong>«todas»</strong> para visualizar la lista completa.<br><br>Están divididas por categorías:<br>• Clientes Detenidos<br>• Queja de Cliente Molesto<br>• Pago<br>• Información del Caso<br>• Dudas e información de PC<br>• Dudas de documentación<br>• CL solicita asesoría legal<br>• Otra Solicitud<br>• No outcome"},{"n":"4","c":"blue","t":"Slack","d":"En la aplicación de Slack se debe de tener los siguientes grupos:<br>• <strong>CDMX - OFICINA:</strong> Para aviso de lunch, WC, regresos de WC y salidas a tomar agua.<br>• <strong>Preguntas Chat Request:</strong> Para solicitar ayuda sobre escalaciones de casos, dudas sobre procesos, ayuda con la gestión de la agenda.<br>• <strong>Tier 1:</strong> Para realizar escalaciones (ver plantilla abajo)."},{"n":"5","c":"blue","t":"CRM","d":"En la sección de <strong>Tareas</strong> del CRM:<br>• Filtrar por <strong>«todas»</strong>.<br>• Se pueden asignar las pendientes de asignación.<br>• Una vez se comience a trabajar en el caso, es importante cambiar el Status a <strong>In progress</strong>.<br>• Una vez asignada la tarea, al abrirla, el CRM coloca el link del perfil del cliente en el apartado <strong>Related to</strong>.<br>• En la sección izquierda de la tarea aparece el motivo de la escalación.<br>• Es importante verificar en el perfil del cliente si este se ha vuelto a comunicar con nosotros después de recibir la escalación por parte de otra área. Revisar el árbol de decisiones para checar el procedimiento.<br>• Si no se ha contactado, se tiene que revisar el motivo de la escalación y encontrar una solución <strong>antes de llamarle al cliente</strong>.<br>• Una vez concluido el contacto, es importante dejar nota en la tarea y en el perfil del cliente: en la parte izquierda, en el botón <strong>«Add note»</strong>, llenamos la información de la nota y al final seleccionamos <strong>«Also add to the case»</strong> y publicamos la nota.<br>• En caso de que el cliente no conteste, se le llama <strong>2 veces</strong>, se deja una nota explicando el motivo del contacto y se envía mensaje de texto al cliente. Revisar templates.<br><br>• Si se requieren revisar recibos o formatos, se deben de buscar en la carpeta <strong>Recibos y notificaciones de USCIS</strong>.<br>• Se pueden enviar los documentos del cliente si es que los solicita:<br>&nbsp;&nbsp;– BIOMÉTRICOS<br>&nbsp;&nbsp;– RECIBOS<br>&nbsp;&nbsp;– IDEN TO GO<br>&nbsp;&nbsp;– PRIMA FACIE<br><br>En dado caso que no le permita enviar los documentos por medio del CRM, se puede enviar un mensaje en Slack en el grupo <strong>Preguntas Chat Request</strong> para pedir apoyo en enviar los documentos al cliente. (Se debe de adjuntar el <strong>nombre completo del cliente, documento del cliente y correo electrónico</strong>.)<br><br>• Colocación de notas del área: ver <strong>Estructura de notas en CRM</strong> (Chats)."}]},{"type":"acc","label":"Gestión de tareas — campos de la tarea","tag":"violet","tl":"Referencia","body":[{"type":"rules","items":["<strong>Details — Related to:</strong> nombre del cliente","<strong>Practice Area:</strong> VAWA","<strong>Status — Not started:</strong> estatus inicial","<strong>Status — In progress:</strong> ponerlo al iniciar la gestión de la tarea","<strong>Status — In validation:</strong> no se utiliza","<strong>Status — Completed:</strong> al completar la tarea. Si no contesta el cliente se le llama 2 veces y se marca como completada","<strong>Priority, Task type y Tags:</strong> no mover","<strong>Outcome:</strong> categoría · <strong>Sub-outcome:</strong> no mover","<strong>People — Assignee:</strong> asignación de la tarea. Buscar tu nombre dentro del menú desplegable","<strong>Unassigned, Responsible, Offer to people y Offer to team:</strong> no mover"]}]},{"type":"steps","label":"Flujo de llamada","items":[{"n":"1","c":"gold","t":"Saludo corporativo","d":"<strong>«Buenos días/tardes/noches. ¿Es usted [nombre completo del cliente]? Le habla [tu nombre completo] de The Mendoza Law Firm.»</strong><br><br><strong>Candados de seguridad (filtros de identidad)</strong><br><strong>«Le confirmaré los primeros 4 dígitos de su número de cliente [número de cliente], ¿puede usted confirmarme los últimos 4?»</strong><br>Esperar y confirmar los dígitos.<br>Si el cliente no los puede proporcionar, podemos:<br>• Pedirle su fecha de nacimiento<br>• Teléfono registrado, correo electrónico o dirección física"},{"n":"2","c":"gold","t":"Motivo de la llamada","d":"<strong>«El motivo de mi llamada el día de hoy es porque usted solicitó asistencia sobre su proceso [mencionar el motivo del contacto]…»</strong>"},{"n":"3","c":"gold","t":"Asistencia adicional","d":"<strong>«¿Tiene alguna duda o hay algo más en lo que lo podemos apoyar el día de hoy?»</strong>"},{"n":"4","c":"gold","t":"Despedida corporativa","d":"<strong>«Gracias por haber contestado mi llamada, le atendió [tu nombre] de The Mendoza Law Firm. Que tenga un excelente día, Sr./Sra. [Apellido del cliente].»</strong>"},{"n":"5","c":"gold","t":"Documentación en CRM","d":"<strong>Título:</strong> Outbound call / Case status<br>(o: Incoming Call / Payment | Emergency | Documents)<br><strong>Cuerpo:</strong><br>Reason: [motivo principal de la interacción]<br>Solution: [acciones realizadas o información proporcionada]<br>Behavior: [Calm / Frustrated / Upset / etc.]<br>CN: [Confirmed o Not Confirmed]<br>Internal note: [incluir solo cuando sea necesario]"}]},{"type":"acc","label":"Plantilla de escalación Tier 1","tag":"gold","tl":"Plantilla","body":[{"type":"speech","text":"ESCALACIÓN CS | (AREA)<br>Case ID:<br>Cliente:<br>Motivo: [describir el motivo de la escalación]<br>Acción requerida:<br>Prioridad: [Regular / Urgente]<br>Responsable: @ [nombre o usuario]"}]},{"type":"rules","label":"Emergencias","color":"red","items":["<strong>File request</strong> — <button class=\"pc\" onclick=\"go('m_file')\">ver protocolo</button>","<strong>Talk to MGM</strong> (el cliente quiere hablar con MGM) — <button class=\"pc\" onclick=\"go('e_bar')\">ver protocolo</button>","<strong>Threatens to sue</strong> (amenaza con demandar) — <button class=\"pc\" onclick=\"go('e_bar')\">ver protocolo</button>","<strong>Bar complaint</strong> — <button class=\"pc\" onclick=\"go('e_bar')\">ver protocolo</button>","<strong>Bar number</strong> — <button class=\"pc\" onclick=\"go('e_bar')\">ver protocolo</button>","<strong>Bad review in social media</strong> (comentarios negativos en redes) — <button class=\"pc\" onclick=\"go('e_bar')\">ver protocolo</button>","<strong>Detenidos</strong> — <button class=\"pc\" onclick=\"go('e_det')\">ver protocolo</button> · <strong>corte</strong> — <button class=\"pc\" onclick=\"go('m_file')\">ver File Request</button> · <strong>clientes muy molestos</strong> — <button class=\"pc\" onclick=\"go('t_vdpc')\">ver VDPC</button>"]},{"type":"acc","label":"Reporte File Request","tag":"gold","tl":"Plantilla","body":[{"type":"speech","text":"REPORTE FILE REQUEST<br>Nombre del cliente:<br>Motivo de la solicitud:<br>Método de entrega:<br>Correo electrónico:<br>Número de teléfono:<br>Fecha de la audiencia y/o comparecencia ante el tribunal:<br>Abogado Externo (Nombre/Email):<br>Fecha límite para presentar la documentación:<br>Preocupaciones o problemas del cliente:<br>Llamada con la abogada Mariana:"}]}]}},
r_cs:{"id":"r_cs","label":"Rutina operativa del agente","icon":"◷","color":"blue","content":{"title":"Rutina operativa del agente","icon":"◷","color":"blue","nolib":true,"intro":"Lo que debes tener abierto y hacer en cada turno como Asesor CS: plataformas, estados del 8x8, grupos de Slack, uso del CRM y qué situaciones se tratan como emergencia.","secs":[{"type":"steps","label":"Plataformas operativas que deben tener abiertas","items":[{"n":"1","c":"blue","t":"Portal de asistencia","d":"En el portal de asistencia se debe registrar los <strong>ingresos, breaks, lunch y salidas</strong>.<br><a href='https://script.google.com/a/macros/supportmendoza.com/s/AKfycbyQQieC30-hQ-lVU5f0VoNzW8UHGb0vqbcSj_9LpOgy4pxkdm_iTqG2NFgve6WpkkLO/exec' target='_blank' style='color:var(--gold)'>Abrir el Portal de asistencia</a>"},{"n":"2","c":"blue","t":"8x8 Work","d":"Aplicación del sistema telefónico."},{"n":"3","c":"blue","t":"Contact Center Agent Workspace","d":"Cambia tu estado desde <strong>Change status</strong>:<br>• <strong>Available:</strong> En línea para llamadas Inbound.<br>• <strong>Break:</strong> Permite dejar de recibir llamadas para realizar actividades como lunch, break o acudir al WC.<br>• <strong>Work Offline:</strong> Permite dejar de recibir llamadas para realizar actividades posteriores a la llamada, como completar notas pendientes, participar en briefs o sesiones de feedback con un TL.<br><br>Una vez terminado tu día laboral debes de salir de la aplicación por medio de <strong>Log Out</strong>."},{"n":"4","c":"blue","t":"Slack","d":"En la aplicación de Slack se debe de tener los siguientes grupos:<br>• <strong>CDMX - OFICINA:</strong> Para aviso de lunch, WC, regresos de WC y salidas a tomar agua.<br>• <strong>Preguntas Inbound:</strong> Para solicitar ayuda sobre situaciones que se presenten en llamada y que tengas dudas de dónde escalar o requieras apoyo.<br>• <strong>Fallas Técnicas:</strong> Para reportar si tienes alguna falla: se cortó la llamada, no contestó, se te fue el internet, el cliente pidió tiempo y no regresó, etc.<br>• <strong>Tier 1:</strong> Para realizar escalaciones (ver plantilla abajo)."},{"n":"5","c":"blue","t":"CRM","d":"En la plataforma CRM se deben de realizar las búsquedas de los casos una vez que se tiene la llamada de Inbound y el motivo identificado.<br>• Si se requieren revisar recibos o formatos, se deben de buscar en la carpeta <strong>Recibos y notificaciones de USCIS</strong>.<br>• Se pueden enviar los documentos del cliente si es que los solicita:<br>&nbsp;&nbsp;– BIOMÉTRICOS<br>&nbsp;&nbsp;– RECIBOS<br>&nbsp;&nbsp;– IDEN TO GO<br>&nbsp;&nbsp;– PRIMA FACIE<br><br>En dado caso que no le permita enviar los documentos por medio del CRM, se puede enviar un mensaje en Slack en el grupo <strong>Preguntas Inbound</strong> para pedir apoyo en enviar los documentos al cliente. (Se debe de adjuntar el <strong>nombre completo del cliente, documento del cliente y correo electrónico</strong>.)<br><br>• Colocación de notas del área: ver <strong>Estructura de notas en CRM</strong> (Inbound)."}]},{"type":"steps","label":"Flujo de llamada","items":[{"n":"1","c":"gold","t":"Saludo corporativo","d":"<strong>«Buenos días/tardes/noches. Gracias por comunicarse a The Mendoza Law Firm; le atiende [tu nombre completo].»</strong><br><br><strong>Candados de seguridad (filtros de identidad)</strong><br>Solicitar y verificar al menos dos filtros de seguridad antes de proporcionar cualquier información del caso:<br>1. Nombre completo del titular del caso<br>2. Número de cliente o fecha de nacimiento<br>3. Teléfono registrado, correo electrónico o dirección física"},{"n":"2","c":"gold","t":"Motivo de la llamada","d":"<strong>«¿En qué le puedo ayudar el día de hoy?»</strong>"},{"n":"3","c":"gold","t":"Parafraseo de confirmación","d":"<strong>«Entonces, si he entendido bien, usted necesita… ¿es correcto?»</strong>"},{"n":"4","c":"gold","t":"Solicitar 3 minutos para verificar, cuando sea necesario","d":"Ver el detalle en el Flujo base — llamada perfecta."},{"n":"5","c":"gold","t":"Documentación en CRM","d":"Durante esos 2 minutos:<br>Completar el registro de la interacción en el CRM con la siguiente estructura:<br><strong>Reason:</strong><br><strong>Solution:</strong><br><strong>Behavior:</strong><br><strong>CN o DoB:</strong>"},{"n":"6","c":"gold","t":"Despedida corporativa","d":"<strong>«Gracias por haberse comunicado a The Mendoza Law Firm, le atendió [tu nombre]. Que tenga un excelente día, Sr./Sra. [Apellido del cliente].»</strong>"}]},{"type":"acc","label":"Plantilla de escalación Tier 1","tag":"gold","tl":"Plantilla","body":[{"type":"speech","text":"ESCALACIÓN CS | (AREA)<br>Case ID:<br>Cliente:<br>Motivo: [describir el motivo de la escalación]<br>Acción requerida:<br>Prioridad: [Regular / Urgente]<br>Responsable: @ [nombre o usuario]"}]},{"type":"rules","label":"Emergencias","color":"red","items":["<strong>File request</strong> — <button class=\"pc\" onclick=\"go('m_file')\">ver protocolo</button>","<strong>Talk to MGM</strong> (el cliente quiere hablar con MGM) — <button class=\"pc\" onclick=\"go('e_bar')\">ver protocolo</button>","<strong>Threatens to sue</strong> (amenaza con demandar) — <button class=\"pc\" onclick=\"go('e_bar')\">ver protocolo</button>","<strong>Bar complaint</strong> — <button class=\"pc\" onclick=\"go('e_bar')\">ver protocolo</button>","<strong>Bar number</strong> — <button class=\"pc\" onclick=\"go('e_bar')\">ver protocolo</button>","<strong>Bad review in social media</strong> (comentarios negativos en redes) — <button class=\"pc\" onclick=\"go('e_bar')\">ver protocolo</button>","<strong>Detenidos</strong> — <button class=\"pc\" onclick=\"go('e_det')\">ver protocolo</button> · <strong>corte</strong> — <button class=\"pc\" onclick=\"go('m_file')\">ver File Request</button> · <strong>clientes muy molestos</strong> — <button class=\"pc\" onclick=\"go('t_vdpc')\">ver VDPC</button>"]},{"type":"acc","label":"Reporte File Request","tag":"gold","tl":"Plantilla","body":[{"type":"speech","text":"REPORTE FILE REQUEST<br>Nombre del cliente:<br>Motivo de la solicitud:<br>Método de entrega:<br>Correo electrónico:<br>Número de teléfono:<br>Fecha de la audiencia y/o comparecencia ante el tribunal:<br>Abogado Externo (Nombre/Email):<br>Fecha límite para presentar la documentación:<br>Preocupaciones o problemas del cliente:<br>Llamada con la abogada Mariana:"}]}]}},
t_esc_tl:{"id":"t_esc_tl","label":"Escalaciones interdepartamentales y emergencias","icon":"⇪","color":"red","content":{"title":"13. Escalaciones interdepartamentales y emergencias","icon":"⇪","color":"red","intro":"El asesor es el primer filtro para una escalación a otra área. Si el cliente ya fue escalado y no recibió respuesta, insiste o se encuentra muy molesto, el TL debe realizar una escalación directa con el área para canalizar la situación.","secs":[{"type":"acc","label":"13.1 File Request","tag":"gold","tl":"Escalación","body":[{"type":"rules","items":["Cuando el cliente solicita su expediente completo, el asesor recopila la información necesaria y notifica al TL.","El tiempo estándar indicado en la fuente para entrega digital es de <strong>3 a 5 días hábiles</strong>; la entrega física puede tardar más.","Si existe urgencia, debe reportarse a <strong>Management</strong> para solicitar atención expedita.","El asesor debe ofrecer/agendar llamada con <strong>Atty. Mariana</strong> como parte del protocolo.","Si la solicitud proviene de un abogado externo, preguntar el nombre del abogado y para qué requiere el expediente.","El TL debe elaborar el reporte con el formato de TL CS, enviarlo al grupo de WhatsApp <strong>“TL CS”</strong> para validación de Management y esperar autorización antes de publicarlo en <strong>Slack TIER 2</strong>. También debe dejar nota en CRM y registrar la solicitud en la <strong>Sheet de File Request</strong>.","Si el cliente solicita su declaración y el caso ya fue enviado a USCIS, la fuente indica ofrecer también CRWBW."]},{"type":"speech","text":"<strong>Información del reporte File Request</strong><br>Cliente: [Nombre del cliente.]<br>Motivo: [Razón de la solicitud.]<br>Forma de envío: [Digital o física.]<br>Destino: [Correo electrónico o dirección.]<br>Contacto: [Número de teléfono.]<br>Fechas críticas: [Fecha de audiencia/corte y fecha límite de documentación.]<br>Contexto: [Molestia o preocupación del cliente.]<br>Llamada con Atty. Mariana: [Sí / No; fecha y hora.]<br>Notas adicionales: [Información relevante.]"}]},{"type":"acc","label":"13.2 Copia de rejection o decisión","tag":"gold","tl":"Escalación","body":[{"type":"rules","items":["Tratar la solicitud como File Request.","Antes, verificar si el cliente ya tuvo una llamada con un abogado de la firma para que le explique el documento.","Si no la tuvo, escalar con Callbacks para una llamada con <strong>Atty. Susana o Atty. Jesus</strong>; la llamada con Mariana puede omitirse.","Realizar el reporte y agregarlo a la Sheet."]}]},{"type":"acc","label":"13.3 Amenaza de Bar Complaint o acción legal","tag":"red","tl":"Emergencia","body":[{"type":"steps","items":[{"n":"1","c":"red","t":"Asesor","d":"El asesor contiene al cliente y reporta la situación al TL.<br>Identificar por qué quiere presentar la queja o demanda, qué necesita y qué solución podría atender la preocupación."},{"n":"2","c":"red","t":"TL","d":"El TL toma la llamada para revisar la situación y las posibles soluciones.<br>Si es posible, agendar con Atty. Mariana o solicitar Callback de emergencia."},{"n":"3","c":"red","t":"Reporte","d":"Elaborar reporte con contexto del caso y compromisos explícitos con tiempos de cumplimiento.<br>Enviar el reporte a Management en <strong>“TL CS”</strong> y esperar confirmación antes de publicarlo en <strong>Slack TIER 2</strong>.<br>Dejar nota del reporte en CRM."}]}]},{"type":"acc","label":"13.4 Solicitud de Bar Number de MGM u otro abogado","tag":"red","tl":"Emergencia","body":[{"type":"steps","items":[{"n":"1","c":"red","t":"Asesor","d":"El asesor contiene al cliente y reporta al TL.<br>Preguntar por qué requiere el número y qué necesita. No negar la información; explicar que puede agendarse una llamada con un abogado para revisar la solicitud."},{"n":"2","c":"red","t":"TL","d":"El TL toma la llamada y evalúa posibles soluciones.<br>Si es posible, agendar con Atty. Mariana o solicitar Callback de emergencia."},{"n":"3","c":"red","t":"Reporte","d":"Realizar reporte con contexto y compromisos explícitos; enviar a Management, esperar autorización antes de publicar en TIER 2 y dejar nota en CRM."}]}]},{"type":"acc","label":"13.5 Cliente quiere consultar a otro abogado","tag":"red","tl":"Emergencia","body":[{"type":"steps","items":[{"n":"1","c":"red","t":"Asesor","d":"Confirmar si ya cuenta con otro abogado o apenas desea consultar; si ya cuenta con representación, solicitar nombres.<br>Preguntar el motivo, qué necesita y qué solución puede ofrecerse."},{"n":"2","c":"red","t":"TL","d":"El TL toma la llamada y evalúa si corresponde agendar con Mariana, otro abogado o solicitar Callback de emergencia."},{"n":"3","c":"red","t":"Reporte","d":"Documentar contexto y compromisos; enviar a Management, esperar confirmación para publicar en TIER 2 y dejar nota en CRM."}]}]},{"type":"acc","label":"13.6 Amenaza con comentarios negativos en redes","tag":"red","tl":"Emergencia","body":[{"type":"steps","items":[{"n":"1","c":"red","t":"Asesor","d":"El asesor contiene al cliente y reporta al TL.<br>Identificar el motivo de la amenaza, qué necesita el cliente y posibles soluciones."},{"n":"2","c":"red","t":"TL","d":"El TL elabora el reporte con contexto y compromisos explícitos."},{"n":"3","c":"red","t":"Reporte","d":"Reportar a Management en <strong>“TL CS”</strong> y esperar confirmación antes de publicar en TIER 2.<br>Dejar nota en CRM."}]}]},{"type":"acc","label":"13.7 Cliente quiere hablar con MGM","tag":"red","tl":"Emergencia","body":[{"type":"steps","items":[{"n":"1","c":"red","t":"Asesor","d":"El asesor contiene al cliente y ofrece una llamada con Atty. Mariana.<br>Preguntar por qué desea hablar con MGM y qué necesita.<br><strong>No negar el contacto con MGM.</strong> Explicar que la firma cuenta con un abogado asignado que puede atender preguntas del caso."},{"n":"2","c":"red","t":"Si acepta","d":"Agendar con Mariana o solicitar Callback de emergencia; registrar todo en la nota."},{"n":"3","c":"red","t":"Si no acepta y exige hablar con MGM","d":"Explicar que la situación será reportada, <strong>sin prometer que MGM se comunicará</strong>."},{"n":"4","c":"red","t":"Reporte","d":"El TL elabora el reporte, lo envía a Management y espera autorización antes de publicarlo en TIER 2. Dejar nota en CRM."}]}]},{"type":"acc","label":"13.8 Estructura del reporte TL CS","tag":"gold","tl":"Plantilla","body":[{"type":"speech","text":"Client: [Nombre del cliente.]<br>Reason: [Motivo de la solicitud, inconformidad, contexto del caso y detalles relevantes.]<br>Solution: [Explicación y contención brindada, acciones realizadas, escalamiento y compromisos.]<br>Type of case: [Tipo de caso.]<br>Stage: [Etapa del caso.]<br>Case open since: [Fecha de apertura del caso.]<br>Payment balance: [Balance de pago.]"}]}]}},

content:{title:"Agents T2 — recibir una escalación",icon:"⇡",color:"gold",draft:true,

fl_ib:["En CADA llamada entrante, sin excepción.",["Son 11 pasos y ninguno se omite.","Sin al menos 2 filtros de seguridad no se da información del caso.","Lee las últimas 3 notas del CRM antes de responder; documenta y escala en Tier 1 antes de despedirte."]],

/* ───── Estado: área seleccionada ───── */
let AREA=null; // 'cs' | 'cc' | 'ch' | 't2' | 'all'
/* La pantalla principal siempre es el selector de área */
function setArea(a){AREA=a;try{localStorage.setItem('cs_portal_area',a)}catch(e){}stack=['home'];renderChip();render()}
function vis(id){
  if(!AREA||AREA==='all')return !!(NODES[id]||ITEMS[id])||['lib','areas','gate'].includes(id)||id.startsWith('area_');
  if(NODES[id]){const n=NODES[id];if(n.areas&&!n.areas.includes(AREA))return false;return n.opts.some(o=>vis(o.go))||!!(n.first&&vis(n.first.go))}
  if(ITEMS[id])return (USE[id]||ALL).includes(AREA);
  return ['lib','areas','gate'].includes(id)||id.startsWith('area_');
}
function renderChip(){
  const w=document.getElementById('achipWrap');
  if(!AREA){w.innerHTML='';return}
  const A=AREAS[AREA];
  w.innerHTML=A?`<button class="achip c-${A.c}" onclick="home()" title="Selecciona área"><span class="ad">${A.i}</span><span class="al">${A.n}</span><small>Cambiar</small></button>`
   :`<button class="achip c-gold" onclick="home()" title="Selecciona área"><span class="ad">∗</span><span class="al">Todas las áreas</span><small>Cambiar</small></button>`;
}

/* ───── Navegación ───── */
let stack=['home'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function labelOf(id){if(id==='gate')return'Selecciona área';if(id==='areas')return'Las 4 áreas';if(id==='lib')return'Biblioteca de speeches';if(id==='guia')return'Guía de inicio';if(id==='glosario')return'Glosario';if(id==='enlaces')return'Enlaces rápidos';if(id.startsWith('area_'))return AREAS[id.slice(5)].n;return NODES[id]?NODES[id].label:(ITEMS[id]?ITEMS[id].label:id)}
function iconOf(id){return NODES[id]?'→':(ITEMS[id].icon||'•')}
function colorOf(id){if(NODES[id])return NODES[id].emg?'red':'gold';const it=ITEMS[id];return it.emg||it.content.emg?'red':(COL[it.color]||'gold')}
function go(id){const k=stack.indexOf(id);if(k>=0)stack=stack.slice(0,k+1);else stack.push(id);render()}
function back(){if(stack.length>1)stack.pop();render()}
function home(){AREA=null;stack=['home'];renderChip();render()}

function pathHTML(){
  if(stack.length<2)return'';
  return`<div class="path"><button class="back" onclick="back()">← Volver</button>${stack.map((id,k)=>k===stack.length-1?`<span class="cur">${esc(labelOf(id))}</span>`:`<button class="pc" onclick="go('${id}')">${esc(labelOf(id))}</button><span class="sep">›</span>`).join('')}</div>`;
}
function render(){
  const mn=document.getElementById('mn');
  let id=stack[stack.length-1],body;
  if(!AREA&&!['areas','guia','glosario','enlaces'].includes(id)&&!id.startsWith('area_')){body=renderGate(true)}
  else if(id==='guia')body=renderGuia();
  else if(id==='glosario')body=renderGlos();
  else if(id==='enlaces')body=renderLinks();
  else if(id==='gate')body=renderGate(false);
  else if(id==='areas')body=renderOverview();
  else if(id==='lib')body=renderLib();
  else if(id.startsWith('area_'))body=renderArea(id.slice(5));
  else if(NODES[id])body=renderNode(NODES[id],id);
  else body=renderItem(id);
  mn.innerHTML=`<div class="wrap">${(!AREA&&stack.length<2)?'':pathHTML()}${body}</div>`;
  if(ITEMS[id]){glossify(mn.querySelector('.ess'));mn.querySelectorAll('.det .dc').forEach(glossify)}
  if(id==='guia')glossify(mn.querySelector('.gsteps'));
  closePop();window.scrollTo(0,0);
  try{const h=stack.length>1?stack[stack.length-1]:'';history.replaceState(null,'',h?'#'+h:location.pathname+location.search)}catch(e){}
}

function isNeg(r){const t=r.replace(/<[^>]+>/g,'').trim().toLowerCase();return /^(nunca|no |no,|prohibido|critical)/.test(t)}
let spk=0;const SPEECH={};
function speechHTML(t){const k='s'+(spk++);SPEECH[k]=t;return`<div class="sp">${t}<br><button class="copy" onclick="copySpeech('${k}')">Copiar speech</button></div>`}
function rulesHTML(items,c,neg){return items.map(r=>{const n=neg||isNeg(r);return`<div class="rl c-${c} ${n?'neg':''}"><b>${n?'✕':'✓'}</b><span>${r}</span></div>`}).join('')}
function stepsHTML(items){return`<div class="steps">${items.map(s=>{const c=COL[s.c]||'blue';return`<div class="st c-${c}"><div class="sn">${s.n}</div><div><div class="stt">${s.t}</div><div class="std">${s.d}</div></div></div>`}).join('')}</div>`}
const TYPE={steps:{i:'1·2',k:'Paso a paso'},rules:{i:'✓',k:'Puntos a cuidar'},speech:{i:'❝',k:'Qué decir'},acc:{i:'+',k:'Complemento'}};
function secHTML(s,open){
  let c='gold',body='',kind=TYPE[s.type].k,ic=TYPE[s.type].i,count='';
  if(s.type==='steps'){c='blue';body=stepsHTML(s.items);count=` · ${s.items.length} pasos`}
  else if(s.type==='rules'){c=s.color==='red'?'red':(COL[s.color]||'gold');body=rulesHTML(s.items,c,s.color==='red');if(s.color==='red'){kind='Atención';ic='✕'}}
  else if(s.type==='speech'){c='gold';body=speechHTML(s.text)}
  else if(s.type==='acc'){c=COL[s.tag]||'teal';kind=s.tl||kind;body=s.body.map(b=>b.type==='speech'?speechHTML(b.text):b.type==='rules'?rulesHTML(b.items,c):b.type==='steps'?stepsHTML(b.items):'').join('')}
  return`<div class="dc c-${c} ${open?'op':''}"><button class="db" onclick="this.parentElement.classList.toggle('op')"><span class="di">${ic}</span><span><span class="dt">${s.label||kind}</span><span class="dk">${kind}${count}</span></span><span class="ar">▼</span></button><div class="dbody">${body}</div></div>`;
}
function appliesHTML(id){
  const u=USE[id]||ALL;
  if(!u.length)return`<div class="applies">Aplica a:<span class="tag c-red">Solo TL</span></div>`;
  return`<div class="applies">Aplica a:${AK.map(k=>{const A=AREAS[k],on=u.includes(k);return`<span class="tag c-${A.c} ${on?'':'off'}">${A.n}</span>`}).join('')}</div>`;
}
function secVis(x){return !x.areas||!AREA||AREA==='all'||x.areas.includes(AREA)}
function renderItem(id){
  const it=ITEMS[id];if(!it)return renderNode(NODES.home,'home');
  const c=it.content,col=colorOf(id),e=ESS[id],isE=it.emg||c.emg;
  let h=`<div class="ph c-${col}"><div class="oi">${c.icon||'•'}</div><div><h1 class="pt">${c.title}</h1>${e?`<div class="pw"><b>Cuándo:</b> ${e[0]}</div>`:''}</div></div>`;
  h+=appliesHTML(id);
  if(c.draft)h+=`<p style="margin-bottom:16px"><span class="draft">✎ BORRADOR · contenido por validar</span></p>`;
  if(isE)h+=`<div class="ebanner">⚠ Emergencia — Notificar al TL de inmediato antes de terminar la llamada.</div>`;
  h+=`<div class="pl"><div class="pl-side">`;
  if(e)h+=`<div class="ess"><div class="ess-h">★ Lo esencial</div>${e[1].map((k,n)=>`<div class="ess-i"><i>${n+1}</i><span>${k}</span></div>`).join('')}</div>`;
  const nx=(NEXT[id]||(isE?NEXT._emg:(id.startsWith('m_')||id.startsWith('fl_')?NEXT._call:[]))).filter(x=>x!==id&&vis(x));
  if(nx.length)h+=`<div class="next"><div class="dh">¿Y después?</div><div class="nxl">${nx.map(nextBtn).join('')}</div></div>`;
  h+=`</div><div class="pl-main"><div class="dh">Detalle · toca para abrir <button class="xall" onclick="toggleAll(this)">Abrir todo</button></div><div class="det">`;
  if(c.intro)h+=`<div class="dc c-blue"><button class="db" onclick="this.parentElement.classList.toggle('op')"><span class="di">i</span><span><span class="dt">Contexto</span><span class="dk">Antes de empezar</span></span><span class="ar">▼</span></button><div class="dbody"><div class="std">${c.intro}</div></div></div>`;
  c.secs.filter(secVis).forEach((s,k)=>h+=secHTML(s,k===0));
  h+=`</div></div></div>`;
  return h;
}

const LIBCAT=[
 {k:'apertura',t:'Apertura y saludo',d:'Cómo abrir cada tipo de atención: llamada entrante, saliente y remarcación.'},
 {k:'espera',t:'Espera y verificación',d:'Cómo pedir tiempo para revisar el caso y cómo regresar con el cliente.'},
 {k:'motivos',t:'Resolver según el motivo',d:'Speeches por motivo de llamada: estatus, pagos, cancelación, expediente, viaje y más.'},
 {k:'contencion',t:'Contención del cliente molesto',d:'Frases de la metodología VDPC y de atención en segundo nivel.'},
 {k:'sensible',t:'Información sensible y terceros',d:'Qué decir cuando no puedes dar información o quien llama no es el titular.'},
 {k:'emergencias',t:'Emergencias',d:'Scripts mandatorios para detención, citas con ICE y posibles estafas. Avisa al TL de inmediato.'},
 {k:'cierre',t:'Cierre y despedida',d:'Asistencia adicional, registro de la llamada y despedida corporativa.'},
 {k:'plantillas',t:'Plantillas de nota (CRM)',d:'Textos para copiar en el registro. No se leen al cliente.'}
];
function libCat(id,ctx,text){
  const c=(ctx+' ').toLowerCase();
  if(/^\s*(<strong>)?(t[ií]tulo:|escalaci[oó]n cs|reporte)/i.test(text)||/plantilla|estructura de notas|nota de texto|reporte/.test(c))return'plantillas';
  if(id.startsWith('e_'))return'emergencias';
  if(id==='m_abuser'||id==='t_noinfo')return'sensible';
  if(id==='t_vdpc'||id==='t2_recibe')return'contencion';
  if(id.startsWith('fl_')||id==='ch_flow'){
    if(/asistencia adicional|despedida|registro de informaci/.test(c))return'cierre';
    if(/3 minutos|resoluci[oó]n de la duda/.test(c))return'espera';
    if(/motivo/.test(c)&&id!=='fl_ib')return'motivos';
    return'apertura';
  }
  return'motivos';
}
let LIB=null;
function buildLib(){
  const out=[];
  let curA=null;
  const add=(id,ctx,text)=>out.push({id,ctx,text,areas:curA,cat:libCat(id,ctx,text)});
  const walk=(id,secs,parent)=>secs.forEach(x=>{
    if(x.type==='speech')add(id,x.label||parent||'Speech',x.text);
    else if(x.type==='acc')walk(id,x.body,x.label||x.tl);
    else if(x.type==='steps')x.items.forEach(st=>{
      const m=st.d.match(/«[^»]+»/g);if(!m)return;
      m.map(z=>z.replace(/<[^>]+>/g,'')).filter(z=>/[.?!,…]/.test(z)).forEach(z=>add(id,st.t,z));
    });
  });
  Object.keys(ITEMS).filter(id=>!ITEMS[id].content.nolib).forEach(id=>ITEMS[id].content.secs.forEach(x=>{curA=x.areas||null;walk(id,[x])}));
  return out;
}
let libF='all',libQ='';
function renderLib(){
  if(!LIB)LIB=buildLib();
  const strip=t=>t.replace(/<[^>]+>/g,' ').toLowerCase();
  const base=LIB.filter(e=>vis(e.id)&&secVis(e));
  const q=libQ.trim().toLowerCase();
  const shown=base.filter(e=>(libF==='all'||e.cat===libF)&&(!q||strip(e.text+' '+e.ctx+' '+ITEMS[e.id].label).includes(q)));
  const cnt=k=>base.filter(e=>e.cat===k).length;
  const A=AREAS[AREA];
  let h=`<div class="gate-k">${A?A.n:'Todas las áreas'} · Qué decir</div>
  <h1 class="gate-h">Biblioteca de speeches</h1>
  <p class="gate-p">Todo lo que el colaborador debe decir, ordenado por momento de la atención. Cada speech viene de su protocolo: cópialo o abre el protocolo para ver el contexto completo.</p>
  <div class="lib-tools"><input class="lib-q" id="libq" placeholder="Buscar en los speeches…" value="${esc(libQ)}" oninput="libQ=this.value;libRefresh()" aria-label="Buscar speech">
  <button class="lib-chip ${libF==='all'?'on':''}" onclick="libF='all';libRefresh()">Todos<small>${base.length}</small></button>
  ${LIBCAT.filter(c=>cnt(c.k)).map(c=>`<button class="lib-chip ${libF===c.k?'on':''}" onclick="libF='${c.k}';libRefresh()">${c.t}<small>${cnt(c.k)}</small></button>`).join('')}</div><div id="libres">`;
  h+=libBody(shown);
  return h+'</div>';
}
let libM=null;
function libCard(e){
  const k='s'+(spk++);SPEECH[k]=e.text;const col=colorOf(e.id);
  return`<div class="lib-it"><div class="lib-meta"><b>${e.ctx}</b><span class="tag c-${col}">${esc(ITEMS[e.id].label)}</span></div><div class="sp">${e.text}</div><div class="lib-acts"><button class="copy" onclick="copySpeech('${k}')">Copiar speech</button><button class="copy" onclick="go('${e.id}')">Ver protocolo →</button></div></div>`;
}
function libBody(shown){
  if(!shown.length)return`<div class="lib-empty">No hay speeches que coincidan. Prueba otra palabra o elige "Todos".</div>`;
  return LIBCAT.map(c=>{
    const it=shown.filter(e=>e.cat===c.k);if(!it.length)return'';
    let inner;
    if(c.k==='motivos'&&!libQ.trim()){
      const ids=[...new Set(it.map(e=>e.id))];
      if(!ids.includes(libM))libM=null;
      inner=`<div class="mot-grid">${ids.map(id=>{const n=it.filter(e=>e.id===id).length,col=colorOf(id);
        return`<button class="mot c-${col} ${libM===id?'on':''}" onclick="libM=libM==='${id}'?null:'${id}';libRefresh()" aria-expanded="${libM===id}"><span class="oi">${ITEMS[id].icon||'•'}</span><span class="mt">${esc(ITEMS[id].label)}</span><span class="mc">${n} ${n===1?'speech':'speeches'}</span></button>`}).join('')}</div>`+
        (libM?`<div class="lib-list mot-open">${it.filter(e=>e.id===libM).map(libCard).join('')}</div>`:`<p class="mot-hint">Elige un motivo para ver sus speeches.</p>`);
    }else inner=`<div class="lib-list">${it.map(libCard).join('')}</div>`;
    return`<section class="lib-sec" id="lib-${c.k}"><div class="lib-sh"><h2>${c.t}</h2><span>${it.length}</span></div><p class="lib-sd">${c.d}</p>${inner}</section>`;
  }).join('');
}
function libRefresh(){
  const q=document.getElementById('libq'),pos=q?q.selectionStart:0;
  const y=window.scrollY;render();window.scrollTo(0,y);
  const q2=document.getElementById('libq');if(q2&&(libQ||pos)){q2.focus();try{q2.setSelectionRange(pos,pos)}catch(e){}}
}

const GLMAP={};GLOS.forEach(g=>{GLMAP[g.t.toLowerCase()]=g;(g.a||[]).forEach(x=>GLMAP[x.toLowerCase()]=g)});
const GLKEYS=Object.keys(GLMAP).sort((a,b)=>b.length-a.length);
const rxEsc=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
/* siglas cortas: solo en mayúsculas exactas */
const GLCASE=new Set(['cl','tl','ice','ead','rfe','nta','noid','mgm','vdpc','foia']);
const GLRX=new RegExp('(^|[^\\wÁÉÍÓÚÑáéíóúñ])('+GLKEYS.map(rxEsc).join('|')+')(?=$|[^\\wÁÉÍÓÚÑáéíóúñ])','gi');
function glossify(root){
  if(!root)return;const seen=new Set();
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('a,button,.gl,.copy,.dt,.dk,.lib-meta')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{
    const t=n.nodeValue;let m,last=0,frag=null;GLRX.lastIndex=0;
    while((m=GLRX.exec(t))){
      const word=m[2],key=word.toLowerCase(),g=GLMAP[key];
      if(!g||seen.has(g.t))continue;
      if(GLCASE.has(key)&&word!==word.toUpperCase())continue;
      seen.add(g.t);frag=frag||document.createDocumentFragment();
      const st=m.index+m[1].length;
      frag.appendChild(document.createTextNode(t.slice(last,st)));
      const b=document.createElement('button');b.type='button';b.className='gl';b.textContent=word;b.dataset.g=g.t;
      frag.appendChild(b);last=st+word.length;
    }
    if(frag){frag.appendChild(document.createTextNode(t.slice(last)));n.parentNode.replaceChild(frag,n)}
  });
}
function glPop(btn){
  closePop();const g=GLMAP[btn.dataset.g.toLowerCase()];if(!g)return;
  const p=document.createElement('div');p.className='glpop';p.id='glpop';p.setAttribute('role','dialog');
  p.innerHTML=`<div class="glpop-k">${GLCAT.find(c=>c.k===g.c).t}</div><div class="glpop-t">${esc(g.t)}</div><div class="glpop-d">${esc(g.d)}</div><button class="copy" onclick="closePop();glQ='${esc(g.t).replace(/'/g,"\\'")}';go('glosario')">Ver en el glosario →</button>`;
  document.body.appendChild(p);
  const r=btn.getBoundingClientRect(),pw=Math.min(320,window.innerWidth-32);p.style.width=pw+'px';
  let left=Math.min(Math.max(16,r.left),window.innerWidth-pw-16);let top=r.bottom+8;
  if(top+p.offsetHeight>window.innerHeight-16)top=Math.max(16,r.top-p.offsetHeight-8);
  p.style.left=left+'px';p.style.top=top+'px';
}
function closePop(){const p=document.getElementById('glpop');if(p)p.remove()}
document.addEventListener('click',e=>{const b=e.target.closest('.gl');if(b){e.preventDefault();e.stopPropagation();glPop(b);return}if(!e.target.closest('.glpop'))closePop()});
window.addEventListener('scroll',closePop,{passive:true});

let glQ='';
function renderGlos(){
  const q=glQ.trim().toLowerCase();
  const norm=x=>x.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const list=GLOS.filter(g=>!q||norm(g.t+' '+(g.a||[]).join(' ')+' '+g.d).includes(norm(q)));
  let h=`<div class="gate-k">Para nuevo ingreso y consultoría</div><h1 class="gate-h">Glosario</h1>
  <p class="gate-p">Siglas, sistemas, áreas y términos que vas a encontrar en los protocolos. Dentro de cada protocolo, los términos subrayados se pueden tocar para ver su definición.</p>
  <div class="lib-tools"><input class="lib-q" id="glq" placeholder="Buscar un término: RFE, Tier 1, prima facie…" value="${esc(glQ)}" oninput="glQ=this.value;glRefresh()" aria-label="Buscar en el glosario"><span style="font-size:14px;color:var(--tx3)">${list.length} términos</span></div>`;
  if(!list.length)return h+`<div class="lib-empty">No encontramos ese término. Pregunta a tu TL y pide que se agregue al glosario.</div>`;
  h+=GLCAT.map(c=>{const it=list.filter(g=>g.c===c.k).sort((a,b)=>a.t.localeCompare(b.t,'es'));if(!it.length)return'';
    return`<section class="lib-sec"><div class="lib-sh"><h2>${c.t}</h2><span>${it.length}</span></div><dl class="gldl">${it.map(g=>`<div class="glrow" id="gl-${encodeURIComponent(g.t)}"><dt>${esc(g.t)}${g.a&&g.a.length?`<small>${esc(g.a.join(' · '))}</small>`:''}</dt><dd>${esc(g.d)}</dd></div>`).join('')}</dl></section>`}).join('');
  return h;
}
function glRefresh(){const q=document.getElementById('glq'),pos=q?q.selectionStart:0;const y=window.scrollY;render();window.scrollTo(0,y);const q2=document.getElementById('glq');if(q2){q2.focus();try{q2.setSelectionRange(pos,pos)}catch(e){}}}

  {n:'Instagram oficial',u:'https://instagram.com/abogadamariamendoza/',d:'Red oficial de la firma.'},
  {n:'TikTok oficial',u:'https://tiktok.com/@abogadamaria',d:'Red oficial de la firma.'},
  {n:'Página web de la firma',u:'https://mendozafirm.com',d:'Sitio oficial de The Mendoza Law Firm.'}]}
];
function linkUses(u){const key=u.replace(/^https?:\/\//,'').replace(/\/$/,'').split('%2F')[0];return Object.keys(ITEMS).filter(id=>(!AREA||vis(id))&&JSON.stringify(ITEMS[id].content).includes(key))}
function copyLink(u){const ok=()=>toast('Enlace copiado');const fb=()=>{const a=document.createElement('textarea');a.value=u;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();ok()};try{navigator.clipboard.writeText(u).then(ok,fb)}catch(e){fb()}}
function renderLinks(){
  const total=LINKS.reduce((n,g)=>n+g.items.length,0);
  return`<div class="gate-k">Acceso rápido</div><h1 class="gate-h">Enlaces rápidos</h1>
  <p class="gate-p">Todos los enlaces que aparecen en los protocolos del portal, en un solo lugar. Cada enlace se abre en una pestaña nueva.</p>
  ${LINKS.map(g=>`<section class="lib-sec"><div class="lib-sh"><h2>${g.g}</h2><span>${g.items.length}</span></div><div class="lkgrid">${g.items.map(l=>{const uses=linkUses(l.u);const dom=l.u.replace(/^https?:\/\//,'').split('/')[0];
    return`<div class="lk"><div class="lk-n">${esc(l.n)}</div><div class="lk-d">${esc(l.d)}</div><div class="lk-u">${esc(dom)}</div>
    ${uses.length?`<div class="lk-use">Se usa en: ${uses.map(id=>`<button class="pc" onclick="if(!AREA){AREA='all';renderChip()}stack=['home'];go('${id}')">${esc(ITEMS[id].label)}</button>`).join(' · ')}</div>`:''}
    <div class="lib-acts"><a class="lk-open" href="${l.u}" target="_blank" rel="noopener">Abrir →</a><button class="copy" onclick="copyLink('${l.u}')">Copiar enlace</button></div></div>`}).join('')}</div></section>`).join('')}
  <p style="font-size:14px;color:var(--tx3)">${total} enlaces.</p>`;
}

/* ───── Búsqueda ───── */
function pathTo(id){
  for(const nid in NODES){const n=NODES[nid];if(!vis(nid))continue;
    if(n.opts.some(o=>o.go===id)||(n.first&&n.first.go===id)){if(nid==='home')return['home'];return pathTo(nid).concat(nid)}}
  return['home'];
}
function doSearch(q){
  const r=document.getElementById('sres');
  if(!q.trim()){r.classList.remove('on');return}
  const ql=q.toLowerCase(),strip=s=>s.replace(/<[^>]+>/g,' ');
  const m=Object.keys(ITEMS).filter(id=>vis(id)&&strip(ITEMS[id].label+' '+JSON.stringify(ITEMS[id].content)+' '+(ESS[id]||[]).join(' ')).toLowerCase().includes(ql));
  const gm=GLOS.filter(g=>(g.t+' '+(g.a||[]).join(' ')).toLowerCase().includes(ql)).slice(0,4);
  const gl=gm.map(g=>`<button class="c-gold" onmousedown="pickGl('${esc(g.t).replace(/'/g,"\\'")}')"><span class="ic">Aa</span><span>Glosario: ${esc(g.t)}<small>${esc(g.d.slice(0,90))}${g.d.length>90?'…':''}</small></span></button>`).join('');
  r.innerHTML=(m.length||gm.length)?gl+m.map(id=>`<button class="c-${colorOf(id)}" onmousedown="pick('${id}')"><span class="ic">${ITEMS[id].icon||'•'}</span><span>${ITEMS[id].label}${ESS[id]?`<small>${ESS[id][0]}</small>`:''}</span></button>`).join(''):`<div class="none">Sin resultados para tu área. Prueba otra palabra o pregunta a tu TL.</div>`;
  r.classList.add('on');
}
function pickGl(t){const s=document.getElementById('si');s.value='';s.blur();document.getElementById('sres').classList.remove('on');glQ=t;stack=AREA?stack.slice(0,1):['home'];go('glosario')}
function pick(id){const s=document.getElementById('si');s.value='';s.blur();document.getElementById('sres').classList.remove('on');if(!AREA)AREA='all',renderChip();stack=pathTo(id).concat(id);render()}
document.getElementById('si').addEventListener('blur',()=>setTimeout(()=>document.getElementById('sres').classList.remove('on'),120));

/* ───── Utilidades ───── */
function copySpeech(k){
  const d=document.createElement('div');d.innerHTML=SPEECH[k].replace(/<br\s*\/?>/gi,'\n');const t=d.textContent.trim();
  const ok=()=>toast('Speech copiado');
  const fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();ok()};
  try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}
}
let tt;function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),1500)}
function curTheme(){const d=document.documentElement.dataset.theme;if(d)return d;return matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}
function syncThemeBtn(){document.getElementById('themeBtn').textContent=curTheme()==='light'?'☾':'☀'}
function toggleTheme(){const n=curTheme()==='light'?'dark':'light';document.documentElement.dataset.theme=n;try{localStorage.setItem('cs_portal_theme',n)}catch(e){}syncThemeBtn()}
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();document.getElementById('si').focus()}
  if(e.key==='Escape'){document.getElementById('si').blur()}
});
try{const t=localStorage.getItem('cs_portal_theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}
syncThemeBtn();
try{const h=decodeURIComponent(location.hash.slice(1));
  if(h==='areas'||h==='lib'||h==='guia'||h==='glosario'||h==='enlaces'||(h.startsWith('area_')&&AREAS[h.slice(5)]))stack=['home',h];
  else if(NODES[h]&&h!=='home'){AREA='all';stack=pathTo(h).concat(h)}
  else if(ITEMS[h]){AREA='all';stack=pathTo(h).concat(h)}
}catch(e){}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==stack[stack.length-1]&&(ITEMS[h]||NODES[h])){stack=pathTo(h).concat(h);render()}});
renderChip();render();
</script>
