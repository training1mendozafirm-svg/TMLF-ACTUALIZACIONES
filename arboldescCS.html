{s:"Herramientas y referencia",id:"tools",icon:"⊡",sc:"grn",ch:[
{id:"t_vdpc",grn:true,label:"Metodología VDPC — clientes molestos",icon:"◇",color:"gold",
content:{title:"Metodología VDPC — contención de clientes molestos",icon:"◇",color:"gold",
intro:"VDPC es el método OBLIGATORIO para clientes molestos. No es un guion rígido: es una secuencia lógica que guía desde la tensión hacia la resolución.",
secs:[
{type:"steps",label:"Las 4 etapas de VDPC",items:[
{n:"V",c:"teal",t:"Validación — reconocer la emoción",d:"Reconocer verbalmente los sentimientos del cliente ANTES de dar información.<br><br><strong>Frases:</strong><br>• «Entiendo lo que me comenta.»<br>• «Tiene toda la razón en sentirse así.»<br>• «Sé que esta situación puede ser algo delicada.»<br><br><strong>Técnica de espejeo sensorial:</strong><br>• Cliente VISUAL ('no veo resultados'): «Entiendo lo que usted está viendo y cómo se percibe desde su lado.»<br>• Cliente AUDITIVO ('me dijeron', 'eso no suena bien'): «Lo que me está diciendo es totalmente válido.»<br>• Cliente KINESTÉSICO ('me siento frustrado', 'estoy cansado'): «Puedo sentir la carga que esto representa para usted.»<br><br>Tono: cálido y pausado, nunca mecánico."},
{n:"D",c:"teal",t:"Disculpa — reconocer el inconveniente",d:"<strong>Frases:</strong><br>• «Lamento mucho la situación.»<br>• «Ofrezco una disculpa por la demora.»<br>• «Siento que esto le haya causado inconvenientes.»<br><br>⚠ Después de la disculpa es el momento ideal para <strong>indagar</strong> y descubrir la raíz real del problema.<br>Tono: sincero y breve, sin justificaciones excesivas."},
{n:"P",c:"teal",t:"Puente — conectar con la solución",d:"<strong>Frases:</strong><br>• «Estoy aquí para ayudarle con este tema.»<br>• «Le comento el siguiente paso…»<br>• «Ahora bien, lo que podemos hacer es…»<br><br>⚠ REGLA: a mayor molestia → menor explicación, puente más rápido a la acción. No cargar de información a alguien muy enojado.<br>Tono: ritmo seguro, con pausas cortas."},
{n:"C",c:"teal",t:"Cierre — orientar al futuro positivo",d:"<strong>Frases:</strong><br>• «Primeramente Dios todo saldrá bien, confíe…»<br>• «Cuando USCIS reciba su caso, le enviaremos un mensaje de texto.»<br>• «Ahora debemos esperar la respuesta, confíe, valdrá la pena.»<br><br>⚠ Promete ACOMPAÑAMIENTO, nunca resultados.<br>Tono: firme, cálido y seguro."}
]},
{type:"rules",label:"Errores que rompen la contención — EVITAR",color:"red",items:[
"Interrumpir al cliente durante la fase de Validación",
"Dar demasiada explicación cuando el cliente está muy molesto",
"Justificar a la firma en lugar de validar al cliente",
"Sonar mecánico o como si estuviera leyendo un guion",
"Prometer resultados en lugar de prometer acompañamiento",
"Olvidar la Asistencia Adicional al finalizar: «¿Hay algo más en lo que pueda servirle?»"
]},
{type:"acc",label:"¿Cuándo contener vs cuándo escalar?",tag:"gold",tl:"Decisión",body:[
{type:"rules",items:[
"SE CONTIENE: solicitudes de cancelación, pedir hablar con abogados, quejas por retrasos ordinarios (negociar más tiempo).",
"SE TURNA / ESCALA: si tras la contención el cliente insiste, hay lenguaje agresivo o amenazas, riesgo de pérdida de confianza, o el caso superó el tiempo límite de su stage.",
"HERRAMIENTA: 'Si el cliente se calma → vas bien. Si se acelera → ajusta el enfoque.'"
]}
]}
]}},
{id:"t_esc",grn:true,label:"Mapa de escalaciones",icon:"⊥",color:"gold",
content:{title:"Los medios de escalación de CS",icon:"⊥",color:"gold",
secs:[
{type:"acc",label:"1 — Formulario de Llamadas (ClickUp) — MEDIO PRINCIPAL",tag:"gold",tl:"Principal",body:[
{type:"rules",items:[
"Es la forma más directa. Al rellenar ciertas opciones la tarea se envía automáticamente al área.",
"En este link se realiza el <strong>registro de TODAS las llamadas con el cliente</strong>. Además sirve para hacer tres tipos de escalaciones: <strong>Cancelación, Back office, Call Backs y PCR</strong> (empujar el trabajo interno). El resto de escalaciones a otras áreas se realizan por Slack y escalación por medio del TL.",
"Link: <a href='https://forms.clickup.com/31633845/f/y5cdn-269314/64XWDTD7ZG7QQJM47J' target='_blank' style='color:var(--gold)'>https://forms.clickup.com/31633845/f/y5cdn-269314/64XWDTD7ZG7QQJM47J</a>",

]}
]},
{type:"acc",label:"2 — Slack — grupos activos",tag:"teal",tl:"Slack",body:[
{type:"rules",items:[
"<strong>rfe-comunications</strong>: cuando USCIS solicita información extra (RFE)",
"<strong>cs-dvs</strong>: cuando el cliente quiere una consulta o tiene situaciones con la consulta",
"<strong>cdmx-oficina</strong>: en este chat se reportan situaciones vinculadas con los horarios"
]}
]}
]}},
{id:"t_can",grn:true,label:"Guía de canalización por área (Case Review)",icon:"⊶",color:"teal",
content:{title:"Canalización — validar siempre contra TramCase",icon:"⊶",color:"teal",
intro:"SIEMPRE verificar las últimas notas de TramCase antes de informar al cliente. Esta guía describe las frases y reglas por tipo de área.",
secs:[
{type:"rules",label:"Áreas de proceso lineal — acción directa",color:"teal",items:[
"Área 0 · SALES → Canalizar a PMO | «Su caso está en proceso de validación inicial. Pronto será contactado.»",
"Área 2 · PSYCHOLOGY → Canalizar a PWI | «Su caso está en la etapa de recolección de documentos. Próximamente lo contactarán para guiarle.»",
"Área 4 · WAE's → Canalizar a PWI_FU | «Se trabaja en el análisis de su declaración y redacción de documentos. Su caso está avanzando.»",
"Área 6 · PACKETS → Canalizar a PCR | «Su caso está siendo ensamblado. El equipo integra la documentación necesaria para continuar.»",
"Área 7 · CA's → Canalizar a CA's | «Su caso está en proceso de análisis y revisión por parte del equipo especializado.»",
"Área 8 · FOLLOW UP → Canalizar a PWI | «Estamos en la etapa de recolección de documentos adicionales. Pronto será contactado.»"
]},
{type:"rules",label:"Seguimiento activo — acción directa",color:"teal",items:[
"Área 9 · CS → Canalizar a PMO | «Su caso está en seguimiento activo. El equipo está al pendiente y en breve tendrá novedades.»",
"Área ELP TX → Canalizar a PCR | «Su caso está en las etapas finales, próximo a ser enviado. ¡Ya casi!»"
]},
{type:"rules",label:"Áreas que requieren revisar TramCase primero",color:"amber",items:[
"CANCUN → Canalizar a PMO — revisar TramCase: ¿No Contact Letter? ¿TL? ¿Unresponsive? ¿Retention? | «Permítame un momento para revisar el estado actual de su caso.»",
"ON HOLD — Abuser YA cumplió 21a+3m → Escalar a PMO | «Vamos a dejar nota para que el equipo lo contacte a la brevedad.»",
"ON HOLD — Abuser AÚN NO cumple → Solo informar, NO escalar | «Su caso está en espera hasta que el abusador cumpla 21 años y 3 meses.»",
"ON HOLD — Compliance/Attys → Solo informar, verificar nota | «Su caso está siendo analizado por nuestro equipo legal.»",
"UNRESPONSIVE → PMO de inmediato, recibir con calidez | «¡Qué gusto saludarle nuevamente! Hemos intentado contactarle. Permítame revisar su caso.»",
"CASO CANCELADO — Tiene Callback → No escalar | «Su caso tiene una llamada de seguimiento programada. El equipo estará en contacto.»",
"CASO CANCELADO — Tiene Discovery Call → No escalar | «Tiene una Discovery Call agendada. Pronto se comunicarán con usted.»",
"CASO CANCELADO — Sin Callback ni Discovery → Discovery Call | «Voy a realizar la escalación para que el equipo coordine una llamada con usted.»"
]}
]}},
{id:"t_noinfo",grn:true,label:"Información que NO se revela al cliente",icon:"⊘",color:"red",
content:{title:"Información visible en TramCase que NO se comunica al cliente",icon:"⊘",color:"red",
intro:"El asesor puede tener acceso visual a cierta información en TramCase, pero eso no significa que pueda compartirla. Todo lo que aparece en esta lista debe ser manejado internamente y escalado al área correspondiente.",
secs:[
{type:"rules",label:"Información confidencial — nunca revelar directamente",color:"red",items:[
"<strong>Rejections</strong> — Si el caso tiene una negativa, CS no la informa. Se escala a Callbacks para que un abogado le notifique al cliente.",
"<strong>Decisions</strong> — Aplica el mismo protocolo que Rejections. Un abogado debe informar al cliente.",
"<strong>RFEs (Request for Evidence)</strong> — No se informa directamente. Se escala a Callbacks.",
"<strong>NOIDs (Notice of Intent to Deny)</strong> — Mismo tratamiento que RFE y Decisions.",
"<strong>NTA (Notice to Appear)</strong> — El asesor no puede decirle al cliente que tiene una NTA. Se escala a <strong>Removals</strong>, no a Callbacks. Si el cliente ya lo sabe y pide el documento, se trata como File Request.",
"<strong>Información de Dropbox</strong> — Los asesores SÍ tienen acceso a Dropbox y lo usan para identificar recibos, estatus y documentos del caso. Que la información esté visible en Dropbox no significa que se pueda compartir con el cliente: cualquier documento negativo (rejection, decision, RFE, NOID, NTA) sigue sin poder comunicarse directamente."
]},
{type:"steps",label:"¿Qué hacer cuando el cliente pregunta o ya lo sabe?",items:[
{n:"A",c:"amber",t:"El cliente NO sabe y el asesor lo ve en TramCase o Dropbox",d:"No mencionarlo. Ofrecer una callback con abogado: «Lo que podemos hacer es agendar una llamada con el área legal para que le den un estatus detallado de su caso.»<br>El asesor <strong>agenda la callback directamente</strong> en el portal de agendas (o escala a <strong>Removals</strong> si es NTA)."},
{n:"B",c:"amber",t:"El cliente SÍ sabe (lo vio en la página de USCIS) y pide información",d:"No confirmar ni ampliar lo que vio. Usar el mismo speech: «Vamos a agendarle una llamada con nuestro equipo legal para darle el detalle correspondiente.»<br>El asesor <strong>agenda la callback directamente</strong>, sin necesidad de autorización previa del TL."},
{n:"C",c:"red",t:"El cliente pide el documento (RFE, NTA, Decision, etc.)",d:"Tratar como <strong>File Request</strong> y agendar la callback correspondiente. Preguntar el motivo de manera discreta, no prometer envío ni dar fechas.<br>Si es para uso personal → TL puede gestionar el envío con autorización.<br>Si es para abogado externo → requiere aprobación de MGM/Wendy antes de cualquier acción."}
]},
{type:"rules",label:"Regla de oro",color:"red",items:[
"Que el asesor pueda verlo en TramCase NO significa que pueda decírselo al cliente",
"Nunca especular ni dar interpretaciones sobre documentos legales — siempre escalar al área legal",
"Si el cliente ya lo sabe por la página de USCIS, no confirmar ni negar — escalar igual"
]}
]}},
{id:"t_notas",grn:true,label:"Estructura de notas en TramCase",icon:"≣",color:"gold",

{id:"t_form_llamadas",grn:true,label:"Formulario de Llamadas (ClickUp)",icon:"⊞",color:"gold",
content:{title:"Formulario de Llamadas — ClickUp",icon:"⊞",color:"gold",
intro:"Este formulario es el medio principal para el registro de TODAS las llamadas con el cliente, y para realizar escalaciones clave.",
secs:[
{type:"rules",label:"Usos del formulario",color:"gold",items:[
"<strong>Registro de todas las llamadas con el cliente</strong> — inbound y outbound.",
"Escalaciones: <strong>Cancelación</strong>, <strong>Back office</strong>, <strong>Call Backs</strong> y <strong>PCR</strong> (empujar trabajo interno).",
"El resto de escalaciones a otras áreas se realizan por Slack o por medio del TL."
]},
{type:"rules",label:"Callbacks — el agente agenda directamente (Antes vs. Ahora)",color:"amber",items:[
"<strong>Antes</strong>, solo el Team Leader podía agendar una Callback. <strong>Ahora el agente de Customer Service puede agendarla directamente</strong>, sin autorización previa del TL.",
"Se puede agendar cuando aplica alguno de estos 3 escenarios: <strong>A)</strong> el cliente NO sabe y el asesor lo ve en TramCase o Dropbox (Rejection, Decisión, NOID, RFE, NTA) — no se menciona, se ofrece callback con abogado y se agenda; <strong>B)</strong> el cliente YA sabe (lo vio en USCIS.gov) — no se confirma ni se amplía, se agenda igual; <strong>C)</strong> el cliente pide el documento — se trata como <strong>File Request</strong> y se agenda la callback.",
"El paso a paso operativo para agendar la callback en el portal de agendas está en el apartado <strong>'Agenda de Callback — paso a paso'</strong> más abajo en Herramientas."
]},
{type:"acc",label:"Acceso al formulario",tag:"gold",tl:"Enlace",body:[
{type:"rules",items:[
"<a href='https://forms.clickup.com/31633845/f/y5cdn-269314/64XWDTD7ZG7QQJM47J' target='_blank' style='color:var(--gold)'>https://forms.clickup.com/31633845/f/y5cdn-269314/64XWDTD7ZG7QQJM47J</a>"
]}
]}
]}},
{id:"t_callback_pasos",grn:true,label:"Agenda de Callback — paso a paso",icon:"☏",color:"gold",sub:"Portal de agendas",
content:{title:"Agenda de Callback — paso a paso",icon:"☏",color:"gold",
intro:"El agente de Customer Service agenda la callback directamente en el portal de agendas, sin autorización previa del TL, cuando aplica alguno de los 3 escenarios (ver 'Formulario de Llamadas' arriba). Este es el procedimiento operativo completo.",
secs:[
{type:"steps",label:"Cómo agendar una callback en el portal de agendas",items:[
{n:"1",c:"blue",t:"Entra al portal de agendas",d:"Abre el <a href='https://jmanuelbv.github.io/PORTAL-AGENDAS-CALLBACKS/#' target='_blank' style='color:var(--gold)'>portal de agendas de callbacks</a>. Verás la pantalla «Selecciona tu área» con 3 opciones: Callbacks, Customer Service y RFE. Como pertenecemos a Customer Service, damos clic ahí."},
{n:"2",c:"blue",t:"Ubícate en el calendario del área",d:"Se despliega un calendario/agenda: cada columna es un abogado. Hay un mini-calendario a la izquierda para navegar entre días. El título en la parte superior muestra el día en el que te encuentras."},
{n:"3",c:"blue",t:"Identifica los espacios disponibles",d:"Los espacios ya ocupados aparecen de color café clarito. Algunos abogados muestran su horario de entrada/salida, bloqueos por compromisos y breaks — esos tampoco cuentan como disponibles. Normalmente la disponibilidad real aparece entre 1 y 1.5 semanas adelante."},
{n:"4",c:"amber",t:"Ten en cuenta la zona horaria del abogado",d:"Todos los abogados manejan horario de Puerto Rico, con una excepción: <strong>Mariana Álvarez</strong>, cuya zona horaria corresponde a Houston, TX."},
{n:"5",c:"amber",t:"Usa la calculadora rápida de horario",d:"Debajo del título hay una barra «Calculadora rápida de horario» con un botón <strong>Abrir</strong>. Selecciona el estado/zona del cliente y automáticamente te muestra la hora equivalente del abogado, para comparar ambos horarios antes de agendar."},
{n:"6",c:"teal",t:"Da clic en el espacio disponible",d:"Ya con la hora convertida y comparada, da clic en el espacio disponible dentro de la columna del abogado correspondiente. Esto abre la ventana emergente «Agendar callback»."},
{n:"7",c:"teal",t:"Llena el formulario con los datos de TramCase",d:"Completa los campos con la información que ya tienes en TramCase. El campo <strong>Atty</strong> se autocompleta según la columna/abogado elegido. El campo <strong>PL / Quién agenda</strong> se llena con tu nombre."},
{n:"8",c:"teal",t:"Guarda la callback",d:"Da clic en <strong>Guardar Callback</strong>. El evento aparece en la columna del abogado, en el horario agendado. Si vuelves a dar clic sobre ese evento, puedes ver de nuevo la ficha completa: cliente, área que la creó, fecha, hora de Puerto Rico y tipo de llamada."},
{n:"9",c:"gold",t:"Envía el recordatorio al cliente",d:"Manda un mensaje de confirmación al cliente usando siempre <strong>su hora local</strong> (nunca la hora de Puerto Rico ni la del abogado). Ejemplo: «Buenas tardes, le envío la información de su cita con nuestros abogados: viernes 24 de julio 2026 a la 1:20 de su hora local.»"},
{n:"10",c:"gold",t:"Deja la nota en TramCase",d:"Registra la nota con la estructura habitual, indicando la hora, el día y el motivo por el que se agendó la callback."}
]},
{type:"rules",label:"Recibos de USCIS — qué se puede compartir con el cliente",color:"teal",items:[
"SÍ se pueden compartir: recibos iniciales, aprobaciones (I-797/A/B), envío de tarjeta o documento (I-797D), citas de biométricos, prima facie.",
"NUNCA se pueden compartir bajo ninguna circunstancia: decisions, rejections, RFEs (I-797E), NOIDs — nada que sea negativo. Estos casos siempre disparan el flujo de agenda de callback descrito arriba.",
"Un I-797C puede corresponder a varias acciones (recibo, transferencia, rechazo, cita). Antes de compartir su contenido con el cliente, verifica cuál es la acción específica indicada en el aviso."
]}
]}},
{id:"t_uscis",grn:true,label:"Consulta de caso en USCIS",icon:"◎",color:"teal",
content:{title:"Consulta de caso — Portal USCIS",icon:"◎",color:"teal",
intro:"Utiliza este portal para verificar el estatus del caso del cliente directamente en la página oficial de USCIS.",
secs:[
{type:"acc",label:"Acceso al portal de USCIS",tag:"teal",tl:"Enlace",body:[
{type:"rules",items:[
"<a href='https://egov.uscis.gov/es' target='_blank' style='color:var(--tel)'>https://egov.uscis.gov/es</a> — Portal oficial en español para consulta de casos.",
"Ingresar el número de recibo del caso (receipt number) para verificar estatus actual."
]}
]}
]}}
]}

function vis(id){
  if(!AREA||AREA==='all')return true;
  if(NODES[id]){const n=NODES[id];if(n.areas&&!n.areas.includes(AREA))return false;return n.opts.some(o=>vis(o.go))||!!(n.first&&vis(n.first.go))}

}

let stack=['home'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function labelOf(id){if(id==='gate')return'Elegir área';if(id==='areas')return'Las 4 áreas';if(id==='lib')return'Biblioteca de speeches';if(id.startsWith('area_'))return AREAS[id.slice(5)].n;return NODES[id]?NODES[id].label:(ITEMS[id]?ITEMS[id].label:id)}
function iconOf(id){return NODES[id]?'→':(ITEMS[id].icon||'•')}
function colorOf(id){if(NODES[id])return NODES[id].emg?'red':'gold';const it=ITEMS[id];return it.emg||it.content.emg?'red':(COL[it.color]||'gold')}
function go(id){const k=stack.indexOf(id);if(k>=0)stack=stack.slice(0,k+1);else stack.push(id);render()}
function back(){if(stack.length>1)stack.pop();render()}
function home(){stack=['home'];render()}

function pathHTML(){
  if(stack.length<2)return'';
  return`<div class="path"><button class="back" onclick="back()">← Volver</button>${stack.map((id,k)=>k===stack.length-1?`<span class="cur">${esc(labelOf(id))}</span>`:`<button class="pc" onclick="go('${id}')">${esc(labelOf(id))}</button><span class="sep">›</span>`).join('')}</div>`;
}
function render(){
  const mn=document.getElementById('mn');
  let id=stack[stack.length-1],body;
  if(!AREA&&id!=='areas'&&!id.startsWith('area_')){body=renderGate(true)}
  else if(id==='gate')body=renderGate(false);
  else if(id==='areas')body=renderOverview();
  else if(id==='lib')body=renderLib();
  else if(id.startsWith('area_'))body=renderArea(id.slice(5));
  else if(NODES[id])body=renderNode(NODES[id],id);
  else body=renderItem(id);
  mn.innerHTML=`<div class="wrap">${(!AREA&&stack.length<2)?'':pathHTML()}${body}</div>`;
  window.scrollTo(0,0);
  try{const h=stack.length>1?stack[stack.length-1]:'';history.replaceState(null,'',h?'#'+h:location.pathname+location.search)}catch(e){}
}

/* ───── Protocolo ───── */
function isNeg(r){const t=r.replace(/<[^>]+>/g,'').trim().toLowerCase();return /^(nunca|no |no,|prohibido|critical)/.test(t)}
let spk=0;const SPEECH={};
function speechHTML(t){const k='s'+(spk++);SPEECH[k]=t;return`<div class="sp">${t}<br><button class="copy" onclick="copySpeech('${k}')">Copiar speech</button></div>`}
function rulesHTML(items,c,neg){return items.map(r=>{const n=neg||isNeg(r);return`<div class="rl c-${c} ${n?'neg':''}"><b>${n?'✕':'✓'}</b><span>${r}</span></div>`}).join('')}
function stepsHTML(items){return`<div class="steps">${items.map(s=>{const c=COL[s.c]||'blue';return`<div class="st c-${c}"><div class="sn">${s.n}</div><div><div class="stt">${s.t}</div><div class="std">${s.d}</div></div></div>`}).join('')}</div>`}
const TYPE={steps:{i:'1·2',k:'Paso a paso'},rules:{i:'✓',k:'Puntos a cuidar'},speech:{i:'❝',k:'Qué decir'},acc:{i:'+',k:'Complemento'}};
function secHTML(s,open){
  let c='gold',body='',kind=TYPE[s.type].k,ic=TYPE[s.type].i,count='';
  if(s.type==='steps'){c='blue';body=stepsHTML(s.items);count=` · ${s.items.length} pasos`}
  else if(s.type==='rules'){c=s.color==='red'?'red':(COL[s.color]||'gold');body=rulesHTML(s.items,c,s.color==='red');if(s.color==='red'){kind='Atención';ic='✕'}}
  else if(s.type==='speech'){c='gold';body=speechHTML(s.text)}
  else if(s.type==='acc'){c=COL[s.tag]||'teal';kind=s.tl||kind;body=s.body.map(b=>b.type==='speech'?speechHTML(b.text):b.type==='rules'?rulesHTML(b.items,c):b.type==='steps'?stepsHTML(b.items):'').join('')}
  return`<div class="dc c-${c} ${open?'op':''}"><button class="db" onclick="this.parentElement.classList.toggle('op')"><span class="di">${ic}</span><span><span class="dt">${s.label||kind}</span><span class="dk">${kind}${count}</span></span><span class="ar">▼</span></button><div class="dbody">${body}</div></div>`;
}
function appliesHTML(id){
  const u=USE[id]||ALL;
  return`<div class="applies">Aplica a:${AK.map(k=>{const A=AREAS[k],on=u.includes(k);return`<span class="tag c-${A.c} ${on?'':'off'}">${A.n}</span>`}).join('')}</div>`;
}
function renderItem(id){
  const it=ITEMS[id];if(!it)return renderNode(NODES.home,'home');
  const c=it.content,col=colorOf(id),e=ESS[id],isE=it.emg||c.emg;
  let h=`<div class="ph c-${col}"><div class="oi">${c.icon||'•'}</div><div><h1 class="pt">${c.title}</h1>${e?`<div class="pw"><b>Cuándo:</b> ${e[0]}</div>`:''}</div></div>`;
  h+=appliesHTML(id);
  if(c.draft)h+=`<p style="margin-bottom:16px"><span class="draft">✎ BORRADOR · contenido por validar</span></p>`;
  if(isE)h+=`<div class="ebanner">⚠ Avisa al TL de inmediato, antes de terminar la atención.</div>`;
  if(e)h+=`<div class="ess"><div class="ess-h">★ Lo esencial</div>${e[1].map((k,n)=>`<div class="ess-i"><i>${n+1}</i><span>${k}</span></div>`).join('')}</div>`;
  h+=`<div class="dh">Detalle · toca para abrir</div><div class="det">`;
  if(c.intro)h+=`<div class="dc c-blue"><button class="db" onclick="this.parentElement.classList.toggle('op')"><span class="di">i</span><span><span class="dt">Contexto</span><span class="dk">Antes de empezar</span></span><span class="ar">▼</span></button><div class="dbody"><div class="std">${c.intro}</div></div></div>`;
  c.secs.forEach((s,k)=>h+=secHTML(s,k===0));
  h+=`</div>`;
  const nx=(NEXT[id]||(isE?NEXT._emg:(id.startsWith('m_')||id.startsWith('fl_')?NEXT._call:[]))).filter(x=>x!==id&&vis(x));
  if(nx.length)h+=`<div class="next"><div class="dh">¿Y después?</div><div class="opts">${nx.map(nextBtn).join('')}</div></div>`;
  return h;
}


/* ───── Biblioteca de speeches ───── */
const LIBCAT=[
 {k:'apertura',t:'Apertura y saludo',d:'Cómo abrir cada tipo de atención: llamada entrante, saliente, remarcación y videollamada.'},
 {k:'espera',t:'Espera y verificación',d:'Cómo pedir tiempo para revisar el caso y cómo regresar con el cliente.'},
 {k:'motivos',t:'Resolver según el motivo',d:'Speeches por motivo de llamada: estatus, pagos, cancelación, expediente, viaje y más.'},
 {k:'contencion',t:'Contención del cliente molesto',d:'Frases de la metodología VDPC y de atención en segundo nivel.'},
 {k:'sensible',t:'Información sensible y terceros',d:'Qué decir cuando no puedes dar información o quien llama no es el titular.'},
 {k:'emergencias',t:'Emergencias',d:'Scripts mandatorios para detención, citas con ICE y posibles estafas. Avisa al TL de inmediato.'},
 {k:'cierre',t:'Cierre y despedida',d:'Asistencia adicional, registro de la llamada y despedida corporativa.'},
 {k:'plantillas',t:'Plantillas de nota (CRM)',d:'Textos para copiar en el registro. No se leen al cliente.'}
];
function libCat(id,ctx,text){
  const c=(ctx+' ').toLowerCase();
  if(/^\s*(<strong>)?t[ií]tulo:/i.test(text)||/plantilla|estructura de notas|nota de texto|reporte/.test(c))return'plantillas';
  if(id.startsWith('e_'))return'emergencias';
  if(id==='m_abuser'||id==='t_noinfo')return'sensible';
  if(id==='t_vdpc'||id==='t2_recibe')return'contencion';
  if(id.startsWith('fl_')||id==='ch_flow'){
    if(/asistencia adicional|despedida|registro de informaci/.test(c))return'cierre';
    if(/3 minutos|resoluci[oó]n de la duda/.test(c))return'espera';
    if(/motivo/.test(c)&&id!=='fl_ib')return'motivos';
    return'apertura';
  }
  return'motivos';
}
let LIB=null;
function buildLib(){
  const out=[];
  const add=(id,ctx,text)=>out.push({id,ctx,text,cat:libCat(id,ctx,text)});
  const walk=(id,secs,parent)=>secs.forEach(x=>{
    if(x.type==='speech')add(id,x.label||parent||'Speech',x.text);
    else if(x.type==='acc')walk(id,x.body,x.label||x.tl);
    else if(x.type==='steps')x.items.forEach(st=>{
      const m=st.d.match(/«[^»]+»/g);if(!m)return;
      m.map(z=>z.replace(/<[^>]+>/g,'')).filter(z=>/[.?!,…]/.test(z)).forEach(z=>add(id,st.t,z));
    });
  });
  Object.keys(ITEMS).forEach(id=>walk(id,ITEMS[id].content.secs));
  return out;
}
let libF='all',libQ='';
function renderLib(){
  if(!LIB)LIB=buildLib();
  const strip=t=>t.replace(/<[^>]+>/g,' ').toLowerCase();
  const base=LIB.filter(e=>vis(e.id));
  const q=libQ.trim().toLowerCase();
  const shown=base.filter(e=>(libF==='all'||e.cat===libF)&&(!q||strip(e.text+' '+e.ctx+' '+ITEMS[e.id].label).includes(q)));
  const cnt=k=>base.filter(e=>e.cat===k).length;
  const A=AREAS[AREA];
  let h=`<div class="gate-k">${A?A.n:'Todas las áreas'} · Qué decir</div>
  <h1 class="gate-h">Biblioteca de speeches</h1>
  <p class="gate-p">Todo lo que el colaborador debe decir, ordenado por momento de la atención. Cada speech viene de su protocolo: cópialo o abre el protocolo para ver el contexto completo.</p>
  <div class="lib-tools"><input class="lib-q" id="libq" placeholder="Buscar en los speeches…" value="${esc(libQ)}" oninput="libQ=this.value;libRefresh()" aria-label="Buscar speech">
  <button class="lib-chip ${libF==='all'?'on':''}" onclick="libF='all';libRefresh()">Todos<small>${base.length}</small></button>
  ${LIBCAT.filter(c=>cnt(c.k)).map(c=>`<button class="lib-chip ${libF===c.k?'on':''}" onclick="libF='${c.k}';libRefresh()">${c.t}<small>${cnt(c.k)}</small></button>`).join('')}</div><div id="libres">`;
  h+=libBody(shown);
  return h+'</div>';
}
let libM=null;
function libCard(e){
  const k='s'+(spk++);SPEECH[k]=e.text;const col=colorOf(e.id);
  return`<div class="lib-it"><div class="lib-meta"><b>${e.ctx}</b><span class="tag c-${col}">${esc(ITEMS[e.id].label)}</span></div><div class="sp">${e.text}</div><div class="lib-acts"><button class="copy" onclick="copySpeech('${k}')">Copiar speech</button><button class="copy" onclick="go('${e.id}')">Ver protocolo →</button></div></div>`;
}
function libBody(shown){
  if(!shown.length)return`<div class="lib-empty">No hay speeches que coincidan. Prueba otra palabra o elige "Todos".</div>`;
  return LIBCAT.map(c=>{
    const it=shown.filter(e=>e.cat===c.k);if(!it.length)return'';
    let inner;
    if(c.k==='motivos'&&!libQ.trim()){
      const ids=[...new Set(it.map(e=>e.id))];
      if(!ids.includes(libM))libM=null;
      inner=`<div class="mot-grid">${ids.map(id=>{const n=it.filter(e=>e.id===id).length,col=colorOf(id);
        return`<button class="mot c-${col} ${libM===id?'on':''}" onclick="libM=libM==='${id}'?null:'${id}';libRefresh()" aria-expanded="${libM===id}"><span class="oi">${ITEMS[id].icon||'•'}</span><span class="mt">${esc(ITEMS[id].label)}</span><span class="mc">${n} ${n===1?'speech':'speeches'}</span></button>`}).join('')}</div>`+
        (libM?`<div class="lib-list mot-open">${it.filter(e=>e.id===libM).map(libCard).join('')}</div>`:`<p class="mot-hint">Elige un motivo para ver sus speeches.</p>`);
    }else inner=`<div class="lib-list">${it.map(libCard).join('')}</div>`;
    return`<section class="lib-sec" id="lib-${c.k}"><div class="lib-sh"><h2>${c.t}</h2><span>${it.length}</span></div><p class="lib-sd">${c.d}</p>${inner}</section>`;
  }).join('');
}
function libRefresh(){
  const q=document.getElementById('libq'),pos=q?q.selectionStart:0;
  const y=window.scrollY;render();window.scrollTo(0,y);
  const q2=document.getElementById('libq');if(q2&&(libQ||pos)){q2.focus();try{q2.setSelectionRange(pos,pos)}catch(e){}}
}

/* ───── Búsqueda ───── */
function pathTo(id){
  for(const nid in NODES){const n=NODES[nid];if(!vis(nid))continue;
    if(n.opts.some(o=>o.go===id)||(n.first&&n.first.go===id)){if(nid==='home')return['home'];return pathTo(nid).concat(nid)}}
  return['home'];
}
function doSearch(q){
  const r=document.getElementById('sres');
  if(!q.trim()){r.classList.remove('on');return}
  const ql=q.toLowerCase(),strip=s=>s.replace(/<[^>]+>/g,' ');
  const m=Object.keys(ITEMS).filter(id=>vis(id)&&strip(ITEMS[id].label+' '+JSON.stringify(ITEMS[id].content)+' '+(ESS[id]||[]).join(' ')).toLowerCase().includes(ql));
  r.innerHTML=m.length?m.map(id=>`<button class="c-${colorOf(id)}" onmousedown="pick('${id}')"><span class="ic">${ITEMS[id].icon||'•'}</span><span>${ITEMS[id].label}${ESS[id]?`<small>${ESS[id][0]}</small>`:''}</span></button>`).join(''):`<div class="none">Sin resultados para tu área. Prueba otra palabra o pregunta a tu TL.</div>`;
  r.classList.add('on');
}
function pick(id){const s=document.getElementById('si');s.value='';s.blur();document.getElementById('sres').classList.remove('on');if(!AREA)AREA='all',renderChip();stack=pathTo(id).concat(id);render()}
document.getElementById('si').addEventListener('blur',()=>setTimeout(()=>document.getElementById('sres').classList.remove('on'),120));

/* ───── Utilidades ───── */
function copySpeech(k){
  const d=document.createElement('div');d.innerHTML=SPEECH[k].replace(/<br\s*\/?>/gi,'\n');const t=d.textContent.trim();
  const ok=()=>toast('Speech copiado');
  const fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();ok()};
  try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}
}
let tt;function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),1500)}
function curTheme(){const d=document.documentElement.dataset.theme;if(d)return d;return matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}
function syncThemeBtn(){document.getElementById('themeBtn').textContent=curTheme()==='light'?'☾':'☀'}
function toggleTheme(){const n=curTheme()==='light'?'dark':'light';document.documentElement.dataset.theme=n;try{localStorage.setItem('cs_portal_theme',n)}catch(e){}syncThemeBtn()}
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();document.getElementById('si').focus()}
  if(e.key==='Escape'){document.getElementById('si').blur()}
});
try{const t=localStorage.getItem('cs_portal_theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}
syncThemeBtn();
try{const h=decodeURIComponent(location.hash.slice(1));
  if(h==='areas'||h==='lib'||(h.startsWith('area_')&&AREAS[h.slice(5)]))stack=['home',h];
  else if(NODES[h]&&h!=='home')stack=pathTo(h).concat(h);
  else if(ITEMS[h])stack=pathTo(h).concat(h);
}catch(e){}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==stack[stack.length-1]&&(ITEMS[h]||NODES[h])){stack=pathTo(h).concat(h);render()}});
renderChip();render();
</script>
