<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Customer Service Portal TMLF</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
/* Layout: encabezado fijo + columna central; selector de área como puerta de entrada */
:root{
  --bg:#0e0f11;--sf:#17191d;--sf2:#1f2227;--sf3:#2a2d34;
  --bd:rgba(255,255,255,.08);--bd2:rgba(255,255,255,.16);
  --tx:#eceef0;--tx2:#a6a9b0;--tx3:#6e717a;
  --gold:#c9a84c;--gd:rgba(201,168,76,.13);--gb:rgba(201,168,76,.35);
  --red:#e86060;--rd:rgba(224,82,82,.13);--rb:rgba(224,82,82,.4);
  --amb:#e0904a;--ad:rgba(212,133,58,.13);--abd:rgba(212,133,58,.38);
  --tel:#40b8ae;--td:rgba(58,173,164,.12);--tbd:rgba(58,173,164,.38);
  --blu:#6ab4ff;--bld:rgba(58,134,255,.13);--blb:rgba(58,134,255,.38);
  --grn:#4fbf8a;--gnd:rgba(76,175,130,.13);--gnb:rgba(76,175,130,.38);
  --vio:#b39cff;--vd:rgba(150,120,255,.13);--vb:rgba(150,120,255,.38);
  --mark:rgba(201,168,76,.22);--ongold:#16130a;--shadow:rgba(0,0,0,.35);
  --font-d:'Playfair Display',Georgia,serif;--font-b:'DM Sans',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f3f4f6;--sf:#fff;--sf2:#f3f4f6;--sf3:#e6e8ec;
  --bd:rgba(0,0,0,.09);--bd2:rgba(0,0,0,.18);
  --tx:#191b21;--tx2:#4a4d58;--tx3:#80838e;
  --gold:#94700f;--gd:rgba(160,110,20,.09);--gb:rgba(160,110,20,.32);
  --red:#c03a3a;--rd:rgba(192,58,58,.08);--rb:rgba(192,58,58,.32);
  --amb:#b5651c;--ad:rgba(181,101,28,.09);--abd:rgba(181,101,28,.32);
  --tel:#18877e;--td:rgba(24,135,126,.08);--tbd:rgba(24,135,126,.32);
  --blu:#2a6fd0;--bld:rgba(42,111,208,.08);--blb:rgba(42,111,208,.32);
  --grn:#258a5a;--gnd:rgba(37,138,90,.08);--gnb:rgba(37,138,90,.32);
  --vio:#6a4fd0;--vd:rgba(106,79,208,.08);--vb:rgba(106,79,208,.32);
  --mark:rgba(201,168,76,.28);--ongold:#fff;--shadow:rgba(0,0,0,.12);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#f3f4f6;--sf:#fff;--sf2:#f3f4f6;--sf3:#e6e8ec;
  --bd:rgba(0,0,0,.09);--bd2:rgba(0,0,0,.18);
  --tx:#191b21;--tx2:#4a4d58;--tx3:#80838e;
  --gold:#94700f;--gd:rgba(160,110,20,.09);--gb:rgba(160,110,20,.32);
  --red:#c03a3a;--rd:rgba(192,58,58,.08);--rb:rgba(192,58,58,.32);
  --amb:#b5651c;--ad:rgba(181,101,28,.09);--abd:rgba(181,101,28,.32);
  --tel:#18877e;--td:rgba(24,135,126,.08);--tbd:rgba(24,135,126,.32);
  --blu:#2a6fd0;--bld:rgba(42,111,208,.08);--blb:rgba(42,111,208,.32);
  --grn:#258a5a;--gnd:rgba(37,138,90,.08);--gnb:rgba(37,138,90,.32);
  --vio:#6a4fd0;--vd:rgba(106,79,208,.08);--vb:rgba(106,79,208,.32);
  --mark:rgba(201,168,76,.28);--ongold:#fff;--shadow:rgba(0,0,0,.12);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--font-b);font-size:16px;line-height:1.6;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--sf)}
button{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
a{color:var(--gold);font-weight:600}
strong{font-weight:600;color:var(--tx)}
h1,h2{text-wrap:balance}
.c-gold{--c:var(--gold);--cd:var(--gd);--cb:var(--gb)}
.c-red{--c:var(--red);--cd:var(--rd);--cb:var(--rb)}
.c-amber{--c:var(--amb);--cd:var(--ad);--cb:var(--abd)}
.c-teal{--c:var(--tel);--cd:var(--td);--cb:var(--tbd)}
.c-blue{--c:var(--blu);--cd:var(--bld);--cb:var(--blb)}
.c-green{--c:var(--grn);--cd:var(--gnd);--cb:var(--gnb)}
.c-violet{--c:var(--vio);--cd:var(--vd);--cb:var(--vb)}

/* Header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--sf);border-bottom:1px solid var(--bd);min-height:60px;display:flex;align-items:center;gap:10px;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{width:42px;height:42px;border-radius:8px;overflow:hidden;background:#000;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;border:none;padding:0}
.htitle{font-family:var(--font-d);font-size:18px;font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsub{font-size:12px;color:var(--tx3)}
.hl{min-width:0;flex:1}
.achip{display:flex;align-items:center;gap:8px;background:var(--cd);border:1px solid var(--cb);color:var(--c);border-radius:20px;padding:5px 12px 5px 6px;cursor:pointer;font-weight:700;font-size:14px;white-space:nowrap;flex-shrink:0}
.achip .ad{width:24px;height:24px;border-radius:50%;background:var(--c);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px}
.achip small{font-weight:500;color:var(--tx3);font-size:12px}
.srch{position:relative;width:280px;max-width:36vw}
.srch input{width:100%;background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:8px 12px 8px 34px;color:var(--tx);font-size:15px;font-family:inherit;outline:none}
.srch input:focus{border-color:var(--gb)}
.srch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--tx3)}
.sres{position:absolute;top:calc(100% + 6px);right:0;left:0;min-width:280px;background:var(--sf);border:1px solid var(--bd2);border-radius:12px;box-shadow:0 10px 30px var(--shadow);max-height:60vh;overflow:auto;display:none;padding:6px}
.sres.on{display:block}
.sres button{width:100%;text-align:left;background:none;border:none;padding:9px 10px;border-radius:8px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;font-size:15px}
.sres button:hover{background:var(--sf2)}
.sres .ic{color:var(--c);width:18px;text-align:center;flex-shrink:0}
.sres small{display:block;color:var(--tx3);font-size:12px}
.sres .none{padding:12px;color:var(--tx3);font-size:14px}
.tbtn{background:var(--sf2);border:1px solid var(--bd);border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:16px;flex-shrink:0}
.tbtn:hover{border-color:var(--bd2)}

.wrap{max-width:980px;margin:0 auto;padding-block:26px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (prefers-reduced-motion:no-preference){.wrap{animation:fi .18s ease}}
@keyframes fi{from{transform:translateY(5px)}to{transform:none}}

/* Path */
.path{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:18px;font-size:14px}
.back{background:var(--sf);border:1px solid var(--bd2);border-radius:20px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:14px;margin-right:4px}
.back:hover{border-color:var(--gold)}
.path .pc{background:none;border:none;cursor:pointer;color:var(--tx2);font-size:14px;padding:0}
.path .pc:hover{color:var(--gold);text-decoration:underline}
.path .sep{color:var(--tx3)}
.path .cur{color:var(--tx);font-weight:600}

/* Selector de área */
.gate-k{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.gate-h{font-family:var(--font-d);font-size:34px;line-height:1.15;margin-bottom:8px}
.gate-p{color:var(--tx2);max-width:62ch;margin-bottom:24px}
.agrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.acard{background:var(--sf);border:1px solid var(--bd);border-top:3px solid var(--c);border-radius:16px;padding:18px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:transform .15s,border-color .15s}
.acard:hover{transform:translateY(-2px);border-color:var(--c)}
.acard .ai{width:44px;height:44px;border-radius:12px;background:var(--cd);color:var(--c);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
.acard .an{font-weight:700;font-size:18px;line-height:1.25}
.acard .at{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--c)}
.acard .aw{font-size:14px;color:var(--tx2);line-height:1.5}
.acard .ago{margin-top:auto;padding-top:6px;font-size:14px;font-weight:700;color:var(--c)}
.gate-alt{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.ghost{background:var(--sf);border:1px solid var(--bd2);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:600;font-size:15px;display:flex;gap:8px;align-items:center}
.ghost:hover{border-color:var(--gold)}
.ghost small{color:var(--tx3);font-weight:500}

.draft{display:inline-flex;align-items:center;gap:6px;background:var(--ad);border:1px dashed var(--abd);color:var(--amb);border-radius:8px;padding:3px 9px;font-size:12px;font-weight:700;letter-spacing:.03em}

/* Perfil del área */
.aph{display:flex;gap:14px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.aph .ai{width:54px;height:54px;border-radius:15px;background:var(--cd);color:var(--c);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;flex-shrink:0}
.aph h1{font-family:var(--font-d);font-size:30px;line-height:1.15}
.aph .at{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.lead{font-size:17px;color:var(--tx);max-width:68ch;margin-bottom:20px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:22px}
.pbox{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;min-width:0}
.pbox h3{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);margin-bottom:8px}
.pbox ul{list-style:none;display:flex;flex-direction:column;gap:7px}
.pbox li{font-size:15px;color:var(--tx2);line-height:1.5;padding-left:16px;position:relative}
.pbox li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--c)}
.pend{background:var(--ad);border:1px dashed var(--abd);border-radius:14px;padding:16px;margin-bottom:22px}
.pend h3{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--amb);margin-bottom:8px}
.pend li{font-size:15px;color:var(--tx2);margin-left:18px;line-height:1.55}
.qbtn{margin-top:4px}

/* Comparativa */
.tscroll{overflow-x:auto;border:1px solid var(--bd);border-radius:14px;background:var(--sf);margin-bottom:24px}
table.cmp{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
.cmp th,.cmp td{padding:12px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--bd)}
.cmp tr:last-child td{border-bottom:none}
.cmp thead th{font-size:13px;color:var(--c);border-bottom:2px solid var(--c);white-space:nowrap}
.cmp tbody th{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);width:120px}
.cmp td{color:var(--tx2);line-height:1.5}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:10px;margin-bottom:10px}
.fnode{background:var(--sf);border:1px solid var(--cb);border-radius:12px;padding:10px 14px;min-width:0;flex:1 1 150px}
.fnode b{display:block;color:var(--c);font-size:15px}
.fnode span{font-size:13px;color:var(--tx2)}
.farr{align-self:center;color:var(--tx3);font-size:20px}
.sec-h{font-family:var(--font-d);font-size:22px;margin:4px 0 12px}

/* Nodos */
.q-step{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.q{font-family:var(--font-d);font-size:30px;line-height:1.2;margin-bottom:6px}
.qh{color:var(--tx2);margin-bottom:22px;font-size:16px}
.first{display:flex;align-items:center;gap:14px;background:var(--gd);border:1px solid var(--gb);border-radius:16px;padding:14px 16px;margin-bottom:22px;cursor:pointer;width:100%;text-align:left}
.first:hover{border-color:var(--gold)}
.first .n{width:36px;height:36px;border-radius:50%;background:var(--gold);color:var(--ongold);font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.first b{display:block;font-size:16px}
.first span{font-size:14px;color:var(--tx2)}
.first .go{margin-left:auto;color:var(--gold);font-weight:700;white-space:nowrap}
.mine{display:flex;align-items:center;gap:14px;background:var(--cd);border:1px solid var(--cb);border-radius:16px;padding:14px 16px;margin-bottom:22px;cursor:pointer;width:100%;text-align:left}
.mine:hover{border-color:var(--c)}
.mine .n{width:36px;height:36px;border-radius:11px;background:var(--c);color:var(--bg);font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mine b{display:block;font-size:16px}
.mine span{font-size:14px;color:var(--tx2)}
.mine .go{margin-left:auto;color:var(--c);font-weight:700;white-space:nowrap}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.opt{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:20px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:150px;transition:transform .15s,border-color .15s;position:relative}
.opt:hover{border-color:var(--c);transform:translateY(-2px)}
.opt .oi{width:46px;height:46px;border-radius:13px;background:var(--cd);color:var(--c);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;margin-bottom:6px}
.opt .ot{font-weight:700;font-size:17px;line-height:1.3}
.opt .od{font-size:14px;color:var(--tx2);line-height:1.45}
.opt .arrow{position:absolute;top:20px;right:18px;color:var(--tx3);font-size:18px}
.opt:hover .arrow{color:var(--c)}
.opt.big{min-height:170px}
.opt.emg{background:linear-gradient(135deg,var(--rd),transparent 70%),var(--sf);border-color:var(--rb)}
.opt .kind{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--tx3);margin-top:auto;padding-top:8px}

/* Protocolo */
.ph{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}
.ph .oi{width:50px;height:50px;border-radius:14px;background:var(--cd);color:var(--c);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;font-weight:700}
.pt{font-family:var(--font-d);font-size:28px;line-height:1.2}
.pw{color:var(--tx2);font-size:15px;margin-top:4px}
.applies{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:16px;font-size:13px;color:var(--tx3)}
.tag{display:inline-flex;align-items:center;gap:5px;background:var(--cd);color:var(--c);border:1px solid var(--cb);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700}
.tag.off{background:none;color:var(--tx3);border-color:var(--bd);font-weight:500;text-decoration:line-through}
.ebanner{background:var(--red);color:#fff;border-radius:14px;padding:13px 16px;font-weight:700;margin-bottom:16px;display:flex;gap:10px;align-items:center}
.ess{background:var(--sf);border:1px solid var(--gb);border-radius:18px;padding:18px;margin-bottom:22px}
.ess-h{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.ess-i{display:flex;gap:12px;align-items:flex-start;padding:8px 0;font-size:17px;line-height:1.45}
.ess-i+.ess-i{border-top:1px solid var(--bd)}
.ess-i i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--gold);color:var(--ongold);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dh{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);margin:0 0 10px}
.det{display:flex;flex-direction:column;gap:10px}
.dc{background:var(--sf);border:1px solid var(--bd);border-radius:16px;overflow:hidden}
.dc.op{border-color:var(--bd2)}
.db{width:100%;background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:left}
.db:hover{background:var(--sf2)}
.db .di{width:34px;height:34px;border-radius:10px;background:var(--cd);color:var(--c);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;font-weight:700}
.db .dt{font-weight:600;font-size:16px;line-height:1.3}
.db .dk{font-size:12px;color:var(--tx3);display:block;font-weight:500}
.db .ar{margin-left:auto;color:var(--tx3);transition:transform .15s}
.dc.op .ar{transform:rotate(180deg)}
.dbody{display:none;padding:4px 16px 16px}
.dc.op .dbody{display:block}
.steps{display:flex;flex-direction:column}
.st{display:grid;grid-template-columns:32px 1fr;gap:12px;padding:10px 0;position:relative}
.st>div{min-width:0}
.st:not(:last-child)::before{content:'';position:absolute;left:15px;top:44px;bottom:-4px;width:2px;background:var(--bd)}
.sn{width:32px;height:32px;border-radius:50%;background:var(--cd);color:var(--c);border:1.5px solid var(--cb);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.stt{font-weight:600;margin-bottom:2px}
.std{font-size:15px;color:var(--tx2);line-height:1.6;overflow-wrap:anywhere}
.std strong,.rl span strong,.sp strong{background:var(--mark);padding:0 3px;border-radius:3px}
.rl{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--bd);font-size:15px;color:var(--tx2);line-height:1.55}
.rl:last-child{border-bottom:none}
.rl b{width:20px;height:20px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;background:var(--cd);color:var(--c);margin-top:2px}
.rl.neg b{background:var(--red);color:#fff}
.rl.neg{color:var(--tx)}
.rl span{min-width:0;overflow-wrap:anywhere}
.sp{background:var(--sf2);border-left:3px solid var(--gold);border-radius:0 12px 12px 0;padding:12px 14px;font-size:15px;color:var(--tx2);line-height:1.75;margin-top:8px;overflow-wrap:anywhere}
.copy{display:inline-block;margin-top:10px;background:var(--sf);border:1px solid var(--gb);color:var(--gold);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600;cursor:pointer}
.copy:hover{background:var(--gold);color:var(--ongold)}
.next{margin-top:28px}
.next .opts{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.next .opt{min-height:0;padding:14px 16px;flex-direction:row;align-items:center;gap:12px}
.next .opt .oi{width:36px;height:36px;font-size:16px;margin:0;flex-shrink:0}
.next .opt .ot{font-size:15px}


/* Biblioteca */
.lib-tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;align-items:center}
.lib-chip{background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer;color:var(--tx2)}
.lib-chip:hover{border-color:var(--bd2);color:var(--tx)}
.lib-chip.on{background:var(--gold);border-color:var(--gold);color:var(--ongold)}
.lib-chip small{opacity:.7;font-weight:500;margin-left:3px}
.lib-q{flex:1 1 220px;min-width:0;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;color:var(--tx);font:inherit;font-size:15px;outline:none}
.lib-q:focus{border-color:var(--gb)}
.lib-sec{margin-bottom:28px}
.lib-sh{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.lib-sh h2{font-family:var(--font-d);font-size:22px}
.lib-sh span{font-size:13px;color:var(--tx3)}
.lib-sd{font-size:14px;color:var(--tx2);margin-bottom:12px;max-width:68ch}
.lib-list{display:flex;flex-direction:column;gap:10px}
.lib-it{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;min-width:0}
.lib-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:6px}
.lib-meta b{font-size:15px}
.lib-meta .src{font-size:13px;color:var(--tx3)}
.lib-it .sp{margin-top:4px}
.lib-acts{display:flex;gap:8px;flex-wrap:wrap}
.lib-acts .copy{margin-top:10px}
.mot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:12px}
.mot{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;cursor:pointer;display:grid;grid-template-columns:36px 1fr;grid-template-rows:auto auto;column-gap:10px;text-align:left;align-items:center}
.mot:hover{border-color:var(--c)}
.mot.on{background:var(--cd);border-color:var(--c)}
.mot .oi{grid-row:1/3;width:36px;height:36px;border-radius:10px;background:var(--cd);color:var(--c);display:flex;align-items:center;justify-content:center;font-weight:700}
.mot.on .oi{background:var(--c);color:var(--bg)}
.mot .mt{font-weight:600;font-size:15px;line-height:1.3}
.mot .mc{font-size:12px;color:var(--tx3)}
.mot-hint{font-size:14px;color:var(--tx3)}
.mot-open{padding-top:4px}
.lib-empty{padding:24px;text-align:center;color:var(--tx3);background:var(--sf);border:1px dashed var(--bd2);border-radius:14px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(20px);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .2s;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%)}

  .pt,.aph h1{font-size:23px}
  .opt{min-height:0}
  .first,.mine{flex-wrap:wrap}
  .first .go,.mine .go{margin-left:50px}
}

<script>
const D=[
{s:"Flujos de llamada",id:"flujos",icon:"☎",sc:"amb",ch:[
{id:"fl_ib",amb:true,label:"Flujo base — llamada perfecta (inbound)",icon:"✓",color:"gold",sub:"11 pasos obligatorios",
content:{title:"Flujo base — llamada perfecta",icon:"✓",color:"gold",
intro:"Todo asesor de CS debe seguir este flujo en CADA llamada entrante sin omitir pasos. Cada paso tiene un propósito específico.",
secs:[
{type:"steps",label:"Los 11 pasos obligatorios",items:[
{n:"1",c:"blue",t:"Saludo corporativo",d:"Decir exactamente: <strong>«Buenos días/tardes/noches, gracias por comunicarse a The Mendoza Law Firm, le atiende [tu nombre completo].»</strong><br>• Usar el nombre completo de la firma: The Mendoza Law Firm.<br>• No usar variantes como 'la firma de la abogada María Mendoza'."},
{n:"2",c:"blue",t:"Candados de seguridad (filtros de identidad)",d:"Solicitar y verificar <strong>al menos dos filtros</strong> ANTES de dar cualquier información del caso:<br>1. <strong>Nombre completo</strong> del titular del caso<br>2. <strong>Número de cliente</strong> o fecha de nacimiento<br>3. <strong>Teléfono registrado</strong>, correo electrónico o dirección física<br><br>Si el cliente no pasa los filtros → <strong>dejar registro de la interacción en el CRM</strong>.<br>Si llama alguien que no es el titular → ver protocolo de terceras personas."},
{n:"3",c:"blue",t:"Motivo de la llamada",d:"Preguntar directamente: <strong>«¿En qué le puedo ayudar el día de hoy?»</strong><br>• Escuchar sin interrumpir.<br>• Tomar notas de los puntos clave.<br>• No asumir el motivo antes de que el cliente lo diga."},
{n:"4",c:"blue",t:"Parafraseo de confirmación",d:"Reformular lo que el cliente dijo para confirmar que entendiste correctamente.<br>Ejemplo: <strong>«Entonces, si he entendido bien, usted necesita… ¿es correcto?»</strong><br>• Esto evita resolver el problema equivocado.<br>• Genera confianza y hace sentir al cliente escuchado."},
{n:"5",c:"blue",t:"Solicitar 3 minutos para verificar, en caso de ser necesario",d:"Decir: <strong>«Permítame un momento, voy a revisar su caso. ¿Puede darme unos 3 minutos?»</strong><br><br>Durante esos 3 minutos puedes:<br>• Leer <strong>al menos las últimas 3 notas</strong> del caso para entender la información.<br>• Usar la <strong>IA del CRM</strong> para preguntar información concreta del proceso que ayude a solucionar la duda del cliente.<br>• Revisar protocolos (si es aplicable).<br>• Preguntar o escalar la situación con un TL.<br>• Escalar en <strong>Tier 1</strong>.<br><br>⚠ El límite es por bloque. Si necesitas más tiempo, regresa antes de los 3 minutos y solicita otro bloque."},
{n:"6",c:"blue",t:"Resolución de la duda",d:"Regresar antes de cumplirse los 3 minutos.<br>• Comenzar siempre con: <strong>«Gracias por su tiempo en espera.»</strong><br>• Explicar de forma clara, sin jerga técnica.<br>• Adaptar la explicación al nivel de entendimiento del cliente."},
{n:"7",c:"blue",t:"Asistencia adicional",d:"Preguntar obligatoriamente en cada llamada:<br><strong>«¿Hay algo más en lo que pueda servirle el día de hoy?»</strong><br>Variantes: «¿Hay algo más en lo que le pueda apoyar?» / «¿Tiene alguna otra pregunta sobre su caso?»<br>• No saltarse este paso aunque parezca que ya terminó la llamada."},
{n:"8",c:"blue",t:"Registro de información",d:"Solicitar 2 minutos para terminar la nota y/o escalar el caso en caso de ser necesario.<br>Decir: <strong>«Permítame dos minutos para dejar registrada la llamada antes de finalizar.»</strong>"},
{n:"9",c:"blue",t:"Documentación en CRM y escalaciones",d:"Durante esos 2 minutos completar la información de la interacción para el registro en el CRM con la siguiente estructura:<br><strong>Reason:</strong><br><strong>Solution:</strong><br><strong>Behavior:</strong><br><strong>CN o DoB:</strong><br><br>Hacer la escalación en <strong>Tier 1</strong> con la plantilla <strong>ESCALACIÓN CS</strong> (ver abajo)."},
{n:"10",c:"blue",t:"Verificación final",d:"Antes de regresar con el cliente confirmar:<br>• La nota de CRM esté completa, clara y guardada.<br>• La escalación ha sido enviada por los canales correspondientes."},
{n:"11",c:"blue",t:"Despedida corporativa",d:"Regresar: <strong>«Gracias por su espera, ya he dejado registrada toda la información.»</strong><br><br>Despedida: <strong>«Gracias por haberse comunicado a The Mendoza Law Firm, le atendió [tu nombre]. Que tenga un excelente día, Sr./Sra. [Apellido del cliente].»</strong>"}
]},
{type:"acc",label:"Plantilla de escalación Tier 1",tag:"gold",tl:"Plantilla",body:[{type:"speech",text:"ESCALACIÓN CS | [ÁREA]<br>Case ID:<br>Cliente:<br>Motivo: [ej. CL quiere su reembolso]<br>Acción requerida:<br>Prioridad: [Regular / Urgente]<br>Responsable: @"}]},
{type:"rules",label:"Reglas innegociables",color:"gold",items:[
"Usar SIEMPRE el nombre completo: The Mendoza Law Firm — nunca variantes",
"Nunca proporcionar información de un caso sin validar al menos 2 filtros de seguridad",
"Los tiempos de espera se gestionan en bloques máximos de 3 minutos",
"Revisar SIEMPRE las notas en CRM antes de informar sobre estatus del caso",
"La oferta de asistencia adicional es obligatoria en cada llamada"
]}
]}},
{id:"fl_video",amb:true,label:"Videollamada de CS",icon:"▶",color:"teal",sub:"Flujo específico para video",
content:{title:"Flujo — videollamada CS",icon:"▶",color:"teal",
secs:[
{type:"steps",label:"Flujo completo de videollamada",items:[
{n:"1",c:"teal",t:"Saludo corporativo",d:"«Buenos días, gracias por comunicarse a The Mendoza Law Firm, le atiende [nombre].»"},
{n:"2",c:"teal",t:"Verificación técnica inicial",d:"Confirmar:<br>• <strong>Audio</strong>: «¿Me escucha correctamente?»<br>• <strong>Video</strong>: «¿Me puede ver bien?»<br>• <strong>Conexión</strong>: «¿La conexión es clara o presenta algún problema?»<br><br>Aclaración al cliente: <em>«Durante la videollamada estaré revisando su caso y tomando anotaciones, por lo que en momentos podría desviar la mirada; sin embargo, continúo atendiendo su información.»</em><br><br>Si falla el sistema: informar al cliente y regresar la llamada."},
{n:"3",c:"teal",t:"Compartir pantalla correctamente",d:"<strong>Preparación previa:</strong> Tener DOS ventanas abiertas.<br><br>• <strong>Ventana IZQUIERDA</strong> (NO se comparte): TramCase, Dropbox, tiempos de procesamiento, Registro de llamadas, ClickUp.<br>• <strong>Ventana DERECHA</strong> (SÍ se comparte): página de la abogada y lo que se quiera mostrar al cliente.<br><br><strong>En 8x8</strong>: clic en ícono compartir → 'Application Window' → seleccionar ventana derecha → 'Share'.<br>Se puede arrastrar contenido de la izquierda a la derecha para mostrárselo al cliente.<br><br><strong>⚠ INSTRUCCIÓN: La videollamada se realiza desde Google Meet.</strong> Conectarse desde el Meet de la cuenta support. Al ingresar, el sistema realizará automáticamente una grabación de la videollamada y del transcript — <strong>asegúrate de que ambos estén activos</strong>. Al finalizar, encontrarás el video y el transcriptor en tu Drive dentro de la carpeta de Meetings."},
{n:"4",c:"teal",t:"Filtros de seguridad",d:"Nombre completo + Número de cliente o fecha de nacimiento + Teléfono, email o dirección registrada."},
{n:"5",c:"teal",t:"Motivo y parafraseo — 3 minutos",d:"Preguntar motivo. Pedir 3 minutos para revisar el caso."},
{n:"6",c:"teal",t:"Resolución con pantalla compartida",d:"Mostrar al cliente su estatus, proceso o documentos relevantes mientras se explica."},
{n:"7",c:"teal",t:"Cierre operativo",d:"2 minutos para documentar. Notas en TramCase + Registro de llamadas. Despedida corporativa."}
]}
]}},
{id:"fl_out",amb:true,label:"Llamada saliente (outbound)",icon:"→",color:"teal",ch:[
{id:"fl_out_std",amb:true,label:"Outbound estándar",icon:"↗",color:"teal",
content:{title:"Script — llamada saliente estándar",icon:"↗",color:"teal",
secs:[
{type:"steps",label:"Preparación previa a la llamada (asesores Chat/Textos — ClickUp)",items:[
{n:"1",c:"blue",t:"Revisar contexto de la tarea",d:"Antes de marcar, leer completa la descripción de la tarea en ClickUp para entender qué solicita el cliente y qué área la originó."},
{n:"2",c:"blue",t:"Verificar en TramCase si el cliente ya se contactó",d:"Revisar las últimas notas en TramCase.<br>• Si el cliente ya llamó por su cuenta a CS → <strong>marcar la tarea como COMPLETADO</strong> sin hacer la llamada. No tiene caso interrumpirlo de nuevo.<br>• Si no hay nota reciente → proceder con la llamada."},
{n:"3",c:"blue",t:"Asignarse la tarea y cambiar estado",d:"Asignarse el propio nombre en la tarea de ClickUp y cambiar el estado:<br>• <strong>Pendiente → En curso</strong> al iniciar.<br>• <strong>En curso → Completado</strong> al resolver."},
{n:"4",c:"amber",t:"Duda antes de llamar → escalar al TL primero",d:"Si después de revisar TramCase y la tarea no queda claro qué decirle al cliente o cómo manejar la situación, <strong>consultar al TL antes de marcar</strong>. No llamar al cliente con información incompleta."},
{n:"5",c:"teal",t:"Nota en TramCase al concluir",d:"La nota de este tipo de llamada lleva un título diferente al outbound estándar:<br><strong>«Outgoing Call / Chat Request»</strong><br>No usar «Outgoing Call» genérico — este formato identifica que la llamada provino de una tarea de ClickUp."}
]},
{type:"speech",label:"Apertura",text:"«Buen día/tarde/noche, ¿es usted el Sr./Sra. <strong>[Nombre del cliente]</strong>?»"},
{type:"steps",label:"Flujo completo",items:[
{n:"1",c:"teal",t:"Identificar al cliente",d:"«Buen día, ¿es usted el Sr./Sra. [Nombre]?»"},
{n:"2",c:"teal",t:"Presentarse",d:"«Le habla <strong>[tu nombre]</strong> de The Mendoza Law Firm. Por motivos de seguridad, le voy a confirmar sus filtros.»"},
{n:"3",c:"teal",t:"Candados de seguridad",d:"Mismo proceso: nombre completo + número de cliente o fecha de nacimiento + teléfono/email/dirección."},
{n:"4",c:"teal",t:"Motivo y resolución",d:"«El motivo de mi llamada es…» → flujo estándar con parafraseo y espera de 3 minutos."},
{n:"5",c:"teal",t:"Cierre",d:"2 min para documentar, despedida corporativa con apellido del cliente."}
]}
]}},
{id:"fl_rem",amb:true,label:"Remarcación automática",icon:"↺",color:"amber",
content:{title:"Protocolo — llamadas de remarcación automática",icon:"↺",color:"amber",
intro:"Ocurre cuando el sistema remarca una llamada entrante no contestada. Para el sistema es outbound pero el cliente la percibe como llamada de la firma.",
secs:[
{type:"speech",label:"Script de presentación obligatorio",text:"«Buen día/tarde/noche, me comunico de The Mendoza Law Firm, mi nombre es <strong>[tu nombre]</strong> y el motivo de esta llamada es por una solicitud que nos hizo para que lo contactáramos de vuelta.»"},
{type:"steps",label:"3 escenarios posibles",items:[
{n:"A",c:"teal",t:"Cliente no necesitaba ayuda",d:"1. Solicitar nombre. 2. Agradecer. 3. Nota informativa en TRAM + ClickUp. 4. Cambiar a <strong>COMPLETADO</strong> en ClickUp. 5. Despedida."},
{n:"B",c:"teal",t:"Cliente sí llamó y tiene duda",d:"1. Filtros de seguridad. 2. Escuchar y parafrasear. 3. 3 minutos para revisar. 4. Resolver. 5. Asistencia adicional. 6. 2 minutos para registrar. 7. Cambiar a <strong>COMPLETADO</strong>. 8. Despedida."},
{n:"C",c:"amber",t:"Cliente no contesta",d:"1. Tomar número del sistema 8x8. 2. Localizar tarea en ClickUp y caso en TRAM. 3. Nota de 'no contacto' en ClickUp. 4. Cambiar a <strong>EN CURSO</strong> (detiene remarcación, pasa a TEXTOS). 5. Nota TRAM con plantilla."}
]},
{type:"rules",label:"Reglas importantes",color:"amber",items:[
"COMPLETADO = el sistema deja de remarcar permanentemente ese número",
"EN CURSO = el sistema deja de remarcar y pasa al equipo de TEXTOS para seguimiento",
"SIEMPRE asignarse el nombre propio en la tarea de ClickUp",
"Plantilla TRAM (ES): 'Se intentó contactar al cliente para dar seguimiento a una llamada pendiente de CS. No se obtuvo respuesta. Si el cliente se comunica, favor de brindarle apoyo completo.'",
"Plantilla TRAM (EN): 'An attempt was made to contact the client to follow up on a pending CS call. No response was received. If the client contacts the firm, please provide full assistance.'"
]}
]}}
]}
]},
{s:"Motivos de llamada",id:"motivos",icon:"❓",sc:"blu",ch:[
{id:"m_st_ok",blu:true,label:"Estatus — caso en tiempos normales",icon:"◉",color:"teal",
content:{"title":"Speech — caso enviado a USCIS","icon":"◉","color":"teal","secs":[{"type":"speech","label":"Speech — caso pendiente en USCIS","text":"«En este momento, su caso está pendiente. USCIS publica actualmente que está completando el 80% de las peticiones en aproximadamente <strong>[X] meses</strong>. Sin embargo, actualmente estamos viendo atrasos en los casos de USCIS, tanto en nuestra oficina como a nivel nacional. Esto no está sucediendo únicamente con su caso.<br><br>Hasta este momento, no tenemos ninguna notificación de USCIS solicitando evidencia adicional o alguna acción de su parte. La falta de respuesta se debe principalmente a la acumulación de casos que existe actualmente en las oficinas de USCIS.<br><br>Sabemos que la espera puede ser difícil. Los casos están siendo revisados de manera más estricta que hace algunos años, y estamos viendo más solicitudes de evidencia y posibles intentos de denegación en algunos casos. Mientras su caso continúe pendiente, existe la posibilidad de que haya cambios en las políticas migratorias que puedan beneficiar el procesamiento de los casos.<br><br>Por ahora, su caso simplemente continúa pendiente y no tenemos ninguna solicitud pendiente de USCIS ni ninguna acción pendiente de su parte.»"},{"type":"rules","label":"Qué verificar y qué hacer","color":"teal","items":["Revisa fecha de envío a USCIS, fecha de recibos iniciales y estatus en la página oficial de USCIS","Envía al cliente documentos como recibos iniciales, aprobaciones o prima facie vigente, en caso de que no se le hayan enviado antes","Consulta la <strong>Calculadora de tiempos</strong> para el dato de [X] meses (enlace pendiente)","No mencionar tiempos exactos ni prometer fechas o resultados"]}]}},
{id:"m_st_at",blu:true,label:"Estatus — cliente molesto por tiempos",icon:"⚠",color:"amber",
content:{"title":"Cliente molesto por tiempos de procesamiento de USCIS","icon":"⚠","color":"amber","secs":[{"type":"steps","label":"Qué hacer","items":[{"n":"1","c":"amber","t":"Dar contención al cliente","d":"Validar su molestia con la metodología VDPC antes de explicar."},{"n":"2","c":"amber","t":"Enviar documentos del caso","d":"Envía al cliente documentos como <strong>recibos iniciales, aprobaciones o prima facie vigente</strong>, en caso de que no se le hayan enviado antes."},{"n":"3","c":"red","t":"Si el cliente está muy insistente o el caso es inusual","d":"Si el cliente está muy insistente, enojado, o vemos una situación de emergencia, alarmante o inusual en el caso, podemos ofrecer una <strong>llamada con USCIS</strong>: llamada entre un asesor de la firma, el cliente y USCIS para preguntar información del caso.<br>• Escalar en el <strong>Forms de Back Office</strong>.<br>• Back Office puede demorar hasta un mes en llamarle."}]},{"type":"rules","label":"A tener en cuenta","color":"red","items":["No ofrecer e-request","No mencionar tiempos exactos ni prometer fechas o resultados"]}]}},
{id:"m_file",blu:true,label:"Solicitud de expediente (File Request)",icon:"⊞",color:"gold",
content:{"title":"Script completo — solicitud de expediente","icon":"⊞","color":"gold","secs":[{"type":"steps","label":"Escenario base — solicitud simple","items":[{"n":"1","c":"gold","t":"Registrar la solicitud y confirmar el motivo","d":"Decir: <strong>«Claro, este es su expediente y usted tiene derecho a recibir una copia. Voy a registrar su solicitud en este momento, sin embargo, debo hacer unas preguntas como protocolo de escalación.»</strong><br>• Confirmar el motivo por el que está solicitando su file."},{"n":"2","c":"gold","t":"Forma de envío","d":"Preguntar: <strong>«¿Cómo le gustaría recibir su expediente?»</strong><br>• Correo electrónico: archivo o enlace seguro.<br>• Correo físico: USB o documentos físicos.<br>• Recogerlo en una de nuestras oficinas.<br><br>Confirmar: correo electrónico, dirección física (si aplica) y número de teléfono.<br>Si desea enviar una copia a otro abogado → confirmar el correo electrónico del abogado."},{"n":"3","c":"gold","t":"Verificar fechas importantes","d":"Decir: <strong>«Antes de continuar, quiero verificar si tiene alguna fecha importante relacionada con su caso.»</strong><br>Preguntar si tiene:<br>• Fecha de audiencia.<br>• Fecha límite para presentar documentación.<br>• Fecha de corte migratoria.<br>• Notice to Appear (NTA) u otra notificación de la corte.<br><br>Si tiene una fecha próxima o un plazo menor a <strong>3–5 días hábiles</strong> → registrarlo y escalarlo con un TL como urgente."},{"n":"4","c":"gold","t":"Ofrecer llamada con abogado","d":"Decir: <strong>«Como parte del protocolo, vamos a agendar una llamada de seguimiento con la abogada María Álvarez. En esta llamada podrá hacer sus preguntas, resolver sus dudas y revisar con ella la estrategia de su caso.»</strong><br>→ Agendar llamada con la abogada María Álvarez."},{"n":"5","c":"gold","t":"Check-in del servicio","d":"Preguntar: <strong>«Antes de terminar, ¿hay alguna molestia o preocupación con su caso o con el servicio que le hemos brindado?»</strong><br><strong>«¿Hay alguna preocupación específica o alguna pregunta que no haya sido respondida y en la que podamos ayudarle?»</strong><br><br>Si necesita orientación legal: <strong>«En la llamada que vamos a agendar, podrá revisar sus preguntas e inquietudes directamente con la abogada.»</strong><br>Si el cliente no desea responder, no insistir."},{"n":"6","c":"gold","t":"Actualización del caso (cuando aplique)","d":"<strong>«Entendemos que los tiempos de procesamiento de USCIS están siendo considerablemente largos. Estos retrasos están afectando a muchos casos actualmente. Su caso continúa siendo trabajado por nuestra firma y le mantendremos informado ante cualquier actualización.»</strong>"},{"n":"7","c":"gold","t":"Tiempo de entrega","d":"<strong>«La firma solicita de 3 a 5 días hábiles para reunir y preparar el expediente completo. Este es el tiempo máximo; si está listo antes, se enviará antes.»</strong><br><strong>«Si usted tiene una fecha límite o necesita el expediente antes de ese plazo, nos puede comentar para registrarlo como urgente.»</strong>"}]},{"type":"rules","label":"Recordatorio para el agente","color":"red","items":["La solicitud se registra INMEDIATAMENTE","No condicionar el expediente a responder preguntas","No condicionar el expediente a hablar con un abogado","No condicionar el expediente a pago o firma de documentos","No condicionar el expediente a explicaciones del cliente","Siempre notificar al TL"]},{"type":"acc","label":"Reporte File Request","tag":"gold","tl":"Plantilla","body":[{"type":"speech","text":"REPORTE FILE REQUEST<br>Nombre del CL:<br>Motivo de solicitud:<br>Forma de envío:<br>Email / Dirección de envío:<br>Número de teléfono:<br>Fecha de audiencia y/o corte:<br>Fecha límite para presentar documentación:<br>Molestia o preocupación del cliente:<br>Llamada agendada con Atty. María Álvarez:<br>Fecha y hora de la llamada:<br>Notas adicionales:"}]},{"type":"acc","label":"Escenario — cliente tiene corte próxima","tag":"amber","tl":"Escenario","body":[{"type":"rules","items":["Preguntar la fecha de la corte","Preguntar el tipo de corte: penal o migratoria","Datos del abogado (si aplica): nombre completo, número de teléfono + extensión (si aplica) y correo electrónico"]}]},{"type":"acc","label":"Escenario — lo solicita un abogado externo / el cliente quiere cambiar de abogado","tag":"red","tl":"Escenario","body":[{"type":"rules","items":["Preguntar si ya cuenta con representación del otro abogado","Datos del abogado (si aplica): nombre completo, número de teléfono + extensión (si aplica) y correo electrónico"]}]}]}},
{id:"m_pago",blu:true,label:"Pago de mensualidad",icon:"$",color:"teal",
content:{"title":"Protocolo — pago de mensualidad en LawPay","icon":"$","color":"teal","secs":[{"type":"steps","label":"Proceso de cobro paso a paso","items":[{"n":"1","c":"blue","t":"Si el cliente quiere hacer el pago con CS","d":"Verificar con el cliente la cantidad."},{"n":"2","c":"blue","t":"Llenar la plataforma LawPay","d":"Ingresar datos del cliente:<br>• <strong>Nombre completo</strong> como aparece registrado en el CRM.<br>• <strong>Monto</strong> (siempre confirmarlo antes con un TL).<br>• <strong>Concepto del pago</strong>: Monthly payment.<br><br>Recuerda que, por seguridad del cliente, no le podemos repetir los datos bancarios al cliente.<br><a href=\"https://secure.lawpay.com/pages/mendozafirm/trust%2Fattyfees\" target=\"_blank\" style=\"color:var(--gold)\">https://secure.lawpay.com/pages/mendozafirm/trust/attyfees</a>"},{"n":"3","c":"blue","t":"Fraseología de autorización (obligatoria antes de procesar el pago)","d":"Decir exactamente: <strong>«Voy a realizar un cobro por el monto de $[monto] USD por concepto de pago mensual para el caso a nombre de [nombre completo del titular del caso]. ¿Es correcto?»</strong><br>Esperar confirmación verbal antes de procesar."},{"n":"4","c":"teal","t":"Post-cobro — 3 acciones obligatorias","d":"1. Copiar el comprobante de pago.<br>2. Adjuntar el comprobante en las notas del CRM, como una nota adicional a la correspondiente a la interacción.<br>3. Enviar el comprobante por mensaje de texto al cliente desde el CRM (esperar confirmación de recibido)."}]}]}},
{id:"m_cancel",blu:true,label:"Cancelaciones y reembolsos",icon:"✕",color:"amber",
content:{"title":"Protocolo completo — cancelaciones y reembolsos","icon":"✕","color":"amber","secs":[{"type":"steps","label":"Cuando el cliente quiere cancelar","items":[{"n":"1","c":"amber","t":"Contener primero","d":"Agotar la contención antes de escalar. Identificar el motivo real de la molestia.<br><br><strong>⏱ Tiempo máximo de contención: 2 minutos.</strong><br>Si en ese tiempo el cliente no acepta o sigue insistiendo → escalar directamente, sin más intentos.<br>El área de <strong>Retentions</strong> es quien se encarga de la contención profunda — no es función de CS prolongar esta etapa.<br><br>Escalar en el CRM en <strong>«Make a request»</strong> → <strong>Solicitud de Cancelación</strong>."},{"n":"2","c":"amber","t":"Informar sobre el proceso","d":"<strong>«Contamos con un área especializada en gestionar las solicitudes de cancelación. Su solicitud será canalizada con el equipo correspondiente y un asesor se pondrá en contacto con usted para dar seguimiento a su caso y brindarle información sobre los siguientes pasos del proceso.»</strong>"},{"n":"3","c":"amber","t":"Si pregunta por reembolso o tiempos de cancelación","d":"<strong>«Esa información será proporcionada por el área encargada después de hacer una evaluación de la situación.»</strong><br><br><strong>Importante:</strong> nunca proporcionar montos, plazos ni tiempos estimados de cancelación."}]},{"type":"steps","label":"Cuando el cliente ya canceló y pregunta por reembolso","items":[{"n":"1","c":"blue","t":"Verificación previa en el CRM","d":"Antes de proporcionar cualquier información, revisar en el CRM si existe una <strong>nota del equipo de Retentions</strong>. La nota debe especificar los tiempos y la forma en que se realizará el reembolso."},{"n":"2","c":"blue","t":"Si aún no hay nota de Retentions","d":"Indicar al cliente que su solicitud será escalada con el área correspondiente para verificar el estatus y los detalles del reembolso."},{"n":"3","c":"red","t":"Si el cliente está molesto por la demora o amenaza con redes sociales","d":"Escalar con prioridad directamente al TL."}]},{"type":"rules","label":"Importante","color":"red","items":["No proporcionar tiempos ni condiciones de reembolso sin información previamente confirmada por el equipo de Retentions en el CRM","Nunca proporcionar montos, plazos ni tiempos estimados de cancelación"]}]}},
{id:"m_reagenda",blu:true,label:"Reagendar INTAKE / Consulta",icon:"◫",color:"teal",
content:{title:"Protocolo — reagendar citas",icon:"◫",color:"teal",
secs:[
{type:"rules",label:"Protocolo — reagendar citas",color:"teal",items:[
"Para reagendar una cita (Intake o Consulta), se escala mediante el formulario: <a href='https://forms.clickup.com/31633845/f/y5cdn-269314/64XWDTD7ZG7QQJM47J' target='_blank' style='color:var(--tel)'>https://forms.clickup.com/…64XWDTD7ZG7QQJM47J</a> en la categoría de <strong>Reagendar Intake DVS</strong>.",
"Al cliente se le informa que se va a estar realizando contacto con él para confirmar la nueva cita."
]},
{type:"rules",label:"Regla de las 12 horas",color:"teal",items:[
"Toda reagenda debe hacerse con mínimo 12 horas de anticipación a la cita original",
"Si el cliente necesita reagendar con menos de 12 horas → notificar al TL para que gestione con DVS",
"Clientes: pueden reagendar por su cuenta solo 1 vez",
"Agentes de CS: sin límite de reagendamientos cumpliendo la regla de 12 horas"
]}
]}},
{id:"m_viaje",blu:true,label:"Cliente quiere viajar (Travel Call)",icon:"✈",color:"amber",
content:{"title":"Protocolo completo — Travel Call","icon":"✈","color":"amber","intro":"Actualmente, la firma no recomienda que los clientes viajen fuera de Estados Unidos debido a los riesgos migratorios que pueden presentarse al intentar reingresar al país.","secs":[{"type":"rules","label":"Contención — consultas sobre viajes fuera de Estados Unidos","color":"amber","items":["Explicar al cliente que, si sale de Estados Unidos, al intentar regresar podría ser sujeto a una <strong>inspección migratoria</strong>","Durante esta revisión, las autoridades podrían identificar antecedentes migratorios que afecten su posibilidad de reingreso","Dependiendo de las circunstancias de su caso, podrían aplicarse consecuencias migratorias, incluyendo un <strong>castigo permanente de 10 años</strong> que le impedirá el reingreso al país de forma legal"]},{"type":"steps","label":"Si el cliente insiste en realizar el viaje","items":[{"n":"1","c":"amber","t":"Hacer el cuestionario de viaje","d":"Se deberá agendar una consulta legal con un abogado para que revise su situación migratoria, evalúe los riesgos y le oriente antes de decidir viajar. Antes de agendar, preguntar:<br>• ¿Ha tenido algún contacto previo con USCIS?<br>• ¿Tiene alguna audiencia o proceso de corte pendiente?<br>• ¿Cuenta con un <strong>EAD</strong>? Solicitar una fotografía del documento a través del CRM.<br>• ¿Cuál es la fecha de vencimiento de su EAD? (Se requiere una vigencia mínima de <strong>11 meses</strong>.)<br>• ¿Su EAD cuenta con la anotación <strong>«Serves as I-512»</strong>?<br>• ¿Cuenta con la aprobación de su formulario <strong>I-131</strong>?<br>• ¿Cuenta con la aprobación de su formulario <strong>I-360</strong>?<br>• ¿Cuenta con un pasaporte vigente?<br>• ¿Tiene una fecha programada para realizar el viaje?"},{"n":"2","c":"teal","t":"Agendar Callback — Travel Call","d":"Ingresar a: <a href=\"https://ecosystem-customer-service.vercel.app/callbacks/agendado\" target=\"_blank\" style=\"color:var(--gold)\">ecosystem-customer-service.vercel.app/callbacks/agendado</a><br>• Seleccionar al abogado que tenga disponibilidad para atender al cliente.<br>• Completar los datos solicitados para agendar la callback.<br>• En <strong>Type of call</strong>, seleccionar <strong>Travel</strong>.<br>• En <strong>Description</strong>, ingresar el cuestionario de viaje con las preguntas y las respuestas del cliente.<br><br><strong>Importante:</strong> verificar que toda la información del cuestionario esté registrada correctamente para que el abogado pueda revisar el caso antes de la consulta."},{"n":"3","c":"blue","t":"Registro obligatorio en el CRM","d":"• Dejar una nota en el CRM con el título <strong>Travel Call</strong>, incluyendo todas las preguntas, las respuestas del cliente y la fecha de la agenda.<br>• Registrar la información relevante y cualquier documentación solicitada o recibida."}]},{"type":"rules","label":"Viajes de emergencia o sin citas disponibles","color":"red","items":["Si el cliente necesita viajar por una emergencia o no hay citas con un abogado antes de la fecha de su viaje → reportar el caso inmediatamente con el TL para revisar si se puede gestionar una cita prioritaria con el área legal","No asegurar al cliente que será posible adelantar la consulta hasta contar con la confirmación correspondiente"]}]}},
{id:"m_abuser",blu:true,label:"Llama abusador / tercera persona",icon:"⊘",color:"amber",
content:{"title":"Protocolo — llamadas de terceras personas (abuser o persona no autorizada)","icon":"⊘","color":"amber","secs":[{"type":"steps","label":"Protocolo de atención","items":[{"n":"1","c":"amber","t":"Identificar la relación con el titular del caso","d":"Preguntar cuál es su relación con el titular y verificar esta información <strong>antes</strong> de proporcionar cualquier dato."},{"n":"2","c":"amber","t":"Si el caso es de visa humanitaria (VAWA, T o U)","d":"Verificar si quien llama es:<br>• <strong>Abuser</strong> (VAWA)<br>• <strong>Tratante</strong> (Visa T)<br>• <strong>Persona por la que está aplicando el cliente</strong> (Visa U)<br><br>Puedes apoyarte en la IA del CRM con la consulta: «¿Quién es el abuser / por quién está aplicando el cliente?»"},{"n":"3","c":"blue","t":"Si el caso NO es de visa humanitaria","d":"Verificar la relación de quien llama con el titular.<br>• <strong>Peticionario o beneficiario</strong>: se le puede proporcionar información del caso.<br>• <strong>No forma parte del caso</strong>: explicar que el titular debe estar presente en la llamada para compartir información."}]},{"type":"rules","label":"Si quien llama es el abuser, tratante o persona por la que aplica el cliente","color":"red","items":["NO confirmar ni negar la existencia de un caso","NO proporcionar información ni detalles relacionados con el expediente","Intentar finalizar la llamada de manera cordial y profesional","Si se torna agresivo, insiste en obtener información, amenaza o se niega a finalizar la llamada → escalar inmediatamente con el TL"]},{"type":"speech","label":"Abuser, tratante o persona por la que aplica el cliente","text":"«Le agradezco mucho su comprensión. Si el titular del caso desea comunicarse con nosotros directamente, con gusto podremos asistirle. En este momento no puedo continuar con esta llamada.»"},{"type":"speech","label":"Otra tercera persona — caso de visa humanitaria","text":"«Para poder brindarle información sobre el caso, es necesario que el titular se encuentre presente durante la llamada. Con gusto podremos atenderles cuando puedan comunicarse juntos.»"},{"type":"speech","label":"Tercera persona — caso NO humanitario","text":"«Por motivos de confidencialidad, únicamente podemos proporcionar información a las personas autorizadas que forman parte del caso. Para poder asistirle, necesitamos que el titular se encuentre presente durante la llamada.»"},{"type":"rules","label":"Consideraciones importantes para el asesor","color":"amber","items":["Siempre verificar la relación de la persona que llama antes de proporcionar información","En casos de visas humanitarias, prestar especial atención a la identidad de la persona que llama y su relación con el caso","Nunca confirmar ni negar la existencia de un expediente cuando quien llama sea el abuser, tratante o persona por la que aplica el cliente","Ante cualquier situación de riesgo, amenaza o comportamiento agresivo, escalar inmediatamente con el TL"]},{"type":"acc","label":"Plantilla de nota obligatoria en CRM","tag":"gold","tl":"Plantilla","body":[{"type":"speech","text":"Título: THIRD-PARTY CALL / CASE INFORMATION REQUEST<br><br>Reason: A third party contacted the office regarding the case and requested information. No case information was provided, and the caller was advised that the case holder must contact the office directly for assistance.<br><br>Solution: The third party was informed that, for privacy and security reasons, no information could be disclosed. They were advised that the primary case holder must contact the office directly if assistance or case information is needed.<br><br>Behavior: Calm<br><br>CN and DOB: Not Confirmed"}]}]}},
{id:"m_trump",blu:true,label:"Preguntas sobre Trump / deportación / VAWA",icon:"◐",color:"teal",
content:{title:"Speech — preguntas VAWA y cambios de administración",icon:"◐",color:"teal",
secs:[
{type:"speech",label:"Speech PARTE 1 — contención inicial",text:"<strong>Agente:</strong> Entiendo que me está preguntando qué pasará con los casos que están teniendo cambios, específicamente VAWA. ¿Estoy en lo correcto?<br><br><strong>Cliente:</strong> Sí.<br><br><strong>Agente:</strong> Comprendo lo que me dice. Si bien VAWA y otros procesos están teniendo cambios en esta administración de Trump, no hay que olvidar que en la primera administración de Trump también se usó esa misma NTA y aun así la abogada ganó casos porque tiene más de 14 años como abogada de migración resolviendo casos muy complicados que otros abogados no se animan a tocar. Confíe.<br><br>Afortunadamente [adaptar según el caso]:<br>• Antes de USCIS: «afortunadamente ya tiene un caso en la firma»<br>• Después de USCIS: «afortunadamente su caso ya fue enviado a migración»<br>• Ya tiene EAD: «afortunadamente ya cuenta con su permiso de trabajo»<br><br>Manténgase informado a través de las redes sociales de la abogada."},
{type:"speech",label:"Speech PARTE 2 — si insiste: '¿qué pasa si no aprueban?'",text:"<strong>Agente:</strong> Entiendo lo que me dice. Hay que tomar en cuenta que existen muchas cosas que se pueden hacer. La abogada no los dejará solos y siempre se puede hacer una apelación. La abogada siempre velará por su beneficio. Confíe."},
{type:"acc",label:"Contexto: ¿qué es el proceso de corte migratoria?",tag:"teal",tl:"Contexto",body:[
{type:"rules",items:[
"NTA (Notice to Appear, Formulario I-862): documento que instruye a comparecer ante un juez de inmigración. Es el inicio del proceso de remoción.",
"Master Hearing: primera audiencia. Actualmente puede tardar 1 a 2 años dependiendo de la ciudad.",
"Individual Hearing: audiencia donde se emite la decisión del caso. Puede tardar de 5 a 7 años.",
"Llegar tan tarde al Individual Hearing puede ser beneficioso porque la decisión se toma posiblemente con otra administración.",
"Video de referencia de la abogada: facebook.com/abogadamariamendoza/videos/659931203357866"
]}
]},
{type:"rules",label:"Indicaciones operativas",color:"teal",items:[
"Reason of Call en Registro: 'Trump questions' — no requiere apartado adicional",
"Adaptar la frase de 'afortunadamente' según la etapa del caso",
"Compartir video de la abogada en Facebook si el cliente lo requiere"
]}
]}},
{id:"m_hc",blu:true,label:"Campaña Habeas Corpus / Mandamus",icon:"⊕",color:"gold",
content:{title:"Protocolo — campaña HC/Mandamus",icon:"⊕",color:"gold",
secs:[
{type:"acc",label:"¿Qué son estos recursos? (contexto interno)",tag:"gold",tl:"Contexto",body:[
{type:"rules",items:[
"DEMANDA MANDAMUS: acción legal federal que busca OBLIGAR a USCIS a emitir una decisión en casos con demoras excesivas. No incluida en el contrato actual. Honorarios adicionales.",
"PETICIÓN DE HABEAS CORPUS: para clientes detenidos por ICE. Permite solicitar audiencia de fianza mientras el caso continúa. Fuera del contrato. Honorarios adicionales.",
"El área de Filtros/Psicología llama a los clientes para INFORMAR. NO para cobrar ni contratar."
]}
]},
{type:"steps",label:"Cómo manejar llamadas sobre esta campaña",items:[
{n:"1",c:"blue",t:"Verificar si ya fue informado",d:"«¿Le llamó alguien de nuestra firma recientemente para comentarle sobre opciones legales como Mandamus o Habeas Corpus?»"},
{n:"2",c:"blue",t:"Si SÍ fue informado",d:"Usar el mini-FAQ. Responder en menos de 60 segundos. No escalar innecesariamente."},
{n:"3",c:"amber",t:"Si NO fue informado o quiere detalle legal",d:"Escalar para que reciba el script completo del área de Litigation."}
]},
{type:"acc",label:"Mini-FAQ — respuestas rápidas",tag:"teal",tl:"Respuestas",body:[
{type:"rules",items:[
"«¿Me llamaron para cobrarme más?» → No. La llamada fue solo informativa. Su caso sigue en proceso y no se le cobra nada.",
"«¿Van a cambiar mi contrato?» → No. El contrato no cambia. Cualquier servicio adicional se explica por separado y solo si usted lo solicita.",
"«¿La Mandamus garantiza que me aprueben?» → No. Solo puede obligar a inmigración a emitir una decisión.",
"«¿Por qué me hablan de esto?» → Para que usted conozca opciones y no decida bajo presión después.",
"«¿Tengo que decidir algo ahora?» → No. La llamada fue únicamente informativa.",
"«¿Es obligatorio?» → No. Es completamente opcional."
]}
]},
{type:"rules",label:"Reglas obligatorias para CS",color:"gold",items:[
"Informar, no persuadir",
"No prometer resultados",
"No ofrecer costos",
"Escalar si el cliente quiere detalle legal adicional"
]}
]}}
]},
{s:"Emergencias — acción inmediata",id:"emgs",icon:"!",emg:true,sc:"red",ch:[
{id:"e_det",label:"Cliente fue detenido (ICE / autoridad)",icon:"!",color:"red",emg:true,
content:{"title":"Emergencia — cliente detenido","icon":"!","color":"red","emg":true,"secs":[{"type":"speech","label":"Speech","text":"«Lamento mucho saber esta situación. Entiendo lo difícil que debe ser. Voy a escalar el caso de inmediato a nuestro departamento de remociones para que puedan evaluarlo y determinar la mejor manera de ayudarlos. Se revisará la información y se estarán poniendo en contacto con ustedes.»"},{"type":"steps","label":"Pasos — antes de terminar la interacción","items":[{"n":"1","c":"red","t":"Notificar al TL","d":"Es una emergencia: el TL debe saberlo antes de terminar la interacción."},{"n":"2","c":"red","t":"Verificar en el CRM","d":"Si es primera vez que se nos informa: verificar que no tengamos ya el reporte de la detención o que ya tenga seguimiento de <strong>Removals</strong>.<br><br>Si ya tiene seguimiento de Removals:<br>• Sondear qué necesitan: actualización del proceso, proporcionar nueva información o dudas específicas de la detención.<br>• Confirmar el contacto de emergencia (nombre, número y parentesco)."},{"n":"3","c":"red","t":"Confirmar quién llama","d":"Confirmar los datos de la persona que se está comunicando y su relación con el cliente.<br>Puede comunicarse otra persona externa al caso para notificar la detención: en ese caso <strong>se pueden omitir los filtros de seguridad</strong>.<br>Solamente tomamos información y reportamos: <strong>no damos estatus del caso ni de la detención</strong>."},{"n":"4","c":"red","t":"Recabar información de la detención","d":"• Fecha y hora de la detención<br>• Entidad que lo detuvo (ICE, USCIS, Sheriff, etc.)<br>• Cargos (migratorios o criminales)<br>• Lugar a dónde lo llevan o a dónde será trasladado<br>• Información proporcionada por las autoridades<br>• Si hablaron con un oficial: nombre completo, insignia/ID, número de caso y teléfono<br>• Contacto de emergencia (nombre, número y parentesco) — <strong>siempre confirmar el número</strong><br>• Si es el abuser / tratante, solicitar otro contacto de emergencia adicional<br>• Tipo de caso y etapa"}]},{"type":"rules","label":"Nota importante sobre representación","color":"red","items":["NO asumir representación automáticamente","La firma evalúa cada caso individualmente y hay casos donde no podemos representarlos; puede requerir un pago de honorarios","Si el cliente fue detenido por cuestiones criminales: recomendarle conseguir asesoría de un abogado especialista en la materia y que nos vaya informando del proceso. Aun así, debemos reportar a Removals para el seguimiento"]}]}},
{id:"e_cita",label:"Cliente informa cita con ICE / autoridad",icon:"◉",color:"red",emg:true,
content:{"title":"Emergencia — cita con ICE u otra autoridad","icon":"◉","color":"red","emg":true,"intro":"Los clientes pueden recibir un documento de ICE donde les informan que deben asistir a una revisión. También hay clientes con revisiones periódicas con ICE como parte del seguimiento de sus procesos de deportación, presenciales en oficinas de ICE o por medio de una aplicación. Es importante recabar toda la información necesaria, porque esta cita puede derivar en un proceso de deportación o detención para el cliente.","secs":[{"type":"speech","label":"Speech principal","text":"«Gracias por informarnos. En este tipo de situaciones es fundamental que un abogado revise su caso antes de que usted asista a la cita. Le pedimos, por favor, <strong>no presentarse hasta que un abogado de nuestro equipo le indique lo contrario</strong>. Su caso será canalizado al área correspondiente para que puedan revisar los detalles y brindarle la orientación legal adecuada lo antes posible.»"},{"type":"steps","label":"Procedimiento obligatorio","items":[{"n":"1","c":"red","t":"Notificar al TL de inmediato","d":"Es una emergencia. El cliente no se debe presentar a la cita sin antes tener asesoría legal por parte de la firma."},{"n":"2","c":"red","t":"Recabar la información","d":"• Fecha de la cita o chequeo<br>• Si tiene documentación, que la envíe por mensaje de texto en ese momento<br>• Autoridad que lo cita (ICE, USCIS, policía local, otra)"},{"n":"3","c":"blue","t":"Canalizar al equipo de Removal","d":"Un abogado de la firma revisará la situación y dará orientación legal antes de la cita.<br>Recabar la información y reportarla al TL."}]},{"type":"rules","label":"Reglas críticas","color":"red","items":["El cliente NO debe presentarse a ninguna cita con ninguna autoridad sin consultar primero con la firma","Mantener calma, transmitir seguridad y claridad al cliente","Evitar conjeturas — nunca especular sobre consecuencias o resultados"]}]}},
{id:"e_red",label:"Redadas / ICE en la puerta del cliente",icon:"◈",color:"red",emg:true,
content:{"title":"Protocolo — redadas de ICE","icon":"◈","color":"red","emg":true,"secs":[{"type":"acc","label":"Derechos si ICE está en su puerta ahora","tag":"red","tl":"URGENTE","body":[{"type":"rules","items":["Tiene derecho a NO abrir la puerta","Tiene derecho a no responder","Puede quedarse dentro de su casa sin contestar","Única excepción: si presentan una 'judge's order' (orden de un juez) con el nombre del cliente y firma del juez. SOLO entonces debe responder.","NO debe firmar ningún documento sin consultar con un abogado de migración","Si tiene documentos migratorios: tenerlos impresos y a la mano siempre"]}]},{"type":"acc","label":"Derechos si lo detienen en la calle / retén","tag":"amber","tl":"Derechos","body":[{"type":"rules","items":["Tiene derecho a permanecer en silencio","Tiene derecho a pedir un abogado","NO debe responder preguntas sin asesoría legal","NO debe firmar ningún documento sin revisión de abogado","En un retén: tiene derecho a no responder preguntas"]}]},{"type":"rules","label":"Recursos a compartir con el cliente","color":"amber","items":["Red Card: <a href='https://drive.google.com/file/d/1OqJiWlDnvCobBC8s0rotPk5uOXrTsrV4/view' target='_blank' style='color:var(--gold)'>drive.google.com/…/1OqJiWlDnvCobBC8s0rotPk5uOXrTsrV4</a>","Recibos iniciales, aprobatorios, prima facie, bona fide","Si ICE está en su puerta EN ESTE MOMENTO → notificar al TL de inmediato y mantener al cliente en línea"]}]}},
{id:"e_bar",label:"Bar Complaint / Amenaza legal / Social Media",icon:"⚖",color:"red",emg:true,
content:{"title":"Emergencia — amenaza legal o reputacional","icon":"⚖","color":"red","emg":true,"secs":[{"type":"rules","label":"Situaciones que requieren escalación inmediata","color":"red","items":["Amenaza de Bar Complaint o acción legal","Solicitud de Bar Number de MGM u otro abogado","Cliente quiere consultar a otro abogado","Amenaza con comentarios negativos en redes","Cliente quiere hablar con MGM"]},{"type":"steps","label":"¿Qué hacer?","items":[{"n":"1","c":"red","t":"Reportar al TL","d":"Reportar inmediatamente con un TL <strong>antes de terminar la llamada</strong>."},{"n":"2","c":"red","t":"Escuchar y validar","d":"Escuchar activamente y validar la emoción del cliente. Mantener la calma y un tono profesional y empático."},{"n":"3","c":"red","t":"Ubicar la causa raíz","d":"Identificar la causa raíz de la frustración."},{"n":"4","c":"red","t":"Comprometerse a escalar","d":"Comprometerse con el cliente a escalar su situación."},{"n":"5","c":"blue","t":"Documentar","d":"Documentar los hechos de forma objetiva en MyCase."}]},{"type":"rules","label":"No hacer","color":"red","items":["No admitir culpa, negligencia o error de la Firma","No dar asesoría legal (exclusiva del abogado)","No prometer resultados garantizados ante USCIS","No discutir, minimizar la queja ni colgar la llamada","No autorizar refunds"]},{"type":"acc","label":"Amenaza de Bar Complaint o acción legal","tag":"red","tl":"Escenario","body":[{"type":"steps","items":[{"n":"1","c":"red","t":"Identificar el motivo","d":"Escuchar al cliente e identificar por qué quiere presentar la queja o demanda, qué necesita y qué solución podría atender su preocupación."},{"n":"2","c":"red","t":"Si menciona a otro abogado","d":"Si dice que ya está pensando en ir con otro abogado o pidiendo asesoría, preguntar el nombre o datos del abogado (se puede mencionar que es por protocolo)."},{"n":"3","c":"red","t":"Escalar con el TL","d":"Recabar toda la información y pedir tiempo en espera al cliente. El TL tomará la llamada, pedirá que se transfiera o dará indicaciones."},{"n":"4","c":"blue","t":"Nota","d":"Incluir en el título el tipo de emergencia: <strong>Threat of a Bar Complaint</strong> o <strong>Threat of Legal Action</strong>."}]}]},{"type":"acc","label":"Solicitud de Bar Number de MGM u otro abogado","tag":"red","tl":"Escenario","body":[{"type":"steps","items":[{"n":"1","c":"red","t":"Preguntar el motivo","d":"Preguntar por qué requiere el número. No negar la información; explicar que puede agendarse una llamada con un abogado para revisar la solicitud."},{"n":"2","c":"red","t":"Escalar con el TL","d":"Recabar toda la información y pedir tiempo en espera al cliente. El TL tomará la llamada, pedirá que se transfiera o dará indicaciones."},{"n":"3","c":"blue","t":"Nota","d":"Incluir en el título: <strong>CL requests MGM's bar number</strong> o <strong>CL requests the attorney's bar number</strong>."}]}]},{"type":"acc","label":"Cliente quiere consultar a otro abogado","tag":"red","tl":"Escenario","body":[{"type":"steps","items":[{"n":"1","c":"red","t":"Confirmar la situación","d":"Confirmar si ya cuenta con otro abogado o apenas desea consultar. Si ya tiene representación, solicitar información del abogado: nombre completo y firma."},{"n":"2","c":"red","t":"Preguntar el motivo","d":"Preguntar el motivo, qué necesita y qué solución se puede ofrecer."},{"n":"3","c":"red","t":"Escalar con el TL","d":"Recabar toda la información y pedir tiempo en espera al cliente. El TL tomará la llamada, pedirá que se transfiera o dará indicaciones."},{"n":"4","c":"blue","t":"Nota","d":"Incluir en el título: <strong>CL is consulting with another attorney</strong>."}]}]},{"type":"acc","label":"Amenaza con comentarios negativos en redes","tag":"red","tl":"Escenario","body":[{"type":"steps","items":[{"n":"1","c":"red","t":"Identificar el motivo","d":"Identificar el motivo de la amenaza y qué necesita el cliente."},{"n":"2","c":"red","t":"Mostrar empatía","d":"Mostrar empatía y establecer compromiso con el cliente."},{"n":"3","c":"red","t":"Escalar con el TL","d":"Recabar toda la información y pedir tiempo en espera al cliente. El TL dará indicaciones."}]}]}]}},
{id:"e_est",label:"Cliente reporta posible estafa",icon:"⊗",color:"red",emg:true,
content:{title:"Protocolo — posible intento de estafa",icon:"⊗",color:"red",
secs:[
{type:"speech",label:"Script inicial — apertura",text:"«Gracias por tomarse el tiempo de compartirnos esta información. Es raro que pase; sin embargo, le daremos seguimiento. Permítame hacerle unas preguntas.»"},
{type:"steps",label:"Preguntas de indagación",items:[
{n:"1",c:"blue",t:"Detalles del contacto",d:"• ¿En qué fecha sucedió?<br>• ¿Dónde tuvo el contacto? ¿Por qué canal?<br>  - Llamada telefónica, mensaje de texto, WhatsApp, correo electrónico, redes sociales (¿cuál y cuál cuenta exactamente?)"},
{n:"2",c:"blue",t:"Evidencia",d:"¿Tiene capturas de pantalla? Pedir que las comparta."},
{n:"3",c:"blue",t:"Solicitud del contacto",d:"¿Qué le solicitaron que hiciera? (pagar, dar datos, firmar, etc.)"},
{n:"4",c:"amber",t:"¿Realizó algún pago?",d:"Si sí realizó un pago: <strong>NO asegurar que se le devolverá nada</strong>. Documentar monto y forma."},
{n:"5",c:"red",t:"Cierre y escalación",d:"«Estaré notificando a mi supervisor. Le agradezco que nos llame. Le enviaré las redes oficiales de la abogada.»<br><br>Enviar mensaje de texto con redes oficiales. Registrar como <strong>Fraud</strong> en Registro de llamadas → Emergencias."}
]},
