<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calificaciones Moodle TMLF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: consulta de dos columnas — índice de cursos a la izquierda, ficha del curso a la derecha; se apila en móvil */
:root{
  --bg:#F3F5F6; --surface:#FFFFFF; --sunk:#E9EDEF; --line:#D6DDE0;
  --ink:#14232A; --muted:#5B6B72; --accent:#0E5C63; --accent-soft:#D7ECEC; --brass:#9A763F;
  --ok:#2E7D4F; --ok-soft:#DDF0E4; --warn:#9A6400; --warn-soft:#F7EAD0; --bad:#A63D3D; --bad-soft:#F6DEDB;
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1518; --surface:#151F23; --sunk:#1B272C; --line:#2A383E;
  --ink:#E4ECEE; --muted:#93A4AA; --accent:#5FB8BD; --accent-soft:#183A3D; --brass:#C9A06A;
  --ok:#6CC08F; --ok-soft:#173326; --warn:#E0A84A; --warn-soft:#3A2D14; --bad:#E58A84; --bad-soft:#3D1F1E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1518; --surface:#151F23; --sunk:#1B272C; --line:#2A383E;
  --ink:#E4ECEE; --muted:#93A4AA; --accent:#5FB8BD; --accent-soft:#183A3D; --brass:#C9A06A;
  --ok:#6CC08F; --ok-soft:#173326; --warn:#E0A84A; --warn-soft:#3A2D14; --bad:#E58A84; --bad-soft:#3D1F1E; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
.wrap{max-width:1320px;margin:0 auto;padding-inline:20px;padding-block:24px 48px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}

.brand{display:flex;align-items:center;gap:18px;min-width:0}
.logo{width:92px;height:auto;flex:none;background:#fff;border-radius:12px;padding:8px;border:1px solid var(--line)}
@media (max-width:520px){.logo{width:72px}}
header.top{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between;padding-bottom:20px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);font-weight:700}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(26px,3.2vw,34px);line-height:1.1;margin:4px 0 6px;text-wrap:balance}
.sub{color:var(--muted);margin:0;max-width:62ch}
.kpis{display:flex;flex-wrap:wrap;gap:28px}
.kpi b{display:block;font-family:var(--f-data);font-size:22px;font-weight:500}
.kpi span{font-size:12px;color:var(--muted)}

.tabs{display:flex;gap:4px;margin:20px 0 16px;background:var(--sunk);padding:4px;border-radius:10px;width:max-content;max-width:100%}
.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.08)}

.grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}

.index{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:860px){.index{position:static}}
.index .head{padding:12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.field{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.field::placeholder{color:var(--muted)}
.sortrow{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.sortrow select{padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:12px}
.clist{max-height:calc(100vh - 260px);overflow:auto;margin:0;padding:6px;list-style:none}
@media (max-width:860px){.clist{max-height:300px}}
.clist button{width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:baseline}
.clist button:hover{background:var(--sunk)}
.clist button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.clist .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clist .ct{font-family:var(--f-data);font-size:12px;color:var(--muted)}
.empty{padding:16px;color:var(--muted);font-size:13px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.phead{padding:20px 22px 16px;border-bottom:1px solid var(--line)}
.phead h2{font-family:var(--f-display);font-weight:500;font-size:24px;margin:2px 0 0;line-height:1.2;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));border-bottom:1px solid var(--line)}
.stat{padding:14px 22px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:var(--f-data);font-size:19px;font-weight:500;white-space:nowrap}
.stat span{font-size:12px;color:var(--muted)}
.chartbox{padding:16px 22px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
@media (max-width:700px){.chartbox{grid-template-columns:minmax(0,1fr)}}
.chartbox h3{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.hist{display:grid;gap:6px}
.hrow{display:grid;grid-template-columns:104px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:12px}
.hrow .lbl{color:var(--muted)}
.hrow .bar{height:12px;background:var(--sunk);border-radius:3px;overflow:hidden}
.hrow .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.hrow .v{text-align:right;font-family:var(--f-data)}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 22px}
.toolbar .field{flex:1 1 220px;width:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn{border:1px solid var(--accent);background:transparent;color:var(--accent);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:12px}
.btn:hover{background:var(--accent-soft)}

.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 22px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap;cursor:pointer;user-select:none}
th[aria-sort="ascending"]::after{content:" ↑"}
th[aria-sort="descending"]::after{content:" ↓"}
td{padding:9px 22px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:var(--sunk)}
td.name{font-weight:600;min-width:220px}
td.name button{all:unset;cursor:pointer}
td.name button:hover{color:var(--accent);text-decoration:underline}
.gcell{display:flex;align-items:center;gap:10px;min-width:150px}
.gcell .mini{flex:1;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;max-width:110px}
.gcell .mini i{display:block;height:100%;background:var(--accent)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-none{background:var(--sunk);color:var(--muted)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 22px;font-size:12px;color:var(--muted)}
.pager{display:flex;gap:6px}
.pager button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 10px;cursor:pointer}
.pager button:disabled{opacity:.4;cursor:default}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600}
.legend{font-size:12px;color:var(--muted);margin-top:14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

function recency(m){const d=(NOW-m)/1440; if(d<=30)return["≤ 30 días","p-ok"]; if(d<=90)return["31–90 días","p-warn"]; return["+90 días","p-bad"]}

document.getElementById("kCourses").textContent=fmtN(C.length);
document.getElementById("kPeople").textContent=fmtN(P.length);
document.getElementById("kRows").textContent=fmtN(D.r.length);
document.getElementById("kLast").textContent=fmtD(NOW);

const S={mode:"c",sel:null,q:"",ord:"n",tq:"",filt:"all",sort:{k:"g",d:-1},page:0};
try{const s=JSON.parse(localStorage.getItem("tmlf-cal")||"{}");if(s.ord)S.ord=s.ord}catch(e){}
document.getElementById("ord").value=S.ord;
const save=()=>{try{localStorage.setItem("tmlf-cal",JSON.stringify({ord:S.ord}))}catch(e){}};

function listItems(){
  const q=norm(S.q);
  if(S.mode==="c"){
    let L=C.filter(c=>c.key.includes(q));
    const o={n:(a,b)=>b.n-a.n,a:(a,b)=>a.name.localeCompare(b.name,"es"),avg:(a,b)=>b.avgPct-a.avgPct,r:(a,b)=>b.last-a.last}[S.ord];
    return L.sort(o);
  } else {
    let L=P.filter(p=>p.key.includes(q));
    const o={n:(a,b)=>b.rows.length-a.rows.length,a:(a,b)=>a.name.localeCompare(b.name,"es"),avg:(a,b)=>avgRel(b)-avgRel(a),r:(a,b)=>lastOf(b)-lastOf(a)}[S.ord];
    return L.sort(o);
  }
}
const avgRel=p=>{const v=p.rows.map(rel).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:-1};
const lastOf=p=>Math.max(...p.rows.map(r=>r[3]));

function renderList(){
  const L=listItems(), ul=document.getElementById("clist");
  if(!L.length){ul.innerHTML='<li class="empty">Sin resultados para esa búsqueda.</li>';return}
  ul.innerHTML=L.map(x=>`<li><button data-i="${x.i}" aria-current="${S.sel===x.i}"><span class="nm" title="${esc(x.name)}">${esc(x.name)}</span><span class="ct">${S.mode==="c"?x.n:x.rows.length}</span></button></li>`).join("");
}
document.getElementById("clist").addEventListener("click",e=>{const b=e.target.closest("button[data-i]");if(!b)return;select(+b.dataset.i)});
document.getElementById("q").addEventListener("input",e=>{S.q=e.target.value;renderList()});
document.getElementById("ord").addEventListener("change",e=>{S.ord=e.target.value;save();renderList()});

function setMode(m){
  S.mode=m;S.q="";S.tq="";S.filt="all";S.page=0;
  document.getElementById("q").value="";
  document.getElementById("q").placeholder=m==="c"?"Buscar curso…":"Buscar colaborador…";
  document.getElementById("tabC").setAttribute("aria-selected",m==="c");
  document.getElementById("tabP").setAttribute("aria-selected",m==="p");
  S.sort=m==="c"?{k:"g",d:-1}:{k:"r",d:-1};
  const first=listItems()[0];S.sel=first?first.i:null;renderList();renderPanel();
}
document.getElementById("tabC").onclick=()=>setMode("c");
document.getElementById("tabP").onclick=()=>setMode("p");

function select(i){S.sel=i;S.tq="";S.filt="all";S.page=0;renderList();renderPanel();
  if(S.mode==="c"){try{history.replaceState(null,"","#c"+i)}catch(e){}}
  if(window.innerWidth<=860)document.getElementById("panel").scrollIntoView({behavior:"smooth",block:"start"});}

function hist(rows,c){
  const b=[["80–100%",0],["50–79%",0],["1–49%",0],["0",0],["Sin calificación",0]];
  rows.forEach(r=>{const p=rel(r);if(p==null)b[4][1]++;else if(p>=.8)b[0][1]++;else if(p>=.5)b[1][1]++;else if(p>0)b[2][1]++;else b[3][1]++});
  const mx=Math.max(1,...b.map(x=>x[1]));
  return b.map(([l,v])=>`<div class="hrow"><span class="lbl">${l}</span><span class="bar"><i style="width:${v/mx*100}%"></i></span><span class="v">${v}</span></div>`).join("");
}
function recHist(rows){
  const b=[["≤ 30 días",0],["31–90 días",0],["91–180 días",0],["+180 días",0]];
  rows.forEach(r=>{const d=(NOW-r[3])/1440;b[d<=30?0:d<=90?1:d<=180?2:3][1]++});
  const mx=Math.max(1,...b.map(x=>x[1]));
  return b.map(([l,v])=>`<div class="hrow"><span class="lbl">${l}</span><span class="bar"><i style="width:${v/mx*100}%;background:var(--brass)"></i></span><span class="v">${v}</span></div>`).join("");
}

const PAGE=50;
function filteredRows(){
  let rows;
  if(S.mode==="c"){rows=C[S.sel].rows}else{rows=P[S.sel].rows}
  const q=norm(S.tq);
  if(q) rows=rows.filter(r=>norm(S.mode==="c"?D.n[r[0]]:D.c[r[1]]).includes(q));
  if(S.filt!=="all") rows=rows.filter(r=>{const p=rel(r);return S.filt==="none"?p==null:S.filt==="ok"?p!=null&&p>=.8:S.filt==="warn"?p!=null&&p>=.5&&p<.8:p!=null&&p<.5});
  const k=S.sort.k,d=S.sort.d;
  const key={n:r=>D.n[r[0]],c:r=>D.c[r[1]],g:r=>r[2]==null?-Infinity:(S.mode==="c"?r[2]:rel(r)),r:r=>r[3]}[k];
  return rows.slice().sort((a,b)=>{const x=key(a),y=key(b);return (typeof x==="string"?x.localeCompare(y,"es"):x-y)*d});
}

function renderPanel(){
  const el=document.getElementById("panel");
  if(S.sel==null){el.innerHTML='<div class="empty">Elige un elemento de la lista.</div>';return}
  const isC=S.mode==="c", ent=isC?C[S.sel]:P[S.sel], rows=ent.rows;
  let stats;
  if(isC){
    stats=[[fmtN(ent.n),"Con acceso"],[fmtN(ent.graded),"Con calificación"],[Math.round(ent.pctGraded*100)+"%","Tasa de calificación"],[ent.avg==null?"—":fmtG(+ent.avg.toFixed(1)),"Promedio"],[fmtG(ent.max)||"—","Máxima del curso"],[fmtD(ent.last),"Último acceso"]];
  } else {
    const g=rows.filter(r=>r[2]!=null).length, ar=avgRel(ent);
    stats=[[rows.length,"Cursos con acceso"],[g,"Con calificación"],[ar<0?"—":Math.round(ar*100)+"%","Avance promedio"],[fmtD(lastOf(ent)),"Último acceso"]];
  }
  el.innerHTML=`
    <div class="phead"><div class="eyebrow">${isC?"Curso":"Colaborador"}</div><h2>${esc(ent.name)}</h2></div>
    <div class="stats">${stats.map(([b,s])=>`<div class="stat"><b>${b}</b><span>${s}</span></div>`).join("")}</div>
    <div class="chartbox">
      <div><h3>Calificación relativa</h3><div class="hist">${hist(rows)}</div>
        <p class="note">${isC?"Porcentaje respecto a la calificación más alta registrada en el curso, porque cada curso usa una escala distinta.":"Porcentaje respecto a la calificación más alta de cada curso."}</p></div>
      <div><h3>Último acceso</h3><div class="hist">${recHist(rows)}</div>
        <p class="note">Días contados hasta el ${fmtD(NOW)}, el acceso más reciente del reporte.</p></div>
    </div>
    <div class="toolbar">
      <input id="tq" class="field" type="search" placeholder="${isC?"Filtrar colaborador…":"Filtrar curso…"}" value="${esc(S.tq)}" autocomplete="off">
      <div class="chips" id="chips">
        ${[["all","Todos"],["ok","Destacado"],["warn","En proceso"],["bad","Bajo"],["none","Sin calificación"]].map(([k,l])=>`<button class="chip" data-f="${k}" aria-pressed="${S.filt===k}">${l}</button>`).join("")}
      </div>
      <button class="btn" id="copy">Copiar tabla</button>
    </div>
    <div class="tbl"><table><thead><tr>
      <th data-k="${isC?"n":"c"}">${isC?"Colaborador":"Curso"}</th>
      <th data-k="g">Calificación</th><th>Estatus</th>
      <th data-k="r">Último acceso</th><th>Recencia</th>
    </tr></thead><tbody id="tb"></tbody></table></div>
    <div class="foot"><span id="cnt"></span><div class="pager"><button id="prev">Anterior</button><button id="next">Siguiente</button></div></div>
    <div class="foot legend" style="padding-top:0"><span>Estatus:</span>
      <span class="pill p-ok">Destacado ≥ 80%</span><span class="pill p-warn">En proceso 50–79%</span><span class="pill p-bad">Bajo &lt; 50%</span><span class="pill p-none">Sin calificación</span></div>`;
  el.querySelector("#tq").addEventListener("input",e=>{S.tq=e.target.value;S.page=0;renderRows()});
  el.querySelector("#chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;S.filt=b.dataset.f;S.page=0;el.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===b));renderRows()});
  el.querySelectorAll("th[data-k]").forEach(th=>th.addEventListener("click",()=>{const k=th.dataset.k;S.sort=S.sort.k===k?{k,d:-S.sort.d}:{k,d:k==="n"||k==="c"?1:-1};renderRows()}));
  el.querySelector("#prev").onclick=()=>{S.page--;renderRows()};
  el.querySelector("#next").onclick=()=>{S.page++;renderRows()};
  el.querySelector("#copy").onclick=copyTable;
  el.querySelector("#tb").addEventListener("click",e=>{const b=e.target.closest("button[data-jump]");if(!b)return;jump(b.dataset.mode,+b.dataset.jump)});
  renderRows();
}

function renderRows(){
  const isC=S.mode==="c", rows=filteredRows(), pages=Math.max(1,Math.ceil(rows.length/PAGE));
  S.page=Math.min(Math.max(0,S.page),pages-1);
  const slice=rows.slice(S.page*PAGE,(S.page+1)*PAGE);
  document.getElementById("tb").innerHTML=slice.length?slice.map(r=>{
    const [sl,sc]=status(r),[rl,rc]=recency(r[3]),p=rel(r);
    const label=isC?D.n[r[0]]:D.c[r[1]];
    const jumpTo=isC?`data-mode="p" data-jump="${r[0]}"`:`data-mode="c" data-jump="${r[1]}"`;
    return `<tr><td class="name"><button ${jumpTo} title="${isC?"Ver todos sus cursos":"Abrir curso"}">${esc(label)}</button></td>
      <td><div class="gcell"><span class="num">${fmtG(r[2])}${!isC&&r[2]!=null?` <span style="color:var(--muted)">/ ${fmtG(C[r[1]].max)}</span>`:""}</span>${p!=null?`<span class="mini"><i style="width:${p*100}%"></i></span>`:""}</div></td>
      <td><span class="pill ${sc}">${sl}</span></td>
      <td class="num" style="white-space:nowrap">${fmtDT(r[3])}</td>
      <td><span class="pill ${rc}">${rl}</span></td></tr>`}).join(""):`<tr><td colspan="5" class="empty">Ningún registro coincide con el filtro.</td></tr>`;
  document.getElementById("cnt").textContent=rows.length?`${fmtN(S.page*PAGE+1)}–${fmtN(S.page*PAGE+slice.length)} de ${fmtN(rows.length)} registros`:"0 registros";
  document.getElementById("prev").disabled=S.page===0;
  document.getElementById("next").disabled=S.page>=pages-1;
  document.querySelectorAll("th[data-k]").forEach(th=>th.setAttribute("aria-sort",th.dataset.k===S.sort.k?(S.sort.d>0?"ascending":"descending"):"none"));
}

function jump(mode,i){
  if(mode!==S.mode){setMode(mode)}
  select(i);
}

function toast(t){const e=document.getElementById("toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2200)}
function copyTable(){
  const isC=S.mode==="c", rows=filteredRows();
  const head=[isC?"Colaborador":"Curso",isC?"Curso":"Colaborador","Calificación","Estatus","Último acceso"].join("\t");
  const lines=rows.map(r=>[isC?D.n[r[0]]:D.c[r[1]],isC?D.c[r[1]]:D.n[r[0]],fmtG(r[2]),status(r)[0],fmtDT(r[3])].join("\t"));
  const txt=[head,...lines].join("\n");
  const fallback=()=>{const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Tabla copiada · pégala en Excel")}catch(e){toast("No se pudo copiar")}ta.remove()};
  try{navigator.clipboard.writeText(txt).then(()=>toast(`${fmtN(rows.length)} filas copiadas · pégalas en Excel`),fallback)}catch(e){fallback()}
}

// Initial state: deep link #c<id> or the largest course
const h=(location.hash||"").match(/^#c(\d+)$/);
S.sel=h&&C[+h[1]]?+h[1]:listItems()[0].i;
renderList();renderPanel();
</script>

</body>
</html>
