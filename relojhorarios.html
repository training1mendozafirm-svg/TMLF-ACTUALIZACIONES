<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Husos horarios · The Mendoza Law Firm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080a12;
    --card:#12151f;
    --card-grad-a:#181c2b;
    --card-grad-b:#11131c;
    --border:#2a3049;
    --gold:#c9a24b;
    --cream:#f3ebd9;
    --text-dim:#8891ab;
    --text-dimmer:#6b7292;
    --text-faint:#5a6083;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--cream);
    font-family:'DM Sans', sans-serif;
    min-height:100vh;
  }
  body{
    position:relative;
    overflow-x:hidden;
    padding:48px 24px 64px;
  }
  .glow-top{
    position:fixed;
    top:-220px; left:50%;
    transform:translateX(-50%);
    width:900px; height:500px;
    border-radius:50%;
    background:rgba(201,162,75,0.08);
    filter:blur(120px);
    pointer-events:none;
    z-index:0;
  }
  .glow-bottom{
    position:fixed;
    bottom:-120px; right:-100px;
    width:500px; height:400px;
    border-radius:50%;
    background:rgba(45,74,138,0.18);
    filter:blur(110px);
    pointer-events:none;
    z-index:0;
  }
  .wrap{
    max-width:1040px;
    margin:0 auto;
    position:relative;
    z-index:1;
  }

  /* Header */
  header{ text-align:center; margin-bottom:36px; }
  .logo-badge{
    width:96px; height:96px;
    margin:0 auto 12px;
    border-radius:50%;
    background:rgba(201,162,75,0.08);
    display:flex; align-items:center; justify-content:center;
  }
  .logo-badge img{
    width:60px; height:60px;
    object-fit:contain;
    filter:drop-shadow(0 0 18px rgba(201,162,75,0.35));
  }
  .brandline{
    display:flex; align-items:center; justify-content:center; gap:12px;
    margin-bottom:10px;
  }
  .brandline .rule{ height:1px; width:40px; }
  .rule.left{ background:linear-gradient(to right, transparent, rgba(201,162,75,0.6)); }
  .rule.right{ background:linear-gradient(to left, transparent, rgba(201,162,75,0.6)); }
  .brandline span.label{
    font-size:11px; letter-spacing:0.35em; text-transform:uppercase; color:var(--gold);
  }
  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:clamp(28px, 4vw, 42px);
    margin:0 0 10px;
    background:linear-gradient(to bottom, #fbf6e9, #e9dcb8);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  header p{
    font-size:13px;
    color:var(--text-dim);
    margin:0;
  }

  /* Search */
  .search-outer{
    max-width:420px;
    margin:28px auto 6px;
    position:relative;
  }
  .search-box{
    display:flex; align-items:center; gap:10px;
    border:1px solid var(--border);
    background:var(--card);
    border-radius:999px;
    padding:11px 16px;
    transition:border-color .2s ease;
  }
  .search-box:focus-within{ border-color:var(--gold); }
  .search-box svg{ flex-shrink:0; }
  .search-box input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--cream);
    font-size:14px;
    font-family:'DM Sans', sans-serif;
  }
  .search-box input::placeholder{ color:var(--text-faint); }
  .clear-btn{
    background:none; border:none; cursor:pointer;
    color:var(--text-dimmer); display:flex; align-items:center;
    padding:2px;
  }
  .clear-btn:hover{ color:var(--gold); }
  .clear-btn.hidden{ display:none; }

  .suggestions{
    position:absolute; top:calc(100% + 6px); left:0; right:0;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 20px 40px rgba(0,0,0,0.45);
    z-index:20;
    display:none;
  }
  .suggestions.open{ display:block; }
  .suggestion-item{
    display:flex; align-items:center; justify-content:space-between;
    width:100%; text-align:left;
    padding:9px 16px;
    background:none; border:none; cursor:pointer;
    color:#e4e7f5; font-size:13.5px;
    font-family:'DM Sans', sans-serif;
  }
  .suggestion-item:hover{ background:#1c2033; }
  .suggestion-item .abbr{
    font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--gold);
  }

  .result-count{
    text-align:center;
    font-size:11px;
    color:var(--text-dimmer);
    min-height:16px;
    margin-bottom:26px;
  }

  /* Featured */
  .section-label{
    text-align:center;
    font-size:10px; letter-spacing:0.25em; text-transform:uppercase;
    color:var(--text-dimmer);
    margin-bottom:12px;
  }
  .featured-row{
    display:flex; flex-wrap:wrap; justify-content:center; gap:16px;
    margin-bottom:40px;
  }
  .featured-card{
    position:relative;
    width:172px;
    border-radius:18px;
    border:1px solid;
    background:linear-gradient(180deg, #20233a, #151829);
    padding:20px 18px;
    text-align:center;
    overflow:hidden;
  }
  .featured-card .topbar{
    position:absolute; top:0; left:0; right:0; height:3px;
  }
  .featured-card .clock-svg{ width:88px; height:88px; margin:4px auto 10px; }
  .featured-card .abbr{
    font-size:10px; letter-spacing:0.2em; text-transform:uppercase; font-weight:500;
    margin-bottom:2px;
  }
  .featured-card .city{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:16px;
    color:var(--cream);
    margin-bottom:6px;
  }
  .featured-card .digital{
    font-family:'JetBrains Mono', monospace;
    font-size:19px;
    color:var(--cream);
    letter-spacing:0.02em;
  }
  .featured-card .period{
    font-size:10px; color:var(--text-dim); margin-left:4px;
  }
  .featured-card .date{
    font-size:10px; color:var(--text-dimmer); margin-top:5px; text-transform:capitalize;
  }

  /* Zones grid */
  .grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:20px;
  }
  @media (max-width:720px){ .grid{ grid-template-columns:1fr; } }

  .zone-card{
    position:relative;
    border-radius:18px;
    border:1px solid var(--border);
    background:linear-gradient(180deg, var(--card-grad-a), var(--card-grad-b));
    padding:22px 20px;
    text-align:center;
    overflow:hidden;
    transition:opacity .3s ease, border-color .3s ease, box-shadow .3s ease;
  }
  .zone-card .topbar{
    position:absolute; top:0; left:0; right:0; height:3px;
  }
  .zone-card.dimmed{ opacity:0.35; }
  .zone-card.matched{
    border-color:var(--gold);
    box-shadow:0 0 0 1px rgba(201,162,75,0.3), 0 8px 30px rgba(201,162,75,0.12);
  }

  .zone-card .clock-svg{ width:132px; height:132px; margin:4px auto 16px; }

  .zone-region{
    font-size:11px; letter-spacing:0.2em; text-transform:uppercase; font-weight:500;
    color:var(--gold);
    display:flex; align-items:center; justify-content:center; gap:6px;
    margin-bottom:2px;
  }
  .zone-region .dot{ width:6px; height:6px; border-radius:50%; display:inline-block; }
  .zone-city{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:19px;
    color:var(--cream);
    margin:2px 0 10px;
  }
  .zone-digital{
    display:flex; align-items:baseline; justify-content:center; gap:6px;
  }
  .zone-digital .time{
    font-family:'JetBrains Mono', monospace;
    font-size:25px;
    color:var(--cream);
  }
  .zone-digital .period{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--text-dim);
  }
  .zone-date{
    font-size:11px; color:var(--text-dimmer); margin-top:6px; text-transform:capitalize;
  }

  .states-wrap{
    margin-top:16px; padding-top:14px;
    border-top:1px solid var(--border);
  }
  .states-title{
    font-size:10px; letter-spacing:0.15em; text-transform:uppercase; color:var(--gold);
    margin-bottom:8px;
  }
  .states-list{
    display:flex; flex-wrap:wrap; justify-content:center; gap:5px;
  }
  .state-pill{
    font-size:10px; line-height:1.2;
    color:#a9b0cc;
    background:#1c2033;
    border:1px solid var(--border);
    border-radius:999px;
    padding:3px 9px;
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .state-pill.match{
    background:var(--gold);
    border-color:var(--gold);
    color:#12151f;
    font-weight:600;
  }

  footer{
    text-align:center;
    font-size:11px;
    color:var(--text-dimmer);
    margin-top:28px;
    line-height:1.6;
    padding:0 12px;
  }
</style>
</head>

    <div id="resultCount" class="result-count"></div>

    <div class="section-label">Referencia</div>
    <div id="featuredRow" class="featured-row"></div>

    <div id="grid" class="grid"></div>

    <footer>
      * Arizona no observa horario de verano (excepto la Nación Navajo). (E) = este del estado, (O) = oeste, (S) = sur, (N) = norte.
    </footer>
  </div>

<script>
const ZONES = [
  {
    city: "Nueva York", region: "Este", tz: "America/New_York", abbr: "ET", accent: "#c9a24b",
    states: ["Connecticut","Delaware","Florida","Georgia","Indiana","Kentucky (E)","Maine","Maryland","Massachusetts","Míchigan","New Hampshire","Nueva Jersey","Nueva York","Carolina del Norte","Ohio","Pensilvania","Rhode Island","Carolina del Sur","Tennessee (E)","Vermont","Virginia","Virginia Occidental","Washington D.C."]
  },
  {
    city: "Chicago", region: "Central", tz: "America/Chicago", abbr: "CT", accent: "#7fb0d9",
    states: ["Alabama","Arkansas","Illinois","Iowa","Kansas (E)","Kentucky (O)","Luisiana","Minnesota","Misisipi","Misuri","Nebraska (E)","Dakota del Norte (centro)","Oklahoma","Dakota del Sur (E)","Tennessee (O)","Texas","Wisconsin"]
  },
  {
    city: "Denver", region: "Montaña", tz: "America/Denver", abbr: "MT", accent: "#d98f6b",
    states: ["Arizona*","Colorado","Idaho (S)","Kansas (O)","Montana","Nebraska (O)","Nuevo México","Dakota del Norte (O)","Dakota del Sur (O)","Texas (El Paso)","Utah","Wyoming"]
  },
  {
    city: "Los Ángeles", region: "Pacífico", tz: "America/Los_Angeles", abbr: "PT", accent: "#8fc99e",
    states: ["California","Idaho (N)","Nevada","Oregón","Washington"]
  },
  {
    city: "Anchorage", region: "Alaska", tz: "America/Anchorage", abbr: "AKT", accent: "#b98fd9",
    states: ["Alaska"]
  },
  {
    city: "Honolulu", region: "Hawái", tz: "Pacific/Honolulu", abbr: "HST", accent: "#e0b866",
    states: ["Hawái"]
  }
];

const FEATURED = [
  { city: "Ciudad de México", tz: "America/Mexico_City", abbr: "CST", accent: "#7fbf8f", flag: "🇲🇽" },
  { city: "Cancún", tz: "America/Cancun", abbr: "EST", accent: "#d97b7b", flag: "🇲🇽" },
  { city: "Washington D.C.", tz: "America/New_York", abbr: "ET", accent: "#7fa8d9", flag: "🇺🇸" }
];

function normalize(str){
  return str.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/\s*\([^)]*\)/g, "")
    .replace(/\*/g, "")
    .trim();
}

function getZonedParts(date, tz){
  const fmt = new Intl.DateTimeFormat("en-US", { timeZone: tz, hour12:false, hour:"2-digit", minute:"2-digit", second:"2-digit" });
  const parts = fmt.formatToParts(date);
  const get = t => parseInt(parts.find(p => p.type === t).value, 10);
  return { h: get("hour") % 24, m: get("minute"), s: get("second") };
}

function pad(n){ return n.toString().padStart(2,"0"); }

function digital12(h,m,s){
  const period = h >= 12 ? "PM" : "AM";
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return { time: `${pad(h12)}:${pad(m)}:${pad(s)}`, period };
}

function dateStrFor(tz, date){
  return new Intl.DateTimeFormat("es-ES", { timeZone: tz, weekday:"long", day:"numeric", month:"long" }).format(date);
}

function analogClockSVG(h, m, s, accent){
  const cx=100, cy=100, r=92;
  const hourAngle = ((h % 12) + m/60) * 30;
  const minAngle = (m + s/60) * 6;
  const secAngle = s * 6;

  let ticks = "";
  for(let i=0;i<60;i++){
    const angle = (i*6*Math.PI)/180;
    const isHour = i % 5 === 0;
    const outer = r - 2;
    const inner = isHour ? r-12 : r-6;
    const x1 = cx + outer*Math.sin(angle);
    const y1 = cy - outer*Math.cos(angle);
    const x2 = cx + inner*Math.sin(angle);
    const y2 = cy - inner*Math.cos(angle);
    ticks += `<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" stroke="${isHour ? accent : '#3a3f55'}" stroke-width="${isHour?2.5:1}" stroke-linecap="round"/>`;
  }

  function handLine(angleDeg, length, width, color){
    const angle = (angleDeg*Math.PI)/180;
    const x2 = cx + length*Math.sin(angle);
    const y2 = cy - length*Math.cos(angle);
    return `<line x1="${cx}" y1="${cy}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" stroke="${color}" stroke-width="${width}" stroke-linecap="round"/>`;
  }

  return `
  <svg viewBox="0 0 200 200" class="clock-svg" xmlns="http://www.w3.org/2000/svg">
    <circle cx="${cx}" cy="${cy}" r="${r+6}" fill="#161a29" stroke="#2a3049" stroke-width="2"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="#12151f"/>
    ${ticks}
    ${handLine(hourAngle, 48, 4.5, "#f3ebd9")}
    ${handLine(minAngle, 68, 3, "#f3ebd9")}
    ${handLine(secAngle, 74, 1.4, accent)}
    <circle cx="${cx}" cy="${cy}" r="4.5" fill="${accent}"/>
  </svg>`;
}

// ---- Build featured row ----
const featuredRow = document.getElementById("featuredRow");
FEATURED.forEach(item => {
  const card = document.createElement("div");
  card.className = "featured-card";
  card.style.borderColor = item.accent + "80";
  card.style.boxShadow = `0 0 0 1px ${item.accent}26, 0 10px 35px ${item.accent}1f`;
  card.innerHTML = `
    <div class="topbar" style="background:linear-gradient(90deg, transparent, ${item.accent}, transparent)"></div>
    <div class="clock-container"></div>
    <div class="abbr" style="color:${item.accent}">${item.flag} ${item.abbr}</div>
    <div class="city">${item.city}</div>
    <div class="digital"><span class="time"></span><span class="period"></span></div>
    <div class="date"></div>
  `;
  card.dataset.tz = item.tz;
  card.dataset.accent = item.accent;
  featuredRow.appendChild(card);
});

// ---- Build zone grid ----
const gridEl = document.getElementById("grid");
ZONES.forEach(zone => {
  const card = document.createElement("div");
  card.className = "zone-card";
  card.dataset.tz = zone.tz;
  card.dataset.accent = zone.accent;

  const statePills = zone.states.map(s =>
    `<span class="state-pill" data-state="${s}">${s}</span>`
  ).join("");

  card.innerHTML = `
    <div class="topbar" style="background:linear-gradient(90deg, transparent, ${zone.accent}, transparent)"></div>
    <div class="clock-container"></div>
    <div class="zone-region" style="color:${zone.accent}">
      <span class="dot" style="background:${zone.accent}"></span>${zone.region} · ${zone.abbr}
    </div>
    <div class="zone-city">${zone.city}</div>
    <div class="zone-digital"><span class="time"></span><span class="period"></span></div>
    <div class="zone-date"></div>
    <div class="states-wrap">
      <div class="states-title">Estados (${zone.states.length})</div>
      <div class="states-list">${statePills}</div>
    </div>
  `;
  gridEl.appendChild(card);
});

// ---- Clock tick ----
function updateClocks(){
  const now = new Date();

  document.querySelectorAll(".featured-card").forEach(card => {
    const tz = card.dataset.tz, accent = card.dataset.accent;
    const { h, m, s } = getZonedParts(now, tz);
    const { time, period } = digital12(h, m, s);
    card.querySelector(".clock-container").innerHTML = analogClockSVG(h, m, s, accent);
    card.querySelector(".time").textContent = time;
    card.querySelector(".period").textContent = period;
    card.querySelector(".date").textContent = dateStrFor(tz, now);
  });

  document.querySelectorAll(".zone-card").forEach(card => {
    const tz = card.dataset.tz, accent = card.dataset.accent;
    const { h, m, s } = getZonedParts(now, tz);
    const { time, period } = digital12(h, m, s);
    card.querySelector(".clock-container").innerHTML = analogClockSVG(h, m, s, accent);
    card.querySelector(".time").textContent = time;
    card.querySelector(".period").textContent = period;
    card.querySelector(".zone-date").textContent = dateStrFor(tz, now);
  });
}
updateClocks();
setInterval(updateClocks, 1000);

// ---- Search logic ----
const searchInput = document.getElementById("searchInput");
const clearBtn = document.getElementById("clearBtn");
const suggestionsEl = document.getElementById("suggestions");
const resultCountEl = document.getElementById("resultCount");

const ALL_STATES = ZONES.flatMap(zone => zone.states.map(s => ({ label: s, zone })));

function runSearch(query){
  const q = normalize(query);
  clearBtn.classList.toggle("hidden", query.length === 0);

  // suggestions
  if(q.length > 0){
    const matches = ALL_STATES.filter(s => normalize(s.label).includes(q)).slice(0, 8);
    if(matches.length > 0){
      suggestionsEl.innerHTML = matches.map(m =>
        `<button class="suggestion-item" data-label="${m.label}" data-tz="${m.zone.tz}">
          <span>${m.label}</span><span class="abbr">${m.zone.abbr}</span>
        </button>`
      ).join("");
      suggestionsEl.classList.add("open");
    } else {
      suggestionsEl.classList.remove("open");
      suggestionsEl.innerHTML = "";
    }
  } else {
    suggestionsEl.classList.remove("open");
    suggestionsEl.innerHTML = "";
  }

  // zone matching + result count
  let resultCount = 0;
  const matchedTz = new Set();

  document.querySelectorAll(".zone-card").forEach(card => {
    const zone = ZONES.find(z => z.tz === card.dataset.tz);
    let zoneHasMatch = false;

    card.querySelectorAll(".state-pill").forEach(pill => {
      const isMatch = q.length > 0 && normalize(pill.dataset.state).includes(q);
      pill.classList.toggle("match", isMatch);
      if(isMatch){ zoneHasMatch = true; resultCount++; }
    });

    if(q.length > 0){
      card.classList.toggle("matched", zoneHasMatch);
      card.classList.toggle("dimmed", !zoneHasMatch);
      if(zoneHasMatch) matchedTz.add(zone.tz);
    } else {
      card.classList.remove("matched", "dimmed");
    }
  });

  if(q.length === 0){
    resultCountEl.textContent = "";
  } else if(resultCount > 0){
    resultCountEl.textContent = `${resultCount} coincidencia${resultCount>1?"s":""} encontrada${resultCount>1?"s":""}`;
  } else {
    resultCountEl.textContent = "Sin coincidencias — revisa la ortografía";
  }
}

searchInput.addEventListener("input", (e) => runSearch(e.target.value));
searchInput.addEventListener("focus", () => { if(searchInput.value) runSearch(searchInput.value); });
searchInput.addEventListener("blur", () => setTimeout(() => suggestionsEl.classList.remove("open"), 150));

clearBtn.addEventListener("click", () => {
  searchInput.value = "";
  runSearch("");
  searchInput.focus();
});

suggestionsEl.addEventListener("mousedown", (e) => {
  const btn = e.target.closest(".suggestion-item");
  if(!btn) return;
  searchInput.value = btn.dataset.label;
  runSearch(btn.dataset.label);
  const card = document.querySelector(`.zone-card[data-tz="${btn.dataset.tz}"]`);
  if(card) card.scrollIntoView({ behavior:"smooth", block:"center" });
});
</script>
</body>
</html>
