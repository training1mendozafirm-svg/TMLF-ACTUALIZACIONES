<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training DVS — The Mendoza Law Firm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:wght@400;500;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy-950:#0a1628;
  --navy-900:#0f1f38;
  --navy-800:#152a4a;
  --navy-700:#1c3660;
  --navy-600:#254478;
  --gold-500:#c9a24b;
  --gold-400:#dcb968;
  --gold-300:#e8cf94;
  --cream:#f7f3ea;
  --ink:#1a2233;
  --ink-soft:#4a5568;
  --white:#ffffff;
  --danger:#a4392f;
  --danger-bg:#f7e6e3;
  --ok:#3f6b4a;
  --ok-bg:#e7f0e8;
  --warn:#8a6a1f;
  --warn-bg:#fbf1dd;
  --radius:10px;
  --shadow:0 8px 24px rgba(10,22,40,.12);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--cream);
  color:var(--ink);
  display:flex;
  min-height:100vh;
  overflow-x:hidden;
  width:100%;
}
h1,h2,h3,h4{font-family:'Cormorant Garamond',serif;font-weight:700;color:var(--navy-900);margin:0 0 .4em;}
.eyebrow{font-family:'Barlow Condensed',sans-serif;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--gold-500);font-size:.8rem;margin-bottom:.5em;}

/* SIDEBAR */
#sidebar{
  width:280px;min-width:280px;
  background:linear-gradient(180deg,var(--navy-950),var(--navy-900) 60%,var(--navy-800));
  color:var(--cream);
  position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;
  padding:0;
  z-index:50;
  transition:transform .3s ease;
}
#sidebar .brand{
  padding:28px 24px 18px;
  border-bottom:1px solid rgba(232,207,148,.15);
}
#sidebar .brand .mark{font-family:'Cormorant Garamond',serif;font-size:1.5rem;color:var(--gold-300);font-weight:700;}
#sidebar .brand .sub{font-family:'Barlow Condensed',sans-serif;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(247,243,234,.55);margin-top:2px;}
#progress-wrap{padding:16px 24px 8px;}
#progress-label{font-family:'Barlow Condensed',sans-serif;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(247,243,234,.6);display:flex;justify-content:space-between;margin-bottom:6px;}
#progress-bar-bg{height:6px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;}
#progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--gold-500),var(--gold-300));width:0%;transition:width .4s ease;border-radius:4px;}
nav#module-nav{flex:1;overflow-y:auto;padding:10px 12px 20px;}
.nav-group{margin-bottom:6px;}
.nav-mod-btn{
  width:100%;text-align:left;background:none;border:none;color:var(--cream);
  font-family:'Barlow Condensed',sans-serif;font-size:1rem;font-weight:600;letter-spacing:.02em;
  padding:12px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:10px;
  opacity:.55;transition:.2s;
}
.nav-mod-btn .num{
  width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(247,243,234,.35);
  display:flex;align-items:center;justify-content:center;font-size:.72rem;flex-shrink:0;
  font-family:'DM Sans',sans-serif;
}
.nav-mod-btn.active{opacity:1;background:rgba(201,162,75,.14);}
.nav-mod-btn.active .num{background:var(--gold-500);border-color:var(--gold-500);color:var(--navy-950);font-weight:700;}
.nav-mod-btn.done .num{background:var(--ok);border-color:var(--ok);color:#fff;}
.nav-mod-btn.done{opacity:.85;}
.nav-mod-btn:hover{opacity:1;background:rgba(255,255,255,.06);}
#sidebar-footer{padding:16px 24px;border-top:1px solid rgba(232,207,148,.15);font-family:'Barlow Condensed',sans-serif;font-size:.72rem;color:rgba(247,243,234,.45);letter-spacing:.04em;}

/* MAIN */
#main{flex:1;min-height:100vh;display:flex;flex-direction:column;}
#topbar{
  display:none;
  background:var(--navy-950);color:var(--cream);padding:14px 18px;
  align-items:center;justify-content:space-between;position:sticky;top:0;z-index:60;
}
#topbar button{background:none;border:1px solid rgba(247,243,234,.3);color:var(--cream);border-radius:8px;padding:6px 10px;font-family:'Barlow Condensed',sans-serif;}
#content-scroll{flex:1;padding:40px 56px 100px;max-width:1180px;margin:0 auto;width:100%;overflow-x:hidden;box-sizing:border-box;}
.module-header{margin-bottom:36px;padding-bottom:22px;border-bottom:1px solid rgba(21,42,74,.12);}
.module-header h1{font-size:2.15rem;line-height:1.15;margin-bottom:4px;}
.module-header .desc{color:var(--ink-soft);font-size:1.02rem;max-width:640px;}
#module-body{display:block;}

/* MASONRY-ish content grid to avoid empty space */
.content-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px;align-items:start;}
.content-grid.wide{grid-template-columns:repeat(auto-fit,minmax(420px,1fr));}
.span-2{grid-column:span 2;}
@media(max-width:820px){.span-2{grid-column:span 1;}}

.card{
  background:var(--white);border-radius:12px;box-shadow:0 1px 3px rgba(10,22,40,.06),0 1px 2px rgba(10,22,40,.08);
  padding:30px 34px;margin-bottom:24px;border:1px solid rgba(21,42,74,.08);
}
.card h3{font-size:1.4rem;color:var(--navy-800);margin-bottom:.5em;}
.card h3 span.icon{margin-right:8px;}
.card .eyebrow{margin-bottom:.7em;}

.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:18px 0;}
.flow-step{
  background:var(--navy-800);color:var(--cream);padding:9px 16px;border-radius:20px;
  font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:.95rem;letter-spacing:.02em;
  white-space:nowrap;
}
.flow-arrow{color:var(--gold-500);font-weight:700;font-size:1.1rem;}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
@media(max-width:820px){.grid2,.grid3{grid-template-columns:1fr;}}

.profile-card{
  border:1.5px solid var(--navy-700);border-radius:var(--radius);padding:18px 20px;background:var(--cream);
}
.profile-card h4{color:var(--navy-800);font-size:1.15rem;border-bottom:1px dashed rgba(21,42,74,.25);padding-bottom:6px;margin-bottom:10px;}
.profile-card ul{margin:0;padding-left:18px;font-size:.93rem;color:var(--ink-soft);}
.profile-card ul li{margin-bottom:4px;}
.tag{
  display:inline-block;font-family:'Barlow Condensed',sans-serif;font-size:.7rem;letter-spacing:.08em;
  text-transform:uppercase;padding:3px 9px;border-radius:20px;font-weight:600;margin-bottom:8px;
}
.tag-humanitaria{background:#f3e3e0;color:#8a3b2e;}
.tag-papeles{background:#e3ecf3;color:#28486e;}
.tag-fuera{background:#eae3f3;color:#503b7a;}
.tag-dentro{background:#e3f0e6;color:#2c5c3a;}

.timeline{display:flex;flex-direction:column;gap:0;margin:20px 0;}
.timeline-phase{display:flex;gap:18px;position:relative;padding-bottom:28px;}
.timeline-phase:last-child{padding-bottom:0;}
.timeline-phase::before{
  content:'';position:absolute;left:17px;top:38px;bottom:0;width:2px;background:rgba(201,162,75,.35);
}
.timeline-phase:last-child::before{display:none;}
.timeline-dot{
  width:36px;height:36px;border-radius:50%;background:var(--navy-800);color:var(--gold-300);
  display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;
  font-weight:700;font-size:.85rem;flex-shrink:0;z-index:1;
}
.timeline-content{flex:1;background:var(--white);border:1px solid rgba(21,42,74,.08);border-radius:var(--radius);padding:16px 20px;}
.timeline-content h4{margin:0 0 8px;font-size:1.15rem;color:var(--navy-800);}
.timeline-content ol,.timeline-content ul{margin:0;padding-left:20px;font-size:.92rem;}
.timeline-content li{margin-bottom:5px;}

.link-table{width:100%;border-collapse:collapse;margin:16px 0;}
.link-table th{
  background:var(--navy-800);color:var(--gold-300);text-align:left;padding:10px 14px;
  font-family:'Barlow Condensed',sans-serif;letter-spacing:.05em;text-transform:uppercase;font-size:.78rem;
}
.link-table td{padding:11px 14px;border-bottom:1px solid rgba(21,42,74,.08);font-size:.92rem;}
.link-table tr:nth-child(even){background:rgba(21,42,74,.03);}
.link-table a{color:var(--navy-700);font-weight:600;text-decoration:none;border-bottom:1px dotted var(--navy-700);}
.link-table a:hover{color:var(--gold-500);border-color:var(--gold-500);}

.stop-box{
  background:var(--danger-bg);border:2px solid var(--danger);border-radius:var(--radius);
  padding:20px 22px;margin:18px 0;
}
.stop-box .stop-label{
  display:inline-block;background:var(--danger);color:#fff;font-family:'Barlow Condensed',sans-serif;
  font-weight:700;letter-spacing:.08em;padding:4px 12px;border-radius:5px;font-size:.85rem;margin-bottom:10px;
}
.warn-box{background:var(--warn-bg);border-left:4px solid var(--warn);border-radius:6px;padding:16px 18px;margin:16px 0;}
.ok-box{background:var(--ok-bg);border-left:4px solid var(--ok);border-radius:6px;padding:16px 18px;margin:16px 0;}

.speech-box{
  background:var(--navy-950);color:var(--cream);border-radius:var(--radius);padding:20px 22px;
  font-style:italic;font-family:'Cormorant Garamond',serif;font-size:1.15rem;line-height:1.55;margin:14px 0;
  border-left:4px solid var(--gold-500);
}

.exercise{
  background:linear-gradient(135deg,var(--navy-800),var(--navy-700));color:var(--cream);
  border-radius:var(--radius);padding:24px 26px;margin:26px 0;
}
.exercise .eyebrow{color:var(--gold-300);}
.exercise textarea{
  width:100%;min-height:90px;border-radius:8px;border:1px solid rgba(247,243,234,.3);
  background:rgba(255,255,255,.06);color:var(--cream);padding:12px;font-family:'DM Sans',sans-serif;
  font-size:.95rem;resize:vertical;
}
.exercise textarea::placeholder{color:rgba(247,243,234,.4);}
.exercise .reveal-btn{
  margin-top:12px;background:var(--gold-500);color:var(--navy-950);border:none;padding:9px 18px;
  border-radius:20px;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.03em;cursor:pointer;
}
.exercise .answer-panel{display:none;margin-top:14px;background:rgba(0,0,0,.2);border-radius:8px;padding:14px 16px;font-size:.92rem;}
.exercise .answer-panel.show{display:block;}

.quiz-q{background:var(--white);border-radius:12px;padding:24px 26px;margin-bottom:16px;box-shadow:0 1px 3px rgba(10,22,40,.06),0 1px 2px rgba(10,22,40,.08);border:1px solid rgba(21,42,74,.08);}
.quiz-q .q-title{font-weight:700;color:var(--navy-800);margin-bottom:12px;font-size:1.02rem;}
.quiz-opt{
  display:block;width:100%;text-align:left;background:var(--cream);border:1.5px solid rgba(21,42,74,.15);
  border-radius:8px;padding:11px 14px;margin-bottom:8px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:.93rem;
  transition:.15s;
}
.quiz-opt:hover{border-color:var(--navy-600);}
.quiz-opt.correct{background:var(--ok-bg);border-color:var(--ok);}
.quiz-opt.incorrect{background:var(--danger-bg);border-color:var(--danger);}
.quiz-feedback{margin-top:10px;font-size:.9rem;font-weight:600;display:none;}
.quiz-feedback.show{display:block;}

/* BADGES / ETIQUETAS de refuerzo */
.badge{
  display:inline-flex;align-items:center;gap:5px;font-family:'Barlow Condensed',sans-serif;
  font-size:.68rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  padding:3px 10px;border-radius:4px;margin:0 6px 10px 0;
}
.badge-key{background:var(--navy-900);color:var(--gold-300);}
.badge-action{background:var(--gold-500);color:var(--navy-950);}
.badge-critical{background:var(--danger);color:#fff;}
.badge-caution{background:var(--warn);color:#fff;}
.badge-ok{background:var(--ok);color:#fff;}
.badge-outline{background:none;border:1.3px solid var(--navy-700);color:var(--navy-800);}

mark.hl{background:linear-gradient(180deg,transparent 55%,rgba(201,162,75,.4) 55%);padding:0 2px;font-weight:600;}
mark.hl-danger{background:linear-gradient(180deg,transparent 55%,rgba(164,57,47,.28) 55%);padding:0 2px;font-weight:600;}

.corner-tag{
  position:absolute;top:16px;right:0;background:var(--gold-500);color:var(--navy-950);
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.68rem;letter-spacing:.07em;
  padding:5px 16px 5px 14px;border-radius:20px 0 0 20px;text-transform:uppercase;
}
.card{position:relative;}
.card:has(.corner-tag) h3, .card:has(.corner-tag) .eyebrow{padding-right:150px;}

.combo-strip{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0;}
.combo-step{background:var(--gold-500);color:var(--navy-950);padding:8px 14px;border-radius:6px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.85rem;}

.platform-chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--navy-800);color:var(--cream);
  padding:7px 14px;border-radius:20px;font-family:'Barlow Condensed',sans-serif;font-weight:600;margin:4px 6px 4px 0;
}

.nav-buttons{display:flex;justify-content:space-between;margin-top:40px;padding-top:24px;border-top:1px solid rgba(21,42,74,.1);}
.nav-buttons button{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.03em;font-size:1rem;
  padding:12px 26px;border-radius:24px;border:none;cursor:pointer;transition:.2s;
}
.btn-primary{background:var(--navy-900);color:var(--gold-300);}
.btn-primary:hover{background:var(--navy-800);}
.btn-primary:disabled{opacity:.35;cursor:not-allowed;}
.btn-ghost{background:none;border:1.5px solid var(--navy-700)!important;color:var(--navy-800);}
.btn-ghost:hover{background:rgba(21,42,74,.05);}

.chase-scenario{background:var(--white);border:2px solid var(--gold-500);border-radius:var(--radius);padding:22px;margin:18px 0;}
.chase-scenario .scenario-tag{font-family:'Barlow Condensed',sans-serif;color:var(--gold-500);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.78rem;}

.module{display:none;}
.module.active{display:block;animation:fadeIn .35s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

::-webkit-scrollbar{width:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(21,42,74,.2);border-radius:10px;}

@media(max-width:900px){
  #sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.4);}
  #sidebar.open{transform:translateX(0);}
  #topbar{display:flex;}
  #content-scroll{padding:28px 20px 70px;}
  .module-header h1{font-size:1.8rem;}
}
</style>
</head>
<body>

<aside id="sidebar">
  <div class="brand">
    <div class="mark">TMLF Academy</div>
    <div class="sub">Training DVS · Domestic Violence Specialist</div>
  </div>
  <div id="progress-wrap">
    <div id="progress-label"><span>Progreso</span><span id="progress-pct">0%</span></div>
    <div id="progress-bar-bg"><div id="progress-bar-fill"></div></div>
  </div>
  <nav id="module-nav"></nav>
  <div id="sidebar-footer">The Mendoza Law Firm<br>Departamento de Training</div>
</aside>

<div id="main">
  <div id="topbar">
    <button onclick="toggleSidebar()">☰ Módulos</button>
    <strong id="topbar-title" style="font-family:'Barlow Condensed',sans-serif;"></strong>
  </div>
  <div id="content-scroll"></div>
</div>

<script>
/* =========================================================
   TRAINING DVS — The Mendoza Law Firm
   Orden: Ruta de Oro → End to End DVS (Intake, Consulta, Links) → Info Importante → Simulación
========================================================= */

const MODULES = [
  { id:'bienvenida', num:'0', label:'Bienvenida', title:'Bienvenido al Training DVS', render: renderBienvenida },
  { id:'ruta-oro', num:'1', label:'Ruta de Oro', title:'Módulo 1 · Ruta de Oro', render: renderRutaOro },
  { id:'e2e-overview', num:'2', label:'End to End DVS', title:'Módulo 2 · End to End DVS', render: renderE2EOverview },
  { id:'intake', num:'2.1', label:'Intake', title:'Módulo 2.1 · Intake', render: renderIntake },
  { id:'consulta', num:'2.2', label:'Consulta', title:'Módulo 2.2 · Consulta', render: renderConsulta },
  { id:'links', num:'2.3', label:'Links Operativos', title:'Módulo 2.3 · Herramientas y Links Operativos', render: renderLinks },
  { id:'importante', num:'3', label:'Información Importante', title:'Módulo 3 · Información Importante', render: renderImportante },
  { id:'simulacion', num:'4', label:'Simulación Final', title:'Módulo 4 · Simulación End to End', render: renderSimulacion },
];

let currentIndex = 0;
let completed = new Set();

function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); }

function buildNav(){
  const nav = document.getElementById('module-nav');
  nav.innerHTML = '';
  MODULES.forEach((m, i) => {
    const btn = document.createElement('button');
    btn.className = 'nav-mod-btn';
    btn.id = 'navbtn-' + m.id;
    btn.innerHTML = `<span class="num">${m.num}</span><span>${m.label}</span>`;
    btn.onclick = () => goTo(i);
    nav.appendChild(btn);
  });
}

function goTo(i){
  currentIndex = i;
  completed.add(MODULES[Math.max(0,i-1)].id); // mark previous as visited path
  render();
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('content-scroll').scrollTop = 0;
  window.scrollTo(0,0);
}

function markDone(id){ completed.add(id); updateProgress(); }

function updateProgress(){
  const pct = Math.round((completed.size / MODULES.length) * 100);
  document.getElementById('progress-bar-fill').style.width = pct + '%';
  document.getElementById('progress-pct').textContent = pct + '%';
  MODULES.forEach(m => {
    const btn = document.getElementById('navbtn-' + m.id);
    btn.classList.toggle('active', MODULES[currentIndex].id === m.id);
    btn.classList.toggle('done', completed.has(m.id) && MODULES[currentIndex].id !== m.id);
  });
}

function render(){
  const m = MODULES[currentIndex];
  document.getElementById('topbar-title').textContent = m.label;
  const el = document.getElementById('content-scroll');
  el.innerHTML = `
    <div class="module-header">
      <div class="eyebrow">Training DVS · TMLF Academy</div>
      <h1>${m.title}</h1>
    </div>
    <div id="module-body"></div>
    <div class="nav-buttons">
      <button class="btn-ghost" onclick="prevModule()" ${currentIndex===0?'disabled':''}>&larr; Anterior</button>
      <button class="btn-primary" id="next-btn" onclick="nextModule()">${currentIndex===MODULES.length-1?'Finalizar':'Siguiente'} &rarr;</button>
    </div>
  `;
  document.getElementById('module-body').innerHTML = m.render();
  markDone(m.id);
  updateProgress();
  attachHandlers();
}

function prevModule(){ if(currentIndex>0){ currentIndex--; goTo(currentIndex);} }
function nextModule(){ if(currentIndex<MODULES.length-1){ currentIndex++; goTo(currentIndex);} else { alert('¡Training completado! Has recorrido las 5 etapas: Ruta de Oro, Intake, Consulta, Links Operativos e Información Importante, y llegaste a la simulación final.'); } }

function revealAnswer(btnId, panelId){
  document.getElementById(panelId).classList.toggle('show');
}

function checkQuiz(optBtn, isCorrect, feedbackId){
  const group = optBtn.parentElement.querySelectorAll('.quiz-opt');
  group.forEach(b => b.onclick = null);
  group.forEach(b => b.style.opacity = '.6');
  optBtn.style.opacity = '1';
  optBtn.classList.add(isCorrect ? 'correct' : 'incorrect');
  const fb = document.getElementById(feedbackId);
  fb.classList.add('show');
}

function attachHandlers(){ /* reserved for future dynamic binds */ }

/* ================= MODULE RENDERERS ================= */

function renderBienvenida(){
  return `
  <div class="card">
    <div class="eyebrow">Objetivo general</div>
    <p style="font-size:1.08rem;color:var(--ink-soft);">Al finalizar este training, el colaborador podrá ejecutar la función de <strong>DVS</strong> desde la identificación inicial del perfil del cliente hasta la consulta, siguiendo la rutina operativa, utilizando correctamente las herramientas y links del área, y aplicando los lineamientos especiales establecidos.</p>
  </div>
  <div class="card">
    <h3>Ruta del training</h3>
    <div class="timeline">
      <div class="timeline-phase">
        <div class="timeline-dot">1</div>
        <div class="timeline-content"><h4>Ruta de Oro</h4><p style="color:var(--ink-soft);margin:0;">¿Qué perfil tengo frente a mí? Aprendes a detectar procesos antes de operar.</p></div>
      </div>
      <div class="timeline-phase">
        <div class="timeline-dot">2</div>
        <div class="timeline-content"><h4>End to End DVS — Intake</h4><p style="color:var(--ink-soft);margin:0;">Cómo obtener y documentar la información del cliente. Antes · Durante · Después.</p></div>
      </div>
      <div class="timeline-phase">
        <div class="timeline-dot">3</div>
