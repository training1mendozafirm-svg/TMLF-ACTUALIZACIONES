<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>I-485 · Caso práctico y guía anotada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style id="css">/* Layout: paralegal workstation — narrow case file column (expediente) on the left, the form being filled (60-70%) on the right. Single light look to match the TMLF case artifacts. */
:root{
  color-scheme:light;
  --navy:#1E2940; --navy-2:#2A3756; --gold:#C9A227; --gold-soft:#F6EBC8;
  --paper:#F4F0E6; --card:#FFFFFF; --ink:#1D2433; --muted:#6A7285; --line:#E3DCCB;
  --blue:#3B5B9A; --blue-soft:#E9EEF8; --amber:#B8862B; --amber-soft:#FBF4E4; --rose:#B04A4A; --rose-soft:#FBECEC;
  --ok:#157A4A; --ok-bg:rgba(21,122,74,.16); --ok-soft:#E6F4EC;
  --bad:#C62828; --bad-bg:rgba(198,40,40,.20); --bad-soft:#FDECEC;
  --typed:#0B3AA6; --hover:#2F5FD0;
  --f-display:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --f-ui:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --hdr:58px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:14px}
button{font-family:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--navy);color:#fff;border-bottom:3px solid var(--gold);min-height:var(--hdr);display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;padding-inline:16px;padding-block:8px}
.top h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.2px}
.top h1 em{color:var(--gold);font-weight:600}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
.stat{display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:4px 10px;font-size:12.5px;font-variant-numeric:tabular-nums;color:#E8ECF5}
.dot{width:9px;height:9px;border-radius:50%}
.dot.ok{background:#4FCB8B} .dot.bad{background:#FF7A7A} .dot.todo{background:transparent;outline:1px dashed #C9D2E6}
.app{display:grid;grid-template-columns:minmax(260px,26%) minmax(0,1fr);height:calc(100% - var(--hdr))}
.app.noexp{grid-template-columns:minmax(0,1fr)}
.app.noexp .exp{display:none}
@media (max-width:1000px){.app{grid-template-columns:minmax(0,1fr);height:auto}}
.exp{overflow-y:auto;padding-inline:16px;padding-block:16px 40px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:12px;min-width:0}
@media (max-width:1000px){.exp{overflow:visible;border-right:0;border-bottom:1px solid var(--line)}}
.exp-head{background:var(--navy);color:#fff;border-radius:12px;padding:16px 18px;box-shadow:0 6px 18px rgba(30,41,64,.18)}
.eyebrow{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold);font-weight:700;margin:0 0 6px}
.exp-head h2{margin:0 0 8px;font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.1}
.exp-head p{margin:0 0 12px;font-size:12.5px;line-height:1.55;color:#D6DCEA}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 10px}
.chip.g{background:var(--gold-soft);color:#6B5210}
.chip.r{background:var(--rose-soft);color:var(--rose)}
.chip.b{background:var(--blue-soft);color:var(--blue)}
.hint{background:var(--blue-soft);border:1px solid #CCD7EE;border-left:3px solid var(--blue);border-radius:8px;padding:9px 12px;font-size:12.5px;line-height:1.5;color:#2A3756}
.sec{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;padding:12px 14px}
.sec.ben{border-left-color:var(--amber);background:var(--amber-soft)}
.sec.cas{border-left-color:var(--rose);background:var(--rose-soft)}
.sec h3{margin:0 0 8px;font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);font-weight:700}
.row{padding-block:6px;border-top:1px solid var(--line);display:grid;gap:1px}
.row:first-of-type{border-top:0}
.row b{font-size:11.5px;font-weight:700;color:var(--navy-2)}
.row span{font-size:13px;line-height:1.4;overflow-wrap:anywhere}
.row small{font-size:11px;color:var(--muted)}
.work{display:flex;flex-direction:column;min-width:0;min-height:0}
.workbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding-inline:16px;padding-block:10px;background:#FFFFFF;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tab{font-size:13px;font-weight:600;min-width:32px;padding:5px 7px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;position:relative;font-variant-numeric:tabular-nums}
.tab:hover{color:var(--ink);border-color:var(--line)}
.tab[aria-current="true"]{color:var(--navy);border-color:var(--gold);background:var(--gold-soft)}
.tab .pbar{position:absolute;left:4px;right:4px;bottom:1px;height:2px;border-radius:2px;background:var(--line);overflow:hidden}
.tab .pbar i{display:block;height:100%;background:var(--ok)}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{font-size:12.5px;font-weight:600;border-radius:6px;padding:6px 10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--navy-2)}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold);color:#5A4410}
.btn:focus-visible,.fld:focus-visible,.tab:focus-visible{outline:2px solid var(--hover);outline-offset:2px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding-inline:16px;padding-block:8px 0}
.legend span{display:inline-flex;gap:6px;align-items:center}
.sw{flex:none;width:20px;height:12px;border-radius:2px}
.sw.todo{border:1px dashed rgba(47,95,208,.7);background:rgba(47,95,208,.06)}
.sw.ok{border:1px solid var(--ok);background:var(--ok-bg)}
.sw.bad{border:1.5px solid var(--bad);background:var(--bad-bg)}
.scroll{overflow-y:auto;padding-inline:16px;padding-block:12px 120px;min-height:0;flex:1}
@media (max-width:1000px){.scroll{overflow:visible}}
.sheet{position:relative;width:100%;margin:0 auto;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 28px rgba(30,41,64,.12);container-type:inline-size}
.sheet.form{max-width:900px}
.sheet.ann,.sheet.static{max-width:1500px}
.sheet img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.fld{position:absolute;padding:0;margin:0;border:1px dashed rgba(47,95,208,.55);background:rgba(47,95,208,.06);cursor:pointer;border-radius:2px;display:flex;align-items:center;overflow:hidden}
.fld:hover{background:rgba(47,95,208,.16);border-style:solid}
.fld.ok{background:var(--ok-bg);border:1px solid var(--ok)}
.fld.bad{background:var(--bad-bg);border:1.5px solid var(--bad)}
.fld.sel{box-shadow:0 0 0 2px var(--hover)}
.fld .val{font-family:var(--f-mono);white-space:nowrap;color:var(--typed);line-height:1;font-size:1.55cqi;padding-left:.5cqi}
.fld.c{justify-content:center}
.fld.c .val{padding:0;font-weight:700;font-size:1.6cqi}
.fld.bad::after{content:"✕";position:absolute;right:.4cqi;top:50%;transform:translateY(-50%);font-size:1.25cqi;font-weight:700;color:var(--bad)}
.fld.c.bad::after{right:auto;left:50%;transform:translate(-50%,-50%)}
.sheet.ann .fld .val{font-size:.78cqi;padding-left:.25cqi}
.sheet.ann .fld.c .val{font-size:.8cqi}
.sheet.ann .fld.bad::after{font-size:.62cqi;right:.2cqi}
.pager{display:flex;justify-content:space-between;gap:10px;margin:14px auto 0;max-width:900px}
#detail{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 32px));z-index:50;background:#fff;border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:10px;padding:14px 16px;box-shadow:0 12px 36px rgba(30,41,64,.28)}
#detail .x{position:absolute;top:6px;right:6px;font-size:18px;line-height:1;border:0;background:transparent;color:var(--muted);cursor:pointer;padding:6px}
#detail h2{margin:0 0 8px;font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
.state{display:inline-flex;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;margin-bottom:8px}
.state.ok{background:var(--ok-soft);color:var(--ok)} .state.bad{background:var(--bad-soft);color:var(--bad)}
.item{font-size:14.5px;font-weight:600;margin:0 0 10px;text-wrap:balance}
.value{font-family:var(--f-mono);font-size:16px;padding:8px 10px;border-radius:6px;background:var(--paper);border:1px solid var(--line);overflow-wrap:anywhere}
.reason{font-size:14px;line-height:1.45;padding:10px 12px;border-radius:6px;background:var(--bad-soft);border-left:3px solid var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;margin:12px 0 0;font-size:12.5px;line-height:1.4}
.kv dt{color:var(--muted)} .kv dd{margin:0}
@media (prefers-reduced-motion:no-preference){.fld{transition:background .15s,border-color .15s}}

/* ===== Plantilla genérica: adiciones ===== */
body{margin:0}
.exp .foot{font-size:11.5px;color:var(--muted);margin:0}
.modes{display:flex;border:1px solid rgba(255,255,255,.3);border-radius:8px;overflow:hidden}
.modes button{font:600 12.5px var(--f-ui);background:transparent;color:#D6DCEA;border:0;padding:6px 12px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--gold);color:var(--navy)}
.sheet[hidden],.cover[hidden]{display:none}
/* Portada generada */
.cover{max-width:900px;margin:0 auto;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 28px rgba(30,41,64,.12);border-radius:4px;overflow:hidden}
.cover-hd{background:var(--navy);color:#fff;padding:36px 40px 30px;border-bottom:4px solid var(--gold)}
.cover-hd h2{font-family:var(--f-display);font-size:46px;line-height:1;margin:0 0 10px}
.cover-hd .case{font-family:var(--f-display);font-size:24px;color:var(--gold);margin:0 0 14px;font-style:italic}
.cover-hd p{color:#D6DCEA;line-height:1.6;margin:0 0 14px;max-width:62ch}
.cover-bd{padding:28px 40px 36px;display:grid;gap:22px}
.cover-bd h3{margin:0 0 10px;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.cover-bd ol{margin:0;padding-left:20px;display:grid;gap:8px;line-height:1.55;font-size:14.5px}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.key{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45}
.key .sw{margin-top:3px}
.facts{display:flex;gap:10px;flex-wrap:wrap}
.fact{background:var(--paper);border-radius:8px;padding:10px 16px;font-size:12.5px;color:var(--muted)}
.fact b{display:block;font-size:22px;color:var(--navy);font-family:var(--f-display)}
.empty{max-width:640px;margin:40px auto;text-align:center;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:40px 28px;color:var(--muted);line-height:1.6}
.empty h2{font-family:var(--f-display);color:var(--navy);font-size:28px;margin:0 0 8px}
/* Constructor: estados de campo */
.sheet.edit .fld{cursor:pointer}
.fld.e-none{border:1.5px dashed #E08A00;background:rgba(224,138,0,.12)}
.fld.e-ok{border:1px solid var(--ok);background:rgba(21,122,74,.12)}
.fld.e-bad{border:1.5px solid var(--bad);background:rgba(198,40,40,.12)}
.fld.e-skip{border:1px dotted #8A90A0;background:rgba(0,0,0,.05);opacity:.55}
.fld.e-bad::after{content:"✕";position:absolute;right:.4cqi;top:50%;transform:translateY(-50%);font-size:1.1cqi;font-weight:700;color:var(--bad)}
.fld.c.e-bad::after{right:auto;left:50%;transform:translate(-50%,-50%)}
.sheet.ann .fld.e-bad::after{font-size:.6cqi}
.fld.sel{box-shadow:0 0 0 2px var(--hover),0 0 0 5px rgba(47,95,208,.25);z-index:3}
.sheet.drawing{cursor:crosshair}
.sheet.drawing .fld{cursor:pointer}
.drawbox{position:absolute;border:2px solid var(--hover);background:rgba(47,95,208,.15);pointer-events:none;z-index:4}
.sw.none{border:1.5px dashed #E08A00;background:rgba(224,138,0,.12)}
.sw.skip{border:1px dotted #8A90A0;background:rgba(0,0,0,.05)}
/* Panel del constructor */
.app.editing{grid-template-columns:minmax(330px,30%) minmax(0,1fr)}
.app.editing.noexp{grid-template-columns:minmax(0,1fr)}
.app.noexp .bld{display:none}
@media (max-width:1000px){.app.editing{grid-template-columns:minmax(0,1fr)}}
.bld[hidden],.exp[hidden]{display:none}
.bhead{background:var(--navy);color:#fff;border-radius:12px;padding:14px 16px}
.bhead h2{margin:0 0 6px;font-family:var(--f-display);font-size:24px}
.bhead p{margin:0;font-size:12.5px;line-height:1.5;color:#D6DCEA}
.bsave{margin-top:8px;font-size:11.5px;color:var(--gold)}
.btabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px;position:sticky;top:-16px;z-index:5}
.btabs button{font:600 12px var(--f-ui);border:0;border-radius:7px;padding:8px 4px;background:transparent;color:var(--muted);cursor:pointer}
.btabs button[aria-selected="true"]{background:var(--navy);color:#fff}
.bpane{display:grid;gap:12px}
.bpane[hidden]{display:none}
.bcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px}
.bcard h3{margin:0;font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
.bcard p.help{margin:0;font-size:12px;line-height:1.5;color:var(--muted)}
.bcard label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--navy-2)}
.bcard input[type=text],.bcard textarea,.bcard select{font:13px var(--f-ui);border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff;color:var(--ink);width:100%}
.bcard textarea{resize:vertical;min-height:62px;line-height:1.45}
.bcard textarea.rows{font-family:var(--f-mono);font-size:11.5px;min-height:140px;white-space:pre;overflow-x:auto}
.bcard input:focus,.bcard textarea:focus,.bcard select:focus{outline:2px solid var(--hover);outline-offset:0;border-color:transparent}
.bchk{display:flex !important;gap:8px;align-items:center;font-weight:500 !important}
.bfile{position:relative;display:flex !important;align-items:center;justify-content:center;gap:6px;border:1.5px dashed var(--blue);border-radius:8px;padding:12px;background:var(--blue-soft);color:var(--blue) !important;cursor:pointer;text-align:center}
.bfile.alt{border-color:var(--line);background:#fff;color:var(--muted) !important;padding:8px}
.bfile input{position:absolute;inset:0;opacity:0;cursor:pointer}
.bstat{font-size:12px;color:var(--muted);line-height:1.5}
.bstat:empty{display:none}
.brow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.brow .btn{flex:1 1 auto}
.btn.sm{font-size:11.5px;padding:4px 8px}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad)}
.plist{display:grid;gap:6px}
.pitem{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px}
.pitem b{color:var(--navy)}
.pitem small{color:var(--muted);grid-column:1/-1}
.pitem .brow{grid-column:1/-1}
.mini{display:inline-flex;gap:3px;align-items:center;font-size:11px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1 1 auto;font:600 12px var(--f-ui);border:0;border-right:1px solid var(--line);background:#fff;color:var(--muted);padding:7px 6px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"].ok{background:var(--ok-soft);color:var(--ok)}
.seg button[aria-pressed="true"].bad{background:var(--bad-soft);color:var(--bad)}
.seg button[aria-pressed="true"].skip{background:#ECEDF1;color:#4A5060}
.seg button[aria-pressed="true"].none{background:#FDF1DD;color:#9A5B00}
.seg button[aria-pressed="true"].neu{background:var(--blue-soft);color:var(--blue)}
.bmeta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.bmeta b{color:var(--navy)}
.secbox{border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;padding:10px;display:grid;gap:8px}
.secbox.ben{border-left-color:var(--amber)}
.secbox.cas{border-left-color:var(--rose)}
.secbox .brow input{flex:1}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.counts div{border-radius:8px;padding:8px;text-align:center;font-size:11px;color:var(--muted);background:var(--paper)}
.counts b{display:block;font-size:20px;color:var(--navy);font-family:var(--f-display)}
.warn{font-size:12px;line-height:1.5;padding:9px 11px;border-radius:8px;background:#FDF1DD;border-left:3px solid #E08A00;color:#6B4400}
.warn:empty{display:none}
.toast{position:fixed;left:16px;bottom:16px;z-index:60;background:var(--navy);color:#fff;border-left:4px solid var(--gold);border-radius:8px;padding:10px 14px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:min(420px,calc(100vw - 32px))}
.toast[hidden]{display:none}
.kbd{font-family:var(--f-mono);font-size:11px;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.tools[hidden],.legend[hidden],.btn[hidden]{display:none}
.modes[hidden]{display:none}

/* ===== I-485 multi-caso: adiciones ===== */
:root{--rf:#1f7a3f;--rp:#5a6b2b;--rt:#7a2fb8;--ru:#0e7490;--rv:#be185d;--q:#1d4ed8;--o:#b7791f;--l:#b42318;--m:#1E2940}
.casepick{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#D6DCEA}
.casepick select{font:600 13px var(--f-ui);border-radius:8px;border:1px solid rgba(255,255,255,.35);background:var(--navy-2);color:#fff;padding:6px 10px;max-width:220px}
.casepill{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:2px}
/* Portada teórica */
.th-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.th-cols h4{margin:0 0 8px;font-family:var(--f-display);font-size:21px;color:var(--navy);text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:2px;text-underline-offset:5px}
.th-cols p,.th-cols li{font-size:13.5px;line-height:1.55;margin:0 0 7px}
.th-cols ul{margin:0;padding-left:18px}
.imp{border:2px solid var(--bad);background:var(--bad-soft);border-radius:10px;padding:14px 18px}
.imp h4{margin:0 0 6px;color:var(--bad);font-family:var(--f-display);font-size:20px}
.imp li{font-size:13px;line-height:1.5;margin-bottom:4px}
.howread{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.howread div{display:flex;gap:8px;align-items:center;font-size:13px}
.tg{display:inline-block;font:700 10px var(--f-ui);letter-spacing:.3px;padding:2px 6px;border-radius:3px;color:#fff;white-space:nowrap;text-align:center}
.tg.Q{background:var(--q)}.tg.O{background:#f2b33d;color:#3b2a05}.tg.L{background:var(--l)}.tg.M{background:var(--m)}
.tg.F{background:var(--rf);border-radius:9px}.tg.P{background:var(--rp);border-radius:9px}.tg.T{background:var(--rt);border-radius:9px}.tg.U{background:var(--ru);border-radius:9px}.tg.V{background:var(--rv);border-radius:9px}
.cmpwrap{overflow-x:auto}
table.cmp{border-collapse:collapse;width:100%;min-width:760px;font-size:12px;line-height:1.4}
table.cmp th,table.cmp td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
table.cmp thead th{color:#fff;font-family:var(--f-ui);font-size:12.5px}
table.cmp thead th:first-child{background:#fff;border:0}
table.cmp tbody th{background:var(--paper);color:var(--navy);width:130px}
table.cmp td.on{box-shadow:inset 0 0 0 2px currentColor}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.ccard{border:2px solid var(--line);border-radius:10px;background:#fff;padding:12px 14px;text-align:left;cursor:pointer;display:grid;gap:4px;font:inherit;color:inherit}
.ccard:hover{border-color:var(--navy-2)}
.ccard[aria-pressed="true"]{border-color:currentColor;box-shadow:0 0 0 3px rgba(30,41,64,.08)}
.ccard b{font-family:var(--f-display);font-size:19px;color:var(--navy)}
.ccard small{color:var(--muted);font-size:12px;line-height:1.4}
.ccard .tg{justify-self:start}
/* Hoja + anotaciones */
.annwrap{display:grid;grid-template-columns:minmax(0,900px);gap:16px;justify-content:center;align-items:start}
.annwrap.on{grid-template-columns:minmax(0,860px) minmax(300px,380px)}
@media (max-width:1250px){.annwrap.on{grid-template-columns:minmax(0,1fr)}}
.notes{display:grid;gap:8px;align-content:start}
.notes[hidden]{display:none}
.nbar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;position:sticky;top:0;z-index:2}
.nbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.note{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;scroll-margin-top:50px}
.note.hl{box-shadow:0 0 0 2px var(--gold)}
.nh{display:flex;gap:7px;align-items:flex-start;margin-bottom:4px;cursor:pointer}
.num{flex:none;width:19px;height:19px;border-radius:50%;background:var(--l);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.nt{font-weight:700;font-size:13px;color:var(--navy);line-height:1.3}
.nr{display:grid;grid-template-columns:92px 1fr;gap:6px;font-size:12.3px;line-height:1.42;padding:3px 4px;border-radius:4px}
.nr+.nr{margin-top:1px}
.nr .lab{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.nr.r{background:#F4F5F7}
.nr.r.mine{background:#FFF8E1;outline:1px solid #E9C46A}
.nr.dim{opacity:.45}
.mk{position:absolute;left:-1.2%;transform:translate(-50%,-10%);width:2.3cqi;height:2.3cqi;min-width:16px;min-height:16px;border-radius:50%;background:var(--l);color:#fff;font:700 max(10px,1.3cqi)/1 var(--f-ui);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff;cursor:pointer;z-index:2;border:0;padding:0}
.sheet .mk[hidden]{display:none}
/* Guía completa */
.guide{max-width:1300px;margin:0 auto;display:grid;gap:22px}
.gpage{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:16px;align-items:start}
@media (max-width:900px){.gpage{grid-template-columns:1fr}}
.gpage h3{grid-column:1/-1;margin:0;font-family:var(--f-display);font-size:22px;color:var(--navy)}
.gimg{position:relative;container-type:inline-size;border:1px solid var(--line)}
.gimg img{width:100%;display:block}
.gnotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px;align-content:start}
.gtop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.gtop p{margin:0;font-size:13px;color:var(--muted)}
#detail .rt{display:inline-block;margin-left:6px}

.when{margin-top:8px;font-size:13.5px;line-height:1.45;padding:10px 12px;border-radius:6px;background:var(--ok-soft);border-left:3px solid var(--ok)}
.when b{display:block;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--ok);margin-bottom:3px}
#detail{max-height:calc(100vh - 120px);overflow-y:auto}

.tg.H{background:var(--rv);border-radius:9px}
.guide[hidden],.annwrap[hidden],.cover[hidden]{display:none !important}
.annwrap.two{grid-template-columns:minmax(260px,1fr) minmax(0,800px) minmax(260px,1fr);justify-content:stretch}
.annwrap.two #sheet{position:sticky;top:0}
@media (max-width:1200px){.annwrap.two{grid-template-columns:minmax(0,1fr)} .annwrap.two #notesL{order:2} .annwrap.two #notes{order:3} .annwrap.two #sheet{position:relative}}
.notes[hidden]{display:none !important}

.cover{max-width:1100px}
.cover-bd h3{margin:0 0 10px}
</style>
</head>
