const TQ=[
{t:"Quién puede pedir a un hermano",q:"¿Quién puede presentar una I-130 a favor de su hermano o hermana?",o:["Un residente permanente de al menos 21 años","Un ciudadano estadounidense de al menos 21 años","Un ciudadano estadounidense de cualquier edad","Un residente o ciudadano mayor de 18 años"],a:1,w:"Solo el <b>ciudadano estadounidense</b> puede pedir a un hermano/a, y debe tener <b>al menos 21 años</b>. Un residente permanente no puede pedir hermanos."},
{t:"Categorías que puede pedir un LPR",q:"Un residente permanente legal (LPR) puede presentar la I-130 para:",o:["Su cónyuge, hijos y padres","Su cónyuge e hijos solteros","Su cónyuge, hijos y hermanos","Su cónyuge e hijos de cualquier estado civil"],a:1,w:"El LPR solo puede pedir a su <b>cónyuge</b> y a sus <b>hijos solteros</b> (menores de 21 o de 21 años o más). No puede pedir padres, hermanos ni hijos casados."},
{t:"Familiares que no se pueden pedir",q:"¿Por cuál de estos familiares NO se puede presentar una I-130?",o:["Hijo casado","Padre","Sobrino","Hermana"],a:2,w:"No se puede pedir a abuelos, nietos, <b>sobrinos</b>, tíos, primos ni suegros."},
{t:"Qué otorga la I-130",q:"¿Qué obtiene el beneficiario cuando se aprueba la I-130?",o:["La Green Card de forma inmediata","Un permiso de trabajo automático","No obtiene estatus por sí sola","Un estatus legal temporal"],a:2,w:"Presentar o aprobar la I-130 <b>no otorga por sí mismo</b> estatus migratorio ni Green Card. Es el <b>primer paso</b> del proceso migratorio familiar."},
{t:"Datos biográficos del peticionario",q:"Los datos biográficos que pide la I-130 (etnicidad, raza, estatura, peso, color de ojos y cabello) corresponden a:",o:["El beneficiario","El peticionario","Ambos, peticionario y beneficiario","El preparador de la forma"],a:1,w:"Los datos biográficos son del <b>peticionario</b>. Error frecuente: llenarlos con los datos del familiar."},
{t:"Una I-130 por cada familiar",q:"Una ciudadana quiere pedir a su esposo y a sus dos hijos solteros menores de 21 años. ¿Cuántas I-130 se presentan?",o:["Una sola I-130","Dos I-130","Tres I-130","Cuatro I-130"],a:2,w:"La regla es <b>una I-130 por cada familiar</b>: una para el esposo y una para cada hijo = 3."},
{t:"I-130A en petición de cónyuge",q:"Cuando se pide al cónyuge, ¿qué forma adicional va junto con la I-130?",o:["I-129F","I-130A","I-864A","I-601"],a:1,w:"La petición de cónyuge va con la <b>I-130A</b> (firmada si el cónyuge está en EE. UU.)."},
{t:"Historial de 5 años",q:"¿Cuántos años cubren los historiales de direcciones y de empleo?",o:["Últimos 3 años","Últimos 10 años","Últimos 2 años","Últimos 5 años"],a:3,w:"Los historiales de dirección y empleo cubren los <b>últimos 5 años, sin huecos</b>."},
{t:"A-Number del residente permanente",q:"¿Dónde encuentras el A-Number de un peticionario residente permanente?",o:["En su tarjeta de Seguro Social","En su pasaporte extranjero","En un recibo IOE de USCIS","En su green card (USCIS#)"],a:3,w:"El A-Number del residente permanente aparece en su <b>green card (USCIS#)</b>."},
{t:"A-Number del ciudadano naturalizado",q:"¿Dónde encuentras el A-Number de un peticionario ciudadano naturalizado?",o:["En su pasaporte estadounidense","En su certificado de naturalización","En su tarjeta de Seguro Social","En su acta de matrimonio"],a:1,w:"El A-Number del ciudadano naturalizado aparece en su <b>certificado de naturalización</b>."},

const _renderR=renderR;renderR=function(){_renderR();$('app').querySelector('.btn[onclick]')?.setAttribute('onclick','restartEval()');saveAttempt()};
function restartEval(){for(const S of [TS,PS]){S.sel={};S.cur=0;S.done=false;S.got=0}REG.saved=false;renderReg();scrollTo(0,0)}

/* ---------- datos de administrador ---------- */
function allAttempts(){const out=[];ADM.data.forEach(p=>(p.attempts||[]).forEach(a=>out.push(Object.assign({uid:p.uid,pname:p.name},a))));return out.sort((a,b)=>b.end.localeCompare(a.end))}
function openAdmin(){showChrome(false);ADM.open=true;if(!ADM.to){const t=new Date();ADM.to=dKey(t);ADM.from=dKey(new Date(t.getFullYear(),t.getMonth(),t.getDate()-29))}
 if(!ADMPIN)return renderPin();loadAdmin()}
function renderPin(msg){$('app').innerHTML=`<div class="reg"><div class="intro"><h3>Acceso de administrador</h3><p>Escribe el PIN de administrador para ver los resultados de los colaboradores.</p></div>
 <form id="pinf" novalidate><label for="apin">PIN</label><input id="apin" type="password" autocomplete="off" inputmode="numeric">${msg?`<div class="err">${esc(msg)}</div>`:""}
 <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" type="submit">Entrar</button><button class="btn" type="button" id="pinBack" style="background:#fff;color:var(--blue);border:2px solid var(--blue)">Volver a la evaluación</button></div></form></div>`;
 $('apin').focus();$('pinBack').onclick=closeAdmin;$('pinf').onsubmit=e=>{e.preventDefault();ADMPIN=$('apin').value.trim();loadAdmin()}}
/* Agrupa las filas de la hoja por colaborador (nombre sin acentos ni mayúsculas) */
function groupRows(rows){const m={};const key=n=>String(n||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
 rows.forEach(r=>{const k=key(r.name);(m[k]=m[k]||{uid:k,name:r.name,attempts:[],updated:''}).attempts.push(r);if(r.end>m[k].updated){m[k].updated=r.end;m[k].name=r.name}});return Object.values(m)}
async function loadAdmin(){$('app').innerHTML=`<div class="note">Cargando resultados…</div>`;ADM.err='';
 try{const d=await jsonp({action:'list',pin:ADMPIN});ADM.data=groupRows(d.rows||[]);renderAdmin()}
 catch(e){if(/PIN/i.test(e.message)){ADMPIN='';renderPin('PIN incorrecto.')}else{ADM.err='No se pudieron leer los resultados: '+e.message;ADM.data=[];renderAdmin()}}}
function closeAdmin(){ADM.open=false;if(!REG.name){renderReg()}else{showChrome(true);[renderT,renderP,renderR][stage]===renderR&&REG.saved?_renderR():[renderT,renderP,renderR][stage]()}scrollTo(0,0)}
function meter(v){const c=v>=PASS?'var(--green)':v>=60?'var(--gold)':'var(--red)';return `<div class="meter"><i><s style="width:${v}%;background:${c}"></s></i><em>${v}%</em></div>`}
function pill(v){return `<span class="pill ${v>=PASS?'ok':'bad'}">${v}%</span>`}
function renderAdmin(){const people=ADM.data.filter(p=>(p.attempts||[]).length);
 let h=`<div class="admtop"><h2>Vista de administrador · Resultados I-130</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="lnk" id="admReload">Actualizar</button><button class="lnk" id="admBack">← Volver a la evaluación</button></div></div>
 <div class="tabs"><button class="tab ${ADM.tab==='people'?'on':''}" data-t="people">Por colaborador</button><button class="tab ${ADM.tab==='general'?'on':''}" data-t="general">General por fecha</button></div>`;
 if(ADM.err)h+=`<div class="note bad">${esc(ADM.err)}</div>`;
 else if(!people.length)h+=`<div class="note">Todavía no hay resultados. Cuando un colaborador se registre y termine la evaluación, su resultado aparecerá aquí con el detalle de sus respuestas.</div>`;
 else h+=ADM.tab==='people'?admPeople(people):admGeneral();
 $('app').innerHTML=h;
 $('admBack').onclick=closeAdmin;$('admReload').onclick=loadAdmin;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ADM.tab=b.dataset.t;renderAdmin()});
 document.querySelectorAll('.prow').forEach(b=>b.onclick=()=>{ADM.pick=b.dataset.u;ADM.att=0;renderAdmin()});
 const s=$('attSel');if(s)s.onchange=()=>{ADM.att=+s.value;renderAdmin()};
 const q=$('pq');if(q){q.oninput=()=>{ADM.q=q.value;const pos=q.selectionStart;renderAdmin();const n=$('pq');n.focus();n.setSelectionRange(pos,pos)}}
 const f=$('dFrom'),t=$('dTo');if(f){f.onchange=()=>{ADM.from=f.value;ADM.range='';renderAdmin()};t.onchange=()=>{ADM.to=t.value;ADM.range='';renderAdmin()}}
 document.querySelectorAll('.qb').forEach(b=>b.onclick=()=>{const d=new Date(),n=+b.dataset.d;ADM.range=b.dataset.d;
  if(n<0){const all=allAttempts().map(a=>a.day).sort();ADM.from=all[0]||dKey(d);ADM.to=dKey(d)}else{ADM.to=dKey(d);ADM.from=dKey(new Date(d.getFullYear(),d.getMonth(),d.getDate()-n))}renderAdmin()});
}
function admPeople(people){people.sort((a,b)=>(b.updated||'').localeCompare(a.updated||''));
 const qq=ADM.q.trim().toLowerCase(),vis=people.filter(p=>!qq||(p.name||'').toLowerCase().includes(qq));
 if(!ADM.pick||!people.find(p=>p.uid===ADM.pick))ADM.pick=people[0].uid;
 const P=people.find(p=>p.uid===ADM.pick),atts=P.attempts.slice().sort((a,b)=>b.end.localeCompare(a.end)),A=atts[Math.min(ADM.att,atts.length-1)];
 const list=vis.map(p=>{const l=p.attempts.slice().sort((a,b)=>b.end.localeCompare(a.end))[0];
  return `<button class="prow ${p.uid===ADM.pick?'on':''}" data-u="${esc(p.uid)}"><span class="n">${esc(p.name)}</span>${pill(l.pct)}<span class="s">${fmtD(l.end)}</span><span class="s">${p.attempts.length} intento${p.attempts.length>1?'s':''}</span></button>`}).join("")||`<div class="hint">Sin coincidencias.</div>`;
 const x=EX[0],pt=pctOf(A.t.got,A.t.n),pp=pctOf(A.p.got,A.p.n),dur=Math.max(0,Math.round((new Date(A.end)-new Date(A.start))/60000));
 const trows=TQ.map((q,k)=>{const s=A.t.sel[k],ok=s===q.a;return `<tr class="${ok?'':'x'}"><td class="num">${k+1}</td><td>${esc(q.t)}</td><td>${s<0?'—':L[s]+'. '+esc(q.o[s])}</td><td>${L[q.a]}. ${esc(q.o[q.a])}</td><td>${ok?'✔':'✘'}</td></tr>`}).join("");
 const prows=x.fields.map((f,k)=>{const s=A.p.sel[k],ok=s===f.ans;return `<tr class="${ok?'':'x'}"><td>${f.id}</td><td>${esc(f.name.replace(/^P\d · /,""))}</td><td>${s<0?'—':esc(f.opts[s])}</td><td>${esc(f.opts[f.ans])}</td><td>${ok?'✔':'✘'}</td></tr>`}).join("");
 return `<div class="agrid"><div><div class="filters" style="margin-bottom:10px"><label style="flex:1">Buscar colaborador<input id="pq" value="${esc(ADM.q)}" placeholder="Nombre"></label></div><div class="plist">${list}</div></div>
 <div><div class="admtop"><h2 style="font-size:20px">${esc(P.name)}</h2>${atts.length>1?`<select class="sel" id="attSel" aria-label="Intento">${atts.map((a,i)=>`<option value="${i}" ${i===ADM.att?'selected':''}>Intento ${atts.length-i} · ${fmtD(a.end)}</option>`).join("")}</select>`:`<span class="hint">${fmtD(A.end)}</span>`}</div>
 <div class="kpis"><div class="kpi"><span>Total</span><b style="color:${A.pass?'var(--green)':'var(--red)'}">${A.pct}%</b></div><div class="kpi"><span>Teórica</span><b>${A.t.got}/${A.t.n}</b></div><div class="kpi"><span>Práctica</span><b>${A.p.got}/${A.p.n}</b></div><div class="kpi"><span>Resultado</span><b style="font-size:18px;color:${A.pass?'var(--green)':'var(--red)'}">${A.pass?'Aprobado':'No aprobado'}</b></div><div class="kpi"><span>Duración</span><b>${dur} min</b></div></div>
 <div class="h3">Parte teórica · ${pt}%</div><div class="tw"><table class="at"><thead><tr><th class="num">#</th><th>Tema</th><th>Su respuesta</th><th>Respuesta correcta</th><th></th></tr></thead><tbody>${trows}</tbody></table></div>
 <div class="h3">Parte práctica · ${pp}%</div><div class="tw"><table class="at"><thead><tr><th>Campo</th><th>Dato</th><th>Su respuesta</th><th>Respuesta correcta</th><th></th></tr></thead><tbody>${prows}</tbody></table></div></div></div>`}
function admGeneral(){const x=EX[0],inR=allAttempts().filter(a=>a.day>=ADM.from&&a.day<=ADM.to);
 const qb=(d,t)=>`<button class="qb ${ADM.range===d?'on':''}" data-d="${d}">${t}</button>`;
 let h=`<div class="filters"><label>Desde<input type="date" id="dFrom" value="${ADM.from}"></label><label>Hasta<input type="date" id="dTo" value="${ADM.to}"></label>${qb('0','Hoy')}${qb('6','7 días')}${qb('29','30 días')}${qb('-1','Todo')}</div>
 <div class="hint">Resultados del grupo del ${fmtDay(ADM.from)} al ${fmtDay(ADM.to)}. Las gráficas no muestran nombres, así que puedes proyectarlas al grupo.</div>`;
 if(!inR.length)return h+`<div class="note">No hay evaluaciones terminadas en este periodo.</div>`;
 const n=inR.length,avg=f=>Math.round(inR.reduce((s,a)=>s+f(a),0)/n),ppl=new Set(inR.map(a=>a.uid)).size,passN=inR.filter(a=>a.pass).length,passP=Math.round(passN/n*100);
 const avT=avg(a=>pctOf(a.t.got,a.t.n)),avP=avg(a=>pctOf(a.p.got,a.p.n)),avTot=avg(a=>a.pct);
 const acc=get=>Math.round(inR.filter(get).length/n*100);
 const tAcc=TQ.map((q,k)=>({lab:q.t,sub:'Pregunta '+(k+1),v:acc(a=>a.t.sel[k]===q.a)}));
 const PART={P1:'Relación',P2:'Peticionario',P4:'Beneficiario'};
 const pAcc=x.fields.map((f,k)=>({lab:(PART[f.id.split('-')[0]]||'')+' · '+f.name.replace(/^P\d · /,"").replace(/^Item [\w.]+ · /,""),sub:f.id,v:acc(a=>a.p.sel[k]===f.ans)}));
 const G='var(--green)',R='#9aa9c7',B='var(--blue)';
 /* anillo de aprobación */
 const C=2*Math.PI*52,arc=passN/n*C;
 const ring=`<svg class="ring" viewBox="0 0 130 130" role="img" aria-label="${passP}% aprobó"><circle cx="65" cy="65" r="52" fill="none" stroke="${R}" stroke-width="16"/>
  ${passN?`<circle cx="65" cy="65" r="52" fill="none" stroke="${G}" stroke-width="16" stroke-dasharray="${arc} ${C}" transform="rotate(-90 65 65)" ${passN<n?'stroke-linecap="butt"':''}/>`:''}
  <text x="65" y="63" text-anchor="middle" font-size="26" font-weight="800" fill="var(--ink)">${passP}%</text><text x="65" y="83" text-anchor="middle" font-size="12" fill="var(--muted)">aprobó</text></svg>`;
 h+=`<div class="cgrid"><div class="cc"><h4>¿Cuántos aprobaron?</h4><div class="sub">Mínimo aprobatorio: 85%</div><div class="hero">${ring}
  <div class="big2"><b>${passN} de ${n}</b>intentos aprobados<br><br><b>${avTot}%</b>promedio del grupo</div></div>
  <div class="legend"><span><i style="background:${G}"></i>Aprobados (${passN})</span><span><i style="background:${R}"></i>No aprobados (${n-passN})</span><span>${ppl} colaborador${ppl>1?'es':''}</span></div></div>`;
 /* distribución */
 const bins=[[0,49,'0–49%'],[50,69,'50–69%'],[70,84,'70–84%'],[85,100,'85–100%']].map(b=>({t:b[2],c:inR.filter(a=>a.pct>=b[0]&&a.pct<=b[1]).length,ok:b[0]>=85}));
 const mx=Math.max(...bins.map(b=>b.c),1);
 h+=`<div class="cc"><h4>¿Cómo se reparten las calificaciones?</h4><div class="sub">Número de intentos por rango de calificación total</div>
  <div class="hist">${bins.map(b=>`<div class="col" data-tip="${b.t}: ${b.c} intento${b.c===1?'':'s'}"><b>${b.c}</b><s style="height:${b.c/mx*100}%;background:${b.ok?G:R}"></s></div>`).join("")}</div>
  <div class="hlab">${bins.map(b=>`<span>${b.t}</span>`).join("")}</div></div></div>`;
 /* teórica vs práctica + tendencia */
 const two=[['Parte teórica',avT],['Parte práctica',avP],['Total',avTot]];
 h+=`<div class="cgrid"><div class="cc"><h4>Teoría contra práctica</h4><div class="sub">Promedio del grupo. La línea punteada marca el 85%.</div>
  <div class="hb">${two.map(t=>`<div class="lab">${t[0]}</div><div class="trk" data-tip="${t[0]}: ${t[1]}%"><s style="width:${t[1]}%;background:${t[1]>=PASS?G:B}"></s><u></u></div><div class="v">${t[1]}%</div>`).join("")}</div></div>`;
 const days={};inR.forEach(a=>(days[a.day]=days[a.day]||[]).push(a));const dk=Object.keys(days).sort();
 const pts=dk.map(d=>({d,v:Math.round(days[d].reduce((s,a)=>s+a.pct,0)/days[d].length),c:days[d].length}));
 const W=520,H=210,l=38,r=26,t=14,bt=34,px=i=>pts.length===1?(l+W-r)/2:l+i*(W-l-r)/(pts.length-1),py=v=>t+(100-v)*(H-t-bt)/100;
 const grid=[0,25,50,85,100].map(v=>`<line x1="${l}" x2="${W-r}" y1="${py(v)}" y2="${py(v)}" stroke="${v===85?'var(--ink)':'var(--line)'}" ${v===85?'stroke-dasharray="4 4" opacity=".45"':''}/><text x="${l-6}" y="${py(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}%</text>`).join("");
 const step=Math.ceil(pts.length/6);
 const xl=pts.map((p,i)=>i%step===0||i===pts.length-1?`<text x="${px(i)}" y="${H-12}" text-anchor="middle" font-size="11" fill="var(--muted)">${new Date(p.d+'T12:00').toLocaleDateString('es-MX',{day:'2-digit',month:'short'})}</text>`:'').join("");
 const line=pts.length>1?`<polyline fill="none" stroke="${B}" stroke-width="2.5" stroke-linejoin="round" points="${pts.map((p,i)=>px(i)+','+py(p.v)).join(' ')}"/>`:'';
 const dots=pts.map((p,i)=>`<circle cx="${px(i)}" cy="${py(p.v)}" r="5" fill="${B}" stroke="#fff" stroke-width="2"/><circle cx="${px(i)}" cy="${py(p.v)}" r="14" fill="transparent" data-tip="${fmtDay(p.d)}: promedio ${p.v}% · ${p.c} intento${p.c>1?'s':''}"/>`).join("");
 h+=`<div class="cc"><h4>Promedio por día</h4><div class="sub">Calificación total promedio de los intentos de cada día</div>
  <svg class="tline" viewBox="0 0 ${W} ${H}" role="img" aria-label="Promedio por día">${grid}${line}${dots}${xl}</svg></div></div>`;
 /* dominio por tema */
 const bars=(arr)=>`<div class="hb">${arr.map(o=>`<div class="lab">${esc(o.lab)}${o.v<PASS?'<span class="tag">Reforzar</span>':''}<small>${esc(o.sub)}</small></div><div class="trk" data-tip="${esc(o.lab)}: ${o.v}% contestó bien"><s style="width:${o.v}%;background:${o.v>=PASS?G:B}"></s><u></u></div><div class="v">${o.v}%</div>`).join("")}</div>`;
 const weak=tAcc.concat(pAcc).filter(o=>o.v<PASS).sort((a,b)=>a.v-b.v).slice(0,5);
 h+=`<div class="cc" style="margin-bottom:16px"><h4>Temas a reforzar con el grupo</h4><div class="sub">Los 5 puntos con menor porcentaje de aciertos</div>
  ${weak.length?bars(weak):'<p>El grupo supera el 85% de aciertos en todas las preguntas y campos de este periodo.</p>'}</div>`;
 h+=`<div class="cc" style="margin-bottom:16px"><h4>Dominio por tema · Parte teórica</h4><div class="sub">Porcentaje de intentos que contestaron bien cada pregunta</div>
  <div class="legend" style="margin:-6px 0 12px"><span><i style="background:${G}"></i>85% o más</span><span><i style="background:${B}"></i>Menos de 85%</span><span><i style="border-left:2px dashed var(--ink);border-radius:0;width:0;height:12px;opacity:.5"></i>Mínimo 85%</span></div>${bars(tAcc)}</div>`;
 h+=`<div class="cc" style="margin-bottom:16px"><h4>Llenado de la forma · Parte práctica</h4><div class="sub">Porcentaje de intentos que llenaron bien cada campo</div>${bars(pAcc)}</div>`;
 /* detalle con nombres, cerrado por defecto */
 h+=`<details class="more"><summary>Ver detalle por día e intentos con nombre (no proyectar)</summary>
 <div class="h3">Por día</div><div class="tw"><table class="at"><thead><tr><th>Fecha</th><th class="num">Intentos</th><th class="num">Colaboradores</th><th>Promedio total</th><th class="num">Aprobados</th></tr></thead><tbody>${dk.slice().reverse().map(d=>{const L2=days[d],av=Math.round(L2.reduce((s,a)=>s+a.pct,0)/L2.length);return `<tr><td>${fmtDay(d)}</td><td class="num">${L2.length}</td><td class="num">${new Set(L2.map(a=>a.uid)).size}</td><td>${meter(av)}</td><td class="num">${L2.filter(a=>a.pass).length}</td></tr>`}).join("")}</tbody></table></div>
 <div class="h3">Intentos del periodo</div><div class="tw"><table class="at"><thead><tr><th>Colaborador</th><th>Fecha y hora</th><th class="num">Teórica</th><th class="num">Práctica</th><th class="num">Total</th></tr></thead><tbody>${inR.map(a=>`<tr><td>${esc(a.name||a.pname)}</td><td>${fmtD(a.end)}</td><td class="num">${a.t.got}/${a.t.n}</td><td class="num">${a.p.got}/${a.p.n}</td><td class="num">${pill(a.pct)}</td></tr>`).join("")}</tbody></table></div></details>`;
 return h}
/* tooltip para gráficas */
(function(){const tip=document.createElement('div');tip.className='tip';tip.hidden=true;document.body.appendChild(tip);
 const show=(el,x,y)=>{tip.textContent=el.getAttribute('data-tip');tip.hidden=false;const r=tip.getBoundingClientRect();tip.style.left=Math.min(innerWidth-r.width-8,x+12)+'px';tip.style.top=Math.max(8,y-r.height-12)+'px'};
 document.addEventListener('mousemove',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el)show(el,e.clientX,e.clientY);else tip.hidden=true});
 document.addEventListener('touchstart',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el){const t=e.touches[0];show(el,t.clientX,t.clientY)}else tip.hidden=true},{passive:true});
})();

/* ---------- arranque ---------- */
renderReg();
headerWho();
</script></body></html>
