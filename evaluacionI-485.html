<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TMLF · I-485 · Ajuste de estatus (petición familiar) · Evaluación</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1f2a3a;--sheet:#fff;--ink:#1a2233;--muted:#5b6475;--line:#d7dce5;
--blue:#1d4ed8;--blue-s:#e6eeff;--green:#15803d;--green-s:#e3f5e9;--red:#b91c1c;--red-s:#fde8e8;--gray-s:#f1f3f7;--gold:#f59e0b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--ink);font-size:17px;line-height:1.55;padding:28px 16px}
.sheet{max-width:980px;margin:0 auto;background:var(--sheet);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
header{background:linear-gradient(120deg,#0f2a5c,#1d4ed8);color:#fff;padding:26px 32px}
header .kicker{font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.8;font-weight:600}
header h1{margin:6px 0 4px;font-size:28px;font-weight:800}
header p{margin:0;opacity:.9}
.bar{display:flex;gap:12px;align-items:center;padding:14px 32px;background:var(--gray-s);border-bottom:1px solid var(--line);font-size:14px;color:var(--muted);flex-wrap:wrap}
.progress{flex:1;min-width:140px;height:8px;background:#dfe3ea;border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--green);width:0;transition:width .4s}
main{padding:28px 32px 36px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tag{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;border-radius:99px}
.t-type{background:var(--blue-s);color:var(--blue)}.t-form{background:var(--gray-s);color:var(--muted)}
.case{border-left:5px solid var(--blue);background:var(--blue-s);padding:16px 20px;border-radius:0 10px 10px 0;margin-bottom:20px}
.case b.lbl{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--blue);margin-bottom:4px}
.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:26px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}main{padding:22px 16px}header,.bar{padding-left:16px;padding-right:16px}}
.formwrap{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fafbfc}
.form{position:relative;container-type:inline-size;width:100%}
.form img{display:block;width:100%;height:auto}
.fill{position:absolute;display:flex;align-items:center;padding-left:1.2cqw;font-family:'Courier Prime',monospace;font-weight:700;font-size:3.1cqw;color:#0b1f6b;white-space:nowrap}
.fill.cells{padding:0}.fill.cells span{flex:1;text-align:center}
.dt{width:100%;border-collapse:collapse;margin-top:12px;background:#fff;border-radius:8px;overflow:hidden;font-size:15px}.dt th,.dt td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left}.dt th{background:#dbe5fb;font-size:14px}.dt td:first-child{font-weight:600;color:var(--muted);width:30%}
.ptitle{font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);margin:14px 0 6px}.ptitle:first-child{margin-top:0}
.sech{font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--blue);padding:6px 12px;border-radius:8px;margin:18px 0 10px}.sech:first-child{margin-top:0}
.sticky{max-height:calc(100vh - 24px);overflow:auto}
.xmark{position:absolute;display:flex;align-items:center;justify-content:center;font-family:"Courier Prime",monospace;font-weight:700;font-size:3.6cqw;color:#0b1f6b;pointer-events:none}.xmark.ok{color:var(--green)}.xmark.bad{color:var(--red)}
.slot.chk .chkph{position:absolute;right:1cqw;top:50%;transform:translateY(-50%);font-size:3cqw}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.dot{border:1px solid var(--line);background:#fff;border-radius:6px;font:inherit;font-size:12px;font-weight:700;padding:4px 8px;cursor:pointer;color:var(--muted)}.dot.ans{background:var(--blue-s);color:var(--blue);border-color:#b9cbf5}.dot.cur{background:var(--gold);color:#1a1a1a;border-color:var(--gold)}
.stepc{font-size:13px;color:var(--muted);margin-bottom:12px}
.navs{display:flex;justify-content:space-between;margin-top:14px;gap:10px}.nav{border:2px solid var(--blue);background:#fff;color:var(--blue);font:inherit;font-weight:700;padding:9px 16px;border-radius:10px;cursor:pointer}.nav.nx{background:var(--blue);color:#fff}.nav:disabled{border-color:#cfd5df;background:#f1f3f7;color:#9aa3b2;cursor:not-allowed}
.slot{position:absolute;cursor:pointer;border:2px solid transparent;border-radius:3px}
.slot .fill{position:absolute;inset:0}
.slot:hover{border-color:rgba(29,78,216,.5)}
.slot.act{border:3px solid var(--gold);background:rgba(245,158,11,.18);animation:pulse 1.6s infinite}
.slot.ok{border:3px solid var(--green);background:rgba(21,128,61,.12)}
.slot.bad{border:3px solid var(--red);background:rgba(185,28,28,.12)}
.slot .tagf{position:absolute;right:-3px;top:-3.4cqw;white-space:nowrap;background:var(--gold);color:#1a1a1a;font-size:2cqw;font-weight:800;padding:.2cqw 1cqw;border-radius:4px 4px 0 0;display:none}
.slot.act .tagf{display:block}
.ph{font-style:normal;color:#9aa6c0}.slot.act .ph{color:#b45309}
.inst{margin:0 0 16px;color:var(--muted)}
.sticky{position:sticky;top:12px}
@media(max-width:820px){.sticky{position:static}}
.fq{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;cursor:pointer;transition:.15s}
.fq.on{border:2px solid var(--gold);box-shadow:0 0 0 4px rgba(245,158,11,.15)}
.fqh{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:10px}
.fqh .num{background:var(--blue);color:#fff;border-radius:6px;padding:2px 8px;font-size:13px}
.fqh .chk{margin-left:auto;color:var(--green)}
.fq .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fq .opt{padding:9px 11px}.fq .opt .l{width:24px;height:24px;font-size:12px}.fq .mono{font-size:15px}
.fq .fb{margin-top:10px;font-size:15px}
.grid{grid-template-columns:1.1fr 1fr}
.hl{position:absolute;border:3px solid var(--gold);border-radius:4px;background:rgba(245,158,11,.18);animation:pulse 1.6s infinite}
.hl span{position:absolute;right:-3px;top:-3.6cqw;background:var(--gold);color:#1a1a1a;font-size:2.2cqw;font-weight:800;padding:.3cqw 1.2cqw;border-radius:4px 4px 0 0;font-family:Inter}
.hl .q{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:4cqw;font-weight:800;color:#b45309}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(245,158,11,.25)}}
.cap{font-size:13px;color:var(--muted);margin-top:8px;text-align:center}
h2{font-size:21px;margin:0 0 14px;line-height:1.35}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:#fff;border-radius:10px;padding:13px 15px;font:inherit;cursor:pointer;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--blue);background:var(--blue-s)}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;background:var(--gray-s);display:grid;place-items:center;font-weight:800;font-size:14px}
.opt.sel{border-color:var(--blue);background:var(--blue-s)}.opt.sel .l{background:var(--blue);color:#fff}
.opt.ok{border-color:var(--green);background:var(--green-s)}.opt.ok .l{background:var(--green);color:#fff}
.opt.bad{border-color:var(--red);background:var(--red-s)}.opt.bad .l{background:var(--red);color:#fff}
.opt:disabled{cursor:default;color:var(--ink)}
.mono{font-family:'Courier Prime',monospace;font-weight:700;font-size:18px}
.btn{margin-top:16px;border:0;background:var(--blue);color:#fff;font:inherit;font-weight:700;padding:12px 22px;border-radius:10px;cursor:pointer}
.btn:disabled{background:#aab3c2;cursor:not-allowed}
.fb{margin-top:16px;border-radius:10px;padding:14px 18px;display:none}
.fb.ok{display:block;background:var(--green-s);border-left:5px solid var(--green)}
.fb.bad{display:block;background:var(--red-s);border-left:5px solid var(--red)}
.fb b.h{display:block;margin-bottom:4px}
.result{text-align:center;padding:30px 10px;display:none}
.result .big{font-size:54px;font-weight:800}

.stepper{display:flex;gap:0;border-bottom:1px solid var(--line);background:#fff}
.stepper div{flex:1;padding:14px 10px;text-align:center;font-weight:700;font-size:14px;color:#9aa3b2;border-bottom:4px solid transparent}
.stepper div.cur{color:var(--blue);border-bottom-color:var(--blue)}.stepper div.fin{color:var(--green);border-bottom-color:var(--green)}
.stepper div span{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#e5e8ee;margin-right:6px;font-size:12px}
.stepper div.cur span{background:var(--blue);color:#fff}.stepper div.fin span{background:var(--green);color:#fff}
.intro{background:var(--gray-s);border-radius:12px;padding:18px 20px;margin-bottom:20px}
.intro h3{margin:0 0 6px;font-size:19px}.intro p{margin:0;color:var(--muted)}
.single{max-width:760px;margin:0 auto}
.qcard{border:2px solid var(--gold);border-radius:12px;padding:18px;margin-top:16px;box-shadow:0 0 0 4px rgba(245,158,11,.12)}
.qcard.rev{border:1px solid var(--line);box-shadow:none}
.qcard h2{font-size:19px}
.qcard .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .qcard .opts{grid-template-columns:1fr}
@media(max-width:620px){.qcard .opts,.fq .opts{grid-template-columns:1fr}}
.qnum{font-size:13px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.revblock{margin-top:26px}
.center{text-align:center}
.rcard{border:1px solid var(--line);border-left:6px solid var(--line);border-radius:12px;padding:16px 20px;margin-top:14px}.rcard.rok{border-left-color:var(--green)}.rcard.rbad{border-left-color:var(--red)}
.rhead{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:19px}.rok .rhead b{color:var(--green)}.rbad .rhead b{color:var(--red)}.rhead b{font-size:26px}
.rsub{color:var(--muted);font-size:14px;margin-top:2px}.rfb{margin-top:10px}.rfb p{margin:0 0 4px;font-weight:600}.rfb ul{margin:0;padding-left:20px}
.scorebox{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}
@media(max-width:620px){.scorebox{grid-template-columns:1fr}}
.scorebox div{background:var(--gray-s);border-radius:12px;padding:16px;text-align:center}
.scorebox b{display:block;font-size:30px}
.scorebox span{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}

.fqh .num{background:var(--blue);color:#fff;border-radius:6px;padding:2px 8px;font-size:13px}
/* ---------- REGISTRO Y ADMINISTRADOR ---------- */
[hidden]{display:none!important}
header .hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
header .who{margin-top:8px;font-size:14px;opacity:.95}
header .who b{font-weight:700}
.admbtn{border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);color:#fff;font:inherit;font-size:13px;font-weight:700;padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.admbtn:hover{background:rgba(255,255,255,.22)}
.admbtn:focus-visible,.atab:focus-visible,.arow:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.reg{max-width:560px;margin:0 auto}
.reg label{display:block;font-weight:700;font-size:14px;margin:4px 0 6px}
.reg input{width:100%;font:inherit;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.reg input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-s)}
.reg .err{color:var(--red);font-size:14px;margin-top:8px;min-height:1.2em}
.reg .hint{color:var(--muted);font-size:14px;margin-top:6px}
.savest{margin:14px auto 0;max-width:760px;font-size:14px;color:var(--muted);text-align:center}
.savest.ok{color:var(--green)}.savest.bad{color:var(--red)}
.atabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.atab{border:0;background:none;font:inherit;font-weight:700;font-size:15px;color:var(--muted);padding:10px 14px;border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer}
.atab.on{color:var(--blue);border-bottom-color:var(--blue)}
.ahead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ahead h2{margin:0}
.nav.sm{padding:7px 12px;font-size:14px}
.afil{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;background:var(--gray-s);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.afil label{display:flex;flex-direction:column;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);gap:4px}
.afil input,.afil select{font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);text-transform:none;letter-spacing:0}
.afil .grow{flex:1;min-width:180px}
.afil .grow input{width:100%}
.twrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.at{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.at th{background:#dbe5fb;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:9px 12px;white-space:nowrap}
.at td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
.at td.n,.at th.n{text-align:right}
.arow{cursor:pointer}.arow:hover td{background:var(--blue-s)}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--green-s);color:var(--green)}.pill.bad{background:var(--red-s);color:var(--red)}
.mk{font-weight:800}.mk.ok{color:var(--green)}.mk.bad{color:var(--red)}
.at .cor{color:var(--green);font-weight:600}.at .wr{color:var(--red);font-weight:600}
.at .qt{color:var(--muted);font-size:13px;display:block}
.empty{text-align:center;color:var(--muted);padding:36px 16px;background:var(--gray-s);border-radius:12px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
@media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpis div{background:var(--gray-s);border-radius:12px;padding:14px;text-align:center}
.kpis b{display:block;font-size:28px;font-variant-numeric:tabular-nums}
.kpis span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.asec{font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);margin:22px 0 10px}
.hb{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,3fr) 52px;gap:10px;align-items:center;font-size:14px;padding:6px 0;border-bottom:1px solid var(--gray-s)}
.hb .lb{min-width:0}
.hb .tr{height:12px;background:var(--gray-s);border-radius:99px;overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:99px}
.hb .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
@media(max-width:620px){.hb{grid-template-columns:1fr 52px}.hb .tr{grid-column:1/-1;grid-row:2}}
.days{display:flex;align-items:flex-end;gap:6px;height:170px;padding:8px 4px 4px;border-bottom:1px solid var(--line);overflow-x:auto}
.days .d{flex:1 0 34px;max-width:64px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.days .d i{display:block;width:70%;min-height:2px;border-radius:4px 4px 0 0}
.days .d b{font-size:12px;font-variant-numeric:tabular-nums}
.days .d .dlb{font-size:11px;color:var(--muted);white-space:nowrap}
.legend{font-size:13px;color:var(--muted);margin-top:6px}
.atsel{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}

/* ---------- VISTA GENERAL CON GRÁFICAS ---------- */
.gh{margin:4px 0 14px}.gh h2{margin:2px 0 0;font-size:24px;text-wrap:balance}
.gcard{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px;background:#fff;min-width:0}
.gcard .asec{margin-top:0}
.g1{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:16px;margin-bottom:16px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.g2 .gcard{margin-bottom:16px}
@media(max-width:760px){.g1,.g2{grid-template-columns:1fr}}
.dcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;margin:0}
.donut{width:170px;max-width:100%;height:auto}
.dn-v{font-size:28px;font-weight:800;fill:var(--ink);font-family:Inter,system-ui,sans-serif}
.dn-l{font-size:12px;font-weight:700;fill:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-family:Inter,system-ui,sans-serif}
.dleg{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.dleg span,.slegend span{display:inline-flex;align-items:center;gap:8px}
.dleg i,.slegend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.dleg b{color:var(--ink)}
.g1k{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.kpi{background:var(--gray-s);border-radius:14px;padding:16px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.kpi>b{font-size:40px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi>span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.kpi.wide{grid-column:1/-1;text-align:left}
.gm{margin-bottom:14px}
.gm-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:700}
.gm-h b{font-size:26px;font-variant-numeric:tabular-nums}
.gm-t{position:relative;height:16px;background:var(--gray-s);border-radius:99px;margin:6px 0}
.kpi .gm-t{background:#fff}
.gm-t i{display:block;height:100%;border-radius:99px}
.gm-t em,.db-t em{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px dashed var(--ink);opacity:.55}
.gm-s{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.gm-n{font-size:13px;color:var(--muted)}
.chip{font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.chip.ok{background:var(--green-s);color:var(--green)}.chip.mid{background:#fef3c7;color:#92400e}.chip.low{background:var(--red-s);color:var(--red)}
.hist{display:flex;align-items:flex-end;gap:10px;height:210px;border-bottom:1px solid var(--line);padding-top:8px}
.hc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:2px;min-width:0}
.hc b{font-size:20px;font-variant-numeric:tabular-nums}
.hpc{font-size:12px;color:var(--muted)}
.hc i{display:block;width:72%;border-radius:6px 6px 0 0;margin-top:4px}
.hl2{font-size:12px;color:var(--muted);text-align:center;margin-top:6px;min-height:2.4em}
.slegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-bottom:10px}
.slegend em{width:0;height:14px;border-left:2px dashed var(--ink);opacity:.55;display:inline-block}
.dom{display:flex;flex-direction:column}
.db{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(0,3fr) 170px;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--gray-s);font-size:14px}
.db-t{position:relative;height:14px;background:var(--gray-s);border-radius:99px}
.db-t i{display:block;height:100%;border-radius:99px}
.db-v{display:flex;align-items:center;gap:8px;justify-content:flex-end;min-width:150px}
.db-v b{font-variant-numeric:tabular-nums;font-size:16px;min-width:44px;text-align:right}
@media(max-width:620px){.db{grid-template-columns:1fr auto}.db-t{grid-column:1/-1;grid-row:2}.db-v{min-width:0}}
.pri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

<script type="application/json" id="cfg">{"v": 1, "meta": {"kicker": "TMLF Learning Center · Curso de Formas NON VAWA · Evaluación", "title": "I-485 · Ajuste de estatus (petición familiar)", "subtitle": "", "form": "I-485", "fileName": "TMLF_Evaluacion_I-485.html", "theoryIntro": "", "practiceIntro": "", "pass": 85}, "tq": [{"t": "Función de la I-485", "q": "¿Cuál es la función principal del Formulario I-485?", "o": ["Solicitar una petición familiar", "Solicitar ajuste de estatus a residente permanente", "Solicitar permiso de trabajo únicamente", "Solicitar una visa de inmigrante"], "a": 1, "w": "La I-485 sirve para pedir la \u003cb>residencia permanente desde dentro de EE. UU.\u003c/b> (ajuste de estatus). La petición familiar es la I-130, el permiso de trabajo la I-765, y la visa de inmigrante se tramita en un consulado fuera de EE. UU."}, {"t": "Formulario que establece la relación familiar", "q": "En un caso de ajuste basado en petición familiar, ¿qué formulario generalmente inicia la relación familiar?", "o": ["I-765", "I-130", "I-864", "I-693"], "a": 1, "w": "La \u003cb>I-130 (Petition for Alien Relative)\u003c/b> es la petición que establece la relación familiar entre el peticionario y el beneficiario; es la petición subyacente de la I-485. La I-765 es permiso de trabajo, la I-864 el affidavit of support y la I-693 el examen médico."}, {"t": "Documento de apoyo económico", "q": "¿Qué documento demuestra principalmente el apoyo económico del patrocinador?", "o": ["I-130", "I-485", "I-864", "I-765"], "a": 2, "w": "La \u003cb>I-864 (Affidavit of Support)\u003c/b> demuestra que el patrocinador tiene medios suficientes para mantener al inmigrante. Es obligatoria en la mayoría de los casos familiares; sin ella, cuando se requiere, la I-485 no puede aprobarse."}, {"t": "Antecedentes penales del beneficiario", "q": "Si el beneficiario tiene antecedentes penales, ¿qué debe hacer el colaborador?", "o": ["Ignorarlos si la I-130 está aprobada", "Revisarlos para determinar si pueden existir consecuencias de inadmisibilidad", "Eliminar la información si no es antes de 5 años", "Nada"], "a": 1, "w": "Los antecedentes penales pueden causar \u003cb>inadmisibilidad\u003c/b> (INA 212(a)) aunque la I-130 esté aprobada. Se deben declarar todos —aunque sean antiguos, sellados o borrados—, reunir los registros certificados y escalar al attorney. Nunca se omite ni se elimina información."}, {"t": "Excepciones a carga pública", "q": "María está preparando su I-485 basada en una petición familiar presentada por su esposo, quien es ciudadano estadounidense. María comenta que escuchó que, como su esposo es militar y en alguna ocasión la agredió físicamente, no tiene que responder las preguntas relacionadas con carga pública. ¿Qué debería hacer el colaborador?", "o": ["No contestar la sección de carga pública porque su esposo es militar.", "No contestarla porque existe violencia doméstica.", "La violencia doméstica por sí sola no determina que pueda omitirse.", "Marcar automáticamente que no está sujeta a carga pública porque está casada con un militar."], "a": 2, "w": "La exención de carga pública depende de la \u003cb>categoría bajo la que se presenta\u003c/b> la I-485, no de la situación personal. María presenta como cónyuge de ciudadano (I-130): esa vía \u003cb>no está exenta\u003c/b>, así que contesta la sección (Items 57–64). Estar casada con un militar activo no exime (la casilla NDAA es solo para familiares de militar \u003cb>fallecido\u003c/b>), y la violencia doméstica solo daría exención si el caso se presentara bajo una vía exenta como VAWA. Escalar al attorney."}, {"t": "Derivados en la categoría de familiar inmediato", "q": "La esposa de un ciudadano tiene un hijo de 15 años de una relación anterior. ¿Puede el hijo ajustar como \u003cb>derivado\u003c/b> en la I-485 de su mamá (familiar inmediato)?", "o": ["Sí, todos los hijos menores de 21 son derivados", "Sí, si vive con ella en EE. UU.", "Sí, si se incluye en la misma I-485 de la mamá", "No: en la categoría de familiar inmediato no hay derivados; el hijo necesita su propia petición"], "a": 3, "w": "Las instrucciones dicen: \u003cb>“Derivative applicants are not allowed in this category.”\u003c/b> En familiar inmediato cada beneficiario necesita su propia I-130. Además, todo solicitante —principal o derivado— presenta \u003cb>su propia\u003c/b> I-485."}, {"t": "Sin prueba de admisión o parole", "q": "Un cliente dice que entró con visa, pero no tiene I-94 ni sello y DHS no tiene registro de su entrada. ¿Qué presume USCIS?", "o": ["Que entró sin admisión ni parole, salvo que se pruebe lo contrario con evidencia secundaria o declaraciones juradas", "Que fue admitido, porque así lo declara en la I-485", "Que entró con parole humanitario", "Nada: no hace falta probar cómo entró"], "a": 0, "w": "Si no hay evidencia primaria y DHS no tiene registro, USCIS \u003cb>presume que entró sin admisión ni parole\u003c/b>. Se puede presentar evidencia secundaria (registros de terceros) o, si no hay, declaraciones bajo protesta que expliquen cuándo, dónde y con qué documentos entró. Si el I-94 no aparece en cbp.gov/i94, se puede pedir con la I-102."}, {"t": "Examen médico I-693", "q": "El cliente insiste en enviar el I-485 sin realizar el examen médico. ¿Qué información debe asegurarse de proporcionarle el colaborador antes de que el cliente tome esa decisión?", "o": ["Únicamente que “USCIS podría pedirlo después”.", "Que el examen médico (I-693) es un requisito indispensable de la I-485 y que el attorney le explicará las consecuencias de no presentarlo.", "Que USCIS rechazará definitivamente el caso.", "Que el examen médico es opcional en los casos familiares."], "a": 1, "w": "El colaborador \u003cb>no asesora\u003c/b> sobre consecuencias legales: eso le corresponde al \u003cb>attorney\u003c/b>. Lo que sí debe dejar claro es que la I-693 es un \u003cb>requisito indispensable\u003c/b> de la I-485 (las instrucciones piden que vaya junto con la forma) y canalizar al cliente con el attorney. No debe decir que es opcional, ni minimizarlo (“podrían pedirlo después”), ni asegurar un resultado como un rechazo definitivo."}], "ex": {"case": "\u003cb>Ana Lucía Ramírez Torres\u003c/b> entró con visa de turista \u003cb>B-2\u003c/b> por El Paso en 2019 y se quedó después de que venció su I-94. En 2022 se casó con \u003cb>Miguel Ángel García López\u003c/b>, ciudadano estadounidense. TMLF presenta \u003cb>la I-130 y la I-485 juntas\u003c/b> (familiar inmediato), con la I-864.\n\u003ctable class=\"dt\">\u003ctr>\u003cth>\u003c/th>\u003cth>Solicitante · Ana Lucía\u003c/th>\u003cth>Esposo peticionario · Miguel Ángel\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Nombre\u003c/td>\u003ctd>RAMÍREZ TORRES, Ana Lucía\u003c/td>\u003ctd>GARCÍA LÓPEZ, Miguel Ángel\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Fecha de nacimiento\u003c/td>\u003ctd>03/14/1992 · Ciudad Juárez, Chihuahua, México\u003c/td>\u003ctd>11/30/1990 · nacido en EE. UU. (ciudadano)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>A-Number\u003c/td>\u003ctd>No tiene\u003c/td>\u003ctd>No tiene\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Domicilio\u003c/td>\u003ctd colspan=\"2\">1520 N Mesa St Apt 4, El Paso, TX 79902 (viven juntos)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Matrimonio\u003c/td>\u003ctd colspan=\"2\">02/14/2022 · El Paso, Texas · primer matrimonio de ambos\u003c/td>\u003c/tr>\n\u003c/table>\n\u003ctable class=\"dt\">\u003ctr>\u003cth colspan=\"2\">Historial migratorio de Ana Lucía\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Única entrada\u003c/td>\u003ctd>06/10/2019 · El Paso, TX · inspeccionada y admitida con visa B-2\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Pasaporte usado\u003c/td>\u003ctd>G12345678 · México · vence 05/20/2027\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Visa\u003c/td>\u003ctd>No. 87654321 · B-2 · expedida 04/02/2018\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>I-94\u003c/td>\u003ctd>48213765901 · clase B-2 · vence 12/09/2019\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Estatus actual\u003c/td>\u003ctd  "id": "10-D", "name": "Item 10 · Date of Last Arrival", "q": "", "kind": "text", "x": 58.63, "y": 51.98, "w": 25.54, "h": 4.99, "fs": 2.2, "opts": ["12/09/2019", "04/02/2018", "02/14/2022", "06/10/2019"], "ans": 3, "why": "Su última (y única) llegada fue el \u003cb>06/10/2019\u003c/b>. \u003cb>12/09/2019\u003c/b> es el vencimiento de su I-94, \u003cb>04/02/2018\u003c/b> la fecha en que le expidieron la visa y \u003cb>02/14/2022\u003c/b> la fecha del matrimonio."}, {"p": 0, "id": "11", "name": "Item 11 · When I last arrived in the United States", "q": "", "kind": "check", "x": 5.53, "y": 62.99, "w": 2.83, "h": 28.69, "cw": 1.95, "ch": 3.01, "pos": [{"x": 5.86, "y": 73.49}, {"x": 5.86, "y": 63.62}, {"x": 5.86, "y": 83.16}, {"x": 5.86, "y": 88.15}], "opts": ["I was inspected at a Port of Entry and paroled as…", "I was inspected at a Port of Entry and admitted as…", "I came into the United States without admission or parole", "Other"], "ans": 1, "why": "Ana Lucía pasó por el puerto de entrada, la inspeccionaron y la \u003cb>admitieron con visa B-2\u003c/b> → “inspected… and admitted as”. Que después se haya quedado sin estatus (overstay) no cambia \u003cb>cómo llegó\u003c/b>. Esta admisión es lo que le permite ajustar como familiar inmediato (INA 245(a))."}, {"p": 0, "id": "11-B", "name": "Item 11 · Admitted as…", "q": "", "kind": "text", "x": 9.03, "y": 66.63, "w": 87.74, "h": 4.99, "fs": 2.2, "opts": ["NO LAWFUL STATUS", "B-2 VISITOR", "SPOUSE OF U.S. CITIZEN", "HUMANITARIAN PAROLE"], "ans": 1, "why": "Se escribe la \u003cb>clase de admisión\u003c/b> que aparece en el I-94: \u003cb>B-2 VISITOR\u003c/b>. “NO LAWFUL STATUS” describe su estatus \u003cb>actual\u003c/b> (va en el Item 14), “Spouse of U.S. Citizen” es su categoría (Parte 2) y no entró con parole."}, {"p": 1, "id": "P2-1", "name": "Part 2 · Item 1 · ¿Presenta ante EOIR (en proceso de remoción)?", "q": "", "kind": "check", "x": 85.53, "y": 11.9, "w": 10.77, "h": 5.19, "cw": 1.91, "ch": 3.46, "pos": [{"x": 86.06, "y": 12.66}, {"x": 93.72, "y": 12.66}], "opts": ["Yes", "No"], "ans": 1, "why": "Yes solo si la I-485 se presenta \u003cb>ante el juez de inmigración\u003c/b> porque el cliente está en proceso de remoción. Ana Lucía nunca ha estado en corte (EOIR sin registros) → \u003cb>No\u003c/b>. Tener overstay no significa estar en proceso; siempre se confirma en el EOIR Case Status."}, {"p": 1, "id": "P2-2a", "name": "Part 2 · Item 2 · Receipt Number of Underlying Petition", "q": "", "kind": "text", "x": 5.98, "y": 26.3, "w": 42.88, "h": 6.06, "fs": 2.2, "opts": ["48213765901", "No aplica", "87654321", "G12345678"], "ans": 1, "why": "La petición subyacente es la \u003cb>I-130\u003c/b> de Miguel Ángel, que se presenta \u003cb>junto con\u003c/b> esta I-485 (concurrent filing): todavía no tiene recibo → \u003cb>en blanco\u003c/b>. Los otros números son el I-94, la visa y el pasaporte."}, {"p": 1, "id": "P2-2b", "name": "Part 2 · Item 2 · Priority Date from Underlying Petition", "q": "", "kind": "text", "x": 61.9, "y": 26.3, "w": 24.28, "h": 6.06, "fs": 2.2, "opts": ["02/14/2022", "No aplica", "06/10/2019", "12/10/2019"], "ans": 1, "why": "Como cónyuge de ciudadano es \u003cb>familiar inmediato\u003c/b>: no depende de priority date (eso es de las categorías de preferencia) y la I-130 aún no tiene recibo → \u003cb>en blanco\u003c/b>. Las otras fechas son el matrimonio, la entrada y el inicio del overstay."}, {"p": 1, "id": "P2-2c", "name": "Part 2 · Item 2 · I am filing this Form I-485 as a…", "q": "", "kind": "check", "x": 5.74, "y": 39.72, "w": 2.75, "h": 10.93, "cw": 1.91, "ch": 3.46, "pos": [{"x": 6.16, "y": 40.48}, {"x": 6.16, "y": 46.43}], "opts": ["Principal Applicant", "Derivative Applicant"], "ans": 0, "why": "Ana Lucía califica \u003cb>directamente\u003c/b> como beneficiaria de la I-130 de su esposo → \u003cb>Principal\u003c/b>. En la categoría de familiar inmediato no existen derivados."}, {"p": 1, "id": "P2-2d", "name": "Part 2 · Item 2 · Principal Applicant's Family Name", "q": "", "kind": "text", "x": 5.98, "y": 62.01, "w": 31.94, "h": 6.06, "fs": 2.2, "opts": ["GARCIA LOPEZ", "No aplica", "RAMIREZ TORRES", "RAMIREZ SOTO"], "ans": 1, "why": "Los datos del principal \u003cb>solo se llenan si el solicitante es derivado\u003c/b>. Ana Lucía es principal → \u003cb>en blanco\u003c/b>. Miguel Ángel es el \u003cb>peticionario\u003c/b>, no el “principal applicant”; y el nombre de Ana Lucía ya va en la Parte 1."}, {"p": 2, "id": "3.a", "name": "Part 2 · Item 3.a · Family-based (categoría)", "q": "", "kind": "check", "x": 7.18, "y": 12.66, "w": 2.75, "h": 86.58, "cw": 1.91, "ch": 3.46, "pos": [{"x": 7.6, "y": 84.09}, {"x": 7.6, "y": 30.63}, {"x": 7.6, "y": 13.42}, {"x": 7.6, "y": 57.36}], "opts": ["Spouse of a lawful permanent resident", "Person admitted as a fiancé(e) or child of a fiancé(e) (K-1/K-2)", "Spouse of a U.S. Citizen", "Unmarried son or daughter of a U.S. citizen and I am 21 years of age or older"], "ans": 2, "why": "Miguel Ángel es \u003cb>ciudadano\u003c/b> y Ana Lucía es su esposa → \u003cb>Spouse of a U.S. Citizen\u003c/b> (familiar inmediato). No es “Spouse of a lawful permanent resident” porque él es ciudadano, no residente; no entró con visa K-1 de prometida; y la de “unmarried son or daughter” es para hijos, no para cónyuges. Se marca \u003cb>solo una\u003c/b> categoría."}]}}</script>

function bar(txt,pct,score){$('count').textContent=txt;$('prog').style.width=pct+"%";$('score').textContent=score||""}
function dots(n,cur,sel,labels,word){return `<div class="steps">${Array.from({length:n},(_,k)=>`<button class="dot ${k===cur?'cur':''} ${sel[k]!=null?'ans':''}" data-k="${k}">${labels?labels[k]:k+1}</button>`).join("")}</div><div class="stepc">${word} ${cur+1} de ${n}</div>`}
function optsHTML(opts,k,sel,done,ans,mono){return `<div class="opts">${opts.map((o,j)=>{let c="";if(done){if(j===ans)c="ok";else if(j===sel)c="bad"}else if(sel===j)c="sel";
 return `<button class="opt ${c}" data-k="${k}" data-j="${j}" ${done?'disabled':''}><span class="l">${L[j]}</span><span class="${mono?'mono':''}">${o}</span></button>`}).join("")}</div>`}
function navHTML(k,n,answered){return `<div class="navs"><button class="nav" data-d="-1" ${k===0?'disabled':''}>← Anterior</button><button class="nav nx" data-d="1" ${!answered||k===n-1?'disabled':''}>Siguiente →</button></div>`}
function fbHTML(ok,why){return `<div class="fb ${ok?'ok':'bad'}"><b class="h">${ok?'✔ Correcto':'✘ Incorrecto'}</b>${why||''}</div>`}
function go(s){stage=ST.indexOf(s);stepper();({t:renderT,p:renderP,r:renderR})[s]();scrollTo(0,0)}
function nextOf(s){go(ST[ST.indexOf(s)+1])}
function retry(){reset();go(ST[0])}
/* ---------- PARTE TEÓRICA ---------- */
function renderT(){const S=TS,n=TQ.length,a=Object.keys(S.sel).length;
 bar(`Parte teórica · Contestadas: ${a} de ${n}`,a/n*100,S.done?`Aciertos: ${S.got} de ${n}`:"");
 let h=`<div class="intro"><h3>${ST.length>2?'Parte 1 · ':''}Preguntas teóricas</h3><p>${M.theoryIntro||`${n} preguntas de opción múltiple sobre la Forma ${FORM}. Contesta todas; puedes regresar con <b>Anterior</b> para cambiar tus respuestas antes de verificar.`}</p></div><div class="single">`;
 if(!S.done){const q=TQ[S.cur];h+=dots(n,S.cur,S.sel,null,'Pregunta')+`<div class="qcard"><div class="qnum">Pregunta ${S.cur+1}</div><h2>${q.q}</h2>${optsHTML(q.o,S.cur,S.sel[S.cur],false,q.a)}${navHTML(S.cur,n,S.sel[S.cur]!=null)}</div>
  <button class="btn" id="go" ${a<n?'disabled':''}>Verificar parte teórica</button>`}
 else{h+=`<div class="fb ${S.got/n*100>=PASS?'ok':'bad'}" style="display:block"><b class="h">${S.got} de ${n} correctas</b>Revisa la retroalimentación de cada pregunta${ST.includes('p')?' y continúa a la parte práctica':''}.</div>`+
  TQ.map((q,k)=>`<div class="qcard rev"><div class="qnum">Pregunta ${k+1}</div><h2>${q.q}</h2>${optsHTML(q.o,k,S.sel[k],true,q.a)}${fbHTML(S.sel[k]===q.a,q.w)}</div>`).join("")+
  `<button class="btn" id="go">${ST.includes('p')?'Continuar a la parte práctica →':'Ver resultado final →'}</button>`}
 $('app').innerHTML=h+`</div>`;
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{S.sel[+b.dataset.k]=+b.dataset.j;renderT()});
 document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{S.cur=Math.max(0,Math.min(n-1,S.cur+(+b.dataset.d)));renderT()});
 document.querySelectorAll('.dot').forEach(b=>b.onclick=()=>{S.cur=+b.dataset.k;renderT()});
 $('go').onclick=()=>{if(!S.done){S.done=true;S.got=TQ.filter((q,k)=>S.sel[k]===q.a).length;renderT();scrollTo(0,0)}else nextOf('t')}}
/* ---------- PARTE PRÁCTICA ---------- */
function val(f,v){if(v==null||v==="No aplica")return "";if(f.kind==="cells"&&/^\d+$/.test(v))return [...v.padEnd(f.cells||v.length," ")].map(c=>`<span>${c}</span>`).join("");return v}
function layerHTML(P,S){return X.fields.map((f,k)=>{if(f.p!==P)return "";
 const st=`left:${f.x}%;top:${f.y}%;width:${f.w}%;height:${f.h}%`,v=S.sel[k]!=null?f.opts[S.sel[k]]:null;
 const cls=S.done?(S.sel[k]===f.ans?"ok":"bad"):(k===S.cur?"act":"");
 if(f.kind==="check"){const ps=v!=null&&f.pos?f.pos[S.sel[k]]:null;
  const mk=ps?`<div class="xmark ${cls}" style="left:${ps.x}%;top:${ps.y}%;width:${f.cw}%;height:${f.ch}%;font-size:${f.cw}cqw">X</div>`:"";
  return `<div class="slot chk ${cls}" data-k="${k}" style="${st}"><span class="tagf">${f.id}</span></div>${mk}`}
 const isCells=f.kind==="cells"&&v&&/^\d+$/.test(v);
 return `<div class="slot ${cls}" data-k="${k}" style="${st}"><span class="tagf">${f.id}</span><div class="fill ${isCells?'cells':''}" style="font-size:${f.fs||3.1}cqw">${v!=null?val(f,v):'<i class="ph">?</i>'}</div></div>`}).join("")}
function panelHTML(P,S){const m=X.pages[P];return `${m.title?`<div class="ptitle">${m.title}</div>`:''}<div class="formwrap"><div class="form"><img src="${m.src}" alt="${m.title||''}">${layerHTML(P,S)}</div></div>`}
function qtext(f){return f.q||`${nm(f)}: ${f.kind==='check'?'¿qué casilla se marca?':'¿qué va en este campo?'}`}
function renderP(){const S=PS,n=X.fields.length,a=Object.keys(S.sel).length;
 bar(`Parte práctica · Campos llenados: ${a} de ${n}`,a/n*100,S.done?`Aciertos: ${S.got} de ${n}`:"");
 let h=`<div class="intro"><h3>${ST.length>2?'Parte 2 · ':''}Práctica: llena la Forma ${FORM}</h3><p>${M.practiceIntro||'Lee el caso y llena cada campo eligiendo la opción correcta. Tu respuesta se escribe en la forma. Si un dato <b>no aplica</b>, elige “No aplica”: en la forma ese campo se deja en blanco.'}</p></div>
 ${X.case?`<div class="case"><b class="lbl">Caso</b>${X.case}</div>`:''}`;
 if(!S.done){const f=X.fields[S.cur],pg=X.pages[f.p]||{};
  h+=`<div class="grid"><div class="sticky">${UP.map(P=>panelHTML(P,S)).join("")}</div><div>`+dots(n,S.cur,S.sel,X.fields.map(f=>f.id||'?'),'Campo')+
  `${pg.title?`<div class="sech">${pg.title}</div>`:''}<div class="qcard" style="margin-top:0"><h2>${qtext(f)}</h2>${optsHTML(f.opts,S.cur,S.sel[S.cur],false,f.ans,true)}${navHTML(S.cur,n,S.sel[S.cur]!=null)}</div>
  <button class="btn" id="go" ${a<n?'disabled':''}>Verificar forma</button></div></div>`}
 else{h+=`<div class="single"><div class="fb ${S.got/n*100>=PASS?'ok':'bad'}" style="display:block"><b class="h">${S.got} de ${n} campos correctos</b>En la forma: verde = correcto, rojo = incorrecto. Debajo de cada parte está la retroalimentación de sus campos.</div>`+
  UP.map(P=>`<div class="revblock">${panelHTML(P,S)}${X.fields.map((f,k)=>f.p!==P?"":`<div class="qcard rev"><div class="fqh"><span class="num">${f.id}</span>${nm(f)}</div>${optsHTML(f.opts,k,S.sel[k],true,f.ans,true)}${fbHTML(S.sel[k]===f.ans,f.why)}</div>`).join("")}</div>`).join("")+
  `<button class="btn" id="go">Ver resultado final →</button></div>`}
 $('app').innerHTML=h;
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{S.sel[+b.dataset.k]=+b.dataset.j;renderP()});
 document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{S.cur=Math.max(0,Math.min(n-1,S.cur+(+b.dataset.d)));renderP()});
 document.querySelectorAll('.dot').forEach(b=>b.onclick=()=>{S.cur=+b.dataset.k;renderP()});
 {const as=document.querySelector('.slot.act'),st=document.querySelector('.sticky');if(as&&st){const r=as.getBoundingClientRect(),sr=st.getBoundingClientRect();if(r.top<sr.top||r.bottom>sr.bottom)st.scrollTop+=r.top-sr.top-80}}
 document.querySelectorAll('.slot').forEach(b=>b.onclick=()=>{if(S.done)return;S.cur=+b.dataset.k;renderP()});
 $('go').onclick=()=>{if(!S.done){S.done=true;S.got=X.fields.filter((f,k)=>S.sel[k]===f.ans).length;renderP();scrollTo(0,0)}else nextOf('p')}}
/* ---------- RESULTADO ---------- */
function renderR(){const nt=TQ.length,np=X.fields.length,hT=nt>0,hP=np>0,tot=(hT?TS.got:0)+(hP?PS.got:0),N=nt+np;
 const pc=(g,n)=>n?Math.floor(g/n*100+1e-9):0,pt=pc(TS.got,nt),pp=pc(PS.got,np),p=pc(tot,N),ok=v=>v>=PASS;
 const missT=TQ.filter((q,k)=>TS.sel[k]!==q.a).map(q=>q.t||q.q),missP=X.fields.filter((f,k)=>PS.sel[k]!==f.ans).map(f=>f.id+' · '+nm(f));
 const card=(title,g,n,v,miss,good,bad)=>`<div class="rcard ${ok(v)?'rok':'rbad'}"><div class="rhead"><span>${title}</span><b>${v}%</b></div><div class="rsub">${g} de ${n} correctas · ${ok(v)?'Aprobado':'No aprobado'}</div>
  <div class="rfb">${miss.length?`<p>${bad}</p><ul>${miss.map(m=>`<li>${m}</li>`).join("")}</ul>`:`<p>${good}</p>`}</div></div>`;
 const fbT=`Dominas los conceptos de la ${FORM} evaluados.`,fbP="Llenaste todos los campos correctamente, sin confundir de quién es cada dato.";
 let gen;
 if(hT&&hP){if(ok(pt)&&ok(pp))gen="Buen trabajo: aprobaste la parte teórica y la práctica.";
  else if(ok(pt))gen="Conoces la teoría, pero necesitas reforzar el llenado de la forma. Revisa con cuidado de quién es cada dato y en qué parte de la forma va.";
  else if(ok(pp))gen=`Llenas bien la forma, pero necesitas reforzar los conceptos teóricos de la ${FORM}. Repasa la guía anotada en los temas señalados.`;
  else gen=`Necesitas reforzar tanto los conceptos como el llenado de la forma. Repasa la guía anotada de la ${FORM} y vuelve a intentar la evaluación.`}
 else gen=ok(p)?"Buen trabajo: aprobaste la evaluación.":`Necesitas reforzar ${hT?'los conceptos':'el llenado de la forma'}. Repasa la guía anotada de la ${FORM} y vuelve a intentar la evaluación.`;
 bar("Evaluación completada",100,`Total: ${tot} de ${N}`);
 $('app').innerHTML=`<div class="single"><div class="center"><div class="result" style="display:block;padding-bottom:6px"><div class="big" style="color:${ok(p)?'var(--green)':'var(--red)'}">${p}%</div><p><b>${ok(p)?"Aprobado":"No aprobado"}</b> · mínimo aprobatorio ${PASS}%</p></div></div>
 <div class="fb ${ok(p)?'ok':'bad'}" style="display:block"><b class="h">Retroalimentación general</b>${gen}</div>
 ${hT?card("Parte teórica",TS.got,nt,pt,missT,fbT,"Temas a reforzar:"):''}
 ${hP?card("Parte práctica",PS.got,np,pp,missP,fbP,"Campos con error:"):''}
 ${hT&&hP?`<div class="rcard ${ok(p)?'rok':'rbad'}"><div class="rhead"><span>Total</span><b>${p}%</b></div><div class="rsub">${tot} de ${N} correctas · ${ok(p)?'Aprobado':'No aprobado'} · mínimo ${PASS}%</div></div>`:''}
 <div class="center"><button class="btn" onclick="retry()">Reintentar evaluación</button></div></div>`}

/* ---------- REGISTRO, GUARDADO Y VISTA DE ADMINISTRADOR ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=s=>String(s||'').replace(/<[^>]*>/g,'');
const normName=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const pad2=n=>String(n).padStart(2,'0');
const dayOf=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const fmtDay=s=>{if(!s)return'';const[y,m,d]=s.split('-');return `${d}/${m}/${y}`};
const fmtDT=iso=>{const d=new Date(iso);return isNaN(d)?'':`${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`};
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
/* ===== CONFIGURACIÓN: pega aquí la URL de tu Web App de Apps Script (termina en /exec) ===== */
const GAS_URL="https://script.google.com/macros/s/AKfycbyzIUX1DZCasZmld04tTPk_8Tzk_9HKg9z7W_ASeMcgC5IfooVQRT1rF-_6RzvaCbxC/exec";
const GAS_OK=/^https:\/\/script\.google(usercontent)?\.com\//.test(GAS_URL);
let WHO=null,ADM=null,ADM_PIN=null;
function jsonp(params){return new Promise((res,rej)=>{const cb='__tmlf'+Date.now()+Math.floor(Math.random()*1e4),sc=document.createElement('script');
 const done=()=>{try{delete window[cb]}catch(e){window[cb]=undefined}sc.remove()};const t=setTimeout(()=>{done();rej(new Error('timeout'))},20000);
 window[cb]=d=>{clearTimeout(t);done();res(d)};sc.onerror=()=>{clearTimeout(t);done();rej(new Error('network'))};
 sc.src=GAS_URL+'?'+new URLSearchParams({...params,callback:cb,_:Date.now()});document.body.appendChild(sc)})}
function setWho(){$('who').innerHTML=WHO?`Colaborador: <b>${esc(WHO)}</b>`:''}
function renderReg(){stage=0;stepper();bar('Registro del colaborador',0,'');
 const prev=lsGet('tmlf_i485_name')||'';
 $('app').innerHTML=`<div class="reg"><div class="intro"><h3>Antes de comenzar</h3><p>Escribe tu nombre completo (nombre y apellidos). Tu resultado y tus respuestas se guardan con este nombre para que el administrador pueda revisarlos.</p></div>
 <form id="regf" novalidate><label for="fullName">Nombre completo</label><input id="fullName" autocomplete="name" placeholder="Ej. Laura Méndez García" value="${esc(prev)}">
 <div class="hint">Usa siempre el mismo nombre en cada intento.</div><div class="err" id="regErr"></div>
 <button class="btn" type="submit">Comenzar evaluación →</button></form></div>`;
 $('regf').onsubmit=e=>{e.preventDefault();const v=$('fullName').value.replace(/\s+/g,' ').trim();
  if(v.split(' ').filter(w=>w.length>1).length<2){$('regErr').textContent='Escribe tu nombre y al menos un apellido.';$('fullName').focus();return}
  WHO=v;lsSet('tmlf_i485_name',v);setWho();go(ST[0])};
 $('fullName').focus()}
const _retry=retry;retry=function(){if(!WHO)return renderReg();_retry()};
const _renderR=renderR;
renderR=function(){_renderR();const S0=TS,S1=PS;
 const st=document.createElement('div');st.className='savest';st.id='saveSt';$('app').appendChild(st);
 if(S1._saved){st.className='savest ok';st.textContent='✓ Resultado guardado';return}
 S1._saved=true;saveAttempt(S0,S1)};
function buildAttempt(S0,S1){const nt=TQ.length,np=X.fields.length,pc=(g,n)=>n?Math.floor(g/n*100+1e-9):0,now=new Date();
 const tot=S0.got+S1.got,N=nt+np,p=pc(tot,N);
 return{id:now.getTime().toString(36)+Math.random().toString(36).slice(2,6),at:now.toISOString(),day:dayOf(now),name:WHO,form:FORM,
  t:{got:S0.got,n:nt,pct:pc(S0.got,nt),sel:TQ.map((_,k)=>S0.sel[k]==null?-1:S0.sel[k])},
  p:{got:S1.got,n:np,pct:pc(S1.got,np),sel:X.fields.map((_,k)=>S1.sel[k]==null?-1:S1.sel[k])},
  total:{got:tot,n:N,pct:p},pass:p>=PASS}}
async function saveAttempt(S0,S1){const rec=buildAttempt(S0,S1);
 const show=(c,t)=>{const e=$('saveSt');if(e){e.className='savest '+c;e.textContent=t}};
 if(!GAS_OK){show('bad','Resultado no guardado: falta configurar la URL de Apps Script en el archivo.');return}
 show('','Guardando resultado…');
 const send=()=>fetch(GAS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'save',rec})});
 try{try{await send()}catch(e){await new Promise(r=>setTimeout(r,1200));await send()}show('ok','✓ Resultado guardado')}
 catch(e){show('bad','No se pudo guardar el resultado. Revisa tu conexión a internet y vuelve a intentar la evaluación.')}}

/* ----- Vista de administrador ----- */
function allAttempts(){const out=(ADM.rows||[]).filter(r=>r&&r.at&&r.t&&r.p&&r.total);return out.sort((a,b)=>a.at<b.at?1:-1)}
function people(){const m=new Map();allAttempts().forEach(r=>{const k=normName(r.name);if(!m.has(k))m.set(k,{key:k,name:r.name,list:[]});m.get(k).list.push(r)});
 return[...m.values()].sort((a,b)=>a.name.localeCompare(b.name,'es'))}
function openAdmin(){ADM=ADM||{tab:'c',sel:null,att:null,q:'',rows:null,from:'',to:'',err:null};
 $('stepper').hidden=true;document.querySelector('.bar').hidden=true;$('admBtn').textContent='← Volver a la evaluación';$('admBtn').onclick=closeAdmin;
 ADM.open=true;if(ADM_PIN)loadAdmin();else renderPin();scrollTo(0,0)}

 else if(!allAttempts().length)h+=`<div class="empty"><b>Todavía no hay evaluaciones registradas</b>Cuando un colaborador termine la evaluación, su resultado aparecerá aquí con su nombre, fecha y respuestas.</div>`;
 else h+=A.tab==='c'?(A.sel?admPerson():admList()):admGeneral();
 $('app').innerHTML=h;
 document.querySelectorAll('.atab').forEach(b=>b.onclick=()=>{A.tab=b.dataset.t;renderAdmin()});
 document.querySelectorAll('.arow').forEach(r=>{const f=()=>{A.tab='c';A.sel=r.dataset.k;A.att=null;renderAdmin();scrollTo(0,0)};r.onclick=f;r.onkeydown=e=>{if(e.key==='Enter')f()}});
 const q=$('aq');if(q){q.oninput=()=>{A.q=q.value;const n=normName(q.value);document.querySelectorAll('.arow').forEach(r=>r.hidden=!!n&&!r.dataset.k.includes(n))}}
 const rf=$('arefresh');if(rf)rf.onclick=()=>loadAdmin();

function pill(ok){return `<span class="pill ${ok?'ok':'bad'}">${ok?'Aprobado':'No aprobado'}</span>`}
function admList(){const P=people(),n=normName(ADM.q);
 return `<div class="afil"><label class="grow">Buscar colaborador<input id="aq" placeholder="Nombre o apellido" value="${esc(ADM.q)}"></label></div>
 <div class="twrap"><table class="at"><thead><tr><th>Colaborador</th><th class="n">Intentos</th><th>Último intento</th><th class="n">Teórica</th><th class="n">Práctica</th><th class="n">Total</th><th>Estado</th><th class="n">Mejor total</th></tr></thead><tbody>${
 P.map(p=>{const l=p.list[0],best=Math.max(...p.list.map(r=>r.total.pct));
  return `<tr class="arow" tabindex="0" data-k="${esc(p.key)}" ${n&&!p.key.includes(n)?'hidden':''}><td><b>${esc(p.name)}</b></td><td class="n">${p.list.length}</td><td>${fmtDT(l.at)}</td><td class="n">${l.t.pct}%</td><td class="n">${l.p.pct}%</td><td class="n"><b>${l.total.pct}%</b></td><td>${pill(l.pass)}</td><td class="n">${best}%</td></tr>`}).join('')
 }</tbody></table></div><p class="legend">Selecciona un colaborador para ver el detalle de sus respuestas. Las columnas muestran su intento más reciente.</p>`}
function admPerson(){const p=people().find(x=>x.key===ADM.sel);if(!p){ADM.sel=null;return admList()}
 const r=p.list.find(x=>x.id===ADM.att)||p.list[0];
 const pc=v=>v>=PASS;
 let h=`<div class="ahead"><div><div class="qnum">Colaborador</div><h2>${esc(p.name)}</h2></div><button class="nav sm" id="aback">← Todos los colaboradores</button></div>`;
 if(p.list.length>1)h+=`<div class="qnum">Intentos (${p.list.length})</div><div class="atsel">${p.list.map((x,i)=>`<button class="dot ${x.id===r.id?'cur':''}" data-att="${esc(x.id)}">${fmtDT(x.at)} · ${x.total.pct}%</button>`).join('')}</div>`;
 h+=`<div class="fb ${r.pass?'ok':'bad'}" style="display:block"><b class="h">${r.total.pct}% · ${r.pass?'Aprobado':'No aprobado'}</b>Presentada el ${fmtDT(r.at)} · ${r.total.got} de ${r.total.n} correctas · mínimo aprobatorio ${PASS}%</div>
 <div class="scorebox"><div><b style="color:${pc(r.t.pct)?'var(--green)':'var(--red)'}">${r.t.pct}%</b><span>Teórica · ${r.t.got}/${r.t.n}</span></div><div><b style="color:${pc(r.p.pct)?'var(--green)':'var(--red)'}">${r.p.pct}%</b><span>Práctica · ${r.p.got}/${r.p.n}</span></div><div><b style="color:${r.pass?'var(--green)':'var(--red)'}">${r.total.pct}%</b><span>Total · ${r.total.got}/${r.total.n}</span></div></div>`;
 const row=(num,label,opts,sel,ans)=>{const ok=sel===ans,ch=sel>=0&&opts[sel]!=null?opts[sel]:'Sin respuesta';
  return `<tr><td>${num}</td><td>${label}</td><td class="${ok?'cor':'wr'}">${sel>=0?L[sel]+') ':''}${esc(strip(ch))}</td><td>${ok?'—':`${L[ans]}) ${esc(strip(opts[ans]))}`}</td><td class="n"><span class="mk ${ok?'ok':'bad'}">${ok?'✔':'✘'}</span></td></tr>`};
 if(TQ.length)h+=`<div class="asec">Parte teórica</div><div class="twrap"><table class="at"><thead><tr><th>#</th><th>Pregunta</th><th>Respuesta del colaborador</th><th>Respuesta correcta</th><th class="n">Resultado</th></tr></thead><tbody>${
  TQ.map((q,k)=>row(k+1,`<b>${esc(q.t||'')}</b><span class="qt">${esc(strip(q.q))}</span>`,q.o,(r.t.sel||[])[k]??-1,q.a)).join('')}</tbody></table></div>`;
 if(X.fields.length)h+=`<div class="asec">Parte práctica</div><div class="twrap"><table class="at"><thead><tr><th>Campo</th><th>Descripción</th><th>Respuesta del colaborador</th><th>Respuesta correcta</th><th class="n">Resultado</th></tr></thead><tbody>${
  X.fields.map((f,k)=>row(esc(f.id),esc(nm(f)),f.opts,(r.p.sel||[])[k]??-1,f.ans)).join('')}</tbody></table></div>`;
 return h}
function lvl(v){return v>=PASS?{c:'ok',col:'var(--green)',t:'Dominado'}:v>=60?{c:'mid',col:'var(--gold)',t:'En desarrollo'}:{c:'low',col:'var(--red)',t:'A reforzar'}}
function donut(pct){const r=52,C=2*Math.PI*r,ok=Math.max(0,Math.min(100,pct));
 return `<svg viewBox="0 0 140 140" class="donut" role="img" aria-label="${ok}% aprobó"><circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--red-s)" stroke-width="16"/>
 <circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--green)" stroke-width="16" stroke-linecap="${ok>0&&ok<100?'round':'butt'}" stroke-dasharray="${C*ok/100} ${C}" transform="rotate(-90 70 70)"/>
 <text x="70" y="68" text-anchor="middle" class="dn-v">${ok}%</text><text x="70" y="88" text-anchor="middle" class="dn-l">aprobó</text></svg>`}
function meter(label,v,sub){const L=lvl(v);return `<div class="gm"><div class="gm-h"><span>${label}</span><b>${v}%</b></div>
 <div class="gm-t" title="${label}: ${v}%"><i style="width:${v}%;background:${L.col}"></i><em style="left:${PASS}%"></em></div>
 <div class="gm-s"><span class="chip ${L.c}">${L.t}</span>${sub||''}</div></div>`}
function dombars(items){return `<div class="dom">${items.map(x=>{const L=lvl(x.pct);
 return `<div class="db" title="${esc(strip(x.full||x.label))} · ${x.pct}% de aciertos (${x.ok} de ${x.n})"><div class="db-l">${x.label}</div>
 <div class="db-t"><i style="width:${Math.max(x.pct,1)}%;background:${L.col}"></i><em style="left:${PASS}%"></em></div>
 <div class="db-v"><b>${x.pct}%</b><span class="chip ${L.c}">${L.t}</span></div></div>`}).join('')}</div>`}
function trend(dl,byDay){const W=640,H=230,pl=40,pr=22,pt=26,pb=34,iw=W-pl-pr,ih=H-pt-pb;
 const xs=i=>pl+(dl.length===1?iw/2:i*iw/(dl.length-1)),ys=v=>pt+ih-(v/100)*ih;
 const pts=dl.map((d,i)=>{const a=byDay.get(d),v=Math.round(a.reduce((s,r)=>s+r.total.pct,0)/a.length);return{d,v,n:a.length,x:xs(i),y:ys(v)}});
 const grid=[0,25,50,75,100].map(g=>`<line x1="${pl}" x2="${W-pr}" y1="${ys(g)}" y2="${ys(g)}" class="tg"/><text x="${pl-8}" y="${ys(g)+4}" text-anchor="end" class="tx">${g}%</text>`).join('');
 const every=Math.ceil(dl.length/8);
 const xl=pts.map((p,i)=>i%every&&i!==pts.length-1?'':`<text x="${p.x}" y="${H-10}" text-anchor="middle" class="tx">${fmtDay(p.d).slice(0,5)}</text>`).join('');
 const path=pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
 const area=pts.length>1?`<path d="${path} L${pts[pts.length-1].x} ${ys(0)} L${pts[0].x} ${ys(0)} Z" class="ta"/>`:'';
 return `<div class="twrap2"><svg viewBox="0 0 ${W} ${H}" class="trend" role="img" aria-label="Promedio total por día">${grid}
 <line x1="${pl}" x2="${W-pr}" y1="${ys(PASS)}" y2="${ys(PASS)}" class="tp"/>
 ${area}${pts.length>1?`<path d="${path}" class="tl"/>`:''}
 ${pts.map(p=>`<g><circle cx="${p.x}" cy="${p.y}" r="5" class="tdot" style="fill:${lvl(p.v).col}"/><circle cx="${p.x}" cy="${p.y}" r="14" fill="transparent"><title>${fmtDay(p.d)} · promedio ${p.v}% · ${p.n} evaluación(es)</title></circle></g>`).join('')}
 ${pts.length<=12?pts.map(p=>`<text x="${p.x}" y="${p.y-11}" text-anchor="middle" class="tv">${p.v}%</text>`).join(''):''}
 ${xl}</svg></div>`}
function admGeneral(){const all=allAttempts(),days=all.map(r=>r.day).sort();
 const from=ADM.from||days[0],to=ADM.to||days[days.length-1];
 const R=all.filter(r=>r.day>=from&&r.day<=to);
 let h=`<div class="afil"><label>Desde<input type="date" id="afrom" value="${from}"></label><label>Hasta<input type="date" id="ato" value="${to}"></label><button class="nav sm" id="areset">Todas las fechas</button></div>`;
 if(!R.length)return h+`<div class="empty"><b>Sin evaluaciones entre el ${fmtDay(from)} y el ${fmtDay(to)}</b>Amplía el rango de fechas.</div>`;
 const ppl=new Set(R.map(r=>normName(r.name))),avg=a=>Math.round(a.reduce((s,v)=>s+v,0)/a.length);
 const passN=R.filter(r=>r.pass).length,passPct=Math.round(passN/R.length*100),avT=avg(R.map(r=>r.total.pct));
 const period=from===to?`el ${fmtDay(from)}`:`del ${fmtDay(from)} al ${fmtDay(to)}`;
 h+=`<div class="gh"><div class="gh-t"><div class="qnum">Resultados del grupo · ${period}</div><h2>¿Cómo le fue al grupo en la evaluación ${esc(FORM)}?</h2></div></div>
 <div class="g1"><div class="gcard dcard">${donut(passPct)}<div class="dleg"><span><i style="background:var(--green)"></i>Aprobaron <b>${passN}</b></span><span><i style="background:var(--red-s);border:1px solid var(--red)"></i>No aprobaron <b>${R.length-passN}</b></span></div></div>
 <div class="g1k"><div class="kpi"><b>${ppl.size}</b><span>Colaboradores evaluados</span></div><div class="kpi"><b>${R.length}</b><span>Evaluaciones presentadas</span></div>
 <div class="kpi wide">${meter('Promedio general del grupo',avT,`<span class="gm-n">Mínimo aprobatorio: ${PASS}%</span>`)}</div></div></div>`;
 // distribución
 const bins=[{l:'Menos de 60%',a:0,b:59},{l:'60% – 69%',a:60,b:69},{l:`70% – ${PASS-1}%`,a:70,b:PASS-1},{l:`${PASS}% – 100%`,a:PASS,b:100}];
 bins.forEach(b=>b.n=R.filter(r=>r.total.pct>=b.a&&r.total.pct<=b.b).length);const mx=Math.max(...bins.map(b=>b.n),1);
 h+=`<div class="g2"><div class="gcard"><div class="asec">Distribución de calificaciones</div><div class="hist">${bins.map(b=>{const L=lvl(b.a);
  return `<div class="hc" title="${b.l}: ${b.n} evaluación(es)"><b>${b.n}</b><span class="hpc">${Math.round(b.n/R.length*100)}%</span><i style="height:${Math.max(b.n/mx*130,b.n?6:2)}px;background:${L.col}"></i><span class="hl2">${b.l}</span></div>`}).join('')}</div>
  <p class="legend">Número de evaluaciones en cada rango de calificación total.</p></div>
 <div class="gcard"><div class="asec">Teoría vs. práctica</div>${meter('Parte teórica · conceptos',avg(R.map(r=>r.t.pct)))}${meter('Parte práctica · llenado de la forma',avg(R.map(r=>r.p.pct)))}
  <p class="legend">Promedio del grupo en cada parte. La línea vertical marca el mínimo aprobatorio (${PASS}%).</p></div></div>`;
 // dominio por tema
 const rate=(list,key,ansOf)=>list.map((q,k)=>{const ok=R.filter(r=>((r[key].sel||[])[k])===ansOf(q)).length;return{q,k,ok,n:R.length,pct:Math.round(ok/R.length*100)}});
 const rt=TQ.length?rate(TQ,'t',q=>q.a).map(x=>({...x,label:esc(x.q.t||strip(x.q.q)),full:x.q.q,kind:'Tema'})):[];
 const rp=X.fields.length?rate(X.fields,'p',f=>f.ans).map(x=>({...x,label:`<b>${esc(x.q.id)}</b> · ${esc(nm(x.q))}`,full:x.q.id+' · '+nm(x.q),kind:'Campo'})):[];
 const pri=[...rt,...rp].sort((a,b)=>a.pct-b.pct).filter(x=>x.pct<PASS).slice(0,3);
 h+=`<div class="gcard"><div class="asec">Prioridades para reforzar</div>${pri.length?`<div class="pri">${pri.map((x,i)=>`<div class="pc ${lvl(x.pct).c}"><div class="pc-n">${i+1}</div><div class="pc-b"><span class="pc-k">${x.kind}</span><div class="pc-l">${x.label}</div></div><div class="pc-v">${x.pct}%<span>aciertos</span></div></div>`).join('')}</div>`
  :`<div class="fb ok" style="display:block"><b class="h">Todo dominado</b>Todos los temas y campos tienen al menos ${PASS}% de aciertos en este periodo.</div>`}</div>`;
 const legend=`<div class="slegend"><span><i style="background:var(--green)"></i>Dominado · ${PASS}% o más</span><span><i style="background:var(--gold)"></i>En desarrollo · 60% a ${PASS-1}%</span><span><i style="background:var(--red)"></i>A reforzar · menos de 60%</span><span><em></em>Mínimo aprobatorio</span></div>`;
 if(rt.length)h+=`<div class="gcard"><div class="asec">Dominio por tema · parte teórica</div>${legend}${dombars(rt.sort((a,b)=>a.pct-b.pct))}</div>`;
 if(rp.length)h+=`<div class="gcard"><div class="asec">Dominio por campo · parte práctica</div>${legend}${dombars(rp.sort((a,b)=>a.pct-b.pct))}</div>`;
 const byDay=new Map();R.forEach(r=>{if(!byDay.has(r.day))byDay.set(r.day,[]);byDay.get(r.day).push(r)});const dl=[...byDay.keys()].sort();
 h+=`<div class="gcard"><div class="asec">Evolución del promedio por día</div>${trend(dl,byDay)}<p class="legend">Cada punto es el promedio total de las evaluaciones de ese día; la línea punteada marca el mínimo aprobatorio (${PASS}%). Pasa el cursor sobre un punto para ver cuántas evaluaciones hubo.</p></div>`;
 h+=`<details class="gcard gdet"><summary>Evaluaciones del periodo con nombres (${R.length}) · no se muestra al proyectar</summary><div class="twrap" style="margin-top:12px"><table class="at"><thead><tr><th>Fecha</th><th>Colaborador</th><th class="n">Teórica</th><th class="n">Práctica</th><th class="n">Total</th><th>Estado</th></tr></thead><tbody>${
 R.map(r=>`<tr class="arow" tabindex="0" data-k="${esc(normName(r.name))}"><td>${fmtDT(r.at)}</td><td><b>${esc(r.name)}</b></td><td class="n">${r.t.pct}%</td><td class="n">${r.p.pct}%</td><td class="n"><b>${r.total.pct}%</b></td><td>${pill(r.pass)}</td></tr>`).join('')}</tbody></table></div></details>`;
 return h}

$('admBtn').onclick=openAdmin;
renderReg();
</script></body></html>
