<script type="application/json" id="cfg">{"v":1,"meta":{"kicker":"TMLF Learning Center · Curso de Formas NON VAWA · Evaluación","title":"I-864 · Affidavit of Support","subtitle":"","form":"I-864","pass":85,"fileName":"TMLF_Evaluacion_I864.html","theoryIntro":"","practiceIntro":""},"tq":[{"t":"Cálculo del household size","q":"Sponsor USC casado pide a su esposa. Tiene 2 hijos menores de 21 de una relación anterior que no viven con él. No tiene otros dependientes ni I-864 anteriores. ¿Cuál es su household size?","o":["2","3","5","4"],"a":3,"w":"Item 1 (esposa patrocinada) = 1 · Item 2 (sponsor) = 1 · Item 3 (cónyuge) = 0 porque ya se contó en Item 1 · Item 4 (hijos \u003c21, \u003cb>aunque no vivan con él\u003c/b>) = 2 → \u003cb>4\u003c/b>."},{"t":"Joint sponsor y el 125%","q":"Sobre el ingreso de un joint sponsor, ¿qué es correcto?","o":["Debe cumplir el 125% por sí solo; no suma el ingreso del peticionario","Suma su ingreso con el del peticionario para llegar al 125%","Solo necesita cumplir el 100% de las guías","No necesita demostrar ingresos si es familiar"],"a":0,"w":"El joint sponsor debe cumplir el \u003cb>125% por sí solo\u003c/b>: no puede sumar ingresos del peticionario ni del otro joint sponsor."},{"t":"Cuándo aplica el 100%","q":"¿En qué caso el mínimo es el 100% de las guías en lugar del 125%?","o":["Cuando el sponsor es LPR","Cuando el sponsor está en servicio militar activo y patrocina a su cónyuge o hijo","Cuando el sponsor es veterano o reservista","Cuando hay un joint sponsor"],"a":1,"w":"Solo baja al \u003cb>100%\u003c/b> si el peticionario está en \u003cb>servicio militar activo\u003c/b> y patrocina a su \u003cb>cónyuge o hijo\u003c/b>. Veteranos, reservistas y joint sponsors usan el 125%."},{"t":"Duración de la obligación","q":"Si el sponsor y la beneficiaria se divorcian, ¿qué pasa con la obligación de la I-864?","o":["Termina en automático con el divorcio","Se transfiere al joint sponsor","Termina cuando la beneficiaria cumple 1 año como residente","Continúa: el divorcio no termina la obligación"],"a":3,"w":"El \u003cb>divorcio no termina\u003c/b> la obligación. Termina cuando el inmigrante se naturaliza, acumula 40 trimestres de trabajo, pierde la residencia y sale del país, o fallece (o fallece el sponsor)."},{"t":"Peticionario sin ingresos suficientes","q":"Si el peticionario no alcanza el ingreso mínimo, ¿qué pasa con su I-864?","o":["Ya no firma la I-864 y la firma solo el joint sponsor","Firma la I-864A en lugar de la I-864","Siempre firma su propia I-864 y se agrega un joint sponsor","Se presenta la I-864EZ"],"a":2,"w":"El peticionario \u003cb>siempre\u003c/b> firma su propia I-864 (Part 1, 1.a), aunque no le alcance; el joint sponsor presenta \u003cb>otra\u003c/b> I-864 (1.d o 1.e)."},{"t":"Quién puede ser sponsor","q":"¿Qué requisitos debe cumplir el sponsor que firma la I-864?","o":["Ser USC o LPR, de cualquier edad, y vivir en cualquier país","Ser USC, U.S. national o LPR, tener 18 años o más y estar domiciliado en EE.UU.","Ser solo ciudadano estadounidense mayor de 21 años","Ser familiar del beneficiario y tener empleo de tiempo completo"],"a":1,"w":"El sponsor debe ser \u003cb>USC, U.S. national o LPR\u003c/b>, tener \u003cb>18 años o más\u003c/b> y estar \u003cb>domiciliado en EE.UU.\u003c/b>"},{"t":"Qué no cuenta como ingreso","q":"¿Cuál de estos NO se cuenta como ingreso del sponsor en la I-864?","o":["Salario de su empleo","Pensión de retiro","Beneficios públicos como SNAP, Medicaid o SSI","Pensión alimenticia que recibe"],"a":2,"w":"Los beneficios públicos \u003cb>means-tested\u003c/b> (SNAP, Medicaid, TANF, SSI) \u003cb>no\u003c/b> se cuentan como ingreso."}],"ex":{"case":"\u003cb>Jorge Alberto Ramírez Torres\u003c/b> es ciudadano estadounidense (no está en servicio militar activo). Presentó una \u003cb>I-130\u003c/b> por su esposa \u003cb>María Fernanda Hernández Cruz\u003c/b> y ahora firma la \u003cb>I-864\u003c/b> como peticionario.\u003cbr>\u003cbr>\n\u003cb>Hogar de Jorge:\u003c/b> <script>
const CFG=JSON.parse(document.getElementById('cfg').textContent);
const M=CFG.meta||{},TQ=CFG.tq||[],X=CFG.ex||{pages:[],fields:[],case:""},PASS=+M.pass||85,FORM=M.form||"";
const L="ABCDEF",$=id=>document.getElementById(id);
const ST=[];if(TQ.length)ST.push("t");if(X.fields.length)ST.push("p");ST.push("r");
const NM={t:"Parte teórica",p:"Parte práctica",r:"Resultado"};let stage=0,TS,PS;
function reset(){TS={sel:{},cur:0,done:false,got:0};PS={sel:{},cur:0,done:false,got:0}}reset();
const nm=f=>(f.name||f.id||"").replace(/^P\d+ · /,"");
const UP=X.pages.map((_,i)=>i).filter(i=>X.fields.some(f=>f.p===i));
function stepper(){$('stepper').innerHTML=ST.map((s,i)=>`<div class="${i===stage?'cur':i<stage?'fin':''}"><span>${i<stage?'✓':i+1}</span>${NM[s]}</div>`).join("")}
function bar(txt,pct,score){$('count').textContent=txt;$('prog').style.width=pct+"%";$('score').textContent=score||""}
function dots(n,cur,sel,labels,word){return `<div class="steps">${Array.from({length:n},(_,k)=>`<button class="dot ${k===cur?'cur':''} ${sel[k]!=null?'ans':''}" data-k="${k}">${labels?labels[k]:k+1}</button>`).join("")}</div><div class="stepc">${word} ${cur+1} de ${n}</div>`}
function optsHTML(opts,k,sel,done,ans,mono){return `<div class="opts">${opts.map((o,j)=>{let c="";if(done){if(j===ans)c="ok";else if(j===sel)c="bad"}else if(sel===j)c="sel";
 return `<button class="opt ${c}" data-k="${k}" data-j="${j}" ${done?'disabled':''}><span class="l">${L[j]}</span><span class="${mono?'mono':''}">${o}</span></button>`}).join("")}</div>`}
function navHTML(k,n,answered){return `<div class="navs"><button class="nav" data-d="-1" ${k===0?'disabled':''}>← Anterior</button><button class="nav nx" data-d="1" ${!answered||k===n-1?'disabled':''}>Siguiente →</button></div>`}
function fbHTML(ok,why){return `<div class="fb ${ok?'ok':'bad'}"><b class="h">${ok?'✔ Correcto':'✘ Incorrecto'}</b>${why||''}</div>`}
function go(s){stage=ST.indexOf(s);stepper();({t:renderT,p:renderP,r:renderR})[s]();scrollTo(0,0)}
function nextOf(s){go(ST[ST.indexOf(s)+1])}
function retry(){reset();go(ST[0])}
/* ---------- PARTE TEÓRICA ---------- */
function renderT(){const S=TS,n=TQ.length,a=Object.keys(S.sel).length;
 bar(`Parte teórica · Contestadas: ${a} de ${n}`,a/n*100,S.done?`Aciertos: ${S.got} de ${n}`:"");
 let h=`<div class="intro"><h3>${ST.length>2?'Parte 1 · ':''}Preguntas teóricas</h3><p>${M.theoryIntro||`${n} preguntas de opción múltiple sobre la Forma ${FORM}. Contesta todas; puedes regresar con <b>Anterior</b> para cambiar tus respuestas antes de verificar.`}</p></div><div class="single">`;
 if(!S.done){const q=TQ[S.cur];h+=dots(n,S.cur,S.sel,null,'Pregunta')+`<div class="qcard"><div class="qnum">Pregunta ${S.cur+1}</div><h2>${q.q}</h2>${optsHTML(q.o,S.cur,S.sel[S.cur],false,q.a)}${navHTML(S.cur,n,S.sel[S.cur]!=null)}</div>
  <button class="btn" id="go" ${a<n?'disabled':''}>Verificar parte teórica</button>`}
 else{h+=`<div class="fb ${S.got/n*100>=PASS?'ok':'bad'}" style="display:block"><b class="h">${S.got} de ${n} correctas</b>Revisa la retroalimentación de cada pregunta${ST.includes('p')?' y continúa a la parte práctica':''}.</div>`+
  TQ.map((q,k)=>`<div class="qcard rev"><div class="qnum">Pregunta ${k+1}</div><h2>${q.q}</h2>${optsHTML(q.o,k,S.sel[k],true,q.a)}${fbHTML(S.sel[k]===q.a,q.w)}</div>`).join("")+
  `<button class="btn" id="go">${ST.includes('p')?'Continuar a la parte práctica →':'Ver resultado final →'}</button>`}
 $('app').innerHTML=h+`</div>`;
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{S.sel[+b.dataset.k]=+b.dataset.j;renderT()});
 document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{S.cur=Math.max(0,Math.min(n-1,S.cur+(+b.dataset.d)));renderT()});
 document.querySelectorAll('.dot').forEach(b=>b.onclick=()=>{S.cur=+b.dataset.k;renderT()});
 $('go').onclick=()=>{if(!S.done){S.done=true;S.got=TQ.filter((q,k)=>S.sel[k]===q.a).length;renderT();scrollTo(0,0)}else nextOf('t')}}
/* ---------- PARTE PRÁCTICA ---------- */
function val(f,v){if(v==null||v==="No aplica")return "";if(f.kind==="cells"&&/^\d+$/.test(v))return [...v.padEnd(f.cells||v.length," ")].map(c=>`<span>${c}</span>`).join("");return v}
function layerHTML(P,S){return X.fields.map((f,k)=>{if(f.p!==P)return "";
 const st=`left:${f.x}%;top:${f.y}%;width:${f.w}%;height:${f.h}%`,v=S.sel[k]!=null?f.opts[S.sel[k]]:null;
 const cls=S.done?(S.sel[k]===f.ans?"ok":"bad"):(k===S.cur?"act":"");
 if(f.kind==="check"||f.kind==="q"){const ps=v!=null&&f.kind==="check"&&f.pos?f.pos[S.sel[k]]:null;
  const mk=ps?`<div class="xmark ${cls}" style="left:${ps.x}%;top:${ps.y}%;width:${f.cw}%;height:${f.ch}%;font-size:${f.cw}cqw">X</div>`:"";
  return `<div class="slot chk ${cls}" data-k="${k}" style="${st}"><span class="tagf">${f.id}</span></div>${mk}`}
 const isCells=f.kind==="cells"&&v&&/^\d+$/.test(v);
 return `<div class="slot ${cls}" data-k="${k}" style="${st}"><span class="tagf">${f.id}</span><div class="fill ${isCells?'cells':''}" style="font-size:${f.fs||3.1}cqw">${v!=null?val(f,v):'<i class="ph">?</i>'}</div></div>`}).join("")}
function panelHTML(P,S){const m=X.pages[P];return `${m.title?`<div class="ptitle">${m.title}</div>`:''}<div class="formwrap"><div class="form"><img src="${m.src}" alt="${m.title||''}">${layerHTML(P,S)}</div></div>`}
function qtext(f){return f.q||(f.kind==='q'?nm(f):`${nm(f)}: ${f.kind==='check'?'¿qué casilla se marca?':'¿qué va en este campo?'}`)}
function renderP(){const S=PS,n=X.fields.length,a=Object.keys(S.sel).length;
 bar(`Parte práctica · Campos llenados: ${a} de ${n}`,a/n*100,S.done?`Aciertos: ${S.got} de ${n}`:"");
 let h=`<div class="intro"><h3>${ST.length>2?'Parte 2 · ':''}Práctica: llena la Forma ${FORM}</h3><p>${M.practiceIntro||'Lee el caso y llena cada campo eligiendo la opción correcta. Tu respuesta se escribe en la forma. Si un dato <b>no aplica</b>, elige “No aplica”: en la forma ese campo se deja en blanco.'}</p></div>
 ${X.case?`<div class="case"><b class="lbl">Caso</b>${X.case}</div>`:''}`;
 if(!S.done){const f=X.fields[S.cur],pg=X.pages[f.p]||{};
  h+=`<div class="grid"><div class="sticky">${UP.map(P=>panelHTML(P,S)).join("")}</div><div>`+dots(n,S.cur,S.sel,X.fields.map(f=>f.id||'?'),'Campo')+
  `${pg.title?`<div class="sech">${pg.title}</div>`:''}<div class="qcard" style="margin-top:0"><h2>${qtext(f)}</h2>${optsHTML(f.opts,S.cur,S.sel[S.cur],false,f.ans,f.kind!=='q')}${navHTML(S.cur,n,S.sel[S.cur]!=null)}</div>
  <button class="btn" id="go" ${a<n?'disabled':''}>Verificar forma</button></div></div>`}
 else{h+=`<div class="single"><div class="fb ${S.got/n*100>=PASS?'ok':'bad'}" style="display:block"><b class="h">${S.got} de ${n} campos correctos</b>En la forma: verde = correcto, rojo = incorrecto. Debajo de cada parte está la retroalimentación de sus campos.</div>`+
  UP.map(P=>`<div class="revblock">${panelHTML(P,S)}${X.fields.map((f,k)=>f.p!==P?"":`<div class="qcard rev"><div class="fqh"><span class="num">${f.id}</span>${nm(f)}</div>${f.kind==='q'?`<p style="margin:0 0 10px;font-weight:600">${qtext(f)}</p>`:''}${optsHTML(f.opts,k,S.sel[k],true,f.ans,f.kind!=='q')}${fbHTML(S.sel[k]===f.ans,f.why)}</div>`).join("")}</div>`).join("")+
  `<button class="btn" id="go">Ver resultado final →</button></div>`}
 $('app').innerHTML=h;
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{S.sel[+b.dataset.k]=+b.dataset.j;renderP()});
 document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{S.cur=Math.max(0,Math.min(n-1,S.cur+(+b.dataset.d)));renderP()});
 document.querySelectorAll('.dot').forEach(b=>b.onclick=()=>{S.cur=+b.dataset.k;renderP()});
 {const as=document.querySelector('.slot.act'),st=document.querySelector('.sticky');if(as&&st){const r=as.getBoundingClientRect(),sr=st.getBoundingClientRect();if(r.top<sr.top||r.bottom>sr.bottom)st.scrollTop+=r.top-sr.top-80}}
 document.querySelectorAll('.slot').forEach(b=>b.onclick=()=>{if(S.done)return;S.cur=+b.dataset.k;renderP()});
 $('go').onclick=()=>{if(!S.done){S.done=true;S.got=X.fields.filter((f,k)=>S.sel[k]===f.ans).length;renderP();scrollTo(0,0)}else nextOf('p')}}
/* ---------- RESULTADO ---------- */
function renderR(){const nt=TQ.length,np=X.fields.length,hT=nt>0,hP=np>0,tot=(hT?TS.got:0)+(hP?PS.got:0),N=nt+np;
 const pc=(g,n)=>n?Math.floor(g/n*100+1e-9):0,pt=pc(TS.got,nt),pp=pc(PS.got,np),p=pc(tot,N),ok=v=>v>=PASS;
 const missT=TQ.filter((q,k)=>TS.sel[k]!==q.a).map(q=>q.t||q.q),missP=X.fields.filter((f,k)=>PS.sel[k]!==f.ans).map(f=>f.id+' · '+nm(f));
 const card=(title,g,n,v,miss,good,bad)=>`<div class="rcard ${ok(v)?'rok':'rbad'}"><div class="rhead"><span>${title}</span><b>${v}%</b></div><div class="rsub">${g} de ${n} correctas · ${ok(v)?'Aprobado':'No aprobado'}</div>
  <div class="rfb">${miss.length?`<p>${bad}</p><ul>${miss.map(m=>`<li>${m}</li>`).join("")}</ul>`:`<p>${good}</p>`}</div></div>`;
 const fbT=`Dominas los conceptos de la ${FORM} evaluados.`,fbP="Llenaste todos los campos correctamente, sin confundir de quién es cada dato.";
 let gen;
 if(hT&&hP){if(ok(pt)&&ok(pp))gen="Buen trabajo: aprobaste la parte teórica y la práctica.";
  else if(ok(pt))gen="Conoces la teoría, pero necesitas reforzar el llenado de la forma. Revisa con cuidado de quién es cada dato y en qué parte de la forma va.";
  else if(ok(pp))gen=`Llenas bien la forma, pero necesitas reforzar los conceptos teóricos de la ${FORM}. Repasa la guía anotada en los temas señalados.`;
  else gen=`Necesitas reforzar tanto los conceptos como el llenado de la forma. Repasa la guía anotada de la ${FORM} y vuelve a intentar la evaluación.`}
 else gen=ok(p)?"Buen trabajo: aprobaste la evaluación.":`Necesitas reforzar ${hT?'los conceptos':'el llenado de la forma'}. Repasa la guía anotada de la ${FORM} y vuelve a intentar la evaluación.`;
 bar("Evaluación completada",100,`Total: ${tot} de ${N}`);
 $('app').innerHTML=`<div class="single"><div class="center"><div class="result" style="display:block;padding-bottom:6px"><div class="big" style="color:${ok(p)?'var(--green)':'var(--red)'}">${p}%</div><p><b>${ok(p)?"Aprobado":"No aprobado"}</b> · mínimo aprobatorio ${PASS}%</p></div></div>
 <div class="fb ${ok(p)?'ok':'bad'}" style="display:block"><b class="h">Retroalimentación general</b>${gen}</div>
 ${hT?card("Parte teórica",TS.got,nt,pt,missT,fbT,"Temas a reforzar:"):''}
 ${hP?card("Parte práctica",PS.got,np,pp,missP,fbP,"Campos con error:"):''}
 ${hT&&hP?`<div class="rcard ${ok(p)?'rok':'rbad'}"><div class="rhead"><span>Total</span><b>${p}%</b></div><div class="rsub">${tot} de ${N} correctas · ${ok(p)?'Aprobado':'No aprobado'} · mínimo ${PASS}%</div></div>`:''}
 <div class="center"><button class="btn" onclick="retry()">Reintentar evaluación</button></div></div>`}
</script>
<script>

   Si se deja vacío, funciona en MODO LOCAL (los resultados solo se guardan

const GAS_URL='https://script.google.com/macros/s/AKfycbyJDF26TgrRh23yly72kFpRjn_Pvhb83VJRXRDZ7p3NFCv6SOf1DROXi_GIQRBKYrxZhQ/exec';
const FORM_KEY=FORM||'I-864';

(function(){
const LS_USER='tmlf_user',LS_RES='tmlf_res_'+FORM_KEY,LS_PEND='tmlf_pend_'+FORM_KEY;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const txt=h=>{const d=document.createElement('div');d.innerHTML=h==null?'':String(h);return (d.textContent||'').replace(/\s+/g,' ').trim()};
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zñ0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const clean=s=>String(s||'').replace(/\s+/g,' ').trim();
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pc=(g,n)=>n?Math.floor(g/n*100+1e-9):0;
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let USER=null,SAVED=false;

/* ---------- Registro ---------- */
function whoBar(){const w=$('who');if(!USER){w.style.display='none';return}
 w.style.display='flex';w.innerHTML=`<span>Colaborador: <b>${esc(USER)}</b></span><button id="chgUser" type="button">Cambiar colaborador</button>`;
 $('chgUser').onclick=()=>{if(confirm('¿Cambiar de colaborador? Se reiniciará la evaluación.')){USER=null;reset();SAVED=false;renderReg()}}}
function renderReg(){whoBar();$('stepper').innerHTML='';bar('Registro del colaborador',0,'');
 const prev=(lsGet(LS_USER,'')||'');
 $('app').innerHTML=`<div class="single"><div class="intro"><h3>Registro</h3><p>Antes de comenzar, escribe tu <b>nombre completo</b> (nombre y apellidos). Así quedarán registrados tus resultados.</p></div>
 <form class="reg" id="regf" autocomplete="on"><label for="regName">Nombre completo</label>
 <input id="regName" name="name" type="text" maxlength="90" placeholder="Ej. María Fernanda López García" value="${esc(prev)}">
 <div class="hint">Escríbelo siempre igual en cada evaluación.</div><div class="err" id="regErr"></div>
 <button class="btn" type="submit">Comenzar evaluación →</button></form></div>`;
 const inp=$('regName');inp.focus();
 $('regf').onsubmit=ev=>{ev.preventDefault();const v=clean(inp.value);
  if(norm(v).split(' ').filter(w=>w.length>1).length<2){$('regErr').textContent='Escribe tu nombre completo: al menos nombre y un apellido.';return}
  USER=v;lsSet(LS_USER,v);reset();SAVED=false;whoBar();go(ST[0])}}

/* ---------- Guardado del resultado ---------- */
function payload(){const nt=TQ.length,np=X.fields.length,tot=(nt?TS.got:0)+(np?PS.got:0),N=nt+np,now=new Date();
 const nmf=f=>(f.name||f.id||'').replace(/^P\d+ · /,'');
 return {id:now.getTime().toString(36)+Math.random().toString(36).slice(2,7),form:FORM_KEY,ts:now.toISOString(),fecha:ymd(now),hora:pad(now.getHours())+':'+pad(now.getMinutes()),
  nombre:USER,nombreNorm:norm(USER),
  teoria:{got:nt?TS.got:0,n:nt,pct:pc(TS.got,nt)},practica:{got:np?PS.got:0,n:np,pct:pc(PS.got,np)},total:{got:tot,n:N,pct:pc(tot,N)},
  aprobado:pc(tot,N)>=PASS,pass:PASS,
  detalle:{teoria:TQ.map((q,k)=>({k:k+1,tema:txt(q.t),pregunta:txt(q.q),resp:TS.sel[k]!=null?L[TS.sel[k]]+') '+txt(q.o[TS.sel[k]]):'—',correcta:L[q.a]+') '+txt(q.o[q.a]),ok:TS.sel[k]===q.a})),
   practica:X.fields.map((f,k)=>({id:txt(f.id),campo:txt(nmf(f)),resp:PS.sel[k]!=null?txt(f.opts[PS.sel[k]]):'—',correcta:txt(f.opts[f.ans]),ok:PS.sel[k]===f.ans}))}}}
function send(r){return fetch(GAS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'save',data:r})})}
function flushPending(){if(!GAS_URL)return;const p=lsGet(LS_PEND,[]);if(!p.length)return;
 const left=[];Promise.all(p.map(r=>send(r).catch(()=>left.push(r)))).then(()=>lsSet(LS_PEND,left))}
function status(cls,msg){const s=$('saveSt');if(s){s.className='save '+cls;s.innerHTML=msg}}
function save(r){const all=lsGet(LS_RES,[]);all.push(r);lsSet(LS_RES,all);
 if(!GAS_URL){status('ok','✔ Resultado guardado (modo local, solo en este navegador).');return}
 status('','Guardando resultado…');
 send(r).then(()=>status('ok','✔ Resultado registrado a nombre de <b>'+esc(r.nombre)+'</b>.'))
  .catch(()=>{const p=lsGet(LS_PEND,[]);p.push(r);lsSet(LS_PEND,p);status('bad','No se pudo enviar el resultado (sin conexión). Se reenviará automáticamente la próxima vez que abras la evaluación en este equipo.')})}
const _renderR=renderR;
renderR=function(){_renderR();const host=document.querySelector('#app .single');
 if(host){const d=document.createElement('div');d.id='saveSt';d.className='save';host.insertBefore(d,host.querySelector('.center:last-child'))}
 if(!SAVED&&USER){SAVED=true;save(payload())}else if(SAVED)status('ok','✔ Resultado registrado.')};
const _retry=retry;retry=function(){SAVED=false;_retry()};

/* ---------- Panel de administrador ---------- */
let ADM={pin:'',rows:[],tab:'p',person:null,open:{},f:{q:'',d1:'',d2:'',att:'all',grp:'d'}};
function showAdmin(on){document.querySelector('.sheet').style.display=on?'none':'';$('admlink').style.display=on?'none':'';$('adm').style.display=on?'block':'none';scrollTo(0,0);if(on)admLogin()}
function admShell(inner){$('adm').innerHTML=`<header><div><div class="kicker">TMLF Learning Center · Administrador</div><h1>Resultados · ${esc(FORM_KEY)}</h1><p>${GAS_URL?'Resultados de todos los colaboradores (Google Sheets)':'Modo local · solo resultados guardados en este navegador'}</p></div>
 <div style="display:flex;gap:8px;flex-wrap:wrap">${ADM.pin?'<button id="admRef" type="button">↻ Actualizar</button>':''}<button id="admExit" type="button">← Volver a la evaluación</button></div></header>${inner}`;
 $('admExit').onclick=()=>showAdmin(false);if($('admRef'))$('admRef').onclick=()=>load(ADM.pin)}
function admLogin(err){if(ADM.pin&&!err){load(ADM.pin);return}
 admShell(`<div class="admbody"><form class="reg" id="pinf"><label for="pin">PIN de administrador</label><input id="pin" type="password" inputmode="numeric" autocomplete="off"><div class="err" id="pinErr">${esc(err||'')}</div><button class="btn" type="submit">Entrar</button></form></div>`);
 $('pin').focus();$('pinf').onsubmit=ev=>{ev.preventDefault();load($('pin').value.trim())}}
function load(pin){admShell(`<div class="admbody"><div class="empty">Cargando resultados…</div></div>`);
 if(!GAS_URL){if(pin!==LOCAL_PIN){ADM.pin='';admLogin('PIN incorrecto.');return}ADM.pin=pin;setRows(lsGet(LS_RES,[]));return}
 const cb='__adm'+Date.now(),s=document.createElement('script');let done=false;
 const fin=()=>{done=true;try{delete window[cb]}catch(e){window[cb]=undefined}s.remove()};
 window[cb]=res=>{fin();if(!res||!res.ok){ADM.pin='';admLogin(res&&res.error==='pin'?'PIN incorrecto.':'Error: '+((res&&res.error)||'respuesta inválida'));return}ADM.pin=pin;setRows(res.rows||[])};
 s.onerror=()=>{if(!done){fin();ADM.pin='';admLogin('No se pudo conectar con Google Sheets. Revisa la URL de Apps Script.')}};
 s.src=GAS_URL+(GAS_URL.includes('?')?'&':'?')+'action=admin&form='+encodeURIComponent(FORM_KEY)+'&pin='+encodeURIComponent(pin)+'&callback='+cb;
 document.body.appendChild(s);
 setTimeout(()=>{if(!done){fin();ADM.pin='';admLogin('Tiempo de espera agotado al consultar Google Sheets.')}},20000)}
function setRows(rows){rows=rows.filter(r=>r&&r.nombre&&r.total).map(r=>Object.assign({},r,{nombreNorm:r.nombreNorm||norm(r.nombre)}));
 rows.sort((a,b)=>String(a.ts).localeCompare(String(b.ts)));
 const cnt={},cn={};rows.forEach(r=>{cnt[r.nombreNorm]=(cnt[r.nombreNorm]||0)+1;r._n=cnt[r.nombreNorm];cn[r.nombreNorm]=cn[r.nombreNorm]||r.nombre;r._disp=cn[r.nombreNorm]});
 ADM.rows=rows;renderAdm()}
function people(rows){const m={};rows.forEach(r=>{(m[r.nombreNorm]=m[r.nombreNorm]||{key:r.nombreNorm,nombre:r.nombre,list:[]}).list.push(r)});
 return Object.values(m).map(p=>{p.last=p.list[p.list.length-1];p.best=p.list.reduce((a,b)=>b.total.pct>a.total.pct?b:a);p.first=p.list[0];return p}).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'))}
const inRange=r=>(!ADM.f.d1||r.fecha>=ADM.f.d1)&&(!ADM.f.d2||r.fecha<=ADM.f.d2);
const pill=ok=>`<span class="pill ${ok?'ok':'bad'}">${ok?'Aprobado':'No aprobado'}</span>`;
const fdate=s=>{if(!s)return '';const[y,m,d]=s.split('-');return d+'/'+m+'/'+y};
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function renderAdm(){const t=ADM.tab;
 admShell(`<div class="tabs"><button type="button" data-t="p" class="${t==='p'?'on':''}">Por colaborador</button><button type="button" data-t="g" class="${t==='g'?'on':''}">General por fecha</button><button type="button" data-t="v" class="${t==='v'?'on':''}">Vista para el grupo</button></div><div class="admbody" id="admB"></div>`);
 document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ADM.tab=b.dataset.t;renderAdm()});
 if(!ADM.rows.length){$('admB').innerHTML=`${GAS_URL?'':'<div class="note">Modo local: configura <b>GAS_URL</b> en el archivo para ver los resultados de todos los colaboradores.</div>'}<div class="empty">Aún no hay evaluaciones registradas.</div>`;return}
 t==='p'?renderPerson():t==='v'?renderGroup():renderGeneral()}
function dateFilters(extra){const f=ADM.f;return `<div class="filters"><div><label>Desde</label><input type="date" id="fd1" value="${f.d1}"></div><div><label>Hasta</label><input type="date" id="fd2" value="${f.d2}"></div>${extra}<div><button class="btn2" type="button" id="fclr">Limpiar fechas</button></div></div>`}
function bindDates(rer){$('fd1').onchange=e=>{ADM.f.d1=e.target.value;rer()};$('fd2').onchange=e=>{ADM.f.d2=e.target.value;rer()};$('fclr').onclick=()=>{ADM.f.d1=ADM.f.d2='';rer()}}

/* --- Vista 1: por colaborador --- */
function renderPerson(){const f=ADM.f,B=$('admB');
 const ps=people(ADM.rows.filter(inRange)).filter(p=>!f.q||p.key.includes(norm(f.q)));
 if(ADM.person&&!ps.some(p=>p.key===ADM.person))ADM.person=null;
 if(!ADM.person&&ps.length)ADM.person=ps[0].key;
 const P=ps.find(p=>p.key===ADM.person);
 B.innerHTML=(GAS_URL?'':'<div class="note">Modo local: solo se muestran resultados guardados en este navegador.</div>')+
  dateFilters(`<div><label>Buscar colaborador</label><input type="search" id="fq" placeholder="Nombre…" value="${esc(f.q)}"></div>`)+
  `<div class="split"><div class="plist">${ps.length?ps.map(p=>`<button type="button" data-k="${esc(p.key)}" class="${p.key===ADM.person?'on':''}"><b>${esc(p.nombre)}</b><small>${p.list.length} intento${p.list.length>1?'s':''} · último ${p.last.total.pct}% · ${fdate(p.last.fecha)}</small></button>`).join(''):'<div class="empty">Sin coincidencias.</div>'}</div>
  <div id="pdet">${P?personDetail(P):''}</div></div>`;
 bindDates(renderPerson);
 $('fq').oninput=e=>{ADM.f.q=e.target.value;const pos=e.target.selectionStart;renderPerson();const q=$('fq');q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}};
 B.querySelectorAll('.plist button').forEach(b=>b.onclick=()=>{ADM.person=b.dataset.k;renderPerson()});
 B.querySelectorAll('.atth').forEach(h=>h.onclick=()=>{const id=h.dataset.id;ADM.open[id]=!isOpen(id,P);renderPerson()})}
const isOpen=(id,P)=>ADM.open[id]!=null?ADM.open[id]:id===P.last.id;
function personDetail(P){const L2=P.list.slice().reverse();
 return `<div class="kpis"><div class="kpi"><span>Intentos</span><b>${P.list.length}</b></div><div class="kpi"><span>Último resultado</span><b style="color:${P.last.aprobado?'var(--green)':'var(--red)'}">${P.last.total.pct}%</b><small>${fdate(P.last.fecha)}</small></div><div class="kpi"><span>Mejor resultado</span><b>${P.best.total.pct}%</b><small>${fdate(P.best.fecha)}</small></div><div class="kpi"><span>Primer intento</span><b>${P.first.total.pct}%</b><small>${fdate(P.first.fecha)}</small></div></div>
 <div class="h3">${esc(P.nombre)} · detalle por intento</div>`+
 L2.map(r=>{const o=isOpen(r.id,P);return `<div class="att"><div class="atth" data-id="${esc(r.id)}"><div><b>Intento ${r._n}</b> · ${fdate(r.fecha)} ${esc(r.hora||'')}<br><small style="color:var(--muted)">Teoría ${r.teoria.got}/${r.teoria.n} (${r.teoria.pct}%) · Práctica ${r.practica.got}/${r.practica.n} (${r.practica.pct}%)</small></div><div style="display:flex;gap:10px;align-items:center"><span class="sc" style="color:${r.aprobado?'var(--green)':'var(--red)'}">${r.total.pct}%</span>${pill(r.aprobado)}<span>${o?'▲':'▼'}</span></div></div>
 ${o?`<div class="attb">${answersHTML(r)}</div>`:''}</div>`}).join('')}
function answersHTML(r){const d=r.detalle||{},T=d.teoria||[],Pr=d.practica||[],mk=ok=>`<td class="${ok?'ok':'bad'}">${ok?'✔':'✘'}</td>`;
 return (T.length?`<div class="h3">Parte teórica · ${r.teoria.got} de ${r.teoria.n}</div><div class="tblwrap"><table class="tbl ans"><tr><th>#</th><th>Tema / pregunta</th><th>Respuesta del colaborador</th><th>Respuesta correcta</th><th></th></tr>${T.map(q=>`<tr><td>${q.k}</td><td><b>${esc(q.tema)}</b><br><small style="color:var(--muted)">${esc(q.pregunta)}</small></td><td>${esc(q.resp)}</td><td>${esc(q.correcta)}</td>${mk(q.ok)}</tr>`).join('')}</table></div>`:'')+
 (Pr.length?`<div class="h3">Parte práctica · ${r.practica.got} de ${r.practica.n}</div><div class="tblwrap"><table class="tbl ans"><tr><th>Campo</th><th>Dato</th><th>Respuesta del colaborador</th><th>Respuesta correcta</th><th></th></tr>${Pr.map(q=>`<tr><td><b>${esc(q.id)}</b></td><td>${esc(q.campo)}</td><td>${esc(q.resp)}</td><td>${esc(q.correcta)}</td>${mk(q.ok)}</tr>`).join('')}</table></div>`:'')}

/* --- Vista 2: general por fecha --- */
function pickAttempts(rows){const a=ADM.f.att;if(a==='all')return rows;const m={};
 rows.forEach(r=>{const c=m[r.nombreNorm];if(!c||(a==='last')||(a==='best'&&r.total.pct>c.total.pct))m[r.nombreNorm]=a==='first'&&c?c:r});
 return Object.values(m).sort((x,y)=>String(x.ts).localeCompare(String(y.ts)))}
function weekKey(s){const d=new Date(s+'T12:00:00'),w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return ymd(d)}
function grpKey(r){return ADM.f.grp==='m'?r.fecha.slice(0,7):ADM.f.grp==='w'?weekKey(r.fecha):r.fecha}
function grpLabel(k){if(ADM.f.grp==='m'){const[y,m]=k.split('-');return MES[+m-1]+' '+y}if(ADM.f.grp==='w'){const d=new Date(k+'T12:00:00');d.setDate(d.getDate()+6);return 'Sem. '+fdate(k)+' – '+fdate(ymd(d))}return fdate(k)}
const avg=a=>a.length?Math.round(a.reduce((s,v)=>s+v,0)/a.length):0;
function barsHTML(items){return `<div class="bars">${items.map(it=>{const c=it.v>=PASS?'var(--green)':it.v>=60?'var(--gold)':'var(--red)';return `<div class="barrow"><div class="lb" title="${esc(it.title||it.l)}">${esc(it.l)}</div><div class="tr"><i style="width:${it.v}%;background:${c}"></i><em style="left:${PASS}%"></em></div><div class="v">${it.v}%</div></div>`}).join('')}</div>`}
function renderGeneral(){const f=ADM.f,B=$('admB');
 const rows=pickAttempts(ADM.rows.filter(inRange)),N=rows.length;
 B.innerHTML=(GAS_URL?'':'<div class="note">Modo local: solo se muestran resultados guardados en este navegador.</div>')+
  dateFilters(`<div><label>Intentos a considerar</label><select id="fatt"><option value="all">Todos los intentos</option><option value="first">Primer intento de cada colaborador</option><option value="last">Último intento de cada colaborador</option><option value="best">Mejor intento de cada colaborador</option></select></div><div><label>Agrupar por</label><select id="fgrp"><option value="d">Día</option><option value="w">Semana</option><option value="m">Mes</option></select></div>`)+
  (N?generalBody(rows):'<div class="empty">No hay evaluaciones en el rango seleccionado.</div>');
 $('fatt').value=f.att;$('fgrp').value=f.grp;
 $('fatt').onchange=e=>{ADM.f.att=e.target.value;renderGeneral()};$('fgrp').onchange=e=>{ADM.f.grp=e.target.value;renderGeneral()};
 bindDates(renderGeneral);
 B.querySelectorAll('tr.click').forEach(tr=>tr.onclick=()=>{ADM.person=tr.dataset.k;ADM.open={};ADM.open[tr.dataset.id]=true;ADM.f.q='';ADM.tab='p';renderAdm()});
 if($('csv'))$('csv').onclick=()=>csv(rows)}
function generalBody(rows){const N=rows.length,ppl=new Set(rows.map(r=>r.nombreNorm)).size,apr=rows.filter(r=>r.aprobado).length;
 const fs=rows.map(r=>r.fecha).sort(),rng=fs[0]===fs[fs.length-1]?fdate(fs[0]):fdate(fs[0])+' – '+fdate(fs[fs.length-1]);
 const g={};rows.forEach(r=>{(g[grpKey(r)]=g[grpKey(r)]||[]).push(r)});
 const keys=Object.keys(g).sort().reverse();
 const T0=(rows.find(r=>r.detalle&&r.detalle.teoria)||{detalle:{teoria:[]}}).detalle.teoria,P0=(rows.find(r=>r.detalle&&r.detalle.practica)||{detalle:{practica:[]}}).detalle.practica;
 const acc=(part,i)=>{const v=rows.map(r=>r.detalle&&r.detalle[part]&&r.detalle[part][i]).filter(Boolean);return v.length?pc(v.filter(x=>x.ok).length,v.length):0};
 const tItems=T0.map((q,i)=>({l:(i+1)+'. '+q.tema,title:q.pregunta,v:acc('teoria',i)})),pItems=P0.map((q,i)=>({l:q.id+' · '+q.campo,v:acc('practica',i)}));
 const hard=tItems.concat(pItems).filter(x=>x.v<PASS).sort((a,b)=>a.v-b.v).slice(0,5);
 return `<div class="kpis"><div class="kpi"><span>Periodo</span><b style="font-size:17px">${rng}</b></div><div class="kpi"><span>Colaboradores</span><b>${ppl}</b></div><div class="kpi"><span>Evaluaciones</span><b>${N}</b></div>
 <div class="kpi"><span>Aprobados</span><b style="color:${pc(apr,N)>=50?'var(--green)':'var(--red)'}">${pc(apr,N)}%</b><small>${apr} de ${N}</small></div><div class="kpi"><span>Promedio total</span><b>${avg(rows.map(r=>r.total.pct))}%</b></div>
 <div class="kpi"><span>Prom. teoría</span><b>${avg(rows.map(r=>r.teoria.pct))}%</b></div><div class="kpi"><span>Prom. práctica</span><b>${avg(rows.map(r=>r.practica.pct))}%</b></div></div>
 <div class="h3">Resultados por ${ADM.f.grp==='m'?'mes':ADM.f.grp==='w'?'semana':'fecha'}</div><div class="tblwrap"><table class="tbl"><tr><th>${ADM.f.grp==='m'?'Mes':ADM.f.grp==='w'?'Semana':'Fecha'}</th><th class="n">Evaluaciones</th><th class="n">Colaboradores</th><th class="n">Prom. teoría</th><th class="n">Prom. práctica</th><th class="n">Prom. total</th><th class="n">Aprobados</th></tr>
 ${keys.map(k=>{const a=g[k],ap=a.filter(r=>r.aprobado).length;return `<tr><td><b>${grpLabel(k)}</b></td><td class="n">${a.length}</td><td class="n">${new Set(a.map(r=>r.nombreNorm)).size}</td><td class="n">${avg(a.map(r=>r.teoria.pct))}%</td><td class="n">${avg(a.map(r=>r.practica.pct))}%</td><td class="n"><b>${avg(a.map(r=>r.total.pct))}%</b></td><td class="n">${ap} de ${a.length} (${pc(ap,a.length)}%)</td></tr>`}).join('')}</table></div>
 ${hard.length?`<div class="h3">Temas y campos con más errores</div>${barsHTML(hard)}`:''}
 ${tItems.length?`<div class="h3">Aciertos por pregunta · parte teórica</div><div class="legend">Porcentaje de evaluaciones que contestaron bien cada pregunta. La línea marca el mínimo aprobatorio (${PASS}%).</div>${barsHTML(tItems)}`:''}
 ${pItems.length?`<div class="h3">Aciertos por campo · parte práctica</div>${barsHTML(pItems)}`:''}
 <div class="h3" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span>Evaluaciones del periodo</span><button class="btn2" type="button" id="csv">⬇ Descargar CSV</button></div>
 <div class="legend">Haz clic en una fila para ver el detalle de respuestas del colaborador.</div>
 <div class="tblwrap"><table class="tbl"><tr><th>Fecha</th><th>Colaborador</th><th class="n">Intento</th><th class="n">Teoría</th><th class="n">Práctica</th><th class="n">Total</th><th>Resultado</th></tr>
 ${rows.slice().reverse().map(r=>`<tr class="click" data-k="${esc(r.nombreNorm)}" data-id="${esc(r.id)}"><td>${fdate(r.fecha)} ${esc(r.hora||'')}</td><td><b>${esc(r._disp)}</b></td><td class="n">${r._n}</td><td class="n">${r.teoria.pct}%</td><td class="n">${r.practica.pct}%</td><td class="n"><b>${r.total.pct}%</b></td><td>${pill(r.aprobado)}</td></tr>`).join('')}</table></div>`}
function csv(rows){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
 const T0=(rows[0].detalle&&rows[0].detalle.teoria)||[],P0=(rows[0].detalle&&rows[0].detalle.practica)||[];
 const head=['Fecha','Hora','Colaborador','Intento','Teoría aciertos','Teoría total','Teoría %','Práctica aciertos','Práctica total','Práctica %','Total aciertos','Total','Total %','Resultado']
  .concat(T0.map(x=>'T'+x.k+' '+x.tema),P0.map(x=>'P '+x.id+' '+x.campo));
 const lines=[head.map(q).join(',')].concat(rows.map(r=>[r.fecha,r.hora,r._disp,r._n,r.teoria.got,r.teoria.n,r.teoria.pct,r.practica.got,r.practica.n,r.practica.pct,r.total.got,r.total.n,r.total.pct,r.aprobado?'Aprobado':'No aprobado']
  .concat(T0.map((_,i)=>{const x=(r.detalle.teoria||[])[i];return x?(x.ok?'✔ ':'✘ ')+x.resp:''}),P0.map((_,i)=>{const x=(r.detalle.practica||[])[i];return x?(x.ok?'✔ ':'✘ ')+x.resp:''})).map(q).join(',')));
 const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download='Resultados_'+FORM_KEY+'_'+(ADM.f.d1||'inicio')+'_'+(ADM.f.d2||ymd(new Date()))+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

/* --- Vista 3: para el grupo (gráficas, anónima) --- */
const band=v=>v>=PASS?{c:'var(--green)',k:'ok',t:'Dominado'}:v>=60?{c:'var(--gold)',k:'mid',t:'En desarrollo'}:{c:'var(--red)',k:'bad',t:'Por reforzar'};
function hbars(items,big){return `<div class="gbars ${big?'big':''}">${items.map(it=>{const b=band(it.v);return `<div class="gbar" data-tip="${esc((it.title||it.l)+' · '+it.v+'% de aciertos'+(it.n?' ('+it.ok+' de '+it.n+')':''))}"><div class="gl">${esc(it.l)}</div><div class="gt"><i style="width:${Math.max(it.v,1)}%;background:${b.c}"></i><em style="left:${PASS}%"></em></div><div class="gv">${it.v}%<small>${b.t}</small></div></div>`}).join('')}</div>`}
function donut(ok,n){const R=70,C=2*Math.PI*R,f=n?ok/n:0,gap=ok&&ok<n?3:0,a=Math.max(f*C-gap,0),b=Math.max((1-f)*C-gap,0);
 return `<svg viewBox="0 0 180 180" class="donut" role="img" aria-label="${ok} de ${n} aprobados"><circle cx="90" cy="90" r="${R}" fill="none" stroke="#e7ebf2" stroke-width="22"/>
 ${b>0?`<circle cx="90" cy="90" r="${R}" fill="none" stroke="var(--red)" stroke-width="22" stroke-dasharray="${b} ${C}" stroke-dashoffset="${-(a+gap)}" transform="rotate(-90 90 90)" data-tip="No aprobados: ${n-ok} de ${n}"/>`:''}
 ${a>0?`<circle cx="90" cy="90" r="${R}" fill="none" stroke="var(--green)" stroke-width="22" stroke-dasharray="${a} ${C}" transform="rotate(-90 90 90)" data-tip="Aprobados: ${ok} de ${n}"/>`:''}
 <text x="90" y="88" text-anchor="middle" class="dn">${pc(ok,n)}%</text><text x="90" y="112" text-anchor="middle" class="ds">aprobados</text></svg>`}
function histo(rows){const B=[['0–59',0,59],['60–69',60,69],['70–79',70,79],['80–84',80,84],['85–94',85,94],['95–100',95,100]];
 const cnt=B.map(b=>rows.filter(r=>r.total.pct>=b[1]&&r.total.pct<=b[2]).length),mx=Math.max(1,...cnt);
 return `<div class="histo">${B.map((b,i)=>{const bd=band(b[1]);return `<div class="hcol" data-tip="${cnt[i]} persona${cnt[i]===1?'':'s'} con calificación de ${b[0]}%"><div class="hval">${cnt[i]}</div><div class="hbw"><i style="height:${cnt[i]/mx*100}%;background:${bd.c}"></i></div><div class="hlab">${b[0]}%</div></div>`}).join('')}</div>
 <div class="glegend"><span><i style="background:var(--red)"></i>Por reforzar (&lt;60%)</span><span><i style="background:var(--gold)"></i>En desarrollo (60–84%)</span><span><i style="background:var(--green)"></i>Aprobado (≥${PASS}%)</span></div>`}
function trend(rows){const g={};rows.forEach(r=>{(g[r.fecha]=g[r.fecha]||[]).push(r.total.pct)});const ks=Object.keys(g).sort();if(ks.length<2)return '';
 const W=1000,H=250,l=44,r=16,t=16,b=34,x=i=>l+(ks.length===1?0:i*(W-l-r)/(ks.length-1)),y=v=>t+(100-v)*(H-t-b)/100,pts=ks.map((k,i)=>[x(i),y(avg(g[k])),k,avg(g[k]),g[k].length]);
 const step=Math.ceil(ks.length/8);
 return `<div class="gcard wide"><div class="gh">Evolución del promedio grupal por fecha</div><svg viewBox="0 0 ${W} ${H}" class="trend" role="img" aria-label="Promedio por fecha">
 ${[0,50,100].map(v=>`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${l-6}" y="${y(v)+4}" text-anchor="end" class="ax">${v}%</text>`).join('')}
 <line x1="${l}" x2="${W-r}" y1="${y(PASS)}" y2="${y(PASS)}" class="pass"/><text x="${W-r}" y="${y(PASS)-5}" text-anchor="end" class="ax">mínimo ${PASS}%</text>
 <polyline points="${pts.map(p=>p[0]+','+p[1]).join(' ')}" class="ln"/>
 ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" class="dt"/><circle cx="${p[0]}" cy="${p[1]}" r="14" fill="transparent" data-tip="${fdate(p[2])} · promedio ${p[3]}% · ${p[4]} evaluación${p[4]>1?'es':''}"/>${i%step===0||i===pts.length-1?`<text x="${p[0]}" y="${H-10}" text-anchor="middle" class="ax">${fdate(p[2]).slice(0,5)}</text>`:''}`).join('')}
 </svg></div>`}
function renderGroup(){const f=ADM.f,B=$('admB');if(!f.gatt)f.gatt='last';
 const rows=(a=>{const s=ADM.f.att;ADM.f.att=f.gatt;const o=pickAttempts(ADM.rows.filter(inRange));ADM.f.att=s;return o})(),N=rows.length;
 B.innerHTML=`<div class="filters gflt">${dateFilters('').replace(/^<div class="filters">|<\/div>$/g,'')}<div><label>Intentos a considerar</label><select id="gatt"><option value="last">Último intento de cada colaborador</option><option value="first">Primer intento de cada colaborador</option><option value="best">Mejor intento de cada colaborador</option><option value="all">Todos los intentos</option></select></div><div><button class="btn2 solid" type="button" id="gfs">⛶ Modo presentación</button></div></div>
 <div id="gview">${N?groupBody(rows):'<div class="empty">No hay evaluaciones en el rango seleccionado.</div>'}</div>`;
 $('gatt').value=f.gatt;$('gatt').onchange=e=>{f.gatt=e.target.value;renderGroup()};bindDates(renderGroup);
 $('gfs').onclick=togglePresent;tips(B)}
function groupBody(rows){const N=rows.length,ppl=new Set(rows.map(r=>r.nombreNorm)).size,apr=rows.filter(r=>r.aprobado).length;
 const fs=rows.map(r=>r.fecha).sort(),rng=fs[0]===fs[fs.length-1]?fdate(fs[0]):fdate(fs[0])+' – '+fdate(fs[fs.length-1]);
 const T0=(rows.find(r=>r.detalle&&r.detalle.teoria)||{detalle:{teoria:[]}}).detalle.teoria,P0=(rows.find(r=>r.detalle&&r.detalle.practica)||{detalle:{practica:[]}}).detalle.practica;
 const it=(part,i,l,title)=>{const v=rows.map(r=>r.detalle&&r.detalle[part]&&r.detalle[part][i]).filter(Boolean),ok=v.filter(x=>x.ok).length;return {l,title,v:pc(ok,v.length),ok,n:v.length}};
 const tI=T0.map((q,i)=>it('teoria',i,q.tema,q.pregunta)).sort((a,b)=>b.v-a.v),pI=P0.map((q,i)=>it('practica',i,q.id+' · '+q.campo)).sort((a,b)=>b.v-a.v);
 const all=tI.concat(pI),top=all.slice().sort((a,b)=>b.v-a.v).slice(0,3),low=all.slice().sort((a,b)=>a.v-b.v).filter(x=>x.v<PASS).slice(0,3);
 const ga=avg(rows.map(r=>r.total.pct)),gb=band(ga),label={first:'primer intento',last:'último intento',best:'mejor intento',all:'todos los intentos'}[ADM.f.gatt];
 return `<div class="ghero"><div class="gtitle"><div class="kicker">Evaluación ${esc(FORM_KEY)} · Resultados del grupo</div><h2>¿Cómo le fue al grupo?</h2><p>${rng} · ${ppl} participante${ppl>1?'s':''} · ${label}</p></div></div>
 <div class="ggrid">
  <div class="gcard"><div class="gh">Promedio del grupo</div><div class="gbig" style="color:${gb.c}">${ga}%</div><div class="gsub">${gb.t} · mínimo aprobatorio ${PASS}%</div>
   <div class="gmini"><div><span>Teoría</span><b>${avg(rows.map(r=>r.teoria.pct))}%</b></div><div><span>Práctica</span><b>${avg(rows.map(r=>r.practica.pct))}%</b></div><div><span>Participantes</span><b>${ppl}</b></div></div></div>
  <div class="gcard center"><div class="gh">Aprobaron</div>${donut(apr,N)}<div class="gsub"><b style="color:var(--green)">${apr}</b> de ${N} aprobados · <b style="color:var(--red)">${N-apr}</b> por reforzar</div></div>
  <div class="gcard"><div class="gh">Distribución de calificaciones</div>${histo(rows)}</div>
 </div>
 <div class="gcard wide"><div class="gh">Teoría vs. práctica</div>${hbars([{l:'Parte teórica',v:avg(rows.map(r=>r.teoria.pct))},{l:'Parte práctica',v:avg(rows.map(r=>r.practica.pct))},{l:'Total',v:ga}],true)}</div>
 <div class="ggrid two">
  <div class="gcard gstr"><div class="gh">💪 Fortalezas del grupo</div>${top.map(x=>`<div class="gitem"><b>${x.v}%</b><span>${esc(x.l)}</span></div>`).join('')}</div>
  <div class="gcard gopp"><div class="gh">🎯 Áreas de oportunidad</div>${low.length?low.map(x=>`<div class="gitem"><b>${x.v}%</b><span>${esc(x.l)}</span></div>`).join(''):'<p class="gsub">Todos los temas están por encima del mínimo aprobatorio. ¡Excelente!</p>'}</div>
 </div>
 ${tI.length?`<div class="gcard wide"><div class="gh">Dominio por tema · parte teórica</div><div class="gnote">Porcentaje del grupo que contestó bien cada tema. La línea marca el ${PASS}%.</div>${hbars(tI)}</div>`:''}
 ${pI.length?`<div class="gcard wide"><div class="gh">Dominio por campo · parte práctica</div><div class="gnote">Porcentaje del grupo que llenó bien cada campo de la forma.</div>${hbars(pI)}</div>`:''}
 ${trend(rows)}
 <div class="glegend foot"><span><i style="background:var(--green)"></i>Dominado (≥${PASS}%)</span><span><i style="background:var(--gold)"></i>En desarrollo (60–${PASS-1}%)</span><span><i style="background:var(--red)"></i>Por reforzar (&lt;60%)</span><span>Vista anónima: no muestra nombres.</span></div>`}
function togglePresent(){const a=$('adm'),on=!a.classList.contains('present');a.classList.toggle('present',on);
 if(on){if(!$('gexit')){const b=document.createElement('button');b.id='gexit';b.type='button';b.className='gexit';b.textContent='✕ Salir de presentación';b.onclick=togglePresent;a.appendChild(b)}
  try{a.requestFullscreen&&a.requestFullscreen().catch(()=>{})}catch(e){}}
 else{const b=$('gexit');if(b)b.remove();try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}}scrollTo(0,0);a.scrollTop=0}
document.addEventListener('fullscreenchange',()=>{const a=$('adm');if(!document.fullscreenElement&&a&&a.classList.contains('present'))togglePresent()});
function tips(root){let tp=$('gtip');if(!tp){tp=document.createElement('div');tp.id='gtip';tp.className='gtip';document.body.appendChild(tp)}
 root.querySelectorAll('[data-tip]').forEach(el=>{el.onmousemove=e=>{tp.textContent=el.getAttribute('data-tip');tp.style.display='block';const w=tp.offsetWidth;tp.style.left=Math.min(e.clientX+14,innerWidth-w-8)+'px';tp.style.top=(e.clientY+16)+'px'};el.onmouseleave=()=>{tp.style.display='none'}})}

$('admlink').onclick=()=>showAdmin(true);
flushPending();
renderReg();
})();
</script>
